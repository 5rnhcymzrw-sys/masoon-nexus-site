name: Normalize knowledge breakpoints
on:
  push:
    branches: [main]
    paths: ['.github/workflows/normalize-knowledge-breakpoints.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize overlapping Fachwissen breakpoints
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/unified-design.css')
          s=p.read_text(encoding='utf-8')
          old='''@media(min-width:561px) and (max-width:1050px){
  html body.page-knowledge.site-light-page main .knowledge-section#knowledge-articles .articles-grid>.article-card{
    background-size:calc(200% + 16px) 100%!important;
    background-position:left top!important;
  }
  html body.page-knowledge.site-light-page main .knowledge-section#knowledge-articles .articles-grid>.article-card:nth-child(2n){
    background-position:right top!important;
  }
}
@media(min-width:801px) and (max-width:1050px){
  html body.page-knowledge.site-light-page main .knowledge-section#knowledge-articles .articles-grid>.article-card{
    background-size:calc(200% + 22px) 100%!important;
  }
}'''
          new='''@media(min-width:561px) and (max-width:800px){
  html body.page-knowledge.site-light-page main .knowledge-section#knowledge-articles .articles-grid>.article-card{
    background-size:calc(200% + 16px) 100%!important;
    background-position:left top!important;
  }
  html body.page-knowledge.site-light-page main .knowledge-section#knowledge-articles .articles-grid>.article-card:nth-child(2n){
    background-position:right top!important;
  }
}
@media(min-width:801px) and (max-width:1050px){
  html body.page-knowledge.site-light-page main .knowledge-section#knowledge-articles .articles-grid>.article-card{
    background-size:calc(200% + 22px) 100%!important;
    background-position:left top!important;
  }
  html body.page-knowledge.site-light-page main .knowledge-section#knowledge-articles .articles-grid>.article-card:nth-child(2n){
    background-position:right top!important;
  }
}'''
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/unified-design.css
          git commit -m "Fachwissen-Breakpoints ohne Überlappung strukturieren"
          git rm .github/workflows/normalize-knowledge-breakpoints.yml
          git commit -m "Temporären Breakpoint-Workflow entfernen"
          git push
