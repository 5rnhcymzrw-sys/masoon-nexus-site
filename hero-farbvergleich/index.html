<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MASOON TREUHAND – Hero Test</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:Arial,sans-serif}.toolbar{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:99999;display:flex;gap:6px;padding:7px;background:rgba(255,255,255,.97);border:1px solid #bbb;box-shadow:0 6px 18px rgba(0,0,0,.12)}button{border:1px solid #bbb;background:#fff;padding:9px 12px;cursor:pointer}button.active{background:#171715;color:#fff}iframe{border:0;width:100%;height:100%}</style></head><body><div class="toolbar"><button data-m="a" class="active">1 – Offen links</button><button data-m="b">2 – Split</button><button data-m="c">3 – Foto gross</button><button data-m="d">4 – Verlauf</button><button data-m="e">5 – Rahmen</button></div><iframe id="site" src="../index.html"></iframe><script>
const f=document.getElementById('site'),bs=[...document.querySelectorAll('button')];
function find(d){const hero=d.querySelector('.home-hero');if(!hero)return{};const h1=hero.querySelector('h1');const text=h1?.parentElement;const img=[...hero.querySelectorAll('img')].find(x=>(x.getAttribute('src')||'').includes('Foto-hero'))||hero.querySelector('img');const pic=img?.parentElement;return{hero,h1,text,img,pic}}
function reset(x){const {hero,text,img,pic}=x;[hero,text,img,pic].filter(Boolean).forEach(el=>el.removeAttribute('style'));}
function apply(m){const d=f.contentDocument,x=find(d);if(!x.hero||!x.text||!x.img)return;reset(x);const {hero,text,img,pic}=x;hero.style.cssText='position:relative!important;overflow:hidden!important;min-height:calc(100svh - 108px)!important;';img.style.cssText='display:block!important;width:100%!important;height:100%!important;object-fit:cover!important;';if(m==='a'){hero.style.background='#E2DED8';pic.style.cssText='position:absolute!important;right:0!important;top:12%!important;width:62%!important;height:72%!important;margin:0!important;overflow:hidden!important;';text.style.cssText='position:absolute!important;z-index:5!important;left:8%!important;top:28%!important;width:38%!important;margin:0!important;padding:0!important;background:transparent!important;box-shadow:none!important;';}
if(m==='b'){hero.style.background='linear-gradient(90deg,#E2DED8 0 46%,#F6F4F1 46% 100%)';pic.style.cssText='position:absolute!important;right:4%!important;top:12%!important;width:54%!important;height:74%!important;margin:0!important;overflow:hidden!important;';text.style.cssText='position:absolute!important;z-index:5!important;left:7%!important;top:25%!important;width:35%!important;margin:0!important;padding:34px!important;background:#EFECE7!important;box-shadow:none!important;';}
if(m==='c'){hero.style.background='#F6F4F1';pic.style.cssText='position:absolute!important;right:0!important;top:4%!important;width:72%!important;height:86%!important;margin:0!important;overflow:hidden!important;';text.style.cssText='position:absolute!important;z-index:5!important;left:5%!important;top:29%!important;width:37%!important;margin:0!important;padding:36px 40px!important;background:rgba(255,255,255,.93)!important;box-shadow:none!important;';}
if(m==='d'){hero.style.background='linear-gradient(115deg,#E2DED8 0%,#EFECE7 35%,#F6F4F1 62%,#D8DDE6 100%)';pic.style.cssText='position:absolute!important;right:5%!important;top:13%!important;width:58%!important;height:70%!important;margin:0!important;overflow:hidden!important;';text.style.cssText='position:absolute!important;z-index:5!important;left:7%!important;top:27%!important;width:38%!important;margin:0!important;padding:34px 38px!important;background:rgba(255,255,255,.68)!important;box-shadow:none!important;';}
if(m==='e'){hero.style.background='#F6F4F1';pic.style.cssText='position:absolute!important;right:5%!important;top:12%!important;width:60%!important;height:72%!important;margin:0!important;overflow:hidden!important;';text.style.cssText='position:absolute!important;z-index:5!important;left:7%!important;top:26%!important;width:39%!important;margin:0!important;padding:36px 40px!important;background:#fff!important;box-shadow:none!important;border:1px solid #c7cbd3!important;';}
bs.forEach(b=>b.classList.toggle('active',b.dataset.m===m));setTimeout(()=>hero.scrollIntoView({block:'start'}),40)}
f.addEventListener('load',()=>apply('a'));bs.forEach(b=>b.onclick=()=>apply(b.dataset.m));
</script></body></html>
