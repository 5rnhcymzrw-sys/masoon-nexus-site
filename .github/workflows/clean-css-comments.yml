name: Clean CSS comments
on:
  push:
    branches: [main]
    paths: ['.github/workflows/clean-css-comments.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete comments and excess whitespace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('assets/unified-design.css')
          s=p.read_text(encoding='utf-8')
          comments=[
            '/* Verbleibende Regeln aus ehemaliger unified-design-base konsolidiert */',
            '/* Desktop Zusammenarbeit: drei Spalten,\nzwei Reihen */',
            '/* Unternehmen: Abschlussabstand wie bei Fachwissen/Einordnung */',
            '/* Werte mobil: gemessene 7-Pixel-Abweichung zur Navigationslinie korrigieren */',
            '/* Unternehmen: Abstand nach dem Werte-Kasten exakt wie nach MASOON TREUHAND */',
            '/* Nur die drei Fachwissen-Karten zusätzlich leicht einfärben */',
            '/* Seitenspezifische Altregeln aus unified-design-base konsolidiert */'
          ]
          removed=0
          for c in comments:
            if c in s:
              s=s.replace(c,'')
              removed+=1
          s=re.sub(r'\n{4,}','\n\n',s)
          p.write_text(s,encoding='utf-8')
          print('removed comments',removed)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/unified-design.css
          git commit -m "Veraltete CSS-Kommentare und Leerraum bereinigen"
          git rm .github/workflows/clean-css-comments.yml
          git commit -m "Temporären Kommentar-Workflow entfernen"
          git push
