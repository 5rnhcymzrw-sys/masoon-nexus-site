name: Article detail token cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/article-detail-token-cleanup.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tokenize shared article base
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/article-detail.css')
          s=p.read_text(encoding='utf-8')
          replacements={
            'padding:234px 0 126px!important':'padding:234px 0 var(--section-y)!important',
            'max-width:1227px!important':'max-width:var(--content-width)!important',
            'padding:170px 0 96px!important':'padding:170px 0 96px!important',
          }
          for old,new in replacements.items():
            assert old in s, old
            s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/article-detail.css
          git commit -m "Artikelbasis an globale Breite und Abstände anbinden"
          git rm .github/workflows/article-detail-token-cleanup.yml
          git commit -m "Temporären Artikelbasis-Workflow entfernen"
          git push