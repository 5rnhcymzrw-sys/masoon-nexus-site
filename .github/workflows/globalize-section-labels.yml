name: Globalize section labels
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/globalize-section-labels.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply global section label rule
        run: python3 scripts/globalize-section-labels.py
      - name: Verify
        run: |
          grep -n -A16 'Einheitliche kleine Bereichstitel' assets/global.css
          if grep -Rni --include='*.css' -E 'section-label[^\{]*\{[^\}]*color:' assets/contact.css assets/dienstleistungen.css assets/unified-design.css assets/article-detail.css; then exit 1; fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/global.css assets/contact.css assets/dienstleistungen.css assets/unified-design.css assets/index-CZfMKxM_.css index.html unternehmen dienstleistungen fachwissen kontakt disclaimer impressum datenschutz
          git commit -m "Bereichstitel global vereinheitlichen"
          git rm scripts/globalize-section-labels.py .github/workflows/globalize-section-labels.yml
          git commit -m "Temporäre Bereichstitel-Bereinigung entfernen"
          git push
