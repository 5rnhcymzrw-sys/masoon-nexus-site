name: temp update home fachwissen existing rules
on:
  push:
    paths:
      - '.github/workflows/temp-update-home-fachwissen-existing-rules.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update only existing Startseite Fachwissen rules
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path('assets/unified-design.css')
          s = css.read_text(encoding='utf-8')
          gradient = 'linear-gradient(to right in oklab,rgba(244,228,201,.11) 0%,rgba(232,227,218,.11) 36%,rgba(193,199,214,.11) 68%,rgba(132,144,171,.11) 100%)'

          replacements = [
            (
              'html body.site-light-page main.home>section.home-paths.home-paths .home-paths__grid.home-paths__grid>a:nth-child(1):not(:hover):not(:active){background:transparent!important;background-color:transparent!important;background-image:none!important;}',
              f'html body.site-light-page main.home>section.home-paths.home-paths .home-paths__grid.home-paths__grid>a:nth-child(1):not(:hover):not(:active){{background-image:{gradient}!important;}}'
            ),
            (
              'html body.site-light-page main.home>section.home-paths.home-paths .home-paths__grid.home-paths__grid>a:nth-child(2):not(:hover):not(:active){background:transparent!important;background-color:transparent!important;background-image:none!important;}',
              f'html body.site-light-page main.home>section.home-paths.home-paths .home-paths__grid.home-paths__grid>a:nth-child(2):not(:hover):not(:active){{background-image:{gradient}!important;}}'
            ),
            (
              'html body.site-light-page main.home>section.home-paths.home-paths .home-paths__grid.home-paths__grid>a:nth-child(3):not(:hover):not(:active){background:transparent!important;background-color:transparent!important;background-image:none!important;}',
              f'html body.site-light-page main.home>section.home-paths.home-paths .home-paths__grid.home-paths__grid>a:nth-child(3):not(:hover):not(:active){{background-image:{gradient}!important;}}'
            ),
            (
              '''html body.page-home.site-light-page main.home section.home-paths .home-paths__grid.home-paths__grid>a{\n  position:relative!important;\n  cursor:pointer!important;\n  border-color:transparent!important;\n  border-image:linear-gradient(110deg,#f3e8d4 0%,#e8e5df 38%,#c7cbd3 66%,#8d96a8 100%) 1!important;\n  transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease,background-color .22s ease!important;\n}''',
              '''html body.page-home.site-light-page main.home section.home-paths .home-paths__grid.home-paths__grid>a{\n  position:relative!important;\n  cursor:pointer!important;\n  border:0!important;\n  border-color:transparent!important;\n  border-image:none!important;\n  background-size:calc(300% + 44px) 100%!important;\n  background-repeat:no-repeat!important;\n  background-origin:border-box!important;\n  -webkit-backdrop-filter:blur(32px)!important;\n  backdrop-filter:blur(32px)!important;\n  box-shadow:none!important;\n  transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease,background-color .22s ease!important;\n}'''
            ),
            (
              '''html body.page-home.site-light-page main.home section.home-paths .home-paths__grid.home-paths__grid>a:nth-child(1){\n  border-image:linear-gradient(110deg,#f3e8d4 0%,#e8e5df 100%) 1!important;\n  background-position:left top!important;\n}''',
              '''html body.page-home.site-light-page main.home section.home-paths .home-paths__grid.home-paths__grid>a:nth-child(1){\n  border-image:none!important;\n  background-position:left top!important;\n}'''
            ),
            (
              '''html body.page-home.site-light-page main.home section.home-paths .home-paths__grid.home-paths__grid>a:nth-child(2){\n  border-image:linear-gradient(110deg,#e8e5df 0%,#c7cbd3 100%) 1!important;\n  background-position:center top!important;\n}''',
              '''html body.page-home.site-light-page main.home section.home-paths .home-paths__grid.home-paths__grid>a:nth-child(2){\n  border-image:none!important;\n  background-position:center top!important;\n}'''
            ),
            (
              '''html body.page-home.site-light-page main.home section.home-paths .home-paths__grid.home-paths__grid>a:nth-child(3){\n  border-image:linear-gradient(110deg,#c7cbd3 0%,#8d96a8 100%) 1!important;\n  background-position:right top!important;\n}''',
              '''html body.page-home.site-light-page main.home section.home-paths .home-paths__grid.home-paths__grid>a:nth-child(3){\n  border-image:none!important;\n  background-position:right top!important;\n}'''
            ),
            (
              'html body.page-home.site-light-page main.home section.home-paths .home-paths__grid>a{box-sizing:border-box!important;width:100%!important;height:220px!important;min-height:220px!important;padding:42px!important;border:1px solid rgba(23,23,21,.14)!important;}',
              'html body.page-home.site-light-page main.home section.home-paths .home-paths__grid>a{box-sizing:border-box!important;width:100%!important;height:220px!important;min-height:220px!important;padding:42px!important;border:0!important;}'
            ),
            (
              '''    border-color:transparent!important;\n    border-image:linear-gradient(110deg,#f3e8d4 0%,#e8e5df 38%,#c7cbd3 66%,#8d96a8 100%) 1!important;\nbackground:linear-gradient(to right in oklab,rgba(243,232,212,.11) 0%,rgba(232,229,223,.11) 36%,rgba(199,203,211,.11) 68%,rgba(141,150,168,.11) 100%)!important;''',
              f'''    border:0!important;\n    border-color:transparent!important;\n    border-image:none!important;\n    background-image:{gradient}!important;'''
            ),
            (
              '''  border-color:transparent!important;\n  border-image:linear-gradient(110deg,#f3e8d4 0%,#e8e5df 38%,#c7cbd3 66%,#8d96a8 100%) 1!important;\n  box-shadow:0 10px 26px rgba(23,23,21,.08)!important;''',
              '''  border:0!important;\n  border-color:transparent!important;\n  border-image:none!important;\n  box-shadow:0 10px 26px rgba(23,23,21,.08)!important;'''
            ),
          ]

          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exact existing rule once, found {count}: {old[:120]!r}')
              s = s.replace(old, new, 1)

          css.write_text(s, encoding='utf-8')

          index = Path('index.html')
          h = index.read_text(encoding='utf-8')
          old_link = 'assets/unified-design.css?v=home-dl-final-gradient-20260911-1'
          new_link = 'assets/unified-design.css?v=home-fachwissen-final-gradient-20260911-1'
          if h.count(old_link) != 1:
              raise SystemExit(f'Expected current Startseite stylesheet link once, found {h.count(old_link)}')
          index.write_text(h.replace(old_link, new_link, 1), encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/unified-design.css index.html
          git diff --cached --check
          git commit -m 'Update existing Startseite Fachwissen cards'
          git push
