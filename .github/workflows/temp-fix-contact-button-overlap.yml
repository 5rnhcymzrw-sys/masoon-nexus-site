name: temp-contact-button-fix
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/unified-design.css')
          s=p.read_text()
          marker='html body.page-contact.site-light-page main .contact-split__form button[type="submit"]{\n  position:relative!important;'
          a=s.index(marker)
          b=s.index('html body.page-contact.site-light-page main .contact-split__form button[type="submit"]::before{',a)
          block=s[a:b]
          old='line-height:1.4!important;letter-spacing:.14em!important;text-transform:uppercase!important;}'
          new='line-height:1.65!important;letter-spacing:1.1px!important;text-transform:uppercase!important;}'
          if block.count(old)!=1:
              raise SystemExit('contact submit typography target mismatch')
          block=block.replace(old,new,1)
          s=s[:a]+block+s[b:]
          marker2='html body.page-contact.site-light-page main .contact-split__form button[type="submit"],\nhtml body.page-contact.site-light-page main .contact-split__form button[type="submit"]:hover,'
          c=s.index(marker2)
          d=s.index('html body.page-contact.site-light-page main .contact-split__form button[type="submit"]::before,',c)
          block2=s[c:d]
          if block2.count('color:#605c55!important;')!=1:
              raise SystemExit('contact submit colour target mismatch')
          block2=block2.replace('color:#605c55!important;','color:#171715!important;',1)
          s=s[:c]+block2+s[d:]
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/unified-design.css
          git commit -m 'Fix contact button typography overlap'
          git push
