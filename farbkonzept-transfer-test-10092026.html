<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MASOON – Farbkonzept Test</title>
<style>
html,body{margin:0;min-height:100%;background:#f4f4f2;font-family:Arial,sans-serif;color:#171715}
.testbar{position:sticky;top:0;z-index:99999;background:#fff;border-bottom:1px solid #d8d8d4;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.testbar strong{font-size:12px;margin-right:8px}.testbar button{appearance:none;border:1px solid #cfcfca;background:#fff;padding:7px 10px;font-size:11px;cursor:pointer}.testbar button:hover,.testbar button.active{background:#171715;color:#fff;border-color:#171715}.note{font-size:11px;color:#666;margin-left:auto}#siteFrame{display:block;width:100%;height:calc(100vh - 58px);min-height:700px;border:0;background:#fff}@media(max-width:800px){.note{width:100%;margin-left:0}#siteFrame{height:calc(100vh - 100px)}}
</style>
</head>
<body>
<div class="testbar">
<strong>FARBKONZEPT TEST · Originalseiten</strong>
<button data-src="index.html?v=colortransfer10092026" data-page="home" class="active">Startseite</button>
<button data-src="dienstleistungen/index.html?v=colortransfer10092026" data-page="services">Dienstleistungen</button>
<button data-src="fachwissen/index.html?v=colortransfer10092026" data-page="knowledge">Fachwissen</button>
<span class="note">Nur Test · Originalseiten unverändert</span>
</div>
<iframe id="siteFrame" src="index.html?v=colortransfer10092026" title="Farbkonzept Test"></iframe>
<script>
const frame=document.getElementById('siteFrame');
const buttons=[...document.querySelectorAll('[data-src]')];
let currentPage='home';
const gradient='linear-gradient(to right in oklab, rgba(243,232,212,.11) 0%, rgba(232,229,223,.11) 36%, rgba(199,203,211,.11) 68%, rgba(141,150,168,.11) 100%)';
function important(el,prop,value){el.style.setProperty(prop,value,'important')}
function clearInterior(el){
  important(el,'background-image','none');
  important(el,'background-color','transparent');
  important(el,'backdrop-filter','none');
  important(el,'-webkit-backdrop-filter','none');
}
function colorLikeStartpage(el,index){
  important(el,'background-image',gradient);
  important(el,'background-color','transparent');
  important(el,'background-origin','border-box');
  important(el,'background-size','calc(300% + 44px) 100%');
  important(el,'background-repeat','no-repeat');
  const pos=index%3===0?'left top':index%3===1?'center top':'right top';
  important(el,'background-position',pos);
  important(el,'backdrop-filter','blur(32px)');
  important(el,'-webkit-backdrop-filter','blur(32px)');
}
function apply(){
  try{
    const d=frame.contentDocument;
    if(!d||!d.body)return;
    if(currentPage==='home'){
      d.querySelectorAll('main.home section.home-paths .home-paths__grid>a').forEach(clearInterior);
    }
    if(currentPage==='services'){
      d.querySelectorAll('main.services-main .services-section .services-grid>.service-card').forEach((el,i)=>colorLikeStartpage(el,i));
    }
    if(currentPage==='knowledge'){
      d.querySelectorAll('main .knowledge-section#knowledge-articles .articles-grid>.article-card').forEach(clearInterior);
    }
  }catch(e){console.error('Farbkonzept Test:',e)}
}
function runRepeated(){apply();setTimeout(apply,250);setTimeout(apply,800);setTimeout(apply,1800)}
frame.addEventListener('load',runRepeated);
buttons.forEach(b=>b.addEventListener('click',()=>{
  currentPage=b.dataset.page;
  buttons.forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  frame.src=b.dataset.src;
}));
</script>
</body>
</html>
