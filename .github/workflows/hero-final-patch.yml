name: Hero final patch

on:
  push:
    paths:
      - '.github/workflows/hero-final-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bestehende Hero-Regeln direkt anpassen
        shell: bash
        run: echo '' | base64 -d | python
      - name: Änderung committen
        shell: bash
        run: |
          git config user.name "5rnhcymzrw-sys"
          git config user.email "5rnhcymzrw@privaterelay.appleid.com"
          git add assets/unified-design.css index.html
          git diff --cached --quiet && exit 0
          git commit -m "Startseite Hero final: separater Verlauf mit Linie und Weichzeichnung"
          git push origin main
