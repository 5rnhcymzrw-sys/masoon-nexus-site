name: Section label grey patch

on:
  push:
    paths:
      - '.github/workflows/section-label-grey-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update existing section label typography
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          base = Path('assets/unified-design-base-20260907.css')
          text = base.read_text()
          selector = 'html body main .section-label.section-label.section-label.section-label.section-label.section-label{'
          start = text.find(selector)
          if start == -1:
              raise SystemExit('Existing high-priority Bereichstitel rule not found')
          end = text.find('}', start)
          if end == -1:
              raise SystemExit('Existing Bereichstitel rule end not found')
          block = text[start:end+1]
          old_spacing = 'letter-spacing:.14em!important;'
          old_color = 'color:#868279!important;'
          if block.count(old_spacing) != 1 or block.count(old_color) != 1:
              raise SystemExit('Expected existing Bereichstitel spacing/color exactly once')
          block = block.replace(old_spacing, 'letter-spacing:1.1px!important;', 1)
          block = block.replace(old_color, 'color:#777777!important;', 1)
          base.write_text(text[:start] + block + text[end+1:])

          unified = Path('assets/unified-design.css')
          utext = unified.read_text()
          utext, count = re.subn(r"@import url\('\./unified-design-base-20260907\.css\?v=[^']+'\);", "@import url('./unified-design-base-20260907.css?v=section-label-grey-20260912-1');", utext, count=1)
          if count != 1:
              raise SystemExit('Existing unified-design base import not found exactly once')
          unified.write_text(utext)

          changed = 0
          for page in Path('.').rglob('*.html'):
              html = page.read_text()
              updated, n = re.subn(r'(unified-design\.css\?v=)[^"\']+', r'\1section-label-grey-20260912-1', html)
              if n:
                  page.write_text(updated)
                  changed += n
          if changed == 0:
              raise SystemExit('No unified-design cache references found')
          print(f'Updated {changed} page cache references')
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/section-label-grey-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bereichstitel global grau mit 1.1px Buchstabenabstand"
          git push