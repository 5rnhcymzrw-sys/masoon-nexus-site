name: Report home path residuals
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/report-home-path-residuals.yml
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report
        run: |
          grep -n 'page-home.site-light-page main.home section.home-paths .home-paths__grid>a' assets/global.css || true
          echo '--- markers ---'
          grep -n 'Fachwissen-Kacheln\|Abschlusskästen' assets/global.css || true
      - name: Remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/report-home-path-residuals.yml
          git commit -m "Temporären Home-Path-Report entfernen"
          git push
