name: Final CSS comment cleanup
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/final-comment-cleanup.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean comments
        run: |
          python3 - <<'PY'
          from pathlib import Path
          changes={
            'assets/unified-design.css':{
              '/* Rechteseiten und bestehende Spezialtexte bleiben unverändert */':'/* Gemeinsame Rechteseiten und Spezialtexte */',
              '/* Startseite: Kontakt wieder an der ursprünglichen linken Position. */':'/* Startseite Kontakt: Position des Bereichslabels */',
            },
            'assets/article-detail.css':{
              '/* fachwissen/kuendigung-arbeitsvertrag/index.html */':'/* Fachartikel: Kündigung Arbeitsvertrag */',
              '/* fachwissen/unternehmen-gruenden/index.html */':'/* Fachartikel: Unternehmen gründen */',
              '/* fachwissen/unternehmensformen/index.html */':'/* Fachartikel: Unternehmensformen */',
              '/* fachwissen/unwahre-buchfuehrung/index.html */':'/* Fachartikel: Unwahre Buchführung */',
            },
          }
          for path,repls in changes.items():
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              for old,new in repls.items():
                  s=s.replace(old,new)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/unified-design.css assets/article-detail.css
          git commit -m "CSS-Kommentare semantisch vereinheitlichen"
          git rm .github/workflows/final-comment-cleanup.yml
          git commit -m "Temporären Kommentar-Workflow entfernen"
          git push
