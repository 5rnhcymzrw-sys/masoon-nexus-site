name: Tokenize header footer remnants
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tokenize-header-footer-remnants.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tokenize remaining header footer values
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/global.css')
          s=p.read_text(encoding='utf-8')
          s=s.replace('(100% - 1227px)', '(100% - var(--content-width))')
          s=s.replace('(100vw - 1227px)', '(100vw - var(--content-width))')
          s=s.replace('height:108px!important', 'height:var(--header-height)!important')
          s=s.replace('width:min(100% - 64px,var(--content-width))', 'width:min(100% - var(--page-gutter),var(--content-width))')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/global.css
          git commit -m "Verbleibende Header-Footer-Hardcodes tokenisieren"
          git rm .github/workflows/tokenize-header-footer-remnants.yml
          git commit -m "Temporären Header-Footer-Token-Workflow entfernen"
          git push
