<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Startseite Kastenfarben Test</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:Arial,sans-serif}.bar{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;gap:5px;padding:6px;background:#fff;border:1px solid #ccc}.bar button{padding:8px 11px;background:#fff;border:1px solid #bbb;cursor:pointer}.bar button.on{background:#111;color:#fff}iframe{width:100%;height:100%;border:0}</style></head><body><div class="bar"><button class="on" data-m="1">1 – sehr weich</button><button data-m="2">2 – warm</button><button data-m="3">3 – Greige</button><button data-m="4">4 – Verlauf</button><button data-m="5">5 – Weiss + Akzent</button></div><iframe id="f" src="../index.html"></iframe><script>const f=document.querySelector('#f'),bs=[...document.querySelectorAll('button')];function set(el,prop,val){el.style.setProperty(prop,val,'important')}function clear(d){d.querySelectorAll('[data-kastentest]').forEach(el=>{['background','background-image','background-color','border-top','border-top-color'].forEach(p=>el.style.removeProperty(p));el.removeAttribute('data-kastentest')})}function go(m){const d=f.contentDocument;if(!d)return;clear(d);const dl=[...d.querySelectorAll('.home-values__item')];const fw=[...d.querySelectorAll('.home-paths__grid > a')];const contact=[...d.querySelectorAll('.home-contact-band')];const all=[...dl,...fw,...contact];all.forEach(el=>el.setAttribute('data-kastentest','1'));if(m==='1'){dl.forEach((el,i)=>{const vals=['linear-gradient(115deg,rgba(243,232,212,.18),rgba(232,229,223,.24),rgba(199,203,211,.12))','linear-gradient(115deg,rgba(243,232,212,.12),rgba(232,229,223,.20),rgba(199,203,211,.10))','linear-gradient(115deg,rgba(243,232,212,.10),rgba(232,229,223,.16),rgba(199,203,211,.08))'];set(el,'background',vals[i%3])});fw.forEach(el=>set(el,'background','linear-gradient(115deg,rgba(243,232,212,.10),rgba(232,229,223,.14),rgba(199,203,211,.08))'));contact.forEach(el=>set(el,'background','linear-gradient(110deg,rgba(243,232,212,.16),rgba(232,229,223,.18),rgba(199,203,211,.10))'))}if(m==='2'){dl.forEach((el,i)=>set(el,'background',i%2===0?'#E2DED8':'#F1EEE9'));fw.forEach(el=>set(el,'background','#F5F2ED'));contact.forEach(el=>set(el,'background','linear-gradient(110deg,#F3E8D4,#F4F1EC)'))}if(m==='3'){const vals=['#E7E4DF','#EFEDE9','#F5F4F1'];dl.forEach((el,i)=>set(el,'background',vals[i%3]));fw.forEach(el=>set(el,'background','#EFEDE9'));contact.forEach(el=>set(el,'background','#E7E4DF'))}if(m==='4'){const vals=['linear-gradient(115deg,rgba(243,232,212,.34),rgba(232,229,223,.38),rgba(199,203,211,.22))','linear-gradient(115deg,rgba(232,229,223,.30),rgba(199,203,211,.28))','linear-gradient(115deg,rgba(199,203,211,.24),rgba(141,150,168,.16))'];dl.forEach((el,i)=>set(el,'background',vals[i%3]));fw.forEach(el=>set(el,'background','linear-gradient(115deg,rgba(243,232,212,.18),rgba(199,203,211,.18))'));contact.forEach(el=>set(el,'background','linear-gradient(110deg,rgba(243,232,212,.30),rgba(232,229,223,.26),rgba(199,203,211,.20),rgba(141,150,168,.12))'))}if(m==='5'){dl.forEach((el,i)=>{set(el,'background','#fff');set(el,'border-top','2px solid '+['#E8E5DF','#C7CBD3','#8D96A8'][i%3])});fw.forEach(el=>set(el,'background','#fff'));contact.forEach(el=>set(el,'background','#fff'))}bs.forEach(b=>b.classList.toggle('on',b.dataset.m===m))}f.addEventListener('load',()=>setTimeout(()=>go('1'),700));bs.forEach(b=>b.onclick=()=>go(b.dataset.m));</script></body></html>
