name: Centralize design tokens
on:
  push:
    paths:
      - '.github/workflows/centralize-design-tokens.yml'
permissions:
  contents: write
jobs:
  centralize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Centralize button and gradient tokens
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/global.css')
          s = p.read_text()

          old_root = '--body-color:#484a4f;--label-size:11px;--content-width:1320px;'
          new_root = '--body-color:#484a4f;--label-size:11px;--button-font:var(--font-inter),Arial,sans-serif;--button-size:11px;--button-weight:500;--button-line-height:1.4;--button-letter-spacing:1.1px;--button-text-transform:uppercase;--content-width:1320px;'
          if old_root not in s:
              raise SystemExit('Root anchor not found')
          s = s.replace(old_root, new_root, 1)

          old_button = '''  font-family:var(--font-inter),Arial,sans-serif!important;\n  font-size:11px!important;\n  font-style:normal!important;\n  font-weight:500!important;\n  line-height:1.4!important;\n  letter-spacing:1.1px!important;\n  text-transform:uppercase!important;\n  font-synthesis:none!important;'''
          new_button = '''  font-family:var(--button-font)!important;\n  font-size:var(--button-size)!important;\n  font-style:normal!important;\n  font-weight:var(--button-weight)!important;\n  line-height:var(--button-line-height)!important;\n  letter-spacing:var(--button-letter-spacing)!important;\n  text-transform:var(--button-text-transform)!important;\n  font-synthesis:none!important;'''
          if old_button not in s:
              raise SystemExit('Button typography block not found')
          s = s.replace(old_button, new_button, 1)

          forward = 'linear-gradient(110deg,#f3e8d4 0%,#e8e5df 38%,#c7cbd3 66%,#8d96a8 100%)'
          reverse = 'linear-gradient(110deg,#8d96a8 0%,#c7cbd3 34%,#e8e5df 62%,#f3e8d4 100%)'
          root_old = '--mt-gradient-frame:'+forward+';--mt-gradient-line:'
          root_new = '--mt-gradient-frame:'+forward+';--mt-gradient-frame-reverse:'+reverse+';--mt-gradient-line:'
          if root_old not in s:
              raise SystemExit('Gradient root anchor not found')
          s = s.replace(root_old, root_new, 1)

          # Replace duplicated forward gradient outside the root definition only.
          first = s.find(forward)
          head, tail = s[:first+len(forward)], s[first+len(forward):]
          tail = tail.replace(forward, 'var(--mt-gradient-frame)')
          s = head + tail
          s = s.replace(reverse, 'var(--mt-gradient-frame-reverse)')

          p.write_text(s)
          PY
          rm -f .github/workflows/centralize-design-tokens.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/global.css .github/workflows/centralize-design-tokens.yml
          git commit -m 'Button- und Verlaufswerte global zentralisieren'
          git push
