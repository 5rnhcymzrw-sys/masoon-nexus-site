name: Consolidate hero endstate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/consolidate-hero-endstate.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: python3 .github/scripts/consolidate_hero_endstate.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/unified-design.css
          git commit -m "Hero-Endzustand konsolidieren"
          git rm .github/scripts/consolidate_hero_endstate.py .github/workflows/consolidate-hero-endstate.yml
          git commit -m "Temporären Hero-Workflow entfernen"
          git push
