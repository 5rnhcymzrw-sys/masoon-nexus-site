name: temp match hero company color
on:
  push:
    paths:
      - '.github/workflows/temp-match-hero-company-color.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match test Hero accent color exactly to Unternehmen image
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('farbtest-alle-kaesten-linien-10092026.html')
          s=p.read_text(encoding='utf-8')
          old="function companyAccentGradient(mode){if(mode==='off')return'transparent';if(mode==='3')return'linear-gradient(to right in oklab,rgba(232,210,176,.20) 0%,rgba(232,227,218,.16) 36%,rgba(193,199,214,.14) 68%,rgba(132,144,171,.14) 100%)';const c=[[244,228,201],[232,227,218],[193,199,214],[132,144,171]],levels={'1':.08,'2':.11,'4':.17,'5':.20,'6':.23},a=levels[mode]??.11;return`linear-gradient(to right in oklab,rgba(${c[0].join(',')},${a}) 0%,rgba(${c[1].join(',')},${a}) 36%,rgba(${c[2].join(',')},${a}) 68%,rgba(${c[3].join(',')},${a}) 100%)`}"
          new="function companyAccentGradient(mode){if(mode==='off')return'transparent';if(mode==='3')return'linear-gradient(to right in oklab,rgba(244,228,201,.14) 0%,rgba(232,227,218,.14) 36%,rgba(193,199,214,.14) 68%,rgba(132,144,171,.14) 100%)';const c=[[244,228,201],[232,227,218],[193,199,214],[132,144,171]],levels={'1':.08,'2':.11,'4':.17,'5':.20,'6':.23},a=levels[mode]??.11;return`linear-gradient(to right in oklab,rgba(${c[0].join(',')},${a}) 0%,rgba(${c[1].join(',')},${a}) 36%,rgba(${c[2].join(',')},${a}) 68%,rgba(${c[3].join(',')},${a}) 100%)`}"
          if s.count(old)!=1:
              raise SystemExit(f'companyAccentGradient match count {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add farbtest-alle-kaesten-linien-10092026.html
          git diff --cached --check
          git commit -m 'Match test Hero accent color to Unternehmen image'
          git push
