<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MASOON TREUHAND – Button Schrifttest</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#111;color:#fff}
.testbar{position:fixed;z-index:9999;top:0;left:0;right:0;min-height:74px;padding:12px 18px;background:#111;border-bottom:1px solid #333;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.testlabel{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#aaa;margin-right:4px}
button{appearance:none;border:1px solid #555;background:#1d1d1d;color:#fff;padding:10px 14px;cursor:pointer;font-size:11px}
button.active{background:#fff;color:#111;border-color:#fff}
.note{margin-left:auto;font-size:10px;color:#aaa}
iframe{position:fixed;top:74px;left:0;width:100%;height:calc(100% - 74px);border:0;background:#fff}
@media(max-width:760px){.testbar{min-height:112px}.note{width:100%;margin-left:0}iframe{top:112px;height:calc(100% - 112px)}}
</style>
</head>
<body>
<div class="testbar">
  <span class="testlabel">Button Schrift</span>
  <button id="original">ORIGINAL</button>
  <button id="impressum" class="active">WIE IMPRESSUM</button>
  <span class="note">Echte aktuelle Startseite. Nur die Schriftwerte der Startseiten-Buttons werden testweise überschrieben.</span>
</div>
<iframe id="site" title="Original Startseite Button Test"></iframe>
<script>
const frame=document.getElementById('site');
const original=document.getElementById('original');
const impressum=document.getElementById('impressum');
let mode='impressum';

function apply(){
  const doc=frame.contentDocument;
  if(!doc||!doc.head)return;
  let style=doc.getElementById('masoon-button-typography-test');
  if(!style){style=doc.createElement('style');style.id='masoon-button-typography-test';doc.head.appendChild(style);}
  if(mode==='original'){
    style.textContent='';
  }else{
    style.textContent=`
html body.page-home main.home a.home-action-button,
html body.page-home main.home a.home-action-button:hover,
html body.page-home main.home a.home-action-button:focus,
html body.page-home main.home a.home-action-button:focus-visible,
html body.page-home main.home a.home-action-button:active{
  font-family:var(--font-inter),Arial,sans-serif!important;
  font-size:11px!important;
  font-style:normal!important;
  font-weight:500!important;
  font-variant:normal!important;
  font-stretch:normal!important;
  line-height:1.4!important;
  letter-spacing:.14em!important;
  word-spacing:normal!important;
  text-transform:uppercase!important;
  text-decoration:none!important;
  text-shadow:none!important;
  -webkit-text-stroke:0!important;
  color:#171715!important;
  -webkit-text-fill-color:#171715!important;
  opacity:1!important;
  font-synthesis:none!important;
  -webkit-font-smoothing:antialiased!important;
  -moz-osx-font-smoothing:grayscale!important;
  text-rendering:geometricPrecision!important;
}
html body.page-home main.home a.home-action-button>span{
  color:#171715!important;
  -webkit-text-fill-color:#171715!important;
}
`;
  }
}

function setMode(next){
  mode=next;
  original.classList.toggle('active',mode==='original');
  impressum.classList.toggle('active',mode==='impressum');
  apply();
}

original.addEventListener('click',()=>setMode('original'));
impressum.addEventListener('click',()=>setMode('impressum'));
frame.onload=()=>{
  apply();
  setTimeout(()=>{
    apply();
    const doc=frame.contentDocument;
    const first=doc.querySelector('.home-values .home-action-button');
    if(first)first.scrollIntoView({block:'center',behavior:'auto'});
  },350);
};
frame.src='./index.html?buttonfonttest='+Date.now();
</script>
</body>
</html>
