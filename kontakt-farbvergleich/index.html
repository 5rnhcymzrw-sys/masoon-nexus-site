<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MASOON TREUHAND – Kontakt Farbvergleich</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:Arial,sans-serif}.toolbar{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:99999;display:flex;gap:8px;padding:8px;background:rgba(255,255,255,.96);border:1px solid rgba(23,23,21,.14);box-shadow:0 8px 24px rgba(23,23,21,.10)}.toolbar button{appearance:none;border:1px solid #b9b5af;background:#fff;padding:9px 14px;font-size:12px;cursor:pointer;color:#171715}.toolbar button.active{background:#171715;color:#fff;border-color:#171715}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><div class="toolbar"><button data-mode="white" class="active">Formular weiss</button><button data-mode="gradient">Formular Verlauf</button></div><iframe id="site" src="../kontakt/index.html"></iframe><script>
const frame=document.getElementById('site'),buttons=[...document.querySelectorAll('button[data-mode]')];
const GRAD='linear-gradient(110deg,#f3e8d4 0%,#e8e5df 38%,#c7cbd3 66%,#8d96a8 100%)';
function apply(mode){const d=frame.contentDocument||frame.contentWindow.document;if(!d)return;d.getElementById('kontakt-farbtest-style')?.remove();const s=d.createElement('style');s.id='kontakt-farbtest-style';const form='html body.site-light-page main .contact-split__form';if(mode==='white')s.textContent=`${form}{background:#fff!important;background-color:#fff!important;background-image:none!important;}`;else s.textContent=`${form}{background:${GRAD}!important;background-image:${GRAD}!important;background-color:transparent!important;}`;d.head.appendChild(s);buttons.forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));}
frame.addEventListener('load',()=>{apply('white');setTimeout(()=>{const d=frame.contentDocument||frame.contentWindow.document;d.querySelector('.contact-split__form')?.scrollIntoView({block:'center'});},180)});buttons.forEach(b=>b.addEventListener('click',()=>apply(b.dataset.mode)));
</script></body></html>
