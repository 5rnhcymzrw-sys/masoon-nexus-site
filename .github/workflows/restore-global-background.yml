name: Restore global background
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-global-background.yml
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original global background
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          css = Path('assets/global.css')
          s = css.read_text(encoding='utf-8')
          assert 'background-image:url("../Hintergrundbild 2.webp")!important;' in s
          s = s.replace(
              'background-image:url("../Hintergrundbild 2.webp")!important;',
              'background-image:url("../Hintergrundbild 2.png")!important;',
              1,
          )
          assert 'background-attachment:scroll!important;' in s
          s = s.replace(
              'background-attachment:scroll!important;',
              'background-attachment:fixed!important;',
              1,
          )
          css.write_text(s, encoding='utf-8')

          production = [Path('index.html')]
          for folder in ['unternehmen','dienstleistungen','fachwissen','kontakt','disclaimer','impressum','datenschutz']:
              root = Path(folder)
              if root.exists():
                  production.extend(root.rglob('index.html'))

          preload_pattern = re.compile(
              r'\n?<link\s+rel="preload"\s+as="image"\s+href="[^"]*Hintergrundbild(?:%20| )2\.webp"\s+type="image/webp"\s*/?>',
              re.I,
          )

          for html in sorted(set(production)):
              text = html.read_text(encoding='utf-8')
              text = preload_pattern.sub('', text)
              text = re.sub(
                  r'global\.css\?v=[^"\']+',
                  'global.css?v=background-png-restored-20260915-1',
                  text,
              )
              html.write_text(text, encoding='utf-8')

          final_css = css.read_text(encoding='utf-8')
          assert 'Hintergrundbild 2.png' in final_css
          assert 'Hintergrundbild 2.webp' not in final_css
          assert 'background-attachment:fixed!important;' in final_css
          PY
      - name: Commit restoration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Globalen Hintergrund auf PNG zurückstellen"
          git push
      - name: Remove generated WebP and temporary workflow
        run: |
          git pull --rebase
          git rm -f "Hintergrundbild 2.webp" .github/workflows/restore-global-background.yml
          git commit -m "Temporäre Hintergrund-Optimierung entfernen"
          git push
