<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>MASOON TREUHAND – Hero Balkenkanten Test</title>
<style>
html,body{margin:0;height:100%;background:#111;font-family:Arial,sans-serif}
body{display:grid;grid-template-rows:58px 1fr;overflow:hidden}
.tester{display:flex;align-items:center;gap:7px;padding:0 14px;background:#f3f3f3;border-bottom:1px solid #ccc;box-sizing:border-box;z-index:10;overflow-x:auto}
.tester strong{font-size:13px;margin-right:6px;font-weight:600;white-space:nowrap}
.tester button{appearance:none;border:1px solid #c9c9c9;background:#fff;padding:9px 12px;font-size:12px;cursor:pointer;white-space:nowrap}
.tester button.active{background:#111;color:#fff;border-color:#111}
iframe{width:100%;height:100%;border:0;background:#fff;display:block}
@media(max-width:900px){.tester strong{display:none}}
</style>
</head>
<body>
<div class="tester">
<strong>Balkenkanten vergleichen</strong>
<button data-v="original" class="active">Original</button>
<button data-v="slant">1 · Schräge Kante</button>
<button data-v="top">2 · Oben versetzt</button>
<button data-v="bottom">3 · Unten versetzt</button>
<button data-v="double">4 · Zwei Schrägen</button>
<button data-v="notch">5 · Mittiger Einschnitt</button>
<button data-v="step">6 · Stufenkante</button>
</div>
<iframe id="site" src="./index.html"></iframe>
<script>
const frame=document.getElementById('site');
const buttons=[...document.querySelectorAll('button[data-v]')];
let current='original';

const testCSS=`
@media(min-width:801px){
  /* Exakt die zwei realen Balken. Breite, Höhe und Position bleiben unverändert. */
  html[class*="hero-edge-"] body.site-light-page main.home section.home-hero .home-hero__copy::before,
  html[class*="hero-edge-"] body.site-light-page main.home section.home-hero .home-hero__text-surface{
    border-radius:0!important;
    -webkit-mask-image:none!important;
    mask-image:none!important;
  }

  html.hero-edge-slant body.site-light-page main.home section.home-hero .home-hero__copy::before,
  html.hero-edge-slant body.site-light-page main.home section.home-hero .home-hero__text-surface{
    clip-path:polygon(0 0,96% 0,100% 50%,96% 100%,0 100%)!important;
  }

  html.hero-edge-top body.site-light-page main.home section.home-hero .home-hero__copy::before,
  html.hero-edge-top body.site-light-page main.home section.home-hero .home-hero__text-surface{
    clip-path:polygon(0 0,94% 0,100% 18%,100% 100%,0 100%)!important;
  }

  html.hero-edge-bottom body.site-light-page main.home section.home-hero .home-hero__copy::before,
  html.hero-edge-bottom body.site-light-page main.home section.home-hero .home-hero__text-surface{
    clip-path:polygon(0 0,100% 0,100% 82%,94% 100%,0 100%)!important;
  }

  html.hero-edge-double body.site-light-page main.home section.home-hero .home-hero__copy::before,
  html.hero-edge-double body.site-light-page main.home section.home-hero .home-hero__text-surface{
    clip-path:polygon(0 0,95% 0,100% 16%,100% 84%,95% 100%,0 100%)!important;
  }

  html.hero-edge-notch body.site-light-page main.home section.home-hero .home-hero__copy::before,
  html.hero-edge-notch body.site-light-page main.home section.home-hero .home-hero__text-surface{
    clip-path:polygon(0 0,100% 0,100% 36%,96% 50%,100% 64%,100% 100%,0 100%)!important;
  }

  html.hero-edge-step body.site-light-page main.home section.home-hero .home-hero__copy::before,
  html.hero-edge-step body.site-light-page main.home section.home-hero .home-hero__text-surface{
    clip-path:polygon(0 0,96% 0,96% 24%,100% 24%,100% 76%,96% 76%,96% 100%,0 100%)!important;
  }
}
`;

function apply(v){
  const d=frame.contentDocument;if(!d)return;
  [...d.documentElement.classList].filter(c=>c.startsWith('hero-edge-')).forEach(c=>d.documentElement.classList.remove(c));
  let st=d.getElementById('hero-edge-test-styles');
  if(!st){st=d.createElement('style');st.id='hero-edge-test-styles';st.textContent=testCSS;d.head.appendChild(st)}
  if(v!=='original')d.documentElement.classList.add('hero-edge-'+v);
  buttons.forEach(b=>b.classList.toggle('active',b.dataset.v===v));
  current=v;
}
frame.addEventListener('load',()=>apply(current));
buttons.forEach(b=>b.addEventListener('click',()=>apply(b.dataset.v)));
</script>
</body>
</html>
