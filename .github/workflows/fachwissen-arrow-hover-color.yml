name: Fachwissen arrow hover color

on:
  push:
    paths:
      - '.github/workflows/fachwissen-arrow-hover-color.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bestehende Pfeilfarbregel anpassen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          css = Path('assets/unified-design.css')
          text = css.read_text()
          old = '''html body.page-knowledge.site-light-page main .knowledge-section .article-card .article-action::after{
  content:"›"!important;
  display:block!important;
  font-size:20px!important;
  font-weight:300!important;
  line-height:1!important;
  letter-spacing:0!important;
  color:#777777!important;
}'''
          new = '''html body.page-knowledge.site-light-page main .knowledge-section .article-card .article-action::after{
  content:"›"!important;
  display:block!important;
  font-size:20px!important;
  font-weight:300!important;
  line-height:1!important;
  letter-spacing:0!important;
  color:inherit!important;
}'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one existing article-action arrow rule, found {text.count(old)}')
          text = text.replace(old, new, 1)
          css.write_text(text)

          page = Path('fachwissen/index.html')
          html = page.read_text()
          html2 = re.sub(r'(\.\./assets/unified-design\.css\?v=)[^"\']+', r'\1fachwissen-arrow-inherit-20260913-1', html, count=1)
          if html2 == html:
              raise SystemExit('Could not update unified-design.css cache token')
          page.write_text(html2)

          check = css.read_text()
          if new not in check or old in check:
              raise SystemExit('Existing arrow rule was not cleanly replaced')
          print('Existing arrow colour changed from fixed #777777 to inherit; no new CSS rule added')
          PY
      - name: Commit und temporären Workflow entfernen
        run: |
          rm -f .github/workflows/fachwissen-arrow-hover-color.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'No changes'; exit 1; }
          git commit -m "Fachwissen: Pfeilfarbe an Beitrag anzeigen koppeln"
          git push
