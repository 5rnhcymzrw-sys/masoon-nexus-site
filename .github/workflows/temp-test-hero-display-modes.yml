name: temp test hero display modes
on:
  push:
    paths:
      - '.github/workflows/temp-test-hero-display-modes.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Hero comparison modes to existing test page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('farbtest-alle-kaesten-linien-10092026.html')
          s=p.read_text(encoding='utf-8')

          old="states.hero={color:'3',lines:'off',soft:'on'};states['company-accent']={color:'3',lines:'off',soft:'on'};"
          new="states.hero={color:'3',lines:'off',soft:'on',display:'separate'};states['company-accent']={color:'3',lines:'off',soft:'on'};"
          if s.count(old)!=1: raise SystemExit(f'hero state match count {s.count(old)}')
          s=s.replace(old,new,1)

          old="""function heroCss(s){const bg=s.color==='off'?'transparent':companyAccentGradient(s.color);return`html body.page-home.site-light-page main.home section.home-hero .home-hero__copy{position:relative!important;isolation:isolate!important}html body.page-home.site-light-page main.home section.home-hero .home-hero__copy>.masoon-hero-white-backplate{display:block!important;position:absolute!important;box-sizing:border-box!important;background:${bg}!important;background-size:100% 100%!important;background-position:0 0!important;background-repeat:no-repeat!important;border:0!important;box-shadow:none!important;-webkit-backdrop-filter:${s.soft==='on'?'blur(32px)':'none'}!important;backdrop-filter:${s.soft==='on'?'blur(32px)':'none'}!important;pointer-events:none!important;z-index:1!important}html body.page-home.site-light-page main.home section.home-hero .home-hero__copy::before{background:#fff!important;background-image:none!important;border:${s.lines==='on'?'1px solid transparent':'0'}!important;border-image:${s.lines==='on'?borderFull:'none'}!important;border-color:transparent!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;z-index:2!important}html body.page-home.site-light-page main.home section.home-hero .home-hero__copy>:not(.masoon-hero-white-backplate){position:relative;z-index:3}`}"""
          new="""function heroCss(s){const bg=s.color==='off'?'transparent':companyAccentGradient(s.color),separate=s.display==='separate',tinted=s.display==='tinted',front=tinted?bg:'#fff',frontSoft=tinted&&s.soft==='on'?'blur(32px)':'none';return`html body.page-home.site-light-page main.home section.home-hero .home-hero__copy{position:relative!important;isolation:isolate!important}html body.page-home.site-light-page main.home section.home-hero .home-hero__copy>.masoon-hero-white-backplate{display:${separate?'block':'none'}!important;position:absolute!important;box-sizing:border-box!important;background:${bg}!important;background-size:100% 100%!important;background-position:0 0!important;background-repeat:no-repeat!important;border:0!important;box-shadow:none!important;-webkit-backdrop-filter:${separate&&s.soft==='on'?'blur(32px)':'none'}!important;backdrop-filter:${separate&&s.soft==='on'?'blur(32px)':'none'}!important;pointer-events:none!important;z-index:1!important}html body.page-home.site-light-page main.home section.home-hero .home-hero__copy::before{background:${front}!important;background-image:${tinted?bg:'none'}!important;background-size:100% 100%!important;background-position:0 0!important;background-repeat:no-repeat!important;border:${s.lines==='on'?'1px solid transparent':'0'}!important;border-image:${s.lines==='on'?borderFull:'none'}!important;border-color:transparent!important;box-shadow:none!important;-webkit-backdrop-filter:${frontSoft}!important;backdrop-filter:${frontSoft}!important;z-index:2!important}html body.page-home.site-light-page main.home section.home-hero .home-hero__copy>:not(.masoon-hero-white-backplate){position:relative;z-index:3}`}"""
          if s.count(old)!=1: raise SystemExit(f'heroCss match count {s.count(old)}')
          s=s.replace(old,new,1)

          old="""function sectionBlock(section){const s=states[section.id];if(section.softOnly)return`<div class=\"section-block\" data-section=\"${section.id}\"><div class=\"section-title\">${section.label}</div><div class=\"mini-row\"><span class=\"mini-label\">Weich</span><button data-section-soft=\"on\" class=\"${s.soft==='on'?'active':''}\">mit</button><button data-section-soft=\"off\" class=\"${s.soft==='off'?'active':''}\">ohne</button></div></div>`;const colorButtons=section.id==='company-accent'?`<button data-section-color=\"off\" class=\"${s.color==='off'?'active':''}\">ohne</button><button data-section-color=\"1\" class=\"${s.color==='1'?'active':''}\">1</button><button data-section-color=\"2\" class=\"${s.color==='2'?'active':''}\">2</button><button data-section-color=\"3\" class=\"${s.color==='3'?'active':''}\">3</button><button data-section-color=\"4\" class=\"${s.color==='4'?'active':''}\">4</button><button data-section-color=\"5\" class=\"${s.color==='5'?'active':''}\">5</button><button data-section-color=\"6\" class=\"${s.color==='6'?'active':''}\">6</button>`:`<button data-section-color=\"off\" class=\"${s.color==='off'?'active':''}\">ohne</button><button data-section-color=\"2\" class=\"${s.color==='2'?'active':''}\">2</button><button data-section-color=\"3\" class=\"${s.color==='3'?'active':''}\">3</button>`;return`<div class=\"section-block\" data-section=\"${section.id}\"><div class=\"section-title\">${section.label}</div><div class=\"mini-row\"><span class=\"mini-label\">Farbe</span>${colorButtons}</div><div class=\"mini-row\"><span class=\"mini-label\">Linien</span><button data-section-lines=\"on\" class=\"${s.lines==='on'?'active':''}\">mit</button><button data-section-lines=\"off\" class=\"${s.lines==='off'?'active':''}\">ohne</button></div><div class=\"mini-row\"><span class=\"mini-label\">Weich</span><button data-section-soft=\"on\" class=\"${s.soft==='on'?'active':''}\">mit</button><button data-section-soft=\"off\" class=\"${s.soft==='off'?'active':''}\">ohne</button></div></div>`}"""
          new="""function sectionBlock(section){const s=states[section.id];if(section.softOnly)return`<div class=\"section-block\" data-section=\"${section.id}\"><div class=\"section-title\">${section.label}</div><div class=\"mini-row\"><span class=\"mini-label\">Weich</span><button data-section-soft=\"on\" class=\"${s.soft==='on'?'active':''}\">mit</button><button data-section-soft=\"off\" class=\"${s.soft==='off'?'active':''}\">ohne</button></div></div>`;const colorButtons=section.id==='company-accent'?`<button data-section-color=\"off\" class=\"${s.color==='off'?'active':''}\">ohne</button><button data-section-color=\"1\" class=\"${s.color==='1'?'active':''}\">1</button><button data-section-color=\"2\" class=\"${s.color==='2'?'active':''}\">2</button><button data-section-color=\"3\" class=\"${s.color==='3'?'active':''}\">3</button><button data-section-color=\"4\" class=\"${s.color==='4'?'active':''}\">4</button><button data-section-color=\"5\" class=\"${s.color==='5'?'active':''}\">5</button><button data-section-color=\"6\" class=\"${s.color==='6'?'active':''}\">6</button>`:`<button data-section-color=\"off\" class=\"${s.color==='off'?'active':''}\">ohne</button><button data-section-color=\"2\" class=\"${s.color==='2'?'active':''}\">2</button><button data-section-color=\"3\" class=\"${s.color==='3'?'active':''}\">3</button>`;const displayRow=section.id==='hero'?`<div class=\"mini-row\"><span class=\"mini-label\">Darstell.</span><button data-section-display=\"normal\" class=\"${s.display==='normal'?'active':''}\">normal</button><button data-section-display=\"separate\" class=\"${s.display==='separate'?'active':''}\">separat</button><button data-section-display=\"tinted\" class=\"${s.display==='tinted'?'active':''}\">eingefärbt</button></div>`:'';return`<div class=\"section-block\" data-section=\"${section.id}\"><div class=\"section-title\">${section.label}</div>${displayRow}<div class=\"mini-row\"><span class=\"mini-label\">Farbe</span>${colorButtons}</div><div class=\"mini-row\"><span class=\"mini-label\">Linien</span><button data-section-lines=\"on\" class=\"${s.lines==='on'?'active':''}\">mit</button><button data-section-lines=\"off\" class=\"${s.lines==='off'?'active':''}\">ohne</button></div><div class=\"mini-row\"><span class=\"mini-label\">Weich</span><button data-section-soft=\"on\" class=\"${s.soft==='on'?'active':''}\">mit</button><button data-section-soft=\"off\" class=\"${s.soft==='off'?'active':''}\">ohne</button></div></div>`}"""
          if s.count(old)!=1: raise SystemExit(f'sectionBlock match count {s.count(old)}')
          s=s.replace(old,new,1)

          old="if(b.dataset.sectionColor)s.color=b.dataset.sectionColor;if(b.dataset.sectionLines)s.lines=b.dataset.sectionLines;if(b.dataset.sectionSoft)s.soft=b.dataset.sectionSoft;"
          new="if(b.dataset.sectionDisplay)s.display=b.dataset.sectionDisplay;if(b.dataset.sectionColor)s.color=b.dataset.sectionColor;if(b.dataset.sectionLines)s.lines=b.dataset.sectionLines;if(b.dataset.sectionSoft)s.soft=b.dataset.sectionSoft;"
          if s.count(old)!=1: raise SystemExit(f'click handler match count {s.count(old)}')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add farbtest-alle-kaesten-linien-10092026.html
          git diff --cached --check
          git commit -m 'Add Hero comparison modes to existing test page'
          git push
