name: Article action hover Nachname

on:
  push:
    paths:
      - '.github/workflows/article-action-hover-nachname.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bestehende Fachwissen-Regeln anpassen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          cache = 'article-action-hover-nachname-20260913-3'
          base = Path('assets/unified-design-base-20260907.css')
          unified = Path('assets/unified-design.css')

          # Bereits vorhandene Beitrag-anzeigen-Regeln behalten ihre Struktur.
          # Nur ein vorhandener Normalfarbwert wird an die bestehende Karten-Hoverregel gekoppelt.
          text = base.read_text()
          selector = 'html body.site-light-page main .knowledge-section .articles-grid>.article-card>.article-action.article-action'
          pat = re.compile(re.escape(selector) + r'\{([^{}]*)\}', re.S)
          matches = list(pat.finditer(text))
          if len(matches) != 2:
              raise SystemExit(f'Expected exactly two article-action rules, found {len(matches)}')
          changed_count = 0
          for m in reversed(matches):
              body = m.group(1)
              old = 'color:#777777!important;'
              if old not in body:
                  continue
              new_body = body.replace(old, 'color:var(--article-action-color,#777777)!important;', 1)
              text = text[:m.start(1)] + new_body + text[m.end(1):]
              changed_count += 1
          if changed_count < 1:
              raise SystemExit('No existing article-action normal color could be coupled')
          base.write_text(text)

          # Bestehende Karten-Hoverregel erweitern, keine neue CSS-Regel erzeugen.
          text = unified.read_text()
          selector = 'html body.page-knowledge.site-light-page main .knowledge-section#knowledge-articles .articles-grid>.article-card.article-card:hover'
          pat = re.compile(re.escape(selector) + r'\{([^{}]*)\}', re.S)
          matches = list(pat.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one article-card hover rule, found {len(matches)}')
          m = matches[0]
          body = m.group(1)
          if '--article-action-color:' in body:
              raise SystemExit('Article action hover variable already exists')
          new_body = body.rstrip()
          if new_body and not new_body.endswith(';'):
              new_body += ';'
          new_body += '\n    --article-action-color:#171715!important;\n  '
          text = text[:m.start(1)] + new_body + text[m.end(1):]

          # Bestehenden Import-Cachewert aktualisieren.
          text2 = re.sub(
              r"(@import url\('\./unified-design-base-20260907\.css\?v=)[^']+",
              r'\1' + cache,
              text,
              count=1,
          )
          if text2 == text:
              raise SystemExit('Could not update base import cache token')
          unified.write_text(text2)

          # Nur vorhandene unified-design Links cache-busten.
          html_changed = 0
          for page in [p for p in sorted(Path('.').rglob('*.html')) if '.git' not in p.parts]:
              h = page.read_text(errors='ignore')
              nh = re.sub(
                  r'((?:\.\./)*assets/unified-design\.css\?v=)[^"\']+',
                  r'\1' + cache,
                  h,
              )
              if nh != h:
                  page.write_text(nh)
                  html_changed += 1

          print('Adjusted existing article-action normal-color rule(s):', changed_count)
          print('Adjusted existing article-card hover rule: 1')
          print('HTML cache tokens changed:', html_changed)
          PY
      - name: Commit und temporären Workflow entfernen
        run: |
          rm -f .github/workflows/article-action-hover-nachname.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'No changes'; exit 1; }
          git commit -m "Beitrag anzeigen: Hoverfarbe wie Nachname"
          git push
