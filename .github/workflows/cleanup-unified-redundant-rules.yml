name: Cleanup unified redundant rules
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-unified-redundant-rules.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove redundant overrides and tokenize widths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/unified-design.css')
          s=p.read_text(encoding='utf-8')

          # Safe token replacements in Fachwissen layout.
          s=s.replace('width:min(calc(100vw - 64px),1227px)!important;','width:min(calc(100vw - var(--page-gutter)),var(--content-width))!important;')
          s=s.replace('width:min(calc(100vw - 36px),1227px)!important;','width:min(calc(100vw - var(--page-gutter-mobile)),var(--content-width))!important;')
          s=s.replace('padding:126px 72px!important;','padding:var(--section-y) 72px!important;')
          s=s.replace('width:min(100% - 64px,1227px)!important;','width:min(100% - var(--page-gutter),var(--content-width))!important;')

          blocks=[]
          blocks.append('''html body.site-light-page .knowledge-section .articles-grid>.article-card>.article-action{\n  margin-top:0!important;\n}\n@media(min-width:801px){\n  html body.site-light-page .knowledge-section .articles-grid>.article-card>.article-action{\n    transform:translateY(-3px)!important;\n  }\n}\n''')
          blocks.append('''/* Fachwissen Hauptseite: nur der Pfeil-Link auf derselben Linie wie Mehr anzeigen */\nhtml body.site-light-page .knowledge-section .articles-grid>.article-card>.article-action{\n  align-self:flex-start!important;\n  margin-top:24px!important;\n  padding-bottom:4px!important;\n  transform:translateY(-3px)!important;\n}\n\n''')
          blocks.append('''/* Fachwissen Hauptseite: Beitrag anzeigen exakt wie Mehr anzeigen */\nhtml body.site-light-page main .knowledge-section .articles-grid>.article-card>.article-action{\n\n  padding-bottom:4px!important;\n}\n\n''')
          blocks.append('''html body main .contact-split__form-label,\nhtml body main .home-paths__grid span{\n  font-family:var(--font-inter),Arial,sans-serif!important;\n  font-size:11px!important;\n  font-weight:500!important;\n  line-height:1.65!important;\n  letter-spacing:.1em!important;\n  text-transform:uppercase!important;\n  color:#868279!important;\n}\n''')
          blocks.append('''html body main .article-card>a{\n  font-family:var(--font-inter),Arial,sans-serif!important;\n  font-size:11px!important;\n  font-style:normal!important;\n  font-weight:500!important;\n  line-height:1.4!important;\n  letter-spacing:1.1px!important;\n  text-transform:uppercase!important;\n  text-decoration:none!important;\n  color:#777777!important;\n}\n''')
          blocks.append('''html body main .details-action,\nhtml body main .home-values__all-services{\n  text-decoration:none!important;\n  color:#777777!important;\n}\n\n''')

          removed=0
          for b in blocks:
              if b in s:
                  s=s.replace(b,'',1)
                  removed+=1
          if removed != len(blocks):
              raise SystemExit(f'Expected {len(blocks)} obsolete blocks, removed {removed}')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/unified-design.css
          git commit -m "Redundante unified-design-Regeln entfernen und Fachwissen tokenisieren"
          git rm .github/workflows/cleanup-unified-redundant-rules.yml
          git commit -m "Temporären unified-design-Bereinigungsworkflow entfernen"
          git push