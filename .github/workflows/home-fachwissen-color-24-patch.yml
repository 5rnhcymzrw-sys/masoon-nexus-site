name: Home Fachwissen color 24 patch

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/home-fachwissen-color-24-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update existing home knowledge gradients only
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path('assets/unified-design.css')
          text = css.read_text()
          old = 'linear-gradient(to right in oklab,rgba(244,228,201,.11) 0%,rgba(232,227,218,.11) 36%,rgba(193,199,214,.11) 68%,rgba(132,144,171,.11) 100%)'
          new = 'linear-gradient(to right in oklab,rgba(244,228,201,.24) 0%,rgba(232,227,218,.24) 36%,rgba(193,199,214,.24) 68%,rgba(158,165,184,.24) 100%)'

          # Obere drei bestehenden Fachwissen-Kartenregeln
          start = text.find('/* Nur die drei Fachwissen-Karten zusätzlich leicht einfärben */')
          end = text.find('/* Kontaktbereich:', start)
          if start == -1 or end == -1:
              raise SystemExit('Home Fachwissen normal-state section not found')
          block = text[start:end]
          if block.count(old) != 3:
              raise SystemExit(f'Expected 3 normal-state gradients, found {block.count(old)}')
          block = block.replace(old, new)
          text = text[:start] + block + text[end:]

          # Bestehende Hover-Regel ebenfalls auf dieselbe Farbe setzen
          hover_selector = 'html body.page-home.site-light-page main.home section.home-paths .home-paths__grid>a:hover,'
          hs = text.find(hover_selector)
          if hs == -1:
              raise SystemExit('Home Fachwissen hover rule not found')
          he = text.find('\n  }', hs)
          if he == -1:
              raise SystemExit('Home Fachwissen hover rule end not found')
          hblock = text[hs:he+4]
          if hblock.count(old) != 1:
              raise SystemExit(f'Expected 1 hover gradient, found {hblock.count(old)}')
          hblock = hblock.replace(old, new, 1)
          text = text[:hs] + hblock + text[he+4:]

          css.write_text(text)

          index = Path('index.html')
          html = index.read_text()
          old_cache = 'assets/unified-design.css?v=home-dl-color-24-20260912-1'
          new_cache = 'assets/unified-design.css?v=home-fachwissen-color-24-20260912-1'
          if html.count(old_cache) != 1:
              raise SystemExit('Expected exactly 1 stylesheet cache reference')
          index.write_text(html.replace(old_cache, new_cache, 1))
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/home-fachwissen-color-24-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/unified-design.css index.html .github/workflows/home-fachwissen-color-24-patch.yml
          git commit -m "Startseite Fachwissen: drei Kästen auf 24 Prozent anpassen"
          git push
