name: Safe button typography

on:
  push:
    paths:
      - '.github/workflows/safe-button-typography.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adjust existing button rules only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          CACHE = 'button-typography-safe-20260912-1'
          NORMAL = '#777777!important'
          DARK = '#4f4e4b!important'

          changed = set()

          def update_rule(path, selector, props, expected=1):
              text = path.read_text()
              pat = re.compile(re.escape(selector) + r'\{([^{}]*)\}', re.S)
              matches = list(pat.finditer(text))
              if len(matches) != expected:
                  raise SystemExit(f'{path}: expected {expected} rule(s) for {selector!r}, found {len(matches)}')
              offset = 0
              for m in matches:
                  body = m.group(1)
                  new = body
                  for prop, value in props.items():
                      p = re.compile(r'(?<![-\w])' + re.escape(prop) + r'\s*:\s*[^;}]+' , re.I)
                      if p.search(new):
                          new = p.sub(f'{prop}:{value}', new)
                      else:
                          if new and not new.rstrip().endswith(';'):
                              new = new.rstrip() + ';'
                          new = new.rstrip() + f'\n  {prop}:{value};\n'
                  if new != body:
                      start = m.start(1) + offset
                      end = m.end(1) + offset
                      text = text[:start] + new + text[end:]
                      offset += len(new) - len(body)
              path.write_text(text)
              changed.add(path)

          def replace_once(path, old, new):
              text = path.read_text()
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected exact replacement once, found {n}: {old[:100]!r}')
              path.write_text(text.replace(old, new, 1))
              changed.add(path)

          # 1) Repair two old unterminated comments that were swallowing existing typography rules.
          base = Path('assets/unified-design-base-20260907.css')
          replace_once(
              base,
              '}/* Kleine Metadaten und Textaktionen: Typografie wie die Kopfzeilen-Navigation,\nhtml body main .contact-split__form-label,',
              '}/* Kleine Metadaten und Textaktionen: Typografie wie die Kopfzeilen-Navigation. */\nhtml body main .contact-split__form-label,'
          )
          replace_once(
              base,
              '}/* Kleine Metadaten,\nhtml body main .contact-split__form-label.contact-split__form-label.contact-split__form-label.contact-split__form-label.contact-split__form-label.contact-split__form-label,',
              '}/* Kleine Metadaten und Aktionsbeschriftungen */\nhtml body main .contact-split__form-label.contact-split__form-label.contact-split__form-label.contact-split__form-label.contact-split__form-label.contact-split__form-label,'
          )

          # 2) Existing shared action typography: exact same values as section labels.
          shared_old = 'html body main .details-action,\nhtml body main .home-values__all-services,\nhtml body main .article-card>a'
          update_rule(base, shared_old, {
              'font-family':'var(--font-inter),Arial,sans-serif!important',
              'font-size':'11px!important',
              'font-style':'normal!important',
              'font-weight':'500!important',
              'line-height':'1.4!important',
              'letter-spacing':'1.1px!important',
              'text-transform':'uppercase!important',
              'color':NORMAL,
              'text-decoration':'none!important',
          })
          update_rule(base, 'html body.site-light-page .knowledge-section .articles-grid>.article-card>.details-action', {
              'font-family':'var(--font-inter),Arial,sans-serif!important',
              'font-size':'11px!important',
              'font-style':'normal!important',
              'font-weight':'500!important',
              'line-height':'1.4!important',
              'letter-spacing':'1.1px!important',
              'text-transform':'uppercase!important',
              'color':NORMAL,
              'text-decoration':'none!important',
          })

          # 3) Contact submit button: keep geometry, change text values only.
          contact = Path('assets/contact.css')
          update_rule(contact, '.contact-split__form button', {
              'font-family':'var(--font-inter),Arial,sans-serif!important',
              'font-size':'11px!important',
              'font-style':'normal!important',
              'font-weight':'500!important',
              'line-height':'1.4!important',
              'letter-spacing':'1.1px!important',
              'text-transform':'uppercase!important',
              'color':NORMAL,
              'text-decoration':'none!important',
          })
          update_rule(contact, '.contact-split__form button span', {'letter-spacing':'0!important'})

          # 4) Page-specific existing rules that had 1.65 line-height / symbol tracking.
          unified = Path('assets/unified-design.css')
          update_rule(unified, 'html body.page-home .home-action-button', {
              'font-family':'var(--font-inter),Arial,sans-serif!important',
              'font-size':'11px!important',
              'font-style':'normal!important',
              'font-weight':'500!important',
              'line-height':'1.4!important',
              'letter-spacing':'1.1px!important',
              'text-transform':'uppercase!important',
              'color':NORMAL,
              'text-decoration':'none!important',
          })
          update_rule(unified, 'html body.page-home .home-action-button span', {'letter-spacing':'0!important'})
          update_rule(unified, 'html body.page-home.site-light-page main.home section.home-paths .home-paths__grid>a>.home-paths__action', {
              'font-family':'var(--font-inter),Arial,sans-serif!important',
              'font-size':'11px!important',
              'font-style':'normal!important',
              'font-weight':'500!important',
              'line-height':'1.4!important',
              'letter-spacing':'1.1px!important',
              'text-transform':'uppercase!important',
              'color':NORMAL,
              'text-decoration':'none!important',
          })
          update_rule(unified, 'html body.page-home.site-light-page main.home section.home-paths .home-paths__grid>a>.home-paths__action>span', {'letter-spacing':'0!important'})
          update_rule(unified, 'html body.page-services.site-light-page .services-closing__links .services-contact-button', {
              'font-family':'var(--font-inter),Arial,sans-serif!important',
              'font-size':'11px!important',
              'font-style':'normal!important',
              'font-weight':'500!important',
              'line-height':'1.4!important',
              'letter-spacing':'1.1px!important',
              'text-transform':'uppercase!important',
              'color':NORMAL,
              'text-decoration':'none!important',
          })
          update_rule(unified, 'html body.page-services.site-light-page .services-closing__links .services-contact-button span', {'letter-spacing':'0!important'})
          update_rule(unified, 'html body.page-services.site-light-page main.services-main .services-contact-button', {
              'font-family':'var(--font-inter),Arial,sans-serif!important',
              'font-size':'11px!important',
              'font-style':'normal!important',
              'font-weight':'500!important',
              'line-height':'1.4!important',
              'letter-spacing':'1.1px!important',
              'text-transform':'uppercase!important',
              'color':NORMAL,
              'text-decoration':'none!important',
          })
          update_rule(unified, 'html body.page-services.site-light-page main.services-main .services-contact-button>span', {'letter-spacing':'0!important'})
          update_rule(unified, 'html body.page-contact.site-light-page main .contact-split__form button[type="submit"]', {
              'font-family':'var(--font-inter),Arial,sans-serif!important',
              'font-size':'11px!important',
              'font-style':'normal!important',
              'font-weight':'500!important',
              'line-height':'1.4!important',
              'letter-spacing':'1.1px!important',
              'text-transform':'uppercase!important',
              'color':NORMAL,
              'text-decoration':'none!important',
          }, expected=3)
          update_rule(unified, 'html body.page-contact.site-light-page main .contact-split__form button[type="submit"]>span', {'letter-spacing':'0!important'})

          # 5) Existing contact state group wrongly bundled normal and hover as dark.
          old_contact_states = '''html body.page-contact.site-light-page main .contact-split__form button[type="submit"],
html body.page-contact.site-light-page main .contact-split__form button[type="submit"]:hover,
html body.page-contact.site-light-page main .contact-split__form button[type="submit"]:focus,
html body.page-contact.site-light-page main .contact-split__form button[type="submit"]:focus-visible,
html body.page-contact.site-light-page main .contact-split__form button[type="submit"]:active{
  color:#4f4e4b!important;
  background:transparent!important;
  box-shadow:none!important;
  filter:none!important;
  transform:none!important;
  transition:none!important;
}'''
          new_contact_states = '''html body.page-contact.site-light-page main .contact-split__form button[type="submit"]{
  color:#777777!important;
  background:transparent!important;
  box-shadow:none!important;
  filter:none!important;
  transform:none!important;
  transition:none!important;
}
html body.page-contact.site-light-page main .contact-split__form button[type="submit"]:hover,
html body.page-contact.site-light-page main .contact-split__form button[type="submit"]:focus,
html body.page-contact.site-light-page main .contact-split__form button[type="submit"]:focus-visible,
html body.page-contact.site-light-page main .contact-split__form button[type="submit"]:active{
  color:#4f4e4b!important;
  background:transparent!important;
  box-shadow:none!important;
  filter:none!important;
  transform:none!important;
  transition:none!important;
}'''
          replace_once(unified, old_contact_states, new_contact_states)

          # 6) Existing Mehr-anzeigen state group: normal/open grey, hover darker.
          dl = Path('assets/dienstleistungen.css')
          old_details_states = '''.services-section .service-card .details-action,
.services-section .service-card:hover .details-action,
.services-section .service-card[open] .details-action{display:inline-block!important;color:#4f4e4b!important;opacity:1!important;visibility:visible!important;}'''
          new_details_states = '''.services-section .service-card .details-action,
.services-section .service-card[open] .details-action{display:inline-block!important;color:#777777!important;opacity:1!important;visibility:visible!important;}
.services-section .service-card:hover .details-action{display:inline-block!important;color:#4f4e4b!important;opacity:1!important;visibility:visible!important;}'''
          replace_once(dl, old_details_states, new_details_states)

          # 7) Verify no target title owner still uses old line-height / spacing / normal colour.
          checks = [
              (contact, '.contact-split__form button{', 'line-height:1.4!important', 'letter-spacing:1.1px!important', 'color:#777777!important'),
              (unified, 'html body.page-home .home-action-button{', 'line-height:1.4!important', 'letter-spacing:1.1px!important', 'color:#777777!important'),
              (unified, 'html body.page-services.site-light-page .services-closing__links .services-contact-button{', 'line-height:1.4!important', 'letter-spacing:1.1px!important', 'color:#777777!important'),
              (unified, 'html body.page-services.site-light-page main.services-main .services-contact-button{', 'line-height:1.4!important', 'letter-spacing:1.1px!important', 'color:#777777!important'),
              (unified, 'html body.page-contact.site-light-page main .contact-split__form button[type="submit"]{', 'line-height:1.4!important', 'letter-spacing:1.1px!important', 'color:#777777!important'),
          ]
          for path, selector, *needles in checks:
              text = path.read_text().replace(' ', '')
              s = selector.replace(' ', '')
              pos = text.find(s)
              if pos < 0:
                  raise SystemExit(f'Missing verified selector {selector} in {path}')
              end = text.find('}', pos)
              block = text[pos:end]
              for needle in needles:
                  if needle.replace(' ', '') not in block:
                      raise SystemExit(f'{path}: {selector} missing {needle}')

          # Base import cache token and direct stylesheet cache tokens.
          if base in changed:
              text = unified.read_text()
              text2 = re.sub(r"(@import url\('\./unified-design-base-20260907\.css\?v=)[^']+", r'\1' + CACHE, text, count=1)
              if text2 == text:
                  raise SystemExit('Could not cache-bust base import')
              unified.write_text(text2)
              changed.add(unified)

          changed_names = {p.name for p in changed}
          html_changed = 0
          for page in [p for p in sorted(Path('.').rglob('*.html')) if '.git' not in p.parts]:
              h = page.read_text(errors='ignore')
              nh = h
              for name in changed_names:
                  nh = re.sub(r'((?:\.\./)*assets/' + re.escape(name) + r'\?v=)[^"\']+', r'\1' + CACHE, nh)
              if nh != h:
                  page.write_text(nh)
                  html_changed += 1

          print('Changed existing CSS files:', [str(p) for p in sorted(changed)])
          print('Cache-updated HTML files:', html_changed)
          PY
      - name: Commit safe changes and remove temporary workflows
        run: |
          rm -f .github/workflows/safe-button-typography.yml
          rm -f .github/workflows/exact-button-typography.yml
          rm -f .github/workflows/revert-bad-button-normalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'No changes'; exit 1; }
          git commit -m "Buttontexte: bestehende Regeln exakt vereinheitlichen"
          git push
