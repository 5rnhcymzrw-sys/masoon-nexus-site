name: Body copy centralization check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/body-copy-centralization-check.yml']
permissions:
  contents: write
jobs:
  apply-verified-body-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Check branch has not moved
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ github.sha }}"
      - name: Apply the exact locally verified changes
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, pathlib, subprocess, zlib
          patch = zlib.decompress(base64.b64decode(""))
          guards = json.loads(zlib.decompress(base64.b64decode("")))
          for name, hashes in guards.items():
              actual = hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
              if actual != hashes["before"]:
                  raise SystemExit("Source changed since verification: " + name)
          subprocess.run(["git", "apply", "--check", "-"], input=patch, check=True)
          subprocess.run(["git", "apply", "-"], input=patch, check=True)
          for name, hashes in guards.items():
              actual = hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
              if actual != hashes["after"]:
                  raise SystemExit("Output differs from verified result: " + name)
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          if changed != set(guards):
              raise SystemExit("Unexpected changed files")
          subprocess.run(["git", "diff", "--check"], check=True)
          subprocess.run(["git", "add", "--", *sorted(guards)], check=True)
          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "commit", "-m", "Fliesstext in global.css vollständig zentralisieren"], check=True)
          subprocess.run(["git", "push", "origin", "HEAD:main"], check=True)
          print("Verified body-copy centralization committed:")
          subprocess.run(["git", "rev-parse", "HEAD"], check=True)
          print("Changed CSS: 5; HTML stylesheet cache references refreshed: 15 pages.")
          PY
