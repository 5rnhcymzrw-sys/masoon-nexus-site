name: Rehome final page blocks
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rehome-final-page-blocks.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move article and contact blocks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          u=Path('assets/unified-design.css')
          a=Path('assets/article-detail.css')
          c=Path('assets/contact.css')
          s=u.read_text(encoding='utf-8')

          article_start=s.index('/* fachwissen/gewinnverwendung/index.html */')
          article_end=s.index('/* impressum/index.html */', article_start)
          article_block=s[article_start:article_end]
          # Remove empty legacy markers and malformed dead selector while preserving real special rules.
          for marker in [
              '/* fachwissen/gewinnverwendung/index.html */\n\n',
              '/* fachwissen/missbraeuchliche-konkurse/index.html */\n\n',
          ]:
              article_block=article_block.replace(marker,'')
          article_block=article_block.replace('body.page-article-company-formation n    .article-body li:last-child{margin-bottom:0}','')
          s=s[:article_start]+s[article_end:]
          a.write_text(a.read_text(encoding='utf-8').rstrip()+"\n\n/* Artikelspezifische Sonderregeln */\n"+article_block.strip()+"\n",encoding='utf-8')

          contact_start=s.index('/* kontakt/index.html */')
          contact_end=s.index('/* unternehmen/index.html */', contact_start)
          contact_block=s[contact_start:contact_end]
          s=s[:contact_start]+s[contact_end:]
          c.write_text(c.read_text(encoding='utf-8').rstrip()+"\n\n/* Kontaktspezifische Endregeln */\n"+contact_block.replace('/* kontakt/index.html */','').strip()+"\n",encoding='utf-8')

          assert 'page-article-' not in s
          assert '/* kontakt/index.html */' not in s
          u.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/unified-design.css assets/article-detail.css assets/contact.css
          git commit -m "Artikel- und Kontaktregeln sauber zuordnen"
          git rm .github/workflows/rehome-final-page-blocks.yml
          git commit -m "Temporären Seitenblock-Workflow entfernen"
          git push
