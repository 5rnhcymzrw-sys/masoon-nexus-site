name: Company portrait color 24 patch

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/company-portrait-color-24-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update existing company portrait gradient only
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path('assets/index-CZfMKxM_.css')
          text = css.read_text()
          selector = '.home-company__image:before{'
          start = text.find(selector)
          if start == -1:
              raise SystemExit('Existing company portrait accent rule not found')
          end = text.find('}', start)
          if end == -1:
              raise SystemExit('Existing company portrait accent rule end not found')
          block = text[start:end+1]
          old = 'background:linear-gradient(to right in oklab,rgba(244,228,201,.14) 0%,rgba(232,227,218,.14) 36%,rgba(193,199,214,.14) 68%,rgba(132,144,171,.14) 100%);'
          new = 'background:linear-gradient(to right in oklab,rgba(244,228,201,.24) 0%,rgba(232,227,218,.24) 36%,rgba(193,199,214,.24) 68%,rgba(158,165,184,.24) 100%);'
          if block.count(old) != 1:
              raise SystemExit(f'Expected exactly 1 portrait gradient in existing rule, found {block.count(old)}')
          block = block.replace(old, new, 1)
          css.write_text(text[:start] + block + text[end+1:])

          page = Path('unternehmen/index.html')
          html = page.read_text()
          old_cache = '../assets/index-CZfMKxM_.css?v=unternehmen-bild-akzent-stufe3-20260911-1'
          new_cache = '../assets/index-CZfMKxM_.css?v=unternehmen-portrait-color-24-20260912-1'
          if html.count(old_cache) != 1:
              raise SystemExit('Expected exactly 1 company stylesheet cache reference')
          page.write_text(html.replace(old_cache, new_cache, 1))
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/company-portrait-color-24-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/index-CZfMKxM_.css unternehmen/index.html .github/workflows/company-portrait-color-24-patch.yml
          git commit -m "Unternehmen Portrait: Verlauf auf 24 Prozent anpassen"
          git push