name: temp remove old home fachwissen colors
on:
  push:
    paths:
      - '.github/workflows/temp-remove-old-home-fachwissen-colors.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete Startseite Fachwissen background declarations
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path('assets/index-CZfMKxM_.css')
          s = css.read_text(encoding='utf-8')

          old_main = '.home-paths__grid a{min-height:280px;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;background:#ece9e3;border:0;border-radius:0;padding:34px 38px;transition:none;position:relative;}'
          new_main = '.home-paths__grid a{min-height:280px;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;border:0;border-radius:0;padding:34px 38px;transition:none;position:relative;}'
          if s.count(old_main) != 1:
              raise SystemExit(f'Expected old main Fachwissen background rule once, found {s.count(old_main)}')
          s = s.replace(old_main, new_main, 1)

          old_2 = '.home-paths__grid a:nth-child(2){background:#dedbd4;}'
          if s.count(old_2) != 1:
              raise SystemExit(f'Expected old second Fachwissen background rule once, found {s.count(old_2)}')
          s = s.replace(old_2, '', 1)

          old_3 = '.home-paths__grid a:nth-child(3){background:#d5d1c9;}'
          if s.count(old_3) != 1:
              raise SystemExit(f'Expected old third Fachwissen background rule once, found {s.count(old_3)}')
          s = s.replace(old_3, '', 1)

          css.write_text(s, encoding='utf-8')

          index = Path('index.html')
          h = index.read_text(encoding='utf-8')
          old_link = 'assets/index-CZfMKxM_.css?v=20260908-clean-rules'
          new_link = 'assets/index-CZfMKxM_.css?v=home-fachwissen-old-colors-removed-20260911-1'
          if h.count(old_link) != 1:
              raise SystemExit(f'Expected current bundled stylesheet link once, found {h.count(old_link)}')
          index.write_text(h.replace(old_link,new_link,1),encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/index-CZfMKxM_.css index.html
          git diff --cached --check
          git commit -m 'Remove obsolete Startseite Fachwissen background colors'
          git push
