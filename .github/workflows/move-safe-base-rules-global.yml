name: Move safe base rules global
on:
  push:
    branches: [main]
    paths: ['.github/workflows/move-safe-base-rules-global.yml']
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move safe shared base rules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base = Path('assets/unified-design-base-20260907.css')
          glob = Path('assets/global.css')
          b = base.read_text(encoding='utf-8')
          g = glob.read_text(encoding='utf-8')
          blocks = [
'''body.site-light-page .page-main,
body.site-light-page .home,
body.site-light-page .home-values,
body.site-light-page .home-values__inner,
body.site-light-page .services-section,
body.site-light-page .knowledge-section,
body.site-light-page .home-paths,
body.site-light-page .home-paths::before,
body.site-light-page .home-contact-band,
body.site-light-page .services-closing{
  background:transparent!important;
  background-color:transparent!important;
  background-image:none!important;
}
''',
'''/* Leerer früherer Bildtrenner wird nicht mehr als eigener Stilbruch gezeigt */
body.site-light-page .home-architecture-banner{
  display:none!important;
}
''',
'''@media(max-width:800px){
  body.site-light-page .home-values__items,
body.site-light-page .home-paths__grid,
body.site-light-page .articles-grid,
body.site-light-page .services-grid{
    gap:16px!important;
  }
}
''',
'''/* Dienstleistungs Hauptseite: linker Startpunkt wie auf der Startseite */
@media(min-width:801px){
  html body .services-main>.services-section{
    padding-left:0!important;
    padding-right:0!important;
  }
}

/* Dienstleistungs Hauptseite: grosse weisse Bereichsfläche entfernen */
html body.site-light-page .services-main>.services-section{
  background:transparent!important;
  background-color:transparent!important;
  background-image:none!important;
  box-shadow:none!important;
}

/* Dienstleistungs Hauptseite: Titelabstand wie Startseite und Fachwissen */
@media(min-width:801px){
  html body .services-main>.services-section>.section-heading{
    margin-bottom:64px!important;
  }
}
'''
          ]
          moved=[]
          for block in blocks:
              if block not in b:
                  raise SystemExit('Expected block missing')
              b=b.replace(block,'',1)
              moved.append(block)
          marker='\n/* Weitere globale Regeln aus unified-design-base zentralisiert */\n'
          g += marker + '\n'.join(moved)
          base.write_text(b,encoding='utf-8')
          glob.write_text(g,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/global.css assets/unified-design-base-20260907.css
          git commit -m "Weitere globale Basisregeln nach global.css verschieben"
          git rm .github/workflows/move-safe-base-rules-global.yml
          git commit -m "Temporären Basisregel-Workflow entfernen"
          git push