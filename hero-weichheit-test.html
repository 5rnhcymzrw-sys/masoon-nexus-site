<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MASOON TREUHAND – Hero Nur Text Test</title>
<style>
html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#111}body{display:grid;grid-template-rows:58px 1fr;overflow:hidden}.tester{display:flex;align-items:center;gap:7px;padding:0 14px;background:#f3f3f3;border-bottom:1px solid #ccc;overflow-x:auto;z-index:10}.tester strong{font-size:13px;white-space:nowrap;margin-right:5px}.tester button{border:1px solid #c9c9c9;background:#fff;padding:9px 13px;font-size:12px;cursor:pointer;white-space:nowrap}.tester button.active{background:#111;color:#fff;border-color:#111}iframe{width:100%;height:100%;border:0;background:#fff}</style>
</head><body>
<div class="tester"><strong>Hero vergleichen</strong><button data-v="original">Original</button><button data-v="textonly" class="active">Nur Text – leerer Hintergrund</button></div>
<iframe id="site" src="./index.html"></iframe>
<script>
const f=document.getElementById('site'),bs=[...document.querySelectorAll('button[data-v]')];let current='textonly';
const css=`@media(min-width:801px){
html.hero-textonly body .home-hero{background:#fff!important;background-color:#fff!important;background-image:none!important;box-shadow:none!important;border:0!important;isolation:isolate!important}
html.hero-textonly body .home-hero *{background-color:transparent!important;background-image:none!important;box-shadow:none!important;border-color:transparent!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
html.hero-textonly body .home-hero img,
html.hero-textonly body .home-hero picture,
html.hero-textonly body .home-hero video,
html.hero-textonly body .home-hero svg{visibility:hidden!important;opacity:0!important}
html.hero-textonly body .home-hero::before,
html.hero-textonly body .home-hero::after,
html.hero-textonly body .home-hero *::before,
html.hero-textonly body .home-hero *::after{content:none!important;display:none!important;background:none!important;background-image:none!important;box-shadow:none!important;border:0!important}
html.hero-textonly body .home-hero h1,
html.hero-textonly body .home-hero p{visibility:visible!important;opacity:1!important;background:none!important}
}`;
function apply(v){const d=f.contentDocument;if(!d)return;d.documentElement.classList.remove('hero-textonly');let st=d.getElementById('hero-textonly-test');if(!st){st=d.createElement('style');st.id='hero-textonly-test';st.textContent=css;d.head.appendChild(st)}if(v==='textonly')d.documentElement.classList.add('hero-textonly');bs.forEach(b=>b.classList.toggle('active',b.dataset.v===v));current=v}
f.addEventListener('load',()=>apply(current));bs.forEach(b=>b.addEventListener('click',()=>apply(b.dataset.v)));
</script></body></html>
