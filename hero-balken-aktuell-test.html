<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>MASOON TREUHAND – Hero Balken aktuell</title>
<style>
html,body{margin:0;height:100%;background:#111;font-family:Arial,sans-serif}
body{display:grid;grid-template-rows:58px 1fr;overflow:hidden}
.tester{display:flex;align-items:center;gap:7px;padding:0 14px;background:#f3f3f3;border-bottom:1px solid #ccc;box-sizing:border-box;z-index:10;overflow-x:auto}
.tester strong{font-size:13px;margin-right:6px;font-weight:600;white-space:nowrap}
.tester button{appearance:none;border:1px solid #c9c9c9;background:#fff;padding:9px 12px;font-size:12px;cursor:pointer;white-space:nowrap}
.tester button.active{background:#111;color:#fff;border-color:#111}
iframe{width:100%;height:100%;border:0;background:#fff;display:block}
@media(max-width:900px){.tester strong{display:none}}
</style>
</head>
<body>
<div class="tester">
<strong>Balken vergleichen</strong>
<button data-v="original" class="active">Original</button>
<button data-v="v1">1 · Schmaler Mitte</button>
<button data-v="v2">2 · Weich auslaufend</button>
<button data-v="v3">3 · Mehr Bild</button>
<button data-v="v4">4 · Versetzt</button>
<button data-v="v5">5 · Glasband</button>
<button data-v="v6">6 · Feine Linien</button>
<button data-v="v7">7 · Offen Mitte</button>
<button data-v="v8">8 · Editorial</button>
</div>
<iframe id="site" src="./index.html?v=20260908-hero-current"></iframe>
<script>
const frame=document.getElementById('site');
const buttons=[...document.querySelectorAll('button[data-v]')];
let current='original';
const css=`
@media(min-width:801px){
html[class*="band-test-"] body.site-light-page main.home section.home-hero{position:relative!important;overflow:hidden!important}
html[class*="band-test-"] body.site-light-page main.home section.home-hero .home-hero__content{position:relative!important;z-index:5!important}
html[class*="band-test-"] body.site-light-page main.home section.home-hero .home-hero__copy{position:relative!important;z-index:6!important}
html[class*="band-test-"] body.site-light-page main.home section.home-hero::before{content:''!important;position:absolute!important;inset:0!important;z-index:3!important;pointer-events:none!important;transform:none!important;background:none!important}
html[class*="band-test-"] body.site-light-page main.home section.home-hero::after{content:''!important;position:absolute!important;inset:0!important;z-index:4!important;pointer-events:none!important;background:none!important}

/* 1: gleiche Idee wie aktuell, aber mittlerer Balken deutlich flacher */
html.band-test-v1 body.site-light-page main.home section.home-hero::before{
 background:linear-gradient(to bottom,
 transparent 0 17%,
 rgba(243,232,212,.28) 17% 23%,
 transparent 23% 39%,
 rgba(255,255,255,.40) 39% 67%,
 transparent 67% 82%,
 rgba(232,229,223,.24) 82% 89%,
 transparent 89% 100%)!important;
}
html.band-test-v1 body.site-light-page main.home section.home-hero::after{
 background:linear-gradient(90deg,rgba(243,232,212,.28) 0%,rgba(232,229,223,.20) 46%,rgba(199,203,211,.08) 66%,transparent 69%)!important;
}

/* 2: Balken lösen sich nach rechts weich auf */
html.band-test-v2 body.site-light-page main.home section.home-hero::before{
 background:
 linear-gradient(90deg,rgba(243,232,212,.40) 0%,rgba(232,229,223,.25) 48%,rgba(199,203,211,.10) 68%,transparent 84%) 0 18%/100% 7% no-repeat,
 linear-gradient(90deg,rgba(255,255,255,.48) 0%,rgba(243,232,212,.30) 42%,rgba(232,229,223,.16) 62%,transparent 78%) 0 39%/100% 43% no-repeat,
 linear-gradient(90deg,rgba(243,232,212,.30) 0%,rgba(199,203,211,.12) 55%,transparent 82%) 0 83%/100% 7% no-repeat!important;
}

/* 3: mehr sichtbares Foto zwischen den Balken */
html.band-test-v3 body.site-light-page main.home section.home-hero::before{
 background:
 linear-gradient(90deg,rgba(243,232,212,.34),rgba(232,229,223,.18) 52%,transparent 78%) 0 18%/100% 5% no-repeat,
 linear-gradient(90deg,rgba(255,255,255,.38),rgba(243,232,212,.22) 48%,rgba(199,203,211,.08) 66%,transparent 74%) 0 45%/100% 30% no-repeat,
 linear-gradient(90deg,rgba(243,232,212,.28),rgba(199,203,211,.10) 58%,transparent 80%) 0 84%/100% 5% no-repeat!important;
}

/* 4: drei Balken bewusst versetzt und unterschiedlich lang */
html.band-test-v4 body.site-light-page main.home section.home-hero::before{
 background:
 linear-gradient(90deg,rgba(243,232,212,.42),rgba(232,229,223,.22) 60%,transparent 100%) 0 17%/73% 7% no-repeat,
 linear-gradient(90deg,rgba(255,255,255,.46),rgba(243,232,212,.26) 45%,rgba(199,203,211,.10) 72%,transparent 100%) 0 40%/68% 39% no-repeat,
 linear-gradient(90deg,rgba(243,232,212,.34),rgba(199,203,211,.14) 70%,transparent 100%) 0 84%/82% 7% no-repeat!important;
}

/* 5: mittlere Fläche als zusammenhängendes Glasband, oben/unten sehr dezent */
html.band-test-v5 body.site-light-page main.home section.home-hero::before{
 background:
 linear-gradient(90deg,rgba(243,232,212,.18),rgba(232,229,223,.10) 55%,transparent 82%) 0 18%/100% 4% no-repeat,
 linear-gradient(90deg,rgba(255,255,255,.54),rgba(243,232,212,.34) 42%,rgba(199,203,211,.13) 66%,transparent 72%) 0 38%/100% 44% no-repeat,
 linear-gradient(90deg,rgba(243,232,212,.18),rgba(199,203,211,.08) 60%,transparent 82%) 0 85%/100% 4% no-repeat!important;
 backdrop-filter:blur(1px)!important;
}

/* 6: nur feine horizontale Farblinien, fast keine Balken */
html.band-test-v6 body.site-light-page main.home section.home-hero::before{
 background:
 linear-gradient(90deg,#f3e8d4 0%,#e8e5df 40%,#c7cbd3 68%,transparent 84%) 0 20%/100% 2px no-repeat,
 linear-gradient(90deg,rgba(255,255,255,.30),rgba(243,232,212,.16) 50%,transparent 72%) 0 42%/100% 34% no-repeat,
 linear-gradient(90deg,#f3e8d4 0%,#c7cbd3 66%,transparent 84%) 0 86%/100% 2px no-repeat!important;
}

/* 7: Mitte weitgehend offen; Balken rahmen Foto und Text nur oben/unten ein */
html.band-test-v7 body.site-light-page main.home section.home-hero::before{
 background:
 linear-gradient(90deg,rgba(243,232,212,.44),rgba(232,229,223,.26) 48%,rgba(199,203,211,.12) 70%,transparent 88%) 0 17%/100% 9% no-repeat,
 linear-gradient(90deg,rgba(243,232,212,.40),rgba(199,203,211,.14) 58%,transparent 86%) 0 80%/100% 10% no-repeat!important;
}
html.band-test-v7 body.site-light-page main.home section.home-hero::after{
 background:linear-gradient(90deg,rgba(255,255,255,.34) 0%,rgba(243,232,212,.12) 40%,transparent 58%)!important;
}

/* 8: editorial – linker Bereich ruhig, Balken schneiden nur leicht ins Foto */
html.band-test-v8 body.site-light-page main.home section.home-hero::before{
 background:
 linear-gradient(90deg,rgba(243,232,212,.38),rgba(232,229,223,.22) 58%,transparent 100%) 0 18%/66% 7% no-repeat,
 linear-gradient(90deg,rgba(255,255,255,.48),rgba(243,232,212,.30) 50%,rgba(199,203,211,.10) 100%) 0 38%/69% 43% no-repeat,
 linear-gradient(90deg,rgba(243,232,212,.30),rgba(199,203,211,.12) 72%,transparent 100%) 0 84%/76% 7% no-repeat!important;
}
}
`;
function apply(v){
 const d=frame.contentDocument;if(!d)return;
 [...d.documentElement.classList].filter(c=>c.startsWith('band-test-')).forEach(c=>d.documentElement.classList.remove(c));
 let st=d.getElementById('band-test-styles');
 if(!st){st=d.createElement('style');st.id='band-test-styles';st.textContent=css;d.head.appendChild(st)}
 if(v!=='original')d.documentElement.classList.add('band-test-'+v);
 buttons.forEach(b=>b.classList.toggle('active',b.dataset.v===v));
 current=v;
}
frame.addEventListener('load',()=>apply(current));
buttons.forEach(b=>b.addEventListener('click',()=>apply(b.dataset.v)));
</script>
</body>
</html>
