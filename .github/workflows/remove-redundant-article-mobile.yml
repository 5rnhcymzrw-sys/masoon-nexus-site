name: Remove redundant article mobile rules
on:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-redundant-article-mobile.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove exact mobile duplicates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('assets/unified-design.css')
          s = p.read_text(encoding='utf-8')
          before = s
          # Entfernt nur artikelbezogene Mobile-Regeln, die article-detail.css später exakt vorgibt.
          s = re.sub(r'\s*html body\.(page-article-[\w-]+)\.site-light-page main\.article-main\{padding:170px 0 96px!important;?\}', '', s)
          s = re.sub(r'body\.(page-article-[\w-]+) \.article-overline\{margin-bottom:24px!important;padding:0 26px!important;?\}', '', s)
          s = re.sub(r'body\.(page-article-[\w-]+) \.article-shell\{width:91%!important;padding:52px 26px!important;display:block!important;?\}', '', s)
          if s == before:
              raise SystemExit('Keine redundanten Mobile-Artikelregeln gefunden')
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/unified-design.css
          git commit -m "Redundante Artikel-Mobile-Regeln entfernen"
          git rm .github/workflows/remove-redundant-article-mobile.yml
          git commit -m "Temporären Artikel-Mobile-Workflow entfernen"
          git push