name: Cleanup home values
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-home-values-final.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/cleanup-home-values-final.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/unified-design.css
          git commit -m "home-values Altregeln konsolidieren"
          git push
