name: Centralize body copy

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/centralize-body-copy.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply cleanup
        run: python .github/scripts/centralize_body_copy.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/global.css assets/unified-design.css assets/unified-design-base-20260907.css assets/article-detail.css assets/contact.css assets/dienstleistungen.css assets/index-CZfMKxM_.css
          if git diff --cached --quiet; then
            echo "Keine Änderungen"
            exit 0
          fi
          git commit -m "Fliesstext global vereinheitlichen"
          git push

# run corrected
