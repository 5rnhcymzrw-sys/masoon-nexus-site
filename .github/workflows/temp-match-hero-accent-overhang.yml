name: temp match hero accent overhang
on:
  push:
    paths:
      - '.github/workflows/temp-match-hero-accent-overhang.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match Hero accent visible overhang to Unternehmen image
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('farbtest-alle-kaesten-linien-10092026.html')
          s=p.read_text(encoding='utf-8')
          old="function syncHeroBackplate(d){const hero=d.querySelector('.home-hero__copy'),b=hero?.querySelector(':scope > .masoon-hero-white-backplate'),base=hero?.querySelector(':scope > .masoon-hero-base-backplate');if(!hero||!b||!base)return;const p=d.defaultView.getComputedStyle(hero,'::before');const left=parseFloat(p.left)||0,top=parseFloat(p.top)||0,width=parseFloat(p.width)||hero.getBoundingClientRect().width,height=parseFloat(p.height)||hero.getBoundingClientRect().height;const accentLeft=left-18,accentTop=top+height*.48,accentWidth=width*.72,accentHeight=height*.58;for(const el of [b,base]){setImp(el,'left',`${accentLeft}px`);setImp(el,'top',`${accentTop}px`);setImp(el,'width',`${accentWidth}px`);setImp(el,'height',`${accentHeight}px`);setImp(el,'right','auto');setImp(el,'bottom','auto')}}"
          new="function syncHeroBackplate(d){const hero=d.querySelector('.home-hero__copy'),b=hero?.querySelector(':scope > .masoon-hero-white-backplate'),base=hero?.querySelector(':scope > .masoon-hero-base-backplate');if(!hero||!b||!base)return;const p=d.defaultView.getComputedStyle(hero,'::before');const left=parseFloat(p.left)||0,top=parseFloat(p.top)||0,width=parseFloat(p.width)||hero.getBoundingClientRect().width,height=parseFloat(p.height)||hero.getBoundingClientRect().height;const overhang=32,accentWidth=width*.72,accentHeight=height*.58,accentLeft=left-overhang,accentTop=top+height+overhang-accentHeight;for(const el of [b,base]){setImp(el,'left',`${accentLeft}px`);setImp(el,'top',`${accentTop}px`);setImp(el,'width',`${accentWidth}px`);setImp(el,'height',`${accentHeight}px`);setImp(el,'right','auto');setImp(el,'bottom','auto')}}"
          if s.count(old)!=1:
              raise SystemExit(f'syncHeroBackplate match count {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add farbtest-alle-kaesten-linien-10092026.html
          git diff --cached --check
          git commit -m 'Match Hero accent overhang to Unternehmen image'
          git push
