name: Remove redundant article text rules
on:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-redundant-article-text.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove known paragraph and list duplicates
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('assets/unified-design.css')
          s = p.read_text(encoding='utf-8')
          pages = [
              'page-article-tax-checklist',
              'page-article-employment-termination',
              'page-article-company-formation',
              'page-article-company-forms',
          ]
          removed = 0
          for page in pages:
              candidates = [
                  f'body.{page} .article-body p{{max-width:none;margin:0 0 12px!important}}',
                  f'body.{page} .article-body p{{max-width:none;margin:0 0 12px!important;}}',
                  f'body.{page} .article-body li::before{{content:"";position:absolute;left:0;top:.825em;width:8px;height:1px;background:#868279}}',
                  f'body.{page} .article-body li::before{{content:"";position:absolute;left:0;top:.825em;width:8px;height:1px;background:#868279;}}',
                  f'body.{page} .article-body h2:first-child{{margin-top:0!important}}',
                  f'body.{page} .article-body h2:first-child{{margin-top:0!important;}}',
              ]
              for old in candidates:
                  if old in s:
                      s = s.replace(old, '', 1)
                      removed += 1
          if removed < 6:
              raise SystemExit(f'Nur {removed} sichere Text-Dubletten gefunden')
          p.write_text(s, encoding='utf-8')
          print('removed', removed)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/unified-design.css
          git commit -m "Redundante Artikeltext-Regeln entfernen"
          git rm .github/workflows/remove-redundant-article-text.yml
          git commit -m "Temporären Artikeltext-Workflow entfernen"
          git push