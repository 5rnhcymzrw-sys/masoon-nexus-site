name: Section label cleanup

on:
  push:
    paths:
      - '.github/workflows/section-label-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove overlapping section-label letter-spacing rules
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          canonical_file = Path('assets/unified-design-base-20260907.css')
          canonical_selector = 'html body main .section-label.section-label.section-label.section-label.section-label.section-label'
          changed_files = []
          removed = []

          for path in sorted(Path('assets').glob('*.css')):
              text = path.read_text()
              original = text

              # Process ordinary CSS blocks. For every rule that targets .section-label,
              # remove its own letter-spacing so the single canonical rule controls it.
              def clean_rule(m):
                  selector = m.group(1)
                  body = m.group(2)
                  if '.section-label' not in selector:
                      return m.group(0)

                  if path == canonical_file and canonical_selector in selector:
                      # Canonical source of truth: exactly 1.1px.
                      if re.search(r'letter-spacing\s*:', body):
                          body2 = re.sub(r'letter-spacing\s*:\s*[^;}]+' , 'letter-spacing:1.1px!important', body)
                      else:
                          body2 = body.rstrip() + '\n  letter-spacing:1.1px!important;\n'
                      return selector + '{' + body2 + '}'

                  body2, n = re.subn(r'\s*letter-spacing\s*:\s*[^;}]+' + r';?', '', body)
                  if n:
                      removed.append(f'{path}: {selector.strip()} ({n})')
                  return selector + '{' + body2 + '}'

              text = re.sub(r'([^{}]+)\{([^{}]*)\}', clean_rule, text)
              if text != original:
                  path.write_text(text)
                  changed_files.append(str(path))

          if not removed:
              raise SystemExit('No overlapping section-label letter-spacing declarations found')

          # Confirm canonical rule still contains 1.1px.
          base = canonical_file.read_text()
          s = base.find(canonical_selector + '{')
          if s == -1:
              raise SystemExit('Canonical section-label rule not found after cleanup')
          e = base.find('}', s)
          block = base[s:e+1]
          if 'letter-spacing:1.1px!important' not in block:
              raise SystemExit('Canonical section-label spacing is not 1.1px')

          # Cache bust active stylesheets.
          unified = Path('assets/unified-design.css')
          u = unified.read_text()
          u, n = re.subn(
              r"@import url\('\./unified-design-base-20260907\.css\?v=[^']+'\);",
              "@import url('./unified-design-base-20260907.css?v=section-label-clean-20260912-3');",
              u,
              count=1
          )
          if n != 1:
              raise SystemExit('Base import not found')
          unified.write_text(u)
          if 'assets/unified-design.css' not in changed_files:
              changed_files.append('assets/unified-design.css')

          html_changed = 0
          for page in Path('.').rglob('*.html'):
              html = page.read_text()
              updated, n = re.subn(
                  r'(unified-design\.css\?v=)[^"\']+',
                  r'\1section-label-clean-20260912-3',
                  html
              )
              if page.as_posix() == 'index.html':
                  updated = re.sub(
                      r'(assets/index-CZfMKxM_\.css\?v=)[^"\']+',
                      r'\1section-label-clean-20260912-3',
                      updated,
                      count=1
                  )
              if updated != html:
                  page.write_text(updated)
                  html_changed += 1

          print('Removed overlapping declarations:')
          for item in removed:
              print(' -', item)
          print('Changed CSS:', ', '.join(changed_files))
          print('HTML cache references updated:', html_changed)
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/section-label-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bereichstitel: alte Buchstabenabstände entfernen"
          git push
