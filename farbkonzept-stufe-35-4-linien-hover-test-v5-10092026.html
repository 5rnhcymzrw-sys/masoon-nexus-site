<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MASOON – Farbtest Bereiche unabhängig</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f4f4f2;font-family:Arial,sans-serif;color:#171715}
.testbar{position:sticky;top:0;z-index:99999;background:#fff;border-bottom:1px solid #d8d8d4;padding:9px 12px}.top{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.top strong{font-size:12px;margin-right:5px}.top button,.row button{appearance:none;border:1px solid #cfcfca;background:#fff;padding:6px 9px;font-size:11px;cursor:pointer}.top button:hover,.top button.active,.row button:hover,.row button.active{background:#171715;color:#fff;border-color:#171715}.note{font-size:10px;color:#777;margin-left:auto}.controls{margin-top:8px;border-top:1px solid #ecece8;padding-top:7px;display:grid;gap:5px}.row{display:flex;align-items:center;gap:5px;flex-wrap:wrap}.name{font-size:11px;font-weight:700;min-width:155px}.lbl{font-size:10px;color:#777;margin-left:6px}.fixed{font-size:10px;color:#777;padding:4px 0}#siteFrame{display:block;width:100%;height:calc(100vh - 135px);min-height:680px;border:0;background:#fff}@media(max-width:1000px){.note{width:100%;margin-left:0}.name{min-width:130px}#siteFrame{height:calc(100vh - 200px)}}
</style>
</head>
<body>
<div class="testbar">
 <div class="top">
  <strong>FARBTEST · Bereiche unabhängig</strong>
  <button data-page="home" data-src="index.html?v=independent-color-10092026" class="active">Startseite</button>
  <button data-page="company" data-src="unternehmen/index.html?v=independent-color-10092026">Unternehmen</button>
  <button data-page="services" data-src="dienstleistungen/index.html?v=independent-color-10092026">Dienstleistungen</button>
  <button data-page="knowledge" data-src="fachwissen/index.html?v=independent-color-10092026">Fachwissen</button>
  <button data-page="contact" data-src="kontakt/index.html?v=independent-color-10092026">Kontakt</button>
  <span class="note">Stufe 3.5 / 4 · Weichzeichnung bei Testfarben AUS · Linien AN = exakt Originalrahmen</span>
 </div>
 <div class="controls" id="controls"></div>
</div>
<iframe id="siteFrame" src="index.html?v=independent-color-10092026" title="Farbtest"></iframe>
<script>
const frame=document.getElementById('siteFrame');
const controls=document.getElementById('controls');
const pageButtons=[...document.querySelectorAll('[data-page]')];
let currentPage='home';
const alpha={'3.5':.145,'4':.18};
const cfg={
 home:[
  {id:'hero',name:'Titelkasten',sel:'.home-hero__text-surface',fill:'original',lines:true,lineOption:true},
  {id:'homeDL',name:'6 DL-Kästen',sel:'main.home .home-values__items>.home-values__item',fill:'4',lines:true,lineOption:true},
  {id:'homeFW',name:'3 Fachwissen-Kästen',sel:'main.home .home-paths__grid>a',fill:'empty',lines:true,lineOption:false,hover:'4'}
 ],
 company:[{id:'companyValues',name:'3 Werte-Kästen',sel:'.company-values-grid>.company-value-card',fill:'original',lines:true,lineOption:true}],
 services:[{id:'services6',name:'6 DL-Kästen',sel:'main.services-main .services-section .services-grid>.service-card',fill:'4',lines:true,lineOption:true}],
 knowledge:[{id:'knowledge7',name:'7 Fachwissen-Kästen',sel:'main .knowledge-section#knowledge-articles .articles-grid>.article-card',fill:'empty',lines:true,lineOption:false,hover:'4'}],
 contact:[{id:'contactForm',name:'Kontaktformular',sel:'.contact-split__form',fill:'original',lines:true,lineOption:true}]
};
function g(level){const a=alpha[String(level)];return `linear-gradient(to right in oklab,rgba(243,232,212,${a}) 0%,rgba(232,229,223,${a}) 36%,rgba(199,203,211,${a}) 68%,rgba(141,150,168,${a}) 100%)`}
function imp(el,p,v){el.style.setProperty(p,v,'important')}
function rem(el,...ps){ps.forEach(p=>el.style.removeProperty(p))}
function setFill(el,i,mode){
 if(mode==='original') rem(el,'background','background-image','background-color','background-origin','background-size','background-repeat','background-position','backdrop-filter','-webkit-backdrop-filter');
 else if(mode==='empty'){imp(el,'background','transparent');imp(el,'background-image','none');imp(el,'background-color','transparent');imp(el,'backdrop-filter','none');imp(el,'-webkit-backdrop-filter','none')}
 else{const gr=g(mode);imp(el,'background',gr);imp(el,'background-image',gr);imp(el,'background-color','transparent');imp(el,'background-origin','border-box');imp(el,'background-size','calc(300% + 44px) 100%');imp(el,'background-repeat','no-repeat');imp(el,'background-position',i%3===0?'left top':i%3===1?'center top':'right top');imp(el,'backdrop-filter','none');imp(el,'-webkit-backdrop-filter','none')}
}
function setLines(el,on){
 if(on){rem(el,'border-color','border-image','border-image-source','border-image-slice')}
 else{imp(el,'border-color','transparent');imp(el,'border-image','none');imp(el,'border-image-source','none')}
}
function applyGroup(group){const d=frame.contentDocument;if(!d)return;const items=[...d.querySelectorAll(group.sel)];items.forEach((el,i)=>{setFill(el,i,group.fill);setLines(el,group.lines)});if(group.hover)wireHover(group,items)}
function wireHover(group,items){items.forEach((el,i)=>{const key='mt'+group.id;if(el.dataset[key]==='1')return;el.dataset[key]='1';el.addEventListener('mouseenter',()=>{setFill(el,i,group.hover);setLines(el,true)});el.addEventListener('mouseleave',()=>{setFill(el,i,group.fill);setLines(el,true)})})}
function applyAll(){try{(cfg[currentPage]||[]).forEach(applyGroup)}catch(e){console.error(e)}}
function repeat(){applyAll();setTimeout(applyAll,180);setTimeout(applyAll,550);setTimeout(applyAll,1200);setTimeout(applyAll,2200)}
function btn(txt,active,fn){const b=document.createElement('button');b.textContent=txt;if(active)b.classList.add('active');b.addEventListener('click',fn);return b}
function render(){controls.innerHTML='';(cfg[currentPage]||[]).forEach(group=>{const row=document.createElement('div');row.className='row';const name=document.createElement('span');name.className='name';name.textContent=group.name;row.appendChild(name);const fl=document.createElement('span');fl.className='lbl';fl.textContent='Innen:';row.appendChild(fl);[['original','ORIGINAL'],['empty','LEER'],['3.5','3.5'],['4','4']].forEach(([m,t])=>row.appendChild(btn(t,group.fill===m,()=>{group.fill=m;render();repeat()})));if(group.lineOption){const ll=document.createElement('span');ll.className='lbl';ll.textContent='Linien:';row.appendChild(ll);row.appendChild(btn('AN',group.lines,()=>{group.lines=true;render();repeat()}));row.appendChild(btn('AUS',!group.lines,()=>{group.lines=false;render();repeat()}))}else{const f=document.createElement('span');f.className='fixed';f.textContent='Linien: ORIGINAL (fix)';row.appendChild(f)}if(group.hover){const hl=document.createElement('span');hl.className='lbl';hl.textContent='Hover:';row.appendChild(hl);['3.5','4'].forEach(m=>row.appendChild(btn(m,group.hover===m,()=>{group.hover=m;render();repeat()})))}controls.appendChild(row)})}
frame.addEventListener('load',()=>{render();repeat()});
pageButtons.forEach(b=>b.addEventListener('click',()=>{currentPage=b.dataset.page;pageButtons.forEach(x=>x.classList.remove('active'));b.classList.add('active');render();frame.src=b.dataset.src}));
render();
</script>
</body>
</html>
