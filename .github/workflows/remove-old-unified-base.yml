name: Remove old unified base
on:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-old-unified-base.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fold remaining base rules into unified design
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          base = Path('assets/unified-design-base-20260907.css')
          unified = Path('assets/unified-design.css')
          b = base.read_text(encoding='utf-8')
          u = unified.read_text(encoding='utf-8')
          # Remove obsolete font-face blocks. PT Serif is already loaded by unified-design.css;
          # Bitter and Source Serif 4 are no longer referenced anywhere in the repository.
          b = re.sub(r'@font-face\s*\{.*?\}\s*', '', b, flags=re.S)
          b = b.replace('/* MASOON TREUHAND – einheitliche visuelle Gestaltung */', '').strip()
          old_import = "@import url('./unified-design-base-20260907.css?v=body-global-20260915-1');\n"
          if old_import not in u:
              raise SystemExit('old base import missing')
          u = u.replace(old_import, '', 1)
          import_line = "@import url('https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&display=swap');\n"
          if import_line not in u:
              raise SystemExit('PT Serif import missing')
          marker = '\n/* Verbleibende Regeln aus ehemaliger unified-design-base konsolidiert */\n'
          u = u.replace(import_line, import_line + marker + b + '\n', 1)
          unified.write_text(u, encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/unified-design.css
          git rm assets/unified-design-base-20260907.css
          git commit -m "Alte unified-design-base vollständig auflösen"
          git rm .github/workflows/remove-old-unified-base.yml
          git commit -m "Temporären Basisdatei-Workflow entfernen"
          git push
