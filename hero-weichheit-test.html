<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MASOON TREUHAND – Hero Hintergrund Test</title>
<style>
html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#111}body{display:grid;grid-template-rows:58px 1fr;overflow:hidden}.tester{display:flex;align-items:center;gap:7px;padding:0 14px;background:#f3f3f3;border-bottom:1px solid #ccc;overflow-x:auto;z-index:10}.tester strong{font-size:13px;white-space:nowrap;margin-right:5px}.tester button{border:1px solid #c9c9c9;background:#fff;padding:9px 13px;font-size:12px;cursor:pointer;white-space:nowrap}.tester button.active{background:#111;color:#fff;border-color:#111}iframe{width:100%;height:100%;border:0;background:#fff}
</style>
</head><body>
<div class="tester"><strong>Ruhiger Hintergrund</strong><button data-v="original">Original</button><button data-v="light">1 · Sehr hell</button><button data-v="medium" class="active">2 · Mittel</button><button data-v="dark">3 · Etwas dunkler</button><button data-v="mediumclean">2 · Mittel · ohne Text</button></div>
<iframe id="site" src="./index.html"></iframe>
<script>
const f=document.getElementById('site'),bs=[...document.querySelectorAll('button[data-v]')];let current='medium';
const css=`@media(min-width:801px){
html[class*="hero-bg-"] body .home-hero__portrait{position:relative!important;overflow:hidden!important}
html[class*="hero-bg-"] body .home-hero__portrait-image{visibility:hidden!important}
html[class*="hero-bg-"] body .home-hero__portrait::before{content:''!important;position:absolute!important;inset:-2%!important;z-index:0!important;background-size:100% 100%!important;background-repeat:no-repeat!important;pointer-events:none!important}
html.hero-bg-light body .home-hero__portrait::before{background:linear-gradient(90deg,#eee9df 0%,#e4e2de 45%,#c9cbd0 72%,#a9adb5 100%)!important}
html.hero-bg-medium body .home-hero__portrait::before,html.hero-bg-mediumclean body .home-hero__portrait::before{background:linear-gradient(90deg,#e6dfd3 0%,#d6d4d0 43%,#b7bac0 70%,#8f949d 100%)!important}
html.hero-bg-dark body .home-hero__portrait::before{background:linear-gradient(90deg,#ddd5c8 0%,#c9c7c4 42%,#a4a8af 69%,#747a84 100%)!important}
html.hero-bg-mediumclean body .home-hero__copy h1,html.hero-bg-mediumclean body .home-hero__copy p{visibility:hidden!important}
}`;
function apply(v){const d=f.contentDocument;if(!d)return;[...d.documentElement.classList].filter(c=>c.startsWith('hero-bg-')).forEach(c=>d.documentElement.classList.remove(c));let st=d.getElementById('hero-bg-test');if(!st){st=d.createElement('style');st.id='hero-bg-test';st.textContent=css;d.head.appendChild(st)}if(v!=='original')d.documentElement.classList.add('hero-bg-'+v);bs.forEach(b=>b.classList.toggle('active',b.dataset.v===v));current=v}
f.addEventListener('load',()=>apply(current));bs.forEach(b=>b.addEventListener('click',()=>apply(b.dataset.v)));
</script></body></html>
