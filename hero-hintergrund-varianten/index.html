<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MASOON TREUHAND – Hero-Hintergrundvarianten</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif}
#site{border:0;width:100%;height:100%;display:block;background:#fff}
#panel{position:fixed;z-index:99999;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center;padding:8px 10px;background:rgba(10,10,10,.86);backdrop-filter:blur(10px);box-shadow:0 8px 30px rgba(0,0,0,.18)}
#panel button{appearance:none;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;font:600 11px/1 Arial,sans-serif;letter-spacing:.08em;width:34px;height:30px;cursor:pointer}
#panel button.active{background:#fff;color:#111}
#panel .label{color:#fff;font:500 10px/1 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;margin-right:4px;white-space:nowrap}
@media(max-width:800px){#panel{left:8px;right:8px;transform:none;overflow-x:auto;justify-content:flex-start}.label{display:none}}
</style>
</head>
<body>
<div id="panel"><span class="label">Hero-Hintergrund</span>
<button data-v="1" class="active">1</button><button data-v="2">2</button><button data-v="3">3</button><button data-v="4">4</button><button data-v="5">5</button><button data-v="6">6</button><button data-v="7">7</button><button data-v="8">8</button><button data-v="9">9</button><button data-v="10">10</button>
</div>
<iframe id="site" src="../index.html"></iframe>
<script>
const frame=document.getElementById('site');
let current=1;
const base=`
html body.site-light-page main.home section.home-hero{isolation:isolate!important;overflow:hidden!important;background:none!important}
html body.site-light-page main.home section.home-hero::before{content:""!important;display:block!important;position:absolute!important;inset:0!important;z-index:0!important;pointer-events:none!important;clip-path:none!important;opacity:1!important;background-image:url("../Hintergrundbild 2.png")!important;background-repeat:no-repeat!important}
html body.site-light-page main.home section.home-hero::after{content:""!important;display:block!important;position:absolute!important;inset:0!important;z-index:1!important;pointer-events:none!important;clip-path:none!important}
html body.site-light-page main.home section.home-hero .home-hero__gradient-panel,html body.site-light-page main.home section.home-hero .home-hero__text-surface{visibility:hidden!important}
html body.site-light-page main.home section.home-hero .home-hero__portrait,html body.site-light-page main.home section.home-hero .home-hero__copy{position:relative!important;z-index:3!important}
`;
const variants={
1:`section.home-hero::before{background-size:cover!important;background-position:center center!important}section.home-hero::after{background:linear-gradient(90deg,rgba(243,232,212,.34) 0%,rgba(255,255,255,.20) 45%,rgba(255,255,255,0) 72%)!important}`,
2:`section.home-hero::before{background-size:145% auto!important;background-position:8% 54%!important}section.home-hero::after{background:linear-gradient(90deg,rgba(243,232,212,.48) 0%,rgba(232,229,223,.28) 42%,rgba(255,255,255,0) 70%)!important}`,
3:`section.home-hero::before{background-size:125% auto!important;background-position:82% 52%!important}section.home-hero::after{background:linear-gradient(90deg,rgba(255,255,255,.34) 0%,rgba(255,255,255,.08) 45%,rgba(199,203,211,.20) 100%)!important}`,
4:`section.home-hero::before{background-size:165% auto!important;background-position:68% 63%!important;opacity:.80!important}section.home-hero::after{background:linear-gradient(105deg,rgba(243,232,212,.46) 0%,rgba(232,229,223,.24) 36%,rgba(199,203,211,.14) 68%,rgba(141,150,168,.10) 100%)!important}`,
5:`section.home-hero::before{background-size:190% auto!important;background-position:44% 58%!important;opacity:.60!important}section.home-hero::after{background:linear-gradient(90deg,rgba(243,232,212,.62) 0%,rgba(255,255,255,.30) 48%,rgba(255,255,255,.04) 78%)!important}`,
6:`section.home-hero::before{background-size:115% auto!important;background-position:center 70%!important;opacity:.88!important}section.home-hero::after{background:linear-gradient(90deg,rgba(232,229,223,.20) 0%,rgba(255,255,255,.10) 50%,rgba(199,203,211,.22) 100%)!important}`,
7:`section.home-hero::before{background-size:150% auto!important;background-position:100% 50%!important;opacity:.92!important}section.home-hero::after{background:linear-gradient(90deg,rgba(243,232,212,.54) 0%,rgba(243,232,212,.32) 36%,rgba(255,255,255,.04) 68%,rgba(141,150,168,.12) 100%)!important}`,
8:`section.home-hero::before{background-size:150% auto!important;background-position:0% 50%!important;opacity:.92!important}section.home-hero::after{background:linear-gradient(90deg,rgba(255,255,255,.18) 0%,rgba(232,229,223,.18) 44%,rgba(199,203,211,.24) 72%,rgba(141,150,168,.18) 100%)!important}`,
9:`section.home-hero::before{background-size:135% auto!important;background-position:50% 64%!important;opacity:.72!important;filter:contrast(.92) brightness(1.04)!important}section.home-hero::after{background:linear-gradient(110deg,rgba(243,232,212,.40) 0%,rgba(232,229,223,.26) 36%,rgba(199,203,211,.16) 66%,rgba(255,255,255,.04) 100%)!important}`,
10:`section.home-hero::before{background-size:205% auto!important;background-position:78% 60%!important;opacity:.42!important}section.home-hero::after{background:linear-gradient(90deg,rgba(243,232,212,.44) 0%,rgba(255,255,255,.36) 48%,rgba(199,203,211,.12) 100%)!important}`
};
function apply(v){
 const d=frame.contentDocument||frame.contentWindow.document;
 let s=d.getElementById('hero-bg-variant-test'); if(!s){s=d.createElement('style');s.id='hero-bg-variant-test';d.head.appendChild(s)}
 s.textContent=base+variants[v].replaceAll('section.home-hero','html body.site-light-page main.home section.home-hero');
 document.querySelectorAll('#panel button').forEach(b=>b.classList.toggle('active',Number(b.dataset.v)===v));
 current=v;
}
frame.addEventListener('load',()=>apply(current));
document.querySelectorAll('#panel button').forEach(b=>b.addEventListener('click',()=>apply(Number(b.dataset.v))));
</script>
</body>
</html>
