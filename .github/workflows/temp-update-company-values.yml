name: temp update company values
on:
  push:
    paths:
      - '.github/workflows/temp-update-company-values.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct existing Unternehmen Werte border declaration only
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Commit change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/unified-design.css unternehmen/index.html
          git diff --cached --check
          git commit -m 'Correct Unternehmen Werte border removal'
          git push
