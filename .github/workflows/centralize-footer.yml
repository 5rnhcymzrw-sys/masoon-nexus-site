name: Centralize footer
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/centralize-footer.yml'
      - '.github/scripts/centralize_footer.py'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Centralize footer styles
        run: python .github/scripts/centralize_footer.py
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/global.css assets/unified-design-base-20260907.css assets/unified-design.css assets/contact.css assets/index-CZfMKxM_.css assets/site.js
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m "Fusszeile zentral in global.css vereinheitlichen"
          git push origin main
