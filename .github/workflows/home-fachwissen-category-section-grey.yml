name: Home Fachwissen category section grey

on:
  push:
    paths:
      - '.github/workflows/home-fachwissen-category-section-grey.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bestehende Kategorienregeln auf Bereichstitel-Farbe anpassen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          repo_files = [Path('assets/global.css'), Path('assets/unified-design-base-20260907.css')]
          old_rule = '.home-paths__grid span{order:2!important;margin:12px 0 0!important;font-family:var(--font-inter)!important;font-size:11px!important;font-weight:500!important;line-height:1.4!important;letter-spacing:.14em!important;text-transform:uppercase!important;color:#171715!important;}'
          new_rule = old_rule.replace('color:#171715!important;', 'color:#777777!important;')
          for path in repo_files:
              text = path.read_text()
              if text.count(old_rule) != 1:
                  raise SystemExit(f'{path}: expected exactly one existing category rule, found {text.count(old_rule)}')
              path.write_text(text.replace(old_rule, new_rule, 1))

          base = Path('assets/unified-design-base-20260907.css')
          text = base.read_text()
          contact_sel = 'html body main .contact-split__form-label.contact-split__form-label.contact-split__form-label.contact-split__form-label.contact-split__form-label.contact-split__form-label'
          category_sel = 'html body main .home-paths__grid.home-paths__grid.home-paths__grid.home-paths__grid.home-paths__grid.home-paths__grid span'
          pattern = re.compile(re.escape(contact_sel + ',\n' + category_sel) + r'\{\n(?P<body>.*?)\n\}', re.S)
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one combined metadata rule, found {len(matches)}')
          body = matches[0].group('body')
          if body.count('color:#171715!important;') != 1:
              raise SystemExit('Combined metadata rule does not contain the expected dark color exactly once')
          category_body = body.replace('color:#171715!important;', 'color:#777777!important;', 1)
          replacement = contact_sel + '{\n' + body + '\n}\n' + category_sel + '{\n' + category_body + '\n}'
          text = text[:matches[0].start()] + replacement + text[matches[0].end():]
          base.write_text(text)

          # Cache-Busting bestehender Stylesheets, ohne neue CSS-Regeln anzuhängen.
          unified = Path('assets/unified-design.css')
          u = unified.read_text()
          u2 = re.sub(r"(unified-design-base-20260907\.css\?v=)[^')\"]+", r'\1home-fachwissen-category-section-grey-20260913-1', u, count=1)
          if u2 == u:
              raise SystemExit('Could not update base CSS import cache token')
          unified.write_text(u2)

          page = Path('index.html')
          h = page.read_text()
          h2 = re.sub(r'(assets/global\.css\?v=)[^"\']+', r'\1home-fachwissen-category-section-grey-20260913-1', h, count=1)
          h2 = re.sub(r'(assets/unified-design\.css\?v=)[^"\']+', r'\1home-fachwissen-category-section-grey-20260913-1', h2, count=1)
          if h2 == h:
              raise SystemExit('Could not update start page cache tokens')
          page.write_text(h2)

          # Verifikation: Kategorien sind in beiden bestehenden Basisregeln #777777; Formularlabel bleibt #171715.
          for path in repo_files:
              check = path.read_text()
              if new_rule not in check:
                  raise SystemExit(f'{path}: grey category rule missing after update')
          check = base.read_text()
          if contact_sel + '{' not in check or category_sel + '{' not in check:
              raise SystemExit('Split metadata rules missing')
          contact_block = re.search(re.escape(contact_sel) + r'\{\n(.*?)\n\}', check, re.S).group(1)
          category_block = re.search(re.escape(category_sel) + r'\{\n(.*?)\n\}', check, re.S).group(1)
          if 'color:#171715!important;' not in contact_block:
              raise SystemExit('Form label dark color was not preserved')
          if 'color:#777777!important;' not in category_block:
              raise SystemExit('Category section-title color was not applied')
          PY
      - name: Commit und temporaeren Workflow entfernen
        run: |
          rm -f .github/workflows/home-fachwissen-category-section-grey.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'No changes'; exit 1; }
          git commit -m "Startseite Fachwissen: Kategorien wie Bereichstitel"
          git push
