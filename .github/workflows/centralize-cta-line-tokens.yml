name: Centralize CTA and line tokens
on:
  push:
    branches: [main]
    paths: ['.github/workflows/centralize-cta-line-tokens.yml']
permissions:
  contents: write
jobs:
  centralize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Centralize CTA and line values
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('assets/global.css')
          s = p.read_text(encoding='utf-8')

          root_old = '--button-text-transform:uppercase;--content-width:1227px;'
          root_new = '--button-text-transform:uppercase;--action-color:#777777;--action-hover-color:#171715;--action-arrow-size:20px;--action-arrow-weight:300;--action-arrow-gap:10px;--short-line-width:48px;--short-line-color:#868279;--short-line-gap:11px;--content-width:1227px;'
          assert root_old in s
          s = s.replace(root_old, root_new, 1)

          old = '''/* Einheitliche Button-Typografie */
html body.site-light-page main :is(button,.button,.home-action-button,.home-values__all-services,.services-contact-button,.details-action,.article-action,.home-paths__action,input[type="submit"],input[type="button"]){
  font-family:var(--font-inter),Arial,sans-serif!important;
  font-size:11px!important;
  font-style:normal!important;
  font-weight:500!important;
  line-height:1.4!important;
  letter-spacing:1.1px!important;
  text-transform:uppercase!important;
  font-synthesis:none!important;
}'''
          new = '''/* Einheitliche Button-Typografie */
html body.site-light-page main :is(button,.button,.home-action-button,.home-values__all-services,.services-contact-button,.details-action,.article-action,.home-paths__action,input[type="submit"],input[type="button"]){
  font-family:var(--button-font)!important;
  font-size:var(--button-size)!important;
  font-style:normal!important;
  font-weight:var(--button-weight)!important;
  line-height:var(--button-line-height)!important;
  letter-spacing:var(--button-letter-spacing)!important;
  text-transform:var(--button-text-transform)!important;
  font-synthesis:none!important;
}'''
          assert old in s
          s = s.replace(old, new, 1)

          # Nur wiederkehrende Kurzlinien-Werte in global.css tokenisieren.
          s = s.replace('width:48px!important;', 'width:var(--short-line-width)!important;')
          s = s.replace('max-width:48px!important;', 'max-width:var(--short-line-width)!important;')
          s = s.replace('background:#868279!important;', 'background:var(--short-line-color)!important;')
          s = s.replace('margin-top:11px!important;', 'margin-top:var(--short-line-gap)!important;')

          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/global.css
          git commit -m "CTA- und Kurzlinienwerte global zentralisieren"
          git rm .github/workflows/centralize-cta-line-tokens.yml
          git commit -m "Temporären CTA-Linien-Workflow entfernen"
          git push