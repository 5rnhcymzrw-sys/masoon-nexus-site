<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Startseite Farbhierarchie Test</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="f" src="../index.html"></iframe><script>const f=document.getElementById('f');f.onload=()=>{const d=f.contentDocument||f.contentWindow.document;setTimeout(()=>{const cards=[...d.querySelectorAll('.home-values__item')];const cols=['#e2ded8','#efede9','#f5f4f1','#e2ded8','#efede9','#f5f4f1'];cards.forEach((e,i)=>{e.style.setProperty('background',cols[i%6],'important');e.style.setProperty('background-image','none','important');e.style.setProperty('border','0','important');e.style.setProperty('box-shadow','none','important')});const know=[...d.querySelectorAll('.home-paths__grid > *, .home-knowledge article, .home-knowledge__item')];know.forEach(e=>{e.style.setProperty('background','#fff','important');e.style.setProperty('box-shadow','none','important');e.style.setProperty('border','1px solid transparent','important');e.style.setProperty('border-image','linear-gradient(90deg,#f3e8d4,#e8e5df,#c7cbd3,#8d96a8) 1','important')});const contact=[...d.querySelectorAll('.home-contact-band, .home-contact-band > *, .home-contact')];contact.forEach(e=>{e.style.setProperty('background','rgba(255,255,255,.94)','important')});},250)};</script></body></html>
