name: Temporary fix contact button overlap
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-fix-contact-button-overlap.yml
permissions:
  contents: write
jobs:
  fix-existing-values:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct only existing contact submit typography rules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('assets/unified-design.css')
          s = p.read_text()
          old_typo = 'font-family:var(--font-inter),Arial,sans-serif!important;font-size:11px!important;font-weight:500!important;\n  line-height:1.4!important;letter-spacing:.14em!important;text-transform:uppercase!important;}'
          new_typo = 'font-family:var(--font-inter),Arial,sans-serif!important;font-size:11px!important;font-weight:500!important;\n  line-height:1.65!important;letter-spacing:1.1px!important;text-transform:uppercase!important;}'
          if s.count(old_typo) != 1:
              raise SystemExit(f'Expected exactly one contact submit typography block, found {s.count(old_typo)}')
          s = s.replace(old_typo, new_typo, 1)
          old_state = '''html body.page-contact.site-light-page main .contact-split__form button[type="submit"]:active{
  color:#605c55!important;
  background:transparent!important;'''
          new_state = '''html body.page-contact.site-light-page main .contact-split__form button[type="submit"]:active{
  color:#171715!important;
  background:transparent!important;'''
          if s.count(old_state) != 1:
              raise SystemExit(f'Expected exactly one contact submit state colour block, found {s.count(old_state)}')
          s = s.replace(old_state, new_state, 1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/unified-design.css
          git commit -m "Fix contact button typography overlap"
          git push
