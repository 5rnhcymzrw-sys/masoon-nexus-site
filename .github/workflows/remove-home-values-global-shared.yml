name: Remove home values global shared
on:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-home-values-global-shared.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove home-values from shared global rules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/global.css')
          s=p.read_text(encoding='utf-8')
          s=s.replace('html body.site-light-page .home-values__item,\nhtml body.site-light-page .article-card,','html body.site-light-page .article-card,',1)
          s=s.replace('body.site-light-page .home-values__items,\nbody.site-light-page .home-paths__grid,','body.site-light-page .home-paths__grid,',1)
          old='body.site-light-page .home-values__item{\n  border-left:var(--mt-gradient-frame-width) solid var(--mt-line)!important;\n}\nbody.site-light-page .home-values__item h3::after,\nbody.site-light-page .home-paths__grid strong::after{\n  background:var(--short-line-color)!important;\n}\n'
          new='body.site-light-page .home-paths__grid strong::after{\n  background:var(--short-line-color)!important;\n}\n'
          assert old in s
          s=s.replace(old,new,1)
          old2='/* Startseite Dienstleistungen: Titel-Text-Abstand wie bei Fachwissen */\nhtml body .home .home-values__item p{\n  margin-top:12px!important;}\n\n'
          assert old2 in s
          s=s.replace(old2,'',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/global.css
          git commit -m "home-values aus globalen Kachelgrundlagen lösen"
          git rm .github/workflows/remove-home-values-global-shared.yml
          git commit -m "Temporären home-values-Workflow entfernen"
          git push
