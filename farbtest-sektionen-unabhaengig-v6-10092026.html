<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MASOON – unabhängiger Farbtest V6</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f4f4f2;font-family:Arial,sans-serif;color:#171715}
.testbar{position:sticky;top:0;z-index:99999;background:#fff;border-bottom:1px solid #d8d8d4;padding:9px 12px}
.top{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.top strong{font-size:12px;margin-right:5px}.top button,.control-row button{appearance:none;border:1px solid #cfcfca;background:#fff;padding:6px 9px;font-size:11px;cursor:pointer}.top button:hover,.top button.active,.control-row button:hover,.control-row button.active{background:#171715;color:#fff;border-color:#171715}.note{font-size:10px;color:#777;margin-left:auto}
.controls{margin-top:8px;border-top:1px solid #ecece8;padding-top:7px;display:grid;gap:5px}.control-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap}.control-name{font-size:11px;font-weight:700;min-width:150px}.control-label{font-size:10px;color:#777;margin-left:6px}.fixed{font-size:10px;color:#777;padding:4px 0}
#siteFrame{display:block;width:100%;height:calc(100vh - 132px);min-height:680px;border:0;background:#fff}
@media(max-width:1000px){.note{width:100%;margin-left:0}.control-name{min-width:130px}#siteFrame{height:calc(100vh - 190px)}}
</style>
</head>
<body>
<div class="testbar">
  <div class="top">
    <strong>FARBTEST V6 · Gruppen unabhängig</strong>
    <button data-page="home" data-src="index.html?v=farbtestv6-10092026" class="active">Startseite</button>
    <button data-page="company" data-src="unternehmen/index.html?v=farbtestv6-10092026">Unternehmen</button>
    <button data-page="services" data-src="dienstleistungen/index.html?v=farbtestv6-10092026">Dienstleistungen</button>
    <button data-page="knowledge" data-src="fachwissen/index.html?v=farbtestv6-10092026">Fachwissen</button>
    <button data-page="contact" data-src="kontakt/index.html?v=farbtestv6-10092026">Kontakt</button>
    <span class="note">Weichzeichnung immer AUS · Originalseiten unverändert · Linien AN = exakt Originalrahmen</span>
  </div>
  <div class="controls" id="controls"></div>
</div>
<iframe id="siteFrame" src="index.html?v=farbtestv6-10092026" title="Unabhängiger Farbtest"></iframe>
<script>
const frame=document.getElementById('siteFrame');
const controls=document.getElementById('controls');
const pageButtons=[...document.querySelectorAll('[data-page]')];
let currentPage='home';

const alpha={'3.5':.145,'4':.18};
const configs={
  home:[
    {id:'hero',name:'Titelkasten',selector:'.home-hero__text-surface',fill:'original',lines:true,lineOption:true},
    {id:'homeDL',name:'6 DL-Kästen',selector:'main.home .home-values__items>.home-values__item',fill:'4',lines:true,lineOption:true},
    {id:'homeFW',name:'3 Fachwissen-Kästen',selector:'main.home .home-paths__grid>a',fill:'empty',lines:true,lineOption:false,hover:'4'}
  ],
  company:[
    {id:'companyValues',name:'3 Werte-Kästen',selector:'.company-values-grid>.company-value-card',fill:'original',lines:true,lineOption:true}
  ],
  services:[
    {id:'services6',name:'6 DL-Kästen',selector:'main.services-main .services-section .services-grid>.service-card',fill:'4',lines:true,lineOption:true}
  ],
  knowledge:[
    {id:'knowledge7',name:'7 Fachwissen-Kästen',selector:'main .knowledge-section#knowledge-articles .articles-grid>.article-card',fill:'empty',lines:true,lineOption:false,hover:'4'}
  ],
  contact:[
    {id:'contactForm',name:'Kontaktformular',selector:'.contact-split__form',fill:'original',lines:true,lineOption:true}
  ]
};

function gradient(level){
  const a=alpha[String(level)];
  return `linear-gradient(to right in oklab, rgba(243,232,212,${a}) 0%, rgba(232,229,223,${a}) 36%, rgba(199,203,211,${a}) 68%, rgba(141,150,168,${a}) 100%)`;
}
function imp(el,p,v){el.style.setProperty(p,v,'important')}
function remove(el,...props){props.forEach(p=>el.style.removeProperty(p))}

function originalFill(el){
  remove(el,'background','background-image','background-color','background-origin','background-size','background-repeat','background-position','backdrop-filter','-webkit-backdrop-filter');
}
function emptyFill(el){
  imp(el,'background','transparent');
  imp(el,'background-image','none');
  imp(el,'background-color','transparent');
  imp(el,'backdrop-filter','none');
  imp(el,'-webkit-backdrop-filter','none');
}
function gradientFill(el,index,level){
  const g=gradient(level);
  imp(el,'background',g);
  imp(el,'background-image',g);
  imp(el,'background-color','transparent');
  imp(el,'background-origin','border-box');
  imp(el,'background-size','calc(300% + 44px) 100%');
  imp(el,'background-repeat','no-repeat');
  imp(el,'background-position',index%3===0?'left top':index%3===1?'center top':'right top');
  imp(el,'backdrop-filter','none');
  imp(el,'-webkit-backdrop-filter','none');
}
function applyFill(el,index,mode){
  if(mode==='original') originalFill(el);
  else if(mode==='empty') emptyFill(el);
  else gradientFill(el,index,mode);
}

/* Rahmen: AN entfernt nur unsere Test-Overrides und gibt damit exakt die Original-CSS frei.
   AUS macht den bestehenden Rahmen unsichtbar, ohne dessen Breite/Boxmass zu verändern. */
function originalLines(el){
  remove(el,'border-color','border-image','border-image-source','border-image-slice');
}
function hiddenLines(el){
  imp(el,'border-color','transparent');
  imp(el,'border-image','none');
  imp(el,'border-image-source','none');
}
function applyLines(el,on){on?originalLines(el):hiddenLines(el)}

function applyGroup(group){
  const d=frame.contentDocument;if(!d)return;
  const items=[...d.querySelectorAll(group.selector)];
  items.forEach((el,i)=>{
    applyFill(el,i,group.fill);
    applyLines(el,group.lines);
  });
  if(group.hover) wireHover(group,items);
}
function wireHover(group,items){
  items.forEach((el,i)=>{
    const key='mtHover'+group.id;
    if(el.dataset[key]==='1')return;
    el.dataset[key]='1';
    el.addEventListener('mouseenter',()=>{
      gradientFill(el,i,group.hover);
      applyLines(el,true); // Fachwissen-Linien bleiben immer Original.
    });
    el.addEventListener('mouseleave',()=>{
      applyFill(el,i,group.fill);
      applyLines(el,true);
    });
  });
}
function applyAll(){
  try{(configs[currentPage]||[]).forEach(applyGroup)}catch(e){console.error('Farbtest V6:',e)}
}
function repeat(){applyAll();setTimeout(applyAll,180);setTimeout(applyAll,550);setTimeout(applyAll,1200);setTimeout(applyAll,2200)}

function button(label,active,onClick){
  const b=document.createElement('button');b.textContent=label;if(active)b.classList.add('active');b.addEventListener('click',onClick);return b;
}
function renderControls(){
  controls.innerHTML='';
  (configs[currentPage]||[]).forEach(group=>{
    const row=document.createElement('div');row.className='control-row';
    const name=document.createElement('span');name.className='control-name';name.textContent=group.name;row.appendChild(name);
    const fillLabel=document.createElement('span');fillLabel.className='control-label';fillLabel.textContent='Innen:';row.appendChild(fillLabel);
    ['original','empty','3.5','4'].forEach(mode=>{
      const labels={original:'ORIGINAL',empty:'LEER','3.5':'3.5','4':'4'};
      row.appendChild(button(labels[mode],group.fill===mode,()=>{group.fill=mode;renderControls();repeat()}));
    });
    if(group.lineOption){
      const lineLabel=document.createElement('span');lineLabel.className='control-label';lineLabel.textContent='Linien:';row.appendChild(lineLabel);
      row.appendChild(button('AN',group.lines===true,()=>{group.lines=true;renderControls();repeat()}));
      row.appendChild(button('AUS',group.lines===false,()=>{group.lines=false;renderControls();repeat()}));
    }else{
      const fixed=document.createElement('span');fixed.className='fixed';fixed.textContent='Linien: ORIGINAL (fix)';row.appendChild(fixed);
    }
    if(group.hover){
      const hoverLabel=document.createElement('span');hoverLabel.className='control-label';hoverLabel.textContent='Hover:';row.appendChild(hoverLabel);
      ['3.5','4'].forEach(mode=>row.appendChild(button(mode,group.hover===mode,()=>{group.hover=mode;renderControls();repeat()})));
    }
    controls.appendChild(row);
  });
}

frame.addEventListener('load',()=>{renderControls();repeat()});
pageButtons.forEach(b=>b.addEventListener('click',()=>{
  currentPage=b.dataset.page;
  pageButtons.forEach(x=>x.classList.remove('active'));b.classList.add('active');
  renderControls();frame.src=b.dataset.src;
}));
renderControls();
</script>
</body>
</html>
