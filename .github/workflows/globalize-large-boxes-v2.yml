name: Globalize large boxes v2
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/globalize-large-boxes-v2.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch cleanup script
        run: python3 scripts/patch-globalize-large-boxes.py
      - name: Apply global large box component
        run: python3 scripts/globalize-large-boxes.py
      - name: Verify
        run: |
          grep -n -A45 'Grosse Abschlusskästen: einzige globale Komponente' assets/global.css
      - name: Commit and push site changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/global.css assets/unified-design.css assets/dienstleistungen.css assets/index-CZfMKxM_.css index.html unternehmen dienstleistungen fachwissen kontakt disclaimer impressum datenschutz
          git commit -m "Grosse Kästen global vereinheitlichen"
          git push
      - name: Remove temporary files
        run: |
          git rm -f scripts/globalize-large-boxes.py scripts/patch-globalize-large-boxes.py .github/workflows/globalize-large-boxes.yml .github/workflows/globalize-large-boxes-v2.yml
          git commit -m "Temporäre Grosskasten-Bereinigung entfernen"
          git push
