name: Hero color 24 patch

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hero-color-24-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update existing hero gradient only
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path('assets/unified-design.css')
          text = css.read_text()
          old = 'background-image:linear-gradient(to right in oklab,rgba(244,228,201,.14) 0%,rgba(232,227,218,.14) 36%,rgba(193,199,214,.14) 68%,rgba(132,144,171,.14) 100%);'
          new = 'background-image:linear-gradient(to right in oklab,rgba(244,228,201,.24) 0%,rgba(232,227,218,.24) 36%,rgba(193,199,214,.24) 68%,rgba(158,165,184,.24) 100%);'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly 1 hero gradient match, found {count}')
          css.write_text(text.replace(old, new, 1))

          index = Path('index.html')
          html = index.read_text()
          old_cache = 'assets/unified-design.css?v=hero-testwerte-layering-20260911-4'
          new_cache = 'assets/unified-design.css?v=hero-color-24-20260912-1'
          if html.count(old_cache) != 1:
              raise SystemExit('Expected exactly 1 stylesheet cache reference')
          index.write_text(html.replace(old_cache, new_cache, 1))
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/hero-color-24-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/unified-design.css index.html .github/workflows/hero-color-24-patch.yml
          git commit -m "Startseite Hero: Verlauf auf 24 Prozent anpassen"
          git push
