name: Centralize body copy
on:
  push:
    branches: [main]
    paths: ['.github/workflows/centralize-body-copy.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Centralize body copy typography
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # 1) global.css: existing confirmed Disclaimer rule becomes the one body-copy source.
          p = Path('assets/global.css')
          s = p.read_text(encoding='utf-8')
          old = 'html body main :is(#mt-body-copy,.mt-body-copy){'
          new = '''html body main :is(#mt-body-copy,.mt-body-copy),
          html body main p:not(.section-label):not(.article-meta):not(.article-card-date):not(.details-action):not(.home-action-button):not(.home-values__all-services):not(.services-contact-button):not(.home-paths__action),
          html body main .article-body li{'''
          if s.count(old) != 1:
              raise SystemExit(f'global body-copy selector: expected 1, found {s.count(old)}')
          s = s.replace(old, new, 1)

          # Remove the obsolete body-level size/line-height defaults. Font family remains a base default.
          old_body = 'body{font-family:var(--font-inter)!important;font-size:var(--body-size)!important;line-height:1.65!important;}'
          if s.count(old_body) != 1:
              raise SystemExit(f'global body default: expected 1, found {s.count(old_body)}')
          s = s.replace(old_body, 'body{font-family:var(--font-inter)!important;}', 1)
          p.write_text(s, encoding='utf-8')

          # 2) Old duplicate body-copy typography in the legacy base file: delete the complete rule.
          p = Path('assets/unified-design-base-20260907.css')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(r'''html body main \.legal-page \.prose,\nhtml body main \.legal-page li,\nhtml body main \.contact-fact p,\nhtml body main \.form-status\{\n  font-family:var\(--font-inter\),Arial,sans-serif!important;\n  font-size:14px!important;\n  font-weight:290!important;\n  line-height:1\.65!important;\n  letter-spacing:normal!important;\n  color:#484a4f!important;\n\}\n''')
          s, n = pattern.subn('', s, count=1)
          if n != 1:
              raise SystemExit(f'legacy body-copy rule: expected 1, found {n}')
          p.write_text(s, encoding='utf-8')

          print('body copy centralized')
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/global.css assets/unified-design-base-20260907.css
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m "Fliesstext zentral in global.css vereinheitlichen"
          git push origin main
