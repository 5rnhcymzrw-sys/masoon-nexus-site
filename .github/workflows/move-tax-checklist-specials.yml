name: Move tax checklist specials to article detail
on:
  push:
    branches: [main]
    paths: ['.github/workflows/move-tax-checklist-specials.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move genuine article specials
        run: |
          python3 - <<'PY'
          from pathlib import Path
          g=Path('assets/global.css')
          a=Path('assets/article-detail.css')
          gs=g.read_text(encoding='utf-8')
          ass=a.read_text(encoding='utf-8')
          block='''/* Steuercheckliste: echte Seitensonderregeln */\nbody.page-article-tax-checklist .item-label{white-space:nowrap!important}\nbody.page-article-tax-checklist .item-separator{display:inline-block!important;width:0!important;height:14px!important;margin:0 7px!important;border:0!important;border-left:1px solid #d7d5d1!important;background:transparent!important;font-size:0!important;line-height:0!important;color:transparent!important;vertical-align:middle!important}\n\n'''
          assert block in gs
          gs=gs.replace(block,'',1)
          assert 'page-article-tax-checklist' not in gs
          ass=ass.rstrip()+"\n\n"+block
          g.write_text(gs,encoding='utf-8')
          a.write_text(ass,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/global.css assets/article-detail.css
          git commit -m "Artikel-Sonderregeln aus global.css lösen"
          git rm .github/workflows/move-tax-checklist-specials.yml
          git commit -m "Temporären Artikel-Sonderregel-Workflow entfernen"
          git push