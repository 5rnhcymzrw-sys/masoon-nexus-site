<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hero-Varianten</title><style>
:root{--ink:#171715;--beige:#e9e5de;--beige2:#f1efeb;--white:#fff;--blue:#c7cbd3;--blue2:#8d96a8;--line:rgba(23,23,21,.16)}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f5f2;color:var(--ink)}.wrap{max-width:1500px;margin:0 auto;padding:22px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;position:sticky;top:0;z-index:20;background:rgba(246,245,242,.96);padding:12px 0}.toolbar button{border:1px solid #bbb;background:#fff;padding:10px 14px;cursor:pointer;font-size:13px}.toolbar button.active{background:#171715;color:#fff;border-color:#171715}
.hero{position:relative;min-height:760px;overflow:hidden;background:#eee}.portrait{position:absolute;right:0;top:13%;width:55%;height:76%;object-fit:cover;object-position:center;z-index:2}.copy{position:absolute;left:20%;top:50%;transform:translateY(-50%);width:min(640px,44vw);background:#fff;padding:34px 42px 36px;z-index:5}.copy h1{font-family:Georgia,serif;font-weight:400;font-size:64px;line-height:1.04;margin:0 0 26px}.copy p{font-size:15px;line-height:1.55;margin:0;color:#514e49}.bg{position:absolute;inset:0;z-index:1}.bg::before,.bg::after{content:"";position:absolute;inset:0}
.v1{background:linear-gradient(105deg,#e9e5de 0%,#f1efeb 42%,#fff 72%)}.v1::before{background:rgba(195,190,180,.25);clip-path:polygon(0 24%,43% 68%,37% 100%,0 100%)}.v1::after{background:rgba(255,255,255,.32);clip-path:polygon(42% 0,51% 0,32% 55%,49% 100%,39% 100%,22% 55%)}
.v2{background:linear-gradient(112deg,#eee9e1 0%,#f4f1ec 45%,#fff 78%)}.v2::before{background:rgba(207,200,188,.22);clip-path:polygon(0 0,34% 0,18% 52%,39% 100%,0 100%)}.v2::after{background:rgba(255,255,255,.4);clip-path:polygon(53% 0,73% 0,48% 100%,29% 100%)}
.v3{background:linear-gradient(96deg,#e7e0d5 0%,#f0ebe4 48%,#fff 76%)}.v3::before{background:rgba(183,175,163,.2);clip-path:polygon(0 32%,52% 70%,39% 100%,0 100%)}.v3::after{background:rgba(255,255,255,.27);clip-path:polygon(34% 0,46% 0,63% 100%,51% 100%)}
.v4{background:linear-gradient(108deg,#ece9e5 0%,#f1f2f3 44%,#fff 76%)}.v4::before{background:rgba(199,203,211,.32);clip-path:polygon(0 0,56% 0,35% 100%,0 100%)}.v4::after{background:rgba(255,255,255,.42);clip-path:polygon(45% 0,66% 0,49% 100%,31% 100%)}
.v5{background:linear-gradient(102deg,#ebe6de,#f5f2ee 54%,#fff 82%)}.v5::before{background:repeating-linear-gradient(160deg,rgba(140,132,121,.11) 0 1px,transparent 1px 13px);clip-path:polygon(0 58%,100% 18%,100% 100%,0 100%)}.v5::after{background:rgba(218,211,201,.18);clip-path:polygon(0 0,39% 0,24% 100%,0 100%)}
.v6{background:linear-gradient(112deg,#e7e2db 0%,#f3f0eb 47%,#fff 78%)}.v6::before{background:rgba(198,192,181,.22);clip-path:polygon(0 0,100% 0,100% 24%,0 74%)}.v6::after{background:rgba(255,255,255,.23);clip-path:polygon(24% 0,43% 0,67% 100%,48% 100%)}
.v7{background:linear-gradient(105deg,#e5dfd6 0%,#efeae3 44%,#fff 77%)}.v7::before{background:rgba(177,169,158,.24);clip-path:polygon(0 18%,61% 73%,45% 100%,0 100%)}.v7::after{background:rgba(255,255,255,.39);clip-path:polygon(18% 0,40% 0,74% 100%,55% 100%)}
.v8{background:linear-gradient(100deg,#eee9e2 0%,#f5f3ef 50%,#eef0f3 72%,#fff 100%)}.v8::before{background:rgba(141,150,168,.20);clip-path:polygon(64% 0,100% 0,100% 100%,46% 100%)}.v8::after{background:rgba(255,255,255,.35);clip-path:polygon(48% 0,62% 0,44% 100%,31% 100%)}
.v9{background:linear-gradient(106deg,#e6dfd5 0%,#f0ebe4 48%,#fff 80%)}.v9::before{background:rgba(187,180,170,.28);clip-path:polygon(0 0,24% 0,49% 100%,0 100%)}.v9::after{background:rgba(255,255,255,.35);clip-path:polygon(27% 0,42% 0,30% 100%,16% 100%)}
.v10{background:linear-gradient(108deg,#eee9e2 0%,#f5f2ed 58%,#fff 82%)}.v10::before{background:rgba(201,195,186,.13);clip-path:polygon(0 58%,100% 0,100% 20%,0 87%)}.v10::after{background:rgba(255,255,255,.25);clip-path:polygon(59% 0,73% 0,49% 100%,36% 100%)}
.note{font-size:12px;color:#6c6862;margin-top:10px}@media(max-width:900px){.hero{min-height:640px}.portrait{width:60%;height:68%;top:18%}.copy{left:7%;width:62vw;padding:26px 28px}.copy h1{font-size:46px}}
</style></head><body><div class="wrap"><div class="toolbar" id="toolbar"></div><section class="hero"><div id="bg" class="bg v1"></div><img class="portrait" src="../Foto-hero.png" alt=""><div class="copy"><h1>Treuhand mit<br>Struktur und<br>Anspruch.</h1><p>Auf der Basis von Diskretion, Präzision und Vertrauen begleiten wir Sie mit fachlicher Klarheit und hohem Anspruch durch alle Phasen Ihres Geschäftslebens.</p></div></section><div class="note">Nur Testseite. Die bestehende Startseite wird nicht verändert.</div></div><script>const bar=document.getElementById('toolbar'),bg=document.getElementById('bg');for(let i=1;i<=10;i++){const b=document.createElement('button');b.textContent='Variante '+i;if(i===1)b.classList.add('active');b.onclick=()=>{bg.className='bg v'+i;document.querySelectorAll('.toolbar button').forEach(x=>x.classList.remove('active'));b.classList.add('active')};bar.appendChild(b)}</script></body></html>
