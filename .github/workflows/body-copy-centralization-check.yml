name: Body copy centralization check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/body-copy-centralization-check.yml']
permissions:
  contents: write
jobs:
  apply-verified-body-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Check branch has not moved
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ github.sha }}"
      - name: Install the verified CSS parser outside the repository
        run: npm install --prefix "$RUNNER_TEMP/body-copy-tools" --ignore-scripts --no-audit --no-fund postcss@8.5.6
      - name: Apply and verify body typography only
        shell: bash
        run: |
          NODE_PATH="$RUNNER_TEMP/body-copy-tools/node_modules" node <<'JS'
          const fs=require('fs');
          const path=require('path');
          const crypto=require('crypto');
          const postcss=require('postcss');
          const {execFileSync}=require('child_process');
          const root=process.cwd();
          const guards=[
          ['assets/article-detail.css','1d66e12aa2db09e5d4ef780b4ee31b8b153343af73cfd600fb3690806f5a64ad','e53f166ec0253c188662f1c22d62c5b6c61d76d14bdc1fdcd90f3fd71cb0c6ce'],
          ['assets/dienstleistungen.css','942b1289df0719994a8931e8dc4a4084e03babf7edabf81a74ae7d6cabd7793f','7b0b592447b796ad16e2f1ce850459008911fe19adaf6c8118629679721c11a8'],
          ['assets/global.css','306ea916b89f74d76abdd8fb791711d258a92b082945c258250de8ede3b02c70','c8f2b7b614b8dc065654564e4a7564199130714c2d0ecdffbd4073088b33358b'],
          ['assets/unified-design-base-20260907.css','6a6a7b72967fcde9f506726991b288e97733adbebf932eeb3aeccaf428c896ba','6c99b2a89a446d6b32b9479c4dae2c1ceae5d0b6315eda968f63adfe40762b2c'],
          ['assets/unified-design.css','b59c4f657ea898b977c35fb1cc3996229c1fe630e9dc2ddc8c5865f23d6a0311','507017df607f520351d3a3c81e72e0894382d6c6a7903223d71056921e2068ce'],
          ['datenschutz/index.html','b7cd95194e852e6c306c03c46a4de6848e912fae808175d494a33bccc2fb01d0','c9ed428a500430c4121ae381588b8b76520df8bbb3462e72455c65691a81b5ea'],
          ['dienstleistungen/index.html','0f235ee168f980392b77a8cddfc44eec931346918068544d97e8ec26c2fd483c','38541c689d59be4022530b1e06ddab569dc53701b4378137dd255cd1d8e64c90'],
          ['disclaimer/index.html','13dcf87e48670dc4e068fa34ab8443df9cf915e0ede551a1a4f58cf5b7edcb49','1bfcafc7c0da84fb427d574188f1b3332e566aee76cf1e9a014a3fd5c69a1a11'],
          ['fachwissen/checkliste-steuererklaerung/index.html','ef8647f2c549fce20c11e85625423e2f10a8e88bd8465b108efd29d222fdb443','ddf325b16e4c1bcfb13c04449a988da09f39b824cefd6bae948b29c1d454c1a6'],
          ['fachwissen/gewinnverwendung/index.html','03ae3b2a439f3ac91a6d282af68ca173ff1a9b1a3cb14b57ba824138c7caf4a1','1cd995f96ff0cce3cf4c00f160c6afcc720252f7de5896c596f5a72c6225dcd1'],
          ['fachwissen/index.html','04aa041c10e3367ef0a9de81670a75d85f180b26c9149ec4adff1a88fea094f3','f81668a69121d1d76ca13d4390d9c8cbd3b9cae4a80ba8e5d751ba16ade0bdda'],
          ['fachwissen/kuendigung-arbeitsvertrag/index.html','c2a322e25e50b1117e697620d2934b612209b791947cd808a5be462a18bbe3a1','dee7a2b1e62dfbc1892516b1cbf28ceb362f417ad7105c87dd2716a8e2bacad2'],
          ['fachwissen/missbraeuchliche-konkurse/index.html','d0dd28e92380a88ae52f727305d4667cb6a51389002b3f9658f270c7932d6108','0d13d4f6e345f1e14b04ca13d69e9039a3b571a15e68608b186fb0dbe290ddcb'],
          ['fachwissen/unternehmen-gruenden/index.html','23bf2765c718db9dbe421a643f9c2ae966f971b778ed2d2c4e9e2447114592bd','5743f41ca0135babbadeb240ca074c99712e02d5e39dd1b0ecb6457c4805148c'],
          ['fachwissen/unternehmensformen/index.html','49d52b583e7bcb4b6e392445208a3486062a303aa513565c0a6ffc16744d1070','718ac7641951571956d16f18b237c2a9e444db89648d5fb4fe17be879b1296ef'],
          ['fachwissen/unwahre-buchfuehrung/index.html','6ca9b38170c31069d4650958baf6d0dff32a40451a2d97dd58b229bb6b3ce249','6fee852a377c571292056eae7bdf5f79b65a7598521e3a9b626d69d3055ae265'],
          ['impressum/index.html','fa38ea4b7230fd3a605bbd908cd93ec644ba443f92c19f41b254cd19ff9f8a82','cf9c1da5c2edea973e0951f0d4b67114db7a52d71a584deb9a11955bcc75f8a1'],
          ['index.html','80766ce7c7559586be44d33a1a903478b2859110e2b1a7b2aa8cdb315ea6002e','99403d1db6636ef5296a3ed13d6bc4fc8d30e34f708a486f71b77d13f3c50cff'],
          ['kontakt/index.html','7657e2905c2c9966fe0bccf8f8e9d4796ed3d0f628099a961967bae70e636cc1','f05de63bf9316d74307f29728ea9ca94d053f8e947901cfd7e883342a46273b8'],
          ['unternehmen/index.html','59a92798820ba0ed61be9f36a39a4eecece0fc1d9f1a67b3ddb435bff5aa0ea5','f778dd374bc407c2b16765d8af6cf985dcb7aa1efc769cd38df876dec4819d3d']
          ];
          const digest=file=>crypto.createHash('sha256').update(fs.readFileSync(path.join(root,file))).digest('hex');
          for(const [file,before] of guards){if(digest(file)!==before)throw Error('Source changed since verification: '+file);}
          const files=['assets/global.css','assets/article-detail.css','assets/unified-design.css','assets/unified-design-base-20260907.css','assets/dienstleistungen.css'];
          const props=new Set(['font-family','font-size','font-weight','line-height','letter-spacing','color','font-style','text-transform']);
          const marker='/* Einheitlicher Fliesstext auf allen Seiten */';
          const oldBody='html body main :is(#mt-body-copy,.mt-body-copy)';
          let counts={};
          for(const file of files){
           const filePath=path.join(root,file);
           const before=fs.readFileSync(filePath,'utf8');
           let text=before;
           if(file==='assets/global.css'){
            const at=text.lastIndexOf(marker);
            if(at<0 || text.slice(at).includes('{'))throw Error('Unexpected global.css tail; refusing to edit');
            if(!text.slice(at).trim().endsWith('html body.site-light-page main .home-hero__services,'))throw Error('Unexpected dangling body rule');
            text=text.slice(0,at).trimEnd()+'\n';
           }
           const tree=postcss.parse(text,{from:filePath});
           let removed=0;
           if(file==='assets/global.css'){
            const tokens=tree.nodes.find(n=>n.type==='rule'&&n.selector===':root');
            const size=tokens.nodes.find(d=>d.prop==='--body-size');
            if(!size||size.value!=='14px')throw Error('Unexpected body-size');
            const definitions=[['--body-font','var(--font-inter),Arial,sans-serif'],['--body-weight','300'],['--body-line-height','1.65'],['--body-letter-spacing','0'],['--body-color','#484a4f']];
            let anchor=size;
            for(const [prop,value] of definitions){
             if(tokens.nodes.some(n=>n.prop===prop))throw Error('Duplicate token '+prop);
             const d=postcss.decl({prop,value,raws:{before:'',between:':'}});tokens.insertAfter(anchor,d);anchor=d;
            }
           }
           tree.walkRules(rule=>{
            if(file==='assets/global.css'&&rule.selector.startsWith(oldBody+',')){
             if(rule.prev()?.type==='comment')rule.prev().text='Einheitlicher Fliesstext: Referenz 01.2026 Konkursrecht. Werte zentral in :root; Layout und Spezialtypografie bleiben separat.';
             rule.selector='html body main .mt-body-copy,\nhtml body main p:not(.section-label):not(.article-meta):not(.article-card-date):not(.details-action):not(.home-action-button):not(.home-values__all-services):not(.services-contact-button):not(.home-paths__action),\nhtml body main .article-body li,\nhtml body main .service-card li,\nhtml body main .article-table-wrap table,\nhtml body main .home-paths__grid>a strong::after';
             const values={'font-family':'var(--body-font)','font-size':'var(--body-size)','font-weight':'var(--body-weight)','line-height':'var(--body-line-height)','letter-spacing':'var(--body-letter-spacing)','color':'var(--body-color)'};
             for(const decl of rule.nodes){if(decl.type==='decl'&&values[decl.prop])decl.value=values[decl.prop];}
             rule.append({prop:'font-style',value:'normal',important:true,raws:{before:'\n  ',between:':'}});
             rule.append({prop:'text-transform',value:'none',important:true,raws:{before:'\n  ',between:':'}});
             counts.bodyRules=(counts.bodyRules||0)+1;
             return;
            }
            const selectors=postcss.list.comma(rule.selector);
            const isBody=s=>{
             if(/\.article-table-wrap\s+table$/.test(s))return true;
             if(s==='html body main .legal-page p:not(.section-label):not(.article-meta):not(.home-hero__intro)')return true;
             if(s==='html body.page-contact.site-light-page main .contact-split__form .contact-success__message')return true;
             // Only direct body text, never titles, numbers, list markers, buttons or labels.
             return /(?:\.services-section|\.service-card)/.test(s)&&/\s(?:p|li)$/.test(s)&&!s.includes('::');
            };
            const body=selectors.filter(isBody);
            if(!body.length)return;
            const ds=rule.nodes.filter(n=>n.type==='decl'&&props.has(n.prop));
            if(!ds.length)return;
            const other=selectors.filter(s=>!isBody(s));
            if(other.length){
             const shared=rule.nodes.filter(n=>n.type==='decl'&&!props.has(n.prop));
             if(shared.length){
              const bodyRule=rule.clone({selector:body.join(',\n')});
              bodyRule.walkDecls(d=>{if(props.has(d.prop))d.remove();});
              rule.parent.insertAfter(rule,bodyRule);
             }
             rule.selector=other.join(',\n');
             removed+=ds.length;
            }else{
             ds.forEach(d=>{d.remove();removed++;});
             if(!rule.nodes.some(n=>n.type==='decl'))rule.remove();
            }
           });
           if(file==='assets/global.css'&&counts.bodyRules!==1)throw Error('Expected exactly one body rule');
           const after=tree.toString();
           postcss.parse(after,{from:filePath});
           fs.writeFileSync(filePath,after);
           counts[file]={removedDeclarations:removed,beforeBytes:Buffer.byteLength(before),afterBytes:Buffer.byteLength(after),sha256:crypto.createHash('sha256').update(after).digest('hex')};
          }
          console.log(JSON.stringify(counts,null,2));
          const changedCss=new Set(files.map(file=>path.basename(file)));
          let cacheUpdates=0;
          for(const [file] of guards.filter(([file])=>file.endsWith('.html'))){
           const full=path.join(root,file);
           const before=fs.readFileSync(full,'utf8');
           const after=before.replace(/(href=["'])([^"']+\.css(?:\?[^"']*)?)(["'])/g,(all,open,uri,close)=>{
            const base=uri.split('?')[0];
            if(!changedCss.has(base.split('/').pop()))return all;
            cacheUpdates++;
            return open+base+'?v=body-global-20260915-1'+close;
           });
           fs.writeFileSync(full,after);
          }
          const unified=path.join(root,'assets/unified-design.css');
          const unifiedText=fs.readFileSync(unified,'utf8');
          fs.writeFileSync(unified,unifiedText.replace('./unified-design-base-20260907.css?v=action-letterspacing-1-1-clean-20260913-1','./unified-design-base-20260907.css?v=body-global-20260915-1'));
          if(cacheUpdates!==38)throw Error('Unexpected stylesheet reference count: '+cacheUpdates);
          for(const [file,before,after] of guards){if(digest(file)!==after)throw Error('Output differs from locally verified result: '+file);}
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'});
          const changed=git('diff','--name-only').trim().split('\n').sort();
          const allowed=guards.map(([file])=>file).sort();
          if(JSON.stringify(changed)!==JSON.stringify(allowed))throw Error('Unexpected changed files');
          git('diff','--check');
          git('add','--',...allowed);
          git('config','user.name','github-actions[bot]');
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com');
          console.log(git('commit','-m','Fliesstext in global.css vollständig zentralisieren'));
          console.log(git('push','origin','HEAD:main'));
          console.log('Verified body-copy commit: '+git('rev-parse','HEAD').trim());
          console.log('5 CSS files centralized; only stylesheet cache references changed in 15 HTML pages.');
          JS
