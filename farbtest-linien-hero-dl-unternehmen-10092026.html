<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MASOON TREUHAND – Farb- und Linientest</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#111;color:#fff}
  .bar{position:fixed;z-index:20;top:0;left:0;right:0;min-height:92px;padding:14px 18px;background:#111;border-bottom:1px solid #333;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .tabs,.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#aaa;margin-right:4px}
  button{appearance:none;border:1px solid #555;background:#1d1d1d;color:#fff;padding:10px 13px;cursor:pointer;font-size:12px}
  button:hover{background:#292929}
  button.active{background:#fff;color:#111;border-color:#fff}
  .note{margin-left:auto;font-size:11px;color:#aaa;white-space:nowrap}
  iframe{position:fixed;top:92px;left:0;width:100%;height:calc(100% - 92px);border:0;background:#fff}
  @media(max-width:950px){.bar{min-height:138px}.note{width:100%;margin-left:0}iframe{top:138px;height:calc(100% - 138px)}}
</style>
</head>
<body>
<div class="bar">
  <div class="tabs">
    <span class="label">Ansicht</span>
    <button data-view="hero" class="active">Startseite Hero</button>
    <button data-view="homeDL">Startseite DL</button>
    <button data-view="company">Unternehmen Werte</button>
    <button data-view="services">DL Hauptseite</button>
  </div>
  <div id="controls" class="controls"></div>
  <div class="note">Nur Testseite. Die echten Seiten werden nicht verändert.</div>
</div>
<iframe id="site" title="Testansicht"></iframe>
<script>
const frame=document.getElementById('site');
const controls=document.getElementById('controls');
const tabs=[...document.querySelectorAll('[data-view]')];
const stamp=Date.now();

const state={
  hero:{gradient:true,line:true},
  homeDL:{line:true},
  company:{line:true},
  services:{line:true}
};

const views={
  hero:{url:'index.html?test='+stamp, target:'.home-hero'},
  homeDL:{url:'index.html?test='+stamp, target:'.home-values'},
  company:{url:'unternehmen/index.html?test='+stamp, target:'.company-values-section'},
  services:{url:'dienstleistungen/index.html?test='+stamp, target:'.services-section'}
};
let current='hero';

function button(label,key,value){
  const b=document.createElement('button');
  b.textContent=label;
  if(state[current][key]===value)b.classList.add('active');
  b.onclick=()=>{state[current][key]=value;renderControls();applyTest();};
  return b;
}

function renderControls(){
  controls.innerHTML='';
  if(current==='hero'){
    let l=document.createElement('span');l.className='label';l.textContent='Verlauf';controls.appendChild(l);
    controls.appendChild(button('AUS','gradient',false));
    controls.appendChild(button('AN','gradient',true));
    l=document.createElement('span');l.className='label';l.textContent='Linie';l.style.marginLeft='8px';controls.appendChild(l);
    controls.appendChild(button('OHNE','line',false));
    controls.appendChild(button('MIT','line',true));
  }else{
    const l=document.createElement('span');l.className='label';l.textContent='Linien';controls.appendChild(l);
    controls.appendChild(button('OHNE','line',false));
    controls.appendChild(button('MIT','line',true));
  }
}

function cssForView(){
  const grad='linear-gradient(to right in oklab,rgba(243,232,212,.11) 0%,rgba(232,229,223,.11) 36%,rgba(199,203,211,.11) 68%,rgba(141,150,168,.11) 100%)';
  let css='';
  if(current==='hero'){
    if(state.hero.gradient){
      css+=`html body.page-home .home-hero__text-surface{background:${grad}!important;background-size:100% 100%!important;background-repeat:no-repeat!important;background-color:transparent!important;}`;
    }else{
      css+=`html body.page-home .home-hero__text-surface{background:#fff!important;background-image:none!important;}`;
    }
    if(!state.hero.line){
      css+=`html body.page-home .home-hero__text-surface{border-width:1px!important;border-style:solid!important;border-color:transparent!important;border-image:none!important;}`;
    }
  }
  if(current==='homeDL' && !state.homeDL.line){
    css+=`html body.page-home main.home .home-values__items>.home-values__item{border-color:transparent!important;border-image:none!important;}`;
  }
  if(current==='company' && !state.company.line){
    css+=`html body.page-company main.page-main .company-values-grid>.company-value-card{border-color:transparent!important;border-image:none!important;}`;
  }
  if(current==='services' && !state.services.line){
    css+=`html body.page-services main.services-main .services-section .services-grid>.service-card{border-color:transparent!important;border-image:none!important;}`;
  }
  return css;
}

function applyTest(){
  const doc=frame.contentDocument;
  if(!doc)return;
  let style=doc.getElementById('masoon-test-overrides');
  if(!style){style=doc.createElement('style');style.id='masoon-test-overrides';doc.head.appendChild(style);}
  style.textContent=cssForView();
}

function focusTarget(){
  try{
    const doc=frame.contentDocument;
    const el=doc.querySelector(views[current].target);
    if(el){
      if(current==='hero')frame.contentWindow.scrollTo(0,0);
      else el.scrollIntoView({block:'center'});
    }
  }catch(e){}
}

function loadView(view){
  current=view;
  tabs.forEach(b=>b.classList.toggle('active',b.dataset.view===view));
  renderControls();
  frame.onload=()=>{applyTest();setTimeout(focusTarget,120);};
  frame.src=views[view].url+'&v='+Date.now();
}

tabs.forEach(b=>b.onclick=()=>loadView(b.dataset.view));
renderControls();
loadView('hero');
</script>
</body>
</html>
