name: temp fix test button lines
on:
  push:
    paths:
      - '.github/workflows/temp-fix-test-button-lines.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch test page button controls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, base64
          p=Path('farbtest-alle-kaesten-linien-10092026.html')
          s=p.read_text(encoding='utf-8')
          repl=base64.b64decode('').decode()
          pattern=r'function applyButtons\(d\)\{.*?\n\}\nfunction apply\(\)\{'
          ns,n=re.subn(pattern,repl,s,count=1,flags=re.S)
          if n != 1:
              raise SystemExit(f'expected 1 applyButtons block, found {n}')
          p.write_text(ns,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add farbtest-alle-kaesten-linien-10092026.html
          git commit -m 'Fix test button frame toggle'
          git push
