name: Action letterspacing correct

on:
  push:
    paths:
      - '.github/workflows/action-letterspacing-correct.yml'

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nur unbeabsichtigte Nebenwirkungen korrigieren
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Nicht-Aktions-Metadaten behalten ihren bisherigen 1.55px-Wert.
          p = Path('assets/global.css')
          s = p.read_text()
          selector = 'html body main :is(#mt-nav-typography,.mt-nav-typography):not(.section-label):not(.article-card-date):not(.details-action):not(.article-back):not(.article-action):not(.home-action-button):not(.home-values__all-services):not(.services-contact-button):not(.home-paths__action){'
          start = s.find(selector)
          if start < 0:
              raise SystemExit('Cleaned mt-nav selector not found')
          end = s.find('}', start)
          block = s[start:end+1]
          if 'letter-spacing:1.1px!important;' not in block:
              raise SystemExit('Unexpected mt-nav letter-spacing state')
          new_block = block.replace('letter-spacing:1.1px!important;', 'letter-spacing:1.55px!important;', 1)
          s = s[:start] + new_block + s[end+1:]
          p.write_text(s)

          # Pfeilsymbol im Kontaktbutton behält 0; nur die Buttonschrift ist 1.1px.
          p = Path('assets/contact.css')
          s = p.read_text()
          old = '.contact-split__form button span{\n  font-size: 17px !important;\n  font-weight: 300 !important;\n  line-height: 1 !important;\n  letter-spacing:1.1px!important;\n}'
          new = '.contact-split__form button span{\n  font-size: 17px !important;\n  font-weight: 300 !important;\n  line-height: 1 !important;\n  letter-spacing:0!important;\n}'
          if s.count(old) != 1:
              raise SystemExit('Contact button symbol rule not found exactly once')
          p.write_text(s.replace(old, new, 1))

          # Verifikation der gewünschten Aktionswerte.
          checks = {
              'assets/global.css': ['.details-action{letter-spacing:1.1px!important;}'],
              'assets/contact.css': ['letter-spacing:1.1px!important;', 'letter-spacing:0!important;'],
              'assets/index-CZfMKxM_.css': ['.button{letter-spacing:1.1px!important;'],
          }
          for fname, needles in checks.items():
              txt = Path(fname).read_text()
              for needle in needles:
                  if needle not in txt:
                      raise SystemExit(f'{fname}: expected value missing: {needle}')
          PY
      - name: Commit und temporaeren Workflow entfernen
        run: |
          rm -f .github/workflows/action-letterspacing-correct.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'No changes'; exit 1; }
          git commit -m "Aktionsschriften: Nebenwirkungen der Bereinigung korrigieren"
          git push
