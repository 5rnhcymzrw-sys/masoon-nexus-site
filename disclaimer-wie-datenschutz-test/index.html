<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Disclaimer – wie Datenschutz Test</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{border:0}.main{width:100%;height:100%}.ref{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}</style></head><body><iframe id="main" class="main" src="../disclaimer/index.html"></iframe><iframe id="ref" class="ref" src="../datenschutz/index.html"></iframe><script>const main=document.getElementById('main'),ref=document.getElementById('ref');function apply(){if(!main.contentDocument||!ref.contentDocument)return;const md=main.contentDocument,rd=ref.contentDocument;const mb=md.body,rb=rd.body;const mc=md.querySelector('.disclaimer-card'),rc=rd.querySelector('.disclaimer-card');if(!mb||!rb||!mc||!rc)return;const bs=getComputedStyle(rb),cs=getComputedStyle(rc);['backgroundImage','backgroundColor','backgroundRepeat','backgroundSize','backgroundPosition','backgroundAttachment'].forEach(p=>mb.style.setProperty(p.replace(/[A-Z]/g,m=>'-'+m.toLowerCase()),bs[p],'important'));['background','backgroundColor','backgroundImage','backgroundRepeat','backgroundSize','backgroundPosition','backgroundOrigin','boxShadow','backdropFilter','webkitBackdropFilter'].forEach(p=>{const css=p.replace(/[A-Z]/g,m=>'-'+m.toLowerCase());const val=cs[p]||'none';mc.style.setProperty(css,val,'important')});mc.style.setProperty('-webkit-backdrop-filter','none','important');mc.style.setProperty('backdrop-filter','none','important');}main.addEventListener('load',()=>setTimeout(apply,200));ref.addEventListener('load',()=>setTimeout(apply,200));</script></body></html>
