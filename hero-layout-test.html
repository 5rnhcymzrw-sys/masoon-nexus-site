<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>MASOON TREUHAND – Hero Layout Test</title>
<style>
html,body{margin:0;height:100%;background:#111;font-family:Arial,sans-serif}
body{display:grid;grid-template-rows:58px 1fr;overflow:hidden}
.tester{display:flex;align-items:center;gap:7px;padding:0 14px;background:#f3f3f3;border-bottom:1px solid #ccc;box-sizing:border-box;z-index:10;overflow-x:auto}
.tester strong{font-size:13px;margin-right:6px;font-weight:600;white-space:nowrap}
.tester button{appearance:none;border:1px solid #c9c9c9;background:#fff;padding:9px 12px;font-size:12px;cursor:pointer;white-space:nowrap}
.tester button.active{background:#111;color:#fff;border-color:#111}
iframe{width:100%;height:100%;border:0;background:#fff;display:block}
@media(max-width:900px){.tester strong{display:none}}
</style>
</head>
<body>
<div class="tester">
<strong>Hero vergleichen</strong>
<button data-v="v3" class="active">3 · Foto dominant</button>
<button data-v="v5">5 · Transparente Fläche links</button>
<button data-v="v7">7 · Text unten</button>
<button data-v="v9">9 · Editorial Vollbild</button>
<button data-v="v11">11 · Vertikale Fläche</button>
<button data-v="v12">12 · Beige Paneel</button>
<button data-v="v14">14 · Feiner Rahmen</button>
<button data-v="v15">15 · Soft Fade</button>
</div>
<iframe id="site" src="./index.html"></iframe>
<script>
const frame=document.getElementById('site');
const buttons=[...document.querySelectorAll('button[data-v]')];
let current='v3';
const css=`
html[class*="hero-test-"] body.site-light-page main.home section.home-hero::before{background:none!important;transform:none!important}
html[class*="hero-test-"] body.site-light-page main.home section.home-hero{overflow:hidden!important;background:linear-gradient(105deg,rgba(243,232,212,.34) 0%,rgba(232,229,223,.22) 42%,rgba(199,203,211,.13) 68%,rgba(255,255,255,.50) 100%)!important}
html[class*="hero-test-"] body.site-light-page main.home section.home-hero::after{content:''!important;position:absolute!important;inset:0!important;pointer-events:none!important;background:linear-gradient(90deg,rgba(243,232,212,.24) 0%,rgba(243,232,212,0) 52%)!important;z-index:0!important}

@media(min-width:801px){
html.hero-test-v3 body.site-light-page main.home section.home-hero{min-height:calc(100svh - 108px)!important;background:linear-gradient(105deg,rgba(243,232,212,.36) 0%,rgba(232,229,223,.18) 45%,rgba(199,203,211,.12) 72%,rgba(255,255,255,.18) 100%)!important}
html.hero-test-v3 body.site-light-page main.home section.home-hero .home-hero__portrait{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;transform:none!important;clip-path:none!important;z-index:1!important}
html.hero-test-v3 body.site-light-page main.home section.home-hero .home-hero__portrait-image{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;object-fit:cover!important;object-position:right 18%!important;transform:none!important}
html.hero-test-v3 body.site-light-page main.home section.home-hero .home-hero__portrait::after{content:''!important;position:absolute!important;inset:0!important;width:100%!important;background:linear-gradient(90deg,rgba(243,232,212,.96) 0%,rgba(232,229,223,.78) 26%,rgba(199,203,211,.30) 49%,rgba(0,0,0,.06) 68%,rgba(0,0,0,.06) 100%)!important}
html.hero-test-v3 body.site-light-page main.home section.home-hero .home-hero__content{width:min(100% - 64px,1227px)!important;margin:0 auto!important;padding:0 0 9vh!important;min-height:calc(100svh - 108px)!important;display:flex!important;align-items:flex-end!important;position:relative!important;z-index:3!important}
html.hero-test-v3 body.site-light-page main.home section.home-hero .home-hero__copy{width:46%!important;padding:0!important;background:transparent!important;border:0!important;border-image:none!important}
html.hero-test-v3 body.site-light-page main.home section.home-hero h1.global-title{font-size:58px!important;line-height:1.02!important}

html.hero-test-v5 body.site-light-page main.home section.home-hero .home-hero__content{display:flex!important;align-items:center!important}
html.hero-test-v5 body.site-light-page main.home section.home-hero .home-hero__copy{width:calc(46% + 46px)!important;padding:42px 46px!important;background:rgba(255,255,255,.58)!important;backdrop-filter:blur(3px)!important;border:0!important;transform:translateX(-46px)!important;border-image:none!important;box-shadow:none!important}

html.hero-test-v7 body.site-light-page main.home section.home-hero .home-hero__content{min-height:calc(100svh - 108px)!important;display:flex!important;align-items:flex-end!important;padding-bottom:9vh!important}
html.hero-test-v7 body.site-light-page main.home section.home-hero .home-hero__copy{width:46%!important;padding:0!important;background:transparent!important;border:0!important;border-image:none!important;box-shadow:none!important}
html.hero-test-v7 body.site-light-page main.home section.home-hero h1.global-title{font-size:60px!important;line-height:1.02!important}
html.hero-test-v7 body.site-light-page main.home section.home-hero::after{background:linear-gradient(90deg,rgba(243,232,212,.86) 0%,rgba(232,229,223,.48) 31%,rgba(199,203,211,.12) 53%,rgba(255,255,255,0) 68%)!important}

html.hero-test-v9 body.site-light-page main.home section.home-hero{min-height:calc(100svh - 108px)!important}
html.hero-test-v9 body.site-light-page main.home section.home-hero .home-hero__portrait{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;transform:none!important;clip-path:none!important;z-index:1!important}
html.hero-test-v9 body.site-light-page main.home section.home-hero .home-hero__portrait-image{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;object-fit:cover!important;object-position:right 18%!important;transform:none!important}
html.hero-test-v9 body.site-light-page main.home section.home-hero .home-hero__portrait::after{content:''!important;position:absolute!important;inset:0!important;width:100%!important;background:linear-gradient(90deg,rgba(243,232,212,.90) 0%,rgba(232,229,223,.62) 31%,rgba(199,203,211,.18) 52%,rgba(0,0,0,0) 72%)!important}
html.hero-test-v9 body.site-light-page main.home section.home-hero .home-hero__content{width:min(100% - 64px,1227px)!important;margin:0 auto!important;padding:104px 0!important;position:relative!important;z-index:3!important}
html.hero-test-v9 body.site-light-page main.home section.home-hero .home-hero__copy{width:52%!important;padding:42px!important;background:rgba(255,255,255,.36)!important;backdrop-filter:blur(2px)!important;border:0!important;border-image:none!important;box-shadow:none!important}

html.hero-test-v11 body.site-light-page main.home section.home-hero .home-hero__copy{width:52%!important;padding:42px!important;background:rgba(243,232,212,.34)!important;border:0!important;border-image:none!important;box-shadow:none!important}
html.hero-test-v11 body.site-light-page main.home section.home-hero::after{background:linear-gradient(90deg,rgba(232,229,223,.18) 0 42%,rgba(199,203,211,.08) 42% 55%,transparent 55%)!important}

html.hero-test-v12 body.site-light-page main.home section.home-hero .home-hero__copy{width:52%!important;padding:42px!important;background:rgba(243,232,212,.52)!important;border:0!important;border-image:none!important;box-shadow:none!important}
html.hero-test-v12 body.site-light-page main.home section.home-hero::after{background:linear-gradient(90deg,rgba(243,232,212,.36),rgba(232,229,223,.12) 48%,transparent 66%)!important}

html.hero-test-v14 body.site-light-page main.home section.home-hero .home-hero__copy{width:52%!important;padding:42px!important;background:rgba(255,255,255,.28)!important;border:1px solid transparent!important;border-image:linear-gradient(110deg,#f3e8d4 0%,#e8e5df 38%,#c7cbd3 66%,#8d96a8 100%) 1!important;box-shadow:none!important}
html.hero-test-v14 body.site-light-page main.home section.home-hero::after{background:linear-gradient(90deg,rgba(243,232,212,.52),rgba(232,229,223,.22) 42%,transparent 64%)!important}

html.hero-test-v15 body.site-light-page main.home section.home-hero .home-hero__copy{width:52%!important;padding:42px!important;background:linear-gradient(135deg,rgba(255,255,255,.68) 0%,rgba(243,232,212,.42) 56%,rgba(232,229,223,.08) 100%)!important;border:0!important;border-image:none!important;box-shadow:none!important}
html.hero-test-v15 body.site-light-page main.home section.home-hero::after{background:linear-gradient(90deg,rgba(243,232,212,.46),rgba(199,203,211,.10) 50%,transparent 68%)!important}
}

@media(max-width:800px){html[class*="hero-test-"] body.site-light-page main.home section.home-hero .home-hero__copy{background:rgba(255,255,255,.76)!important;border:0!important;border-image:none!important;transform:none!important}}
`;
function apply(v){
 const d=frame.contentDocument;if(!d)return;
 [...d.documentElement.classList].filter(c=>c.startsWith('hero-test-')).forEach(c=>d.documentElement.classList.remove(c));
 d.documentElement.classList.add('hero-test-'+v);
 let st=d.getElementById('hero-layout-test-styles');
 if(!st){st=d.createElement('style');st.id='hero-layout-test-styles';st.textContent=css;d.head.appendChild(st)}
 buttons.forEach(b=>b.classList.toggle('active',b.dataset.v===v));
 current=v;
}
frame.addEventListener('load',()=>apply(current));
buttons.forEach(b=>b.addEventListener('click',()=>apply(b.dataset.v)));
</script>
</body>
</html>
