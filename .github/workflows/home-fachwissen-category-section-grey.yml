name: Home Fachwissen category section grey

on:
  push:
    paths:
      - '.github/workflows/home-fachwissen-category-section-grey.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bestehende Kategorienregeln auf Bereichstitel-Farbe anpassen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) Bestehende direkte Kategorie-Regel in beiden geladenen Designquellen anpassen.
          for path in [Path('assets/global.css'), Path('assets/unified-design-base-20260907.css')]:
              text = path.read_text()
              pattern = re.compile(r'(\.home-paths__grid span\{[^{}]*?)color:#171715!important;([^{}]*\})', re.S)
              matches = list(pattern.finditer(text))
              if len(matches) != 1:
                  raise SystemExit(f'{path}: expected exactly one existing dark home-paths category rule, found {len(matches)}')
              text = pattern.sub(r'\1color:#777777!important;\2', text, count=1)
              path.write_text(text)

          # 2) Die alte gemeinsame Metadatenregel sauber trennen, damit NACHNAME dunkel bleibt,
          #    die drei Startseiten-Kategorien aber #777777 wie die Bereichstitel erhalten.
          base = Path('assets/unified-design-base-20260907.css')
          text = base.read_text()
          contact_sel = 'html body main .contact-split__form-label.contact-split__form-label.contact-split__form-label.contact-split__form-label.contact-split__form-label.contact-split__form-label'
          category_sel = 'html body main .home-paths__grid.home-paths__grid.home-paths__grid.home-paths__grid.home-paths__grid.home-paths__grid span'
          combined = re.compile(re.escape(contact_sel + ',\n' + category_sel) + r'\{\n(?P<body>.*?)\n\}', re.S)
          matches = list(combined.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one combined metadata rule, found {len(matches)}')
          body = matches[0].group('body')
          if body.count('color:#171715!important;') != 1:
              raise SystemExit('Combined metadata rule must contain one dark color')
          category_body = body.replace('color:#171715!important;', 'color:#777777!important;', 1)
          replacement = contact_sel + '{\n' + body + '\n}\n' + category_sel + '{\n' + category_body + '\n}'
          text = text[:matches[0].start()] + replacement + text[matches[0].end():]
          base.write_text(text)

          # 3) Bestehende Cache-Tokens aktualisieren.
          unified = Path('assets/unified-design.css')
          u = unified.read_text()
          u2 = re.sub(r"(unified-design-base-20260907\.css\?v=)[^')\"]+", r'\1home-fachwissen-category-section-grey-20260913-2', u, count=1)
          if u2 == u:
              raise SystemExit('Could not update base CSS import cache token')
          unified.write_text(u2)

          page = Path('index.html')
          h = page.read_text()
          h2 = re.sub(r'(assets/global\.css\?v=)[^"\']+', r'\1home-fachwissen-category-section-grey-20260913-2', h, count=1)
          h2 = re.sub(r'(assets/unified-design\.css\?v=)[^"\']+', r'\1home-fachwissen-category-section-grey-20260913-2', h2, count=1)
          if h2 == h:
              raise SystemExit('Could not update start page cache tokens')
          page.write_text(h2)

          # 4) Verifikation: keine alte dunkle Kategorie-Regel bleibt aktiv; Formularlabel bleibt dunkel.
          for path in [Path('assets/global.css'), Path('assets/unified-design-base-20260907.css')]:
              check = path.read_text()
              old_dark = re.findall(r'\.home-paths__grid span\{[^{}]*color:#171715!important;[^{}]*\}', check, re.S)
              if old_dark:
                  raise SystemExit(f'{path}: old dark category rule still present')
          check = base.read_text()
          contact_block = re.search(re.escape(contact_sel) + r'\{\n(.*?)\n\}', check, re.S).group(1)
          category_block = re.search(re.escape(category_sel) + r'\{\n(.*?)\n\}', check, re.S).group(1)
          if 'color:#171715!important;' not in contact_block:
              raise SystemExit('Form label dark color was not preserved')
          if 'color:#777777!important;' not in category_block:
              raise SystemExit('Category section-title color was not applied')
          PY
      - name: Commit und temporaeren Workflow entfernen
        run: |
          rm -f .github/workflows/home-fachwissen-category-section-grey.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'No changes'; exit 1; }
          git commit -m "Startseite Fachwissen: Kategorien wie Bereichstitel"
          git push
