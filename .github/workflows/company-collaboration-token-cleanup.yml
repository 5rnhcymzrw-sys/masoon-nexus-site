name: Company collaboration token cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/company-collaboration-token-cleanup.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace shared collaboration values
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('assets/unified-design.css')
          s = p.read_text(encoding='utf-8')
          replacements = {
            'width:min(calc(100% - 64px),1227px)!important;': 'width:min(calc(100% - var(--page-gutter)),var(--content-width))!important;',
            'margin:118px auto 126px!important;': 'margin:118px auto var(--section-y)!important;',
            'width:calc(100% - 36px)!important;min-height:0!important;height:auto!important;margin:82px auto 82px!important;': 'width:calc(100% - var(--page-gutter-mobile))!important;min-height:0!important;height:auto!important;margin:var(--section-y-mobile) auto var(--section-y-mobile)!important;'
          }
          for old,new in replacements.items():
              assert old in s, old
              s = s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/unified-design.css
          git commit -m "Zusammenarbeit auf globale Breiten- und Abstandstokens umstellen"
          git rm .github/workflows/company-collaboration-token-cleanup.yml
          git commit -m "Temporären Zusammenarbeit-Workflow entfernen"
          git push