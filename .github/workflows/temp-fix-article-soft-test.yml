name: temp fix article soft test
on:
  push:
    paths:
      - '.github/workflows/temp-fix-article-soft-test.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch article soft comparison
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('farbtest-alle-kaesten-linien-10092026.html')
          s=p.read_text(encoding='utf-8')
          old="function paintSoftOnly(items,state){items.forEach(el=>{remember(el);restore(el);setSoft(el,state.soft==='on')})}"
          new="function paintSoftOnly(items,state){items.forEach(el=>{remember(el);restore(el);setSoft(el,state.soft==='on');if(page==='./fachwissen/checkliste-steuererklaerung/index.html'){setImp(el,'background',state.soft==='on'?'rgba(255,255,255,.18)':'transparent');setImp(el,'background-color',state.soft==='on'?'rgba(255,255,255,.18)':'transparent');}})}"
          if s.count(old)!=1:
              raise SystemExit(f'expected 1 target, found {s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add farbtest-alle-kaesten-linien-10092026.html
          git commit -m 'Fix article soft comparison on test page'
          git push
