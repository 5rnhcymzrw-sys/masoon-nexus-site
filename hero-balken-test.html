<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>MASOON TREUHAND – Hero Balken Test</title>
<style>
html,body{margin:0;height:100%;background:#111;font-family:Arial,sans-serif}
body{display:grid;grid-template-rows:58px 1fr;overflow:hidden}
.tester{display:flex;align-items:center;gap:7px;padding:0 14px;background:#f3f3f3;border-bottom:1px solid #ccc;box-sizing:border-box;z-index:10;overflow-x:auto}
.tester strong{font-size:13px;margin-right:6px;font-weight:600;white-space:nowrap}
.tester button{appearance:none;border:1px solid #c9c9c9;background:#fff;padding:9px 12px;font-size:12px;cursor:pointer;white-space:nowrap}
.tester button.active{background:#111;color:#fff;border-color:#111}
iframe{width:100%;height:100%;border:0;background:#fff;display:block}
@media(max-width:900px){.tester strong{display:none}}
</style>
</head>
<body>
<div class="tester">
<strong>Balken vergleichen</strong>
<button data-v="v1" class="active">1 · Schmal & ruhig</button>
<button data-v="v2">2 · Breit & weich</button>
<button data-v="v3">3 · Versetzt</button>
<button data-v="v4">4 · Verlauf</button>
<button data-v="v5">5 · Mittelband</button>
<button data-v="v6">6 · Geteilt</button>
<button data-v="v7">7 · Asymmetrisch</button>
<button data-v="v8">8 · Nur Linien</button>
</div>
<iframe id="site" src="./index.html"></iframe>
<script>
const frame=document.getElementById('site');
const buttons=[...document.querySelectorAll('button[data-v]')];
let current='v1';
const css=`
html[class*="bar-test-"] body.site-light-page main.home section.home-hero{
  position:relative!important;
  isolation:isolate!important;
  overflow:hidden!important;
}
html[class*="bar-test-"] body.site-light-page main.home section.home-hero::before,
html[class*="bar-test-"] body.site-light-page main.home section.home-hero::after{
  content:''!important;
  position:absolute!important;
  z-index:2!important;
  pointer-events:none!important;
  transform:none!important;
}
html[class*="bar-test-"] body.site-light-page main.home section.home-hero .home-hero__copy{
  position:relative!important;
  z-index:4!important;
}
html[class*="bar-test-"] body.site-light-page main.home section.home-hero .home-hero__copy::before{
  content:'';
  position:absolute;
  z-index:-1;
  pointer-events:none;
}

@media(min-width:801px){
/* 1 – zwei schmale, ruhige Vollbreiten-Balken; Mitte fast offen */
html.bar-test-v1 body.site-light-page main.home section.home-hero::before{
  left:0!important;right:0!important;top:17%!important;height:5.5%!important;
  background:linear-gradient(90deg,rgba(243,232,212,.56),rgba(232,229,223,.36) 48%,rgba(199,203,211,.24))!important;
}
html.bar-test-v1 body.site-light-page main.home section.home-hero::after{
  left:0!important;right:0!important;bottom:13%!important;height:5.5%!important;
  background:linear-gradient(90deg,rgba(243,232,212,.48),rgba(232,229,223,.30) 48%,rgba(199,203,211,.22))!important;
}
html.bar-test-v1 body.site-light-page main.home section.home-hero .home-hero__copy::before{
  inset:-18px -32px;
  background:linear-gradient(90deg,rgba(255,255,255,.24),rgba(243,232,212,.12),transparent 88%);
}

/* 2 – breitere, weichere Balken; dazwischen sanfte transparente Fläche */
html.bar-test-v2 body.site-light-page main.home section.home-hero::before{
  left:0!important;right:0!important;top:15%!important;height:10%!important;
  background:linear-gradient(90deg,rgba(243,232,212,.62),rgba(232,229,223,.38) 45%,rgba(199,203,211,.20),rgba(141,150,168,.10))!important;
}
html.bar-test-v2 body.site-light-page main.home section.home-hero::after{
  left:0!important;right:0!important;bottom:10%!important;height:9%!important;
  background:linear-gradient(90deg,rgba(243,232,212,.54),rgba(232,229,223,.34) 45%,rgba(199,203,211,.18),rgba(141,150,168,.10))!important;
}
html.bar-test-v2 body.site-light-page main.home section.home-hero .home-hero__copy::before{
  inset:-34px -58px;
  background:linear-gradient(110deg,rgba(255,255,255,.46),rgba(243,232,212,.26),rgba(199,203,211,.08));
  backdrop-filter:blur(2px);
}

/* 3 – obere und untere Fläche bewusst gegeneinander versetzt */
html.bar-test-v3 body.site-light-page main.home section.home-hero::before{
  left:0!important;top:16%!important;width:69%!important;height:8%!important;
  background:linear-gradient(90deg,rgba(243,232,212,.66),rgba(232,229,223,.38),rgba(199,203,211,.15))!important;
}
html.bar-test-v3 body.site-light-page main.home section.home-hero::after{
  right:0!important;bottom:12%!important;width:74%!important;height:8%!important;
  background:linear-gradient(90deg,rgba(232,229,223,.20),rgba(199,203,211,.28),rgba(141,150,168,.18))!important;
}
html.bar-test-v3 body.site-light-page main.home section.home-hero .home-hero__copy::before{
  inset:-22px -38px;
  background:rgba(255,255,255,.27);
}

/* 4 – Balken selbst lösen sich weich in das Foto auf */
html.bar-test-v4 body.site-light-page main.home section.home-hero::before{
  left:0!important;right:0!important;top:15%!important;height:8%!important;
  background:linear-gradient(90deg,rgba(243,232,212,.72) 0%,rgba(232,229,223,.42) 34%,rgba(199,203,211,.18) 58%,transparent 82%)!important;
}
html.bar-test-v4 body.site-light-page main.home section.home-hero::after{
  left:0!important;right:0!important;bottom:11%!important;height:8%!important;
  background:linear-gradient(90deg,rgba(243,232,212,.60) 0%,rgba(232,229,223,.36) 36%,rgba(199,203,211,.16) 60%,transparent 84%)!important;
}
html.bar-test-v4 body.site-light-page main.home section.home-hero .home-hero__copy::before{
  inset:-24px -48px;
  background:linear-gradient(90deg,rgba(255,255,255,.48),rgba(255,255,255,.18),transparent);
}

/* 5 – statt drei Rechtecken ein einziges breites Mittelband plus feine Abschlusslinien */
html.bar-test-v5 body.site-light-page main.home section.home-hero::before{
  left:0!important;right:0!important;top:35%!important;height:39%!important;
  background:linear-gradient(90deg,rgba(243,232,212,.54),rgba(232,229,223,.34) 42%,rgba(199,203,211,.16) 64%,rgba(255,255,255,.04) 82%)!important;
  border-top:1px solid rgba(141,150,168,.18)!important;
  border-bottom:1px solid rgba(141,150,168,.18)!important;
}
html.bar-test-v5 body.site-light-page main.home section.home-hero::after{display:none!important}
html.bar-test-v5 body.site-light-page main.home section.home-hero .home-hero__copy::before{display:none}

/* 6 – ein klarer, aber feiner Farbsplit Beige links / Blaugrau rechts */
html.bar-test-v6 body.site-light-page main.home section.home-hero::before{
  left:0!important;right:0!important;top:16%!important;height:7%!important;
  background:linear-gradient(90deg,rgba(243,232,212,.62) 0 54%,rgba(199,203,211,.24) 54% 100%)!important;
}
html.bar-test-v6 body.site-light-page main.home section.home-hero::after{
  left:0!important;right:0!important;bottom:12%!important;height:7%!important;
  background:linear-gradient(90deg,rgba(243,232,212,.50) 0 54%,rgba(141,150,168,.18) 54% 100%)!important;
}
html.bar-test-v6 body.site-light-page main.home section.home-hero .home-hero__copy::before{
  inset:-20px -36px;
  background:linear-gradient(90deg,rgba(255,255,255,.38),rgba(243,232,212,.16));
}

/* 7 – kurze obere Fläche links, längere untere Fläche rechts; Mitte ohne Kasten */
html.bar-test-v7 body.site-light-page main.home section.home-hero::before{
  left:0!important;top:16%!important;width:57%!important;height:7%!important;
  background:linear-gradient(90deg,rgba(243,232,212,.66),rgba(232,229,223,.28),rgba(199,203,211,.08))!important;
}
html.bar-test-v7 body.site-light-page main.home section.home-hero::after{
  right:0!important;bottom:11%!important;width:79%!important;height:7%!important;
  background:linear-gradient(90deg,rgba(232,229,223,.10),rgba(199,203,211,.25),rgba(141,150,168,.18))!important;
}
html.bar-test-v7 body.site-light-page main.home section.home-hero .home-hero__copy::before{
  inset:-18px -34px;
  background:linear-gradient(90deg,rgba(243,232,212,.36),rgba(255,255,255,.12),transparent);
}

/* 8 – fast kein Balken mehr: nur zwei feine Linien und weicher Textbereich */
html.bar-test-v8 body.site-light-page main.home section.home-hero::before{
  left:0!important;right:0!important;top:18%!important;height:1px!important;
  background:linear-gradient(90deg,#f3e8d4 0%,#e8e5df 38%,#c7cbd3 66%,#8d96a8 100%)!important;
}
html.bar-test-v8 body.site-light-page main.home section.home-hero::after{
  left:0!important;right:0!important;bottom:14%!important;height:1px!important;
  background:linear-gradient(90deg,#f3e8d4 0%,#e8e5df 38%,#c7cbd3 66%,#8d96a8 100%)!important;
}
html.bar-test-v8 body.site-light-page main.home section.home-hero .home-hero__copy::before{
  inset:-32px -56px;
  background:linear-gradient(110deg,rgba(255,255,255,.48),rgba(243,232,212,.24),rgba(199,203,211,.08));
}
}

@media(max-width:800px){
html[class*="bar-test-"] body.site-light-page main.home section.home-hero .home-hero__copy::before{
  inset:-14px!important;background:rgba(255,255,255,.65)!important;backdrop-filter:none!important;
}
}
`;
function apply(v){
  const d=frame.contentDocument;if(!d)return;
  [...d.documentElement.classList].filter(c=>c.startsWith('bar-test-')).forEach(c=>d.documentElement.classList.remove(c));
  d.documentElement.classList.add('bar-test-'+v);
  let st=d.getElementById('hero-bar-test-styles');
  if(!st){st=d.createElement('style');st.id='hero-bar-test-styles';st.textContent=css;d.head.appendChild(st)}
  buttons.forEach(b=>b.classList.toggle('active',b.dataset.v===v));
  current=v;
}
frame.addEventListener('load',()=>apply(current));
buttons.forEach(b=>b.addEventListener('click',()=>apply(b.dataset.v)));
</script>
</body>
</html>
