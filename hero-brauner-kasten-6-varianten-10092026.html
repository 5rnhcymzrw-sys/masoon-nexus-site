<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MASOON TREUHAND – Hero Beige Kasten Test</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#f5f5f3;font-family:Arial,sans-serif;color:#171715}
  .bar{position:sticky;top:0;z-index:30;background:#111;padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #333}
  .bar span{color:#fff;font-size:11px;letter-spacing:.08em;margin-right:6px}
  .bar button{appearance:none;border:1px solid #666;background:#1d1d1d;color:#fff;padding:9px 11px;font-size:11px;cursor:pointer;white-space:nowrap}
  .bar button.active{background:#fff;color:#111;border-color:#fff}
  .note{padding:9px 14px;background:#fff;border-bottom:1px solid #ddd;font-size:12px;line-height:1.45}
  iframe{display:block;width:100%;height:calc(100vh - 92px);border:0;background:#fff}
</style>
</head>
<body>
<div class="bar">
  <span>ECHTE STARTSEITE · HERO · #D7D3CB</span>
  <button data-v="0" class="active">ORIGINAL</button>
  <button data-v="1">1 FOTO-NAH</button>
  <button data-v="2">2 ETWAS HÖHER</button>
  <button data-v="3">3 ETWAS TIEFER</button>
  <button data-v="4">4 SCHMALER</button>
  <button data-v="5">5 BREITER</button>
  <button data-v="6">6 RUHIGER</button>
</div>
<div class="note">Nur der zusätzliche beige Kasten hinter dem weissen Hero-Kasten wird getestet. Weissfläche, Text, Bild, Rahmen, Schrift und Abstände der echten Startseite bleiben unverändert.</div>
<iframe id="site" src="./index.html?v=hero-beige-six-10092026"></iframe>
<script>
const frame=document.getElementById('site');
const variants={
  0:null,
  1:{left:-28,top:42,width:75,bottom:-26},
  2:{left:-28,top:38,width:75,bottom:-26},
  3:{left:-28,top:46,width:75,bottom:-26},
  4:{left:-28,top:42,width:70,bottom:-26},
  5:{left:-28,top:42,width:80,bottom:-26},
  6:{left:-22,top:44,width:74,bottom:-20}
};
let current=0;
function cssFor(v){
  const p=variants[v];
  if(!p){
    return `html body.page-home.site-light-page main.home section.home-hero .home-hero__copy::after{content:none!important;display:none!important;}`;
  }
  return `
@media(min-width:801px){
  html body.page-home.site-light-page main.home section.home-hero .home-hero__copy::after{
    content:""!important;
    display:block!important;
    position:absolute!important;
    z-index:-2!important;
    left:${p.left}px!important;
    top:${p.top}%!important;
    width:${p.width}%!important;
    bottom:${p.bottom}px!important;
    height:auto!important;
    background:#D7D3CB!important;
    border:0!important;
    box-shadow:none!important;
    filter:none!important;
    pointer-events:none!important;
  }
}`;
}
function apply(){
  const d=frame.contentDocument;if(!d)return;
  let s=d.getElementById('masoon-hero-beige-six');
  if(!s){s=d.createElement('style');s.id='masoon-hero-beige-six';d.head.appendChild(s)}
  s.textContent=cssFor(current);
  const hero=d.querySelector('.home-hero');
  if(hero) hero.scrollIntoView({block:'start'});
}
frame.addEventListener('load',()=>setTimeout(apply,100));
document.querySelectorAll('button[data-v]').forEach(b=>b.addEventListener('click',()=>{
  current=Number(b.dataset.v);
  document.querySelectorAll('button[data-v]').forEach(x=>x.classList.toggle('active',x===b));
  apply();
}));
</script>
</body>
</html>
