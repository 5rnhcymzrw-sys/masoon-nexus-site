name: Action letterspacing cleanup

on:
  push:
    paths:
      - '.github/workflows/action-letterspacing-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bestehende Aktionsregeln bereinigen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          css_files = [
              Path('assets/global.css'),
              Path('assets/unified-design-base-20260907.css'),
              Path('assets/unified-design.css'),
              Path('assets/index-CZfMKxM_.css'),
              Path('assets/contact.css'),
              Path('assets/article-detail.css'),
          ]

          target_tokens = (
              '.home-action-button',
              '.home-values__all-services',
              '.details-action',
              '.article-action',
              '.services-contact-button',
              '.article-back',
              '.home-paths__action',
              '.contact-split__form button',
              '.button',
          )
          symbol_tokens = (
              '::after', '::before', '.details-toggle-symbol',
              '.home-action-button span', '.services-contact-button span',
              '.article-back span', '.home-paths__action>span',
              '.home-paths__action > span', '>span', '> span',
          )

          rule_re = re.compile(r'(?P<sel>[^{}]+)\{(?P<body>[^{}]*)\}', re.S)
          ls_re = re.compile(r'letter-spacing\s*:\s*([^;!}]+)\s*(?:!important)?\s*;', re.I)

          total_changes = 0
          for path in css_files:
              text = path.read_text()
              pieces = []
              pos = 0
              changed_here = 0
              for m in rule_re.finditer(text):
                  sel = m.group('sel')
                  body = m.group('body')
                  sl = sel.lower()
                  if not any(t in sl for t in target_tokens):
                      continue
                  if any(t in sl for t in symbol_tokens):
                      continue
                  vals = [v.strip() for v in ls_re.findall(body)]
                  if not vals:
                      continue
                  bad = [v for v in vals if v.lower() != '1.1px']
                  if not bad:
                      continue
                  new_body = ls_re.sub('letter-spacing:1.1px!important;', body)
                  pieces.append((m.start('body'), m.end('body'), new_body))
                  changed_here += 1
                  print(f'{path}: {sel.strip()} :: {vals} -> 1.1px')
              for a,b,repl in reversed(pieces):
                  text = text[:a] + repl + text[b:]
              if changed_here:
                  path.write_text(text)
                  total_changes += changed_here

          # Alte mt-nav-Regel direkt bereinigen: Aktionsklassen dürfen nie wieder 1.55px übernehmen.
          global_css = Path('assets/global.css')
          g = global_css.read_text()
          old_sel = 'html body main :is(#mt-nav-typography,.mt-nav-typography:not(.details-action):not(.article-back):not(.article-action)):not(.section-label):not(.article-card-date){'
          new_sel = 'html body main :is(#mt-nav-typography,.mt-nav-typography):not(.section-label):not(.article-card-date):not(.details-action):not(.article-back):not(.article-action):not(.home-action-button):not(.home-values__all-services):not(.services-contact-button):not(.home-paths__action){'
          if old_sel in g:
              g = g.replace(old_sel, new_sel, 1)
              global_css.write_text(g)
              total_changes += 1
              print('assets/global.css: mt-nav selector cleaned so action classes cannot inherit 1.55px')
          elif new_sel not in g:
              raise SystemExit('Expected existing mt-nav typography selector not found')

          # Verifikation aller expliziten Buchstabenabstände in Aktionsregeln.
          problems = []
          for path in css_files:
              text = path.read_text()
              for m in rule_re.finditer(text):
                  sel = m.group('sel')
                  body = m.group('body')
                  sl = sel.lower()
                  if not any(t in sl for t in target_tokens):
                      continue
                  if any(t in sl for t in symbol_tokens):
                      continue
                  for v in ls_re.findall(body):
                      if v.strip().lower() != '1.1px':
                          problems.append(f'{path}: {sel.strip()} -> {v.strip()}')
          if problems:
              raise SystemExit('Remaining action letter-spacing conflicts:\n' + '\n'.join(problems))

          if total_changes == 0:
              raise SystemExit('No existing rules required adjustment')

          # Nur vorhandene Cache-Referenzen aktualisieren.
          token = 'action-letterspacing-1-1-clean-20260913-1'
          for path in Path('.').rglob('*.html'):
              h = path.read_text()
              nh = h
              nh = re.sub(r'(assets/global\.css\?v=)[^"\']+', rf'\1{token}', nh)
              nh = re.sub(r'(\.\./assets/global\.css\?v=)[^"\']+', rf'\1{token}', nh)
              nh = re.sub(r'(\.\./\.\./assets/global\.css\?v=)[^"\']+', rf'\1{token}', nh)
              nh = re.sub(r'(assets/unified-design\.css\?v=)[^"\']+', rf'\1{token}', nh)
              nh = re.sub(r'(\.\./assets/unified-design\.css\?v=)[^"\']+', rf'\1{token}', nh)
              nh = re.sub(r'(\.\./\.\./assets/unified-design\.css\?v=)[^"\']+', rf'\1{token}', nh)
              nh = re.sub(r'(assets/index-CZfMKxM_\.css\?v=)[^"\']+', rf'\1{token}', nh)
              nh = re.sub(r'(\.\./assets/index-CZfMKxM_\.css\?v=)[^"\']+', rf'\1{token}', nh)
              nh = re.sub(r'(\.\./\.\./assets/index-CZfMKxM_\.css\?v=)[^"\']+', rf'\1{token}', nh)
              nh = re.sub(r'(assets/contact\.css\?v=)[^"\']+', rf'\1{token}', nh)
              nh = re.sub(r'(\.\./assets/contact\.css\?v=)[^"\']+', rf'\1{token}', nh)
              nh = re.sub(r'(assets/article-detail\.css\?v=)[^"\']+', rf'\1{token}', nh)
              nh = re.sub(r'(\.\./\.\./assets/article-detail\.css\?v=)[^"\']+', rf'\1{token}', nh)
              if nh != h:
                  path.write_text(nh)

          # Import der bestehenden Basisdatei cache-busten.
          unified = Path('assets/unified-design.css')
          u = unified.read_text()
          u = re.sub(r"(unified-design-base-20260907\.css\?v=)[^')\"]+", rf'\1{token}', u, count=1)
          unified.write_text(u)
          PY
      - name: Commit und temporaeren Workflow entfernen
        run: |
          rm -f .github/workflows/action-letterspacing-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'No changes'; exit 1; }
          git commit -m "Aktionsschriften: Buchstabenabstand wie Bereichstitel bereinigen"
          git push
