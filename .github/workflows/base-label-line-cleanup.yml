name: Base label line cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/base-label-line-cleanup.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean redundant label and line values
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/unified-design-base-20260907.css')
          s=p.read_text(encoding='utf-8')
          redundant='/* Kleine Bereichstitel: ursprüngliche Abstände wiederherstellen */\nhtml body .section-label{\n  margin:0 0 30px!important;\n}\n\n'
          if redundant not in s: raise SystemExit('redundant label block missing')
          s=s.replace(redundant,'',1)
          s=s.replace('top:calc(100% + 11px)!important;','top:calc(100% + var(--short-line-gap))!important;')
          s=s.replace('width:48px!important;','width:var(--short-line-width)!important;')
          s=s.replace('max-width:48px!important;','max-width:var(--short-line-width)!important;')
          s=s.replace('background:#868279!important;','background:var(--short-line-color)!important;')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/unified-design-base-20260907.css
          git commit -m "Redundante Labelregel entfernen und Kurzlinien tokenisieren"
          git rm .github/workflows/base-label-line-cleanup.yml
          git commit -m "Temporären Basislinien-Workflow entfernen"
          git push
