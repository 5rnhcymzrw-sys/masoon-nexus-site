<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MASOON TREUHAND – Designentwurf 1</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#fff;overflow:hidden}
iframe{display:block;width:100%;height:100%;border:0;background:#fff}
</style>
</head>
<body>
<iframe id="site" src="./index.html" title="MASOON TREUHAND Designentwurf 1"></iframe>
<script>
const frame=document.getElementById('site');
frame.addEventListener('load',()=>{
  const d=frame.contentDocument;
  if(!d)return;
  const s=d.createElement('style');
  s.id='design-entwurf-1';
  s.textContent=`
/* DESIGNENTWURF 1 – nur bestehende MASOON-Farben, keine Layout-/Inhaltsänderung */
html body.site-light-page main.home>.home-values{
  background:
    linear-gradient(180deg,rgba(243,232,212,.18) 0%,rgba(255,255,255,.96) 42%,rgba(199,203,211,.10) 100%)!important;
}
html body.site-light-page main.home>.home-values .home-values__item{
  border:1px solid transparent!important;
  border-image:linear-gradient(110deg,#f3e8d4 0%,#e8e5df 38%,#c7cbd3 66%,#8d96a8 100%) 1!important;
  box-shadow:none!important;
}
html body.site-light-page main.home>.home-values .home-values__item:nth-child(1){background:rgba(255,255,255,.82)!important}
html body.site-light-page main.home>.home-values .home-values__item:nth-child(2){background:rgba(243,232,212,.22)!important}
html body.site-light-page main.home>.home-values .home-values__item:nth-child(3){background:rgba(232,229,223,.30)!important}
html body.site-light-page main.home>.home-values .home-values__item:nth-child(4){background:rgba(199,203,211,.16)!important}
html body.site-light-page main.home>.home-values .home-values__item:nth-child(5){background:rgba(255,255,255,.82)!important}
html body.site-light-page main.home>.home-values .home-values__item:nth-child(6){background:rgba(141,150,168,.10)!important}
html body.site-light-page main.home>.home-values .home-values__item .service-number{color:#868279!important}

/* Unternehmensbereich bleibt in seiner bestehenden Gestaltung; insbesondere vorhandene Beige-Fläche hinter dem Foto bleibt unberührt. */

html body.site-light-page main.home>.home-paths{
  background:
    linear-gradient(115deg,rgba(243,232,212,.13) 0%,rgba(232,229,223,.16) 36%,rgba(199,203,211,.14) 68%,rgba(141,150,168,.08) 100%)!important;
}
html body.site-light-page main.home>.home-paths .home-paths__grid>a{
  background:rgba(255,255,255,.48)!important;
  box-shadow:none!important;
}
html body.site-light-page main.home>.home-paths .home-paths__grid>a:nth-child(1){background:rgba(243,232,212,.18)!important}
html body.site-light-page main.home>.home-paths .home-paths__grid>a:nth-child(2){background:rgba(232,229,223,.24)!important}
html body.site-light-page main.home>.home-paths .home-paths__grid>a:nth-child(3){background:rgba(199,203,211,.16)!important}

html body.site-light-page main.home>section.home-contact-band{
  background:
    linear-gradient(110deg,rgba(243,232,212,.34) 0%,rgba(232,229,223,.26) 38%,rgba(199,203,211,.22) 66%,rgba(141,150,168,.16) 100%)!important;
}

/* bestehende Verlaufslinien und Rahmen bleiben dieselbe verbindliche Palette */
html body.site-light-page main.home .home-action-button::before,
html body.site-light-page main.home section.home-paths .home-paths__grid>a{
  border-image-source:linear-gradient(110deg,#f3e8d4 0%,#e8e5df 38%,#c7cbd3 66%,#8d96a8 100%)!important;
}
`;
  d.head.appendChild(s);
});
</script>
</body>
</html>
