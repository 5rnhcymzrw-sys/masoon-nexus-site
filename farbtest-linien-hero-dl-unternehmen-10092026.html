<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MASOON TREUHAND – Originalseiten Test</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#111;color:#fff}
  .bar{position:fixed;z-index:50;top:0;left:0;right:0;min-height:104px;padding:12px 16px;background:#111;border-bottom:1px solid #333;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .tabs,.controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .label{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#aaa;margin-right:3px}
  button{appearance:none;border:1px solid #555;background:#1d1d1d;color:#fff;padding:9px 11px;cursor:pointer;font-size:11px}
  button:hover{background:#292929}
  button.active{background:#fff;color:#111;border-color:#fff}
  .note{margin-left:auto;font-size:10px;color:#aaa;white-space:nowrap}
  iframe{position:fixed;top:104px;left:0;width:100%;height:calc(100% - 104px);border:0;background:#fff}
  @media(max-width:1080px){.bar{min-height:150px}.note{width:100%;margin-left:0}iframe{top:150px;height:calc(100% - 150px)}}
</style>
</head>
<body>
<div class="bar">
  <div class="tabs">
    <span class="label">Originalseite</span>
    <button data-view="hero" class="active">Startseite Hero</button>
    <button data-view="homeDL">Startseite DL</button>
    <button data-view="company">Unternehmen Werte</button>
    <button data-view="services">DL Hauptseite</button>
  </div>
  <div id="controls" class="controls"></div>
  <div class="note">Originalseiten werden geladen. Änderungen gelten nur in dieser Testansicht.</div>
</div>
<iframe id="site" title="Originalseiten-Test"></iframe>
<script>
const frame=document.getElementById('site');
const controls=document.getElementById('controls');
const tabs=[...document.querySelectorAll('[data-view]')];

const state={
  hero:{gradient:false,line:true,blur:false},
  homeDL:{line:true,blur:true},
  company:{line:true,blur:true},
  services:{line:true,blur:true}
};

const views={
  hero:{url:'./index.html',scroll:'.home-hero'},
  homeDL:{url:'./index.html',scroll:'.home-values'},
  company:{url:'./unternehmen/index.html',scroll:'.company-values-section'},
  services:{url:'./dienstleistungen/index.html',scroll:'.services-section'}
};

let current='hero';

function mk(label,key,value){
  const b=document.createElement('button');
  b.textContent=label;
  if(state[current][key]===value)b.classList.add('active');
  b.addEventListener('click',()=>{
    state[current][key]=value;
    renderControls();
    applyTest();
  });
  return b;
}

function addGroup(name,key){
  const l=document.createElement('span');
  l.className='label';
  l.textContent=name;
  if(controls.childNodes.length)l.style.marginLeft='8px';
  controls.appendChild(l);
  controls.appendChild(mk('AUS',key,false));
  controls.appendChild(mk('AN',key,true));
}

function renderControls(){
  controls.innerHTML='';
  if(current==='hero')addGroup('Verlauf','gradient');
  addGroup('Linie','line');
  addGroup('Weichzeichnung','blur');
}

function cssForCurrent(){
  const fill='linear-gradient(to right in oklab,rgba(243,232,212,.11) 0%,rgba(232,229,223,.11) 36%,rgba(199,203,211,.11) 68%,rgba(141,150,168,.11) 100%)';
  const borderAll='linear-gradient(110deg,#f3e8d4 0%,#e8e5df 38%,#c7cbd3 66%,#8d96a8 100%) 1';
  const borderLeft='linear-gradient(110deg,#f3e8d4 0%,#e8e5df 100%) 1';
  const borderMid='linear-gradient(110deg,#e8e5df 0%,#c7cbd3 100%) 1';
  const borderRight='linear-gradient(110deg,#c7cbd3 0%,#8d96a8 100%) 1';
  let css='';

  if(current==='hero'){
    const s='html body.page-home.site-light-page main.home section.home-hero .home-hero__copy::before';
    css+=s+'{content:""!important;display:block!important;';
    css+=state.hero.gradient
      ? 'background:'+fill+'!important;background-color:transparent!important;'
      : 'background:#fff!important;background-image:none!important;';
    css+=state.hero.line
      ? 'border:1px solid transparent!important;border-image:'+borderAll+'!important;'
      : 'border:1px solid transparent!important;border-image:none!important;border-color:transparent!important;';
    css+=state.hero.blur
      ? '-webkit-backdrop-filter:blur(32px)!important;backdrop-filter:blur(32px)!important;'
      : '-webkit-backdrop-filter:none!important;backdrop-filter:none!important;';
    css+='}';
    return css;
  }

  let base='';
  if(current==='homeDL')base='html body.page-home.site-light-page main.home .home-values__items>.home-values__item';
  if(current==='company')base='html body.page-company.site-light-page main.page-main .company-values-grid>.company-value-card';
  if(current==='services')base='html body.page-services.site-light-page main.services-main .services-section .services-grid>.service-card';

  css+=base+'{';
  if(state[current].line){
    css+='border-width:1px!important;border-style:solid!important;border-color:transparent!important;';
  }else{
    css+='border-width:1px!important;border-style:solid!important;border-color:transparent!important;border-image:none!important;';
  }
  css+=state[current].blur
    ? '-webkit-backdrop-filter:blur(32px)!important;backdrop-filter:blur(32px)!important;'
    : '-webkit-backdrop-filter:none!important;backdrop-filter:none!important;';
  css+='}';

  if(state[current].line){
    css+=base+':nth-child(3n+1){border-image:'+borderLeft+'!important;}';
    css+=base+':nth-child(3n+2){border-image:'+borderMid+'!important;}';
    css+=base+':nth-child(3n){border-image:'+borderRight+'!important;}';
  }

  return css;
}

function applyTest(){
  try{
    const doc=frame.contentDocument;
    if(!doc||!doc.head)return;
    let style=doc.getElementById('masoon-original-test-overrides');
    if(!style){
      style=doc.createElement('style');
      style.id='masoon-original-test-overrides';
      doc.head.appendChild(style);
    }
    style.textContent=cssForCurrent();
  }catch(e){console.error(e);}
}

function focusTarget(){
  try{
    const doc=frame.contentDocument;
    const el=doc.querySelector(views[current].scroll);
    if(!el)return;
    if(current==='hero')frame.contentWindow.scrollTo(0,0);
    else el.scrollIntoView({block:'center',behavior:'auto'});
  }catch(e){console.error(e);}
}

function loadView(view){
  current=view;
  tabs.forEach(b=>b.classList.toggle('active',b.dataset.view===view));
  renderControls();
  frame.onload=()=>{
    applyTest();
    setTimeout(()=>{applyTest();focusTarget();},150);
    setTimeout(()=>{applyTest();focusTarget();},650);
  };
  const sep=views[view].url.includes('?')?'&':'?';
  frame.src=views[view].url+sep+'originaltest='+Date.now();
}

tabs.forEach(b=>b.addEventListener('click',()=>loadView(b.dataset.view)));
loadView('hero');
</script>
</body>
</html>
