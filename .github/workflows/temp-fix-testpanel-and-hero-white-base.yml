name: temp fix testpanel and hero white base
on:
  push:
    paths:
      - '.github/workflows/temp-fix-testpanel-and-hero-white-base.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix existing test panel and Hero white backing
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('farbtest-alle-kaesten-linien-10092026.html')
          s=p.read_text(encoding='utf-8')

          old=".test-panel{position:fixed;left:14px;bottom:14px;z-index:9999;width:255px;max-width:calc(100vw - 28px);max-height:78vh;overflow:auto;padding:10px;background:rgba(255,255,255,.97);border:1px solid #cfcfcf;box-shadow:0 4px 18px rgba(0,0,0,.12)}"
          new=".test-panel{position:fixed;left:auto;right:10px;top:10px;bottom:auto;z-index:9999;width:205px;max-width:calc(100vw - 20px);max-height:72vh;overflow:auto;padding:8px;background:rgba(255,255,255,.97);border:1px solid #cfcfcf;box-shadow:0 4px 18px rgba(0,0,0,.12)}"
          if s.count(old)!=1: raise SystemExit(f'test-panel match count {s.count(old)}')
          s=s.replace(old,new,1)

          old="@media(max-width:560px){.test-panel{left:8px;bottom:8px;width:255px;max-width:calc(100vw - 16px);max-height:72vh}}"
          new="@media(max-width:560px){.test-panel{left:auto;right:6px;top:6px;bottom:auto;width:190px;max-width:calc(100vw - 12px);max-height:68vh}}"
          if s.count(old)!=1: raise SystemExit(f'mobile test-panel match count {s.count(old)}')
          s=s.replace(old,new,1)

          old="function ensureHeroBackplate(d){const hero=d.querySelector('.home-hero__copy');if(!hero)return;let b=hero.querySelector(':scope > .masoon-hero-white-backplate');if(!b){b=d.createElement('div');b.className='masoon-hero-white-backplate';b.setAttribute('aria-hidden','true');hero.prepend(b)}requestAnimationFrame(()=>syncHeroBackplate(d));setTimeout(()=>syncHeroBackplate(d),80)}"
          new="function ensureHeroBackplate(d){const hero=d.querySelector('.home-hero__copy');if(!hero)return;let base=hero.querySelector(':scope > .masoon-hero-base-backplate');if(!base){base=d.createElement('div');base.className='masoon-hero-base-backplate';base.setAttribute('aria-hidden','true');hero.prepend(base)}let b=hero.querySelector(':scope > .masoon-hero-white-backplate');if(!b){b=d.createElement('div');b.className='masoon-hero-white-backplate';b.setAttribute('aria-hidden','true');base.after(b)}requestAnimationFrame(()=>syncHeroBackplate(d));setTimeout(()=>syncHeroBackplate(d),80)}"
          if s.count(old)!=1: raise SystemExit(f'ensureHeroBackplate match count {s.count(old)}')
          s=s.replace(old,new,1)

          old="function syncHeroBackplate(d){const hero=d.querySelector('.home-hero__copy'),b=hero?.querySelector(':scope > .masoon-hero-white-backplate');if(!hero||!b)return;const p=d.defaultView.getComputedStyle(hero,'::before');const left=parseFloat(p.left)||0,top=parseFloat(p.top)||0,width=parseFloat(p.width)||hero.getBoundingClientRect().width,height=parseFloat(p.height)||hero.getBoundingClientRect().height;setImp(b,'left',`${left-38}px`);setImp(b,'top',`${top+height*.48}px`);setImp(b,'width',`${width*.78}px`);setImp(b,'height',`${height*.66}px`);setImp(b,'right','auto');setImp(b,'bottom','auto')}"
          new="function syncHeroBackplate(d){const hero=d.querySelector('.home-hero__copy'),b=hero?.querySelector(':scope > .masoon-hero-white-backplate'),base=hero?.querySelector(':scope > .masoon-hero-base-backplate');if(!hero||!b||!base)return;const p=d.defaultView.getComputedStyle(hero,'::before');const left=parseFloat(p.left)||0,top=parseFloat(p.top)||0,width=parseFloat(p.width)||hero.getBoundingClientRect().width,height=parseFloat(p.height)||hero.getBoundingClientRect().height;const accentLeft=left-38,accentTop=top+height*.48,accentWidth=width*.78,accentHeight=height*.66;for(const el of [b,base]){setImp(el,'left',`${accentLeft}px`);setImp(el,'top',`${accentTop}px`);setImp(el,'width',`${accentWidth}px`);setImp(el,'height',`${accentHeight}px`);setImp(el,'right','auto');setImp(el,'bottom','auto')}}"
          if s.count(old)!=1: raise SystemExit(f'syncHeroBackplate match count {s.count(old)}')
          s=s.replace(old,new,1)

          old="function heroCss(s){const bg=s.color==='off'?'transparent':companyAccentGradient(s.color),separate=s.display==='separate',tinted=s.display==='tinted',front=tinted?bg:'#fff',frontSoft=tinted&&s.soft==='on'?'blur(32px)':'none';return`html body.page-home.site-light-page main.home section.home-hero .home-hero__copy{position:relative!important;isolation:isolate!important}html body.page-home.site-light-page main.home section.home-hero .home-hero__copy>.masoon-hero-white-backplate{display:${separate?'block':'none'}!important;position:absolute!important;box-sizing:border-box!important;background:${bg}!important;background-size:100% 100%!important;background-position:0 0!important;background-repeat:no-repeat!important;border:0!important;box-shadow:none!important;-webkit-backdrop-filter:${separate&&s.soft==='on'?'blur(32px)':'none'}!important;backdrop-filter:${separate&&s.soft==='on'?'blur(32px)':'none'}!important;pointer-events:none!important;z-index:1!important}html body.page-home.site-light-page main.home section.home-hero .home-hero__copy::before{background:${front}!important;background-image:${tinted?bg:'none'}!important;background-size:100% 100%!important;background-position:0 0!important;background-repeat:no-repeat!important;border:${s.lines==='on'?'1px solid transparent':'0'}!important;border-image:${s.lines==='on'?borderFull:'none'}!important;border-color:transparent!important;box-shadow:none!important;-webkit-backdrop-filter:${frontSoft}!important;backdrop-filter:${frontSoft}!important;z-index:2!important}html body.page-home.site-light-page main.home section.home-hero .home-hero__copy>:not(.masoon-hero-white-backplate){position:relative;z-index:3}`}"
          new="function heroCss(s){const bg=s.color==='off'?'transparent':companyAccentGradient(s.color),separate=s.display==='separate',tinted=s.display==='tinted';return`html body.page-home.site-light-page main.home section.home-hero .home-hero__copy{position:relative!important;isolation:isolate!important}html body.page-home.site-light-page main.home section.home-hero .home-hero__copy>.masoon-hero-base-backplate{display:${separate?'block':'none'}!important;position:absolute!important;box-sizing:border-box!important;background:#fff!important;border:0!important;box-shadow:none!important;pointer-events:none!important;z-index:0!important}html body.page-home.site-light-page main.home section.home-hero .home-hero__copy>.masoon-hero-white-backplate{display:${separate?'block':'none'}!important;position:absolute!important;box-sizing:border-box!important;background-color:#fff!important;background-image:${bg}!important;background-size:100% 100%!important;background-position:0 0!important;background-repeat:no-repeat!important;border:0!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;pointer-events:none!important;z-index:1!important}html body.page-home.site-light-page main.home section.home-hero .home-hero__copy::before{background-color:#fff!important;background-image:${tinted?bg:'none'}!important;background-size:100% 100%!important;background-position:0 0!important;background-repeat:no-repeat!important;border:${s.lines==='on'?'1px solid transparent':'0'}!important;border-image:${s.lines==='on'?borderFull:'none'}!important;border-color:transparent!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;z-index:2!important}html body.page-home.site-light-page main.home section.home-hero .home-hero__copy>:not(.masoon-hero-white-backplate):not(.masoon-hero-base-backplate){position:relative;z-index:3}`}"
          if s.count(old)!=1: raise SystemExit(f'heroCss match count {s.count(old)}')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add farbtest-alle-kaesten-linien-10092026.html
          git diff --cached --check
          git commit -m 'Fix test panel position and Hero white backing'
          git push
