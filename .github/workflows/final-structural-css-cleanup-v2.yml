name: Final structural CSS cleanup v2
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/final-structural-css-cleanup-v2.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/final-structural-css-cleanup.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/unified-design.css
          git commit -m "Rechteseiten und letzte Spezifitätsreste konsolidieren"
          git push
