name: Move company values global
on:
  push:
    branches: [main]
    paths: ['.github/workflows/move-company-values-global.yml']
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move company value card block
        run: |
          python3 <<'PY'
          from pathlib import Path
          src = Path('assets/unified-design.css')
          dst = Path('assets/global.css')
          s = src.read_text(encoding='utf-8')
          g = dst.read_text(encoding='utf-8')
          start = s.index('html body.page-company .company-values-section .section-heading')
          end_marker = '@media(min-width:801px){html body.page-company .company-values-section{padding-top:52.773px!important}}'
          end = s.index(end_marker, start) + len(end_marker)
          block = s[start:end]
          assert '.company-value-card' in block and '.company-values-grid' in block
          src.write_text(s[:start] + s[end:], encoding='utf-8')
          dst.write_text(g.rstrip() + '\n\n/* Unternehmenswerte – globale Kachelkomponente */\n' + block + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/global.css assets/unified-design.css
          git commit -m "Unternehmenswerte-Kacheln global zentralisieren"
          git rm .github/workflows/move-company-values-global.yml
          git commit -m "Temporären Werte-Kachel-Workflow entfernen"
          git push