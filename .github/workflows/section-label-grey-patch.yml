name: Section label grey patch

on:
  push:
    paths:
      - '.github/workflows/section-label-grey-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update existing section label rule
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('assets/unified-design.css')
          text = path.read_text()
          old = "html body .section-label{\n  gap:10px!important;\n}"
          new = "html body .section-label{\n  gap:10px!important;\n  color:#777777!important;\n  letter-spacing:1.1px!important;\n}"
          if text.count(old) != 1:
              raise SystemExit('Existing global section-label rule not found exactly once')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/section-label-grey-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/unified-design.css .github/workflows/section-label-grey-patch.yml
          git commit -m "Bereichstitel global grau mit 1.1px Buchstabenabstand"
          git push