<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MASOON TREUHAND – Hero Bildvarianten</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}
#bar{position:fixed;z-index:99999;left:0;right:0;top:0;height:58px;background:#111;color:#fff;display:flex;align-items:center;gap:8px;padding:0 16px;font:12px Arial,sans-serif;box-sizing:border-box}
#bar strong{margin-right:10px;font-weight:600;letter-spacing:.04em}
#bar button{border:1px solid #555;background:#222;color:#fff;height:32px;min-width:34px;padding:0 10px;cursor:pointer}
#bar button.active{background:#fff;color:#111;border-color:#fff}
#site{position:absolute;left:0;right:0;top:58px;bottom:0;width:100%;height:calc(100% - 58px);border:0;background:#fff}
</style>
</head>
<body>
<div id="bar"><strong>Hero-Varianten</strong><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button><button data-v="4">4</button><button data-v="5">5</button><button data-v="6">6</button><button data-v="7">7</button><button data-v="8">8</button><button data-v="9">9</button><button data-v="10">10</button></div>
<iframe id="site" src="../index.html"></iframe>
<script>
const presets={
1:`
.home-hero{background:#eeeae4!important}
.home-hero__portrait{clip-path:none!important;left:50%!important;right:0!important;width:50%!important}
.home-hero__portrait-image{width:100%!important;inset:0!important;object-fit:cover!important;object-position:50% 50%!important}
.home-hero__copy::before{background:#fff!important;opacity:1!important}
`,
2:`
.home-hero{background:linear-gradient(105deg,#e9e5de 0%,#f1efeb 46%,#fff 72%)!important}
.home-hero__portrait{clip-path:none!important;left:54%!important;right:0!important;width:46%!important}
.home-hero__portrait-image{width:100%!important;inset:0!important;object-fit:cover!important;object-position:48% 50%!important}
.home-hero__copy::before{background:rgba(255,255,255,.94)!important}
`,
3:`
.home-hero{background:#f1efeb!important}
.home-hero__portrait{clip-path:inset(7% 4% 7% 0)!important;left:47%!important;right:4%!important;width:49%!important}
.home-hero__portrait-image{width:100%!important;inset:0!important;object-fit:cover!important;object-position:52% 50%!important}
.home-hero__copy::before{background:#fff!important}
`,
4:`
.home-hero{background:linear-gradient(90deg,#e9e5de 0 38%,#f7f6f3 38% 100%)!important}
.home-hero__portrait{clip-path:none!important;left:45%!important;right:0!important;width:55%!important}
.home-hero__portrait-image{width:100%!important;inset:0!important;object-fit:cover!important;object-position:55% 50%!important;filter:saturate(.88) contrast(.96)!important}
.home-hero__copy::before{background:rgba(255,255,255,.9)!important}
`,
5:`
.home-hero{background:linear-gradient(115deg,#e7e2da 0%,#f4f2ee 52%,#fff 52%)!important}
.home-hero__portrait{clip-path:polygon(15% 0,100% 0,100% 100%,0 100%)!important;left:44%!important;right:0!important;width:56%!important}
.home-hero__portrait-image{width:100%!important;inset:0!important;object-fit:cover!important;object-position:55% 50%!important}
.home-hero__copy::before{background:#fff!important}
`,
6:`
.home-hero{background:#ece8e1!important}
.home-hero__portrait{clip-path:none!important;left:52%!important;right:3%!important;width:45%!important;top:7%!important;bottom:7%!important;height:auto!important}
.home-hero__portrait-image{width:100%!important;height:100%!important;inset:0!important;object-fit:cover!important;object-position:50% 50%!important}
.home-hero__copy::before{background:rgba(255,255,255,.98)!important}
`,
7:`
.home-hero{background:linear-gradient(105deg,#e9e5de 0%,#f1efeb 44%,#fff 72%)!important}
.home-hero__portrait{clip-path:none!important;left:39%!important;right:0!important;width:61%!important}
.home-hero__portrait-image{width:100%!important;inset:0!important;object-fit:cover!important;object-position:58% 50%!important}
.home-hero__copy::before{background:rgba(255,255,255,.86)!important;backdrop-filter:blur(3px)!important}
`,
8:`
.home-hero{background:#f5f3ef!important}
.home-hero__portrait{clip-path:none!important;left:50%!important;right:0!important;width:50%!important}
.home-hero__portrait-image{width:100%!important;inset:0!important;object-fit:cover!important;object-position:50% 50%!important;filter:grayscale(.18) sepia(.05)!important}
.home-hero__copy::before{background:linear-gradient(90deg,#fff 0%,rgba(255,255,255,.94) 75%,rgba(255,255,255,.72) 100%)!important}
`,
9:`
.home-hero{background:linear-gradient(90deg,#eee9e2 0%,#f7f5f2 54%,#fff 54%)!important}
.home-hero__portrait{clip-path:inset(0 0 0 7%)!important;left:48%!important;right:0!important;width:52%!important}
.home-hero__portrait-image{width:100%!important;inset:0!important;object-fit:cover!important;object-position:52% 50%!important}
.home-hero__copy::before{background:rgba(255,255,255,.96)!important}
`,
10:`
.home-hero{background:linear-gradient(110deg,#e8e3dc 0%,#f1efeb 36%,#c7cbd3 100%)!important}
.home-hero__portrait{clip-path:none!important;left:53%!important;right:3%!important;width:44%!important;top:6%!important;bottom:6%!important;height:auto!important}
.home-hero__portrait-image{width:100%!important;height:100%!important;inset:0!important;object-fit:cover!important;object-position:50% 50%!important}
.home-hero__copy::before{background:#fff!important}
`
};
const frame=document.getElementById('site');
let current=1;
function apply(v){
 current=+v;
 document.querySelectorAll('#bar button').forEach(b=>b.classList.toggle('active',+b.dataset.v===current));
 const d=frame.contentDocument||frame.contentWindow.document;
 let s=d.getElementById('hero-image-variant-test');
 if(!s){s=d.createElement('style');s.id='hero-image-variant-test';d.head.appendChild(s)}
 s.textContent=`
.home-hero__gradient-panel,.home-hero__text-surface{visibility:hidden!important}
.home-hero::before,.home-hero::after{content:none!important;display:none!important}
@media(min-width:801px){${presets[current]}}
`;
 try{frame.contentWindow.scrollTo(0,0)}catch(e){}
}
frame.addEventListener('load',()=>apply(1));
document.querySelectorAll('#bar button').forEach(b=>b.addEventListener('click',()=>apply(b.dataset.v)));
</script>
</body>
</html>
