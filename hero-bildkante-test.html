<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>MASOON TREUHAND – Hero Bildkante Test</title>
<style>
html,body{margin:0;height:100%;background:#111;font-family:Arial,sans-serif}
body{display:grid;grid-template-rows:58px 1fr;overflow:hidden}
.tester{display:flex;align-items:center;gap:7px;padding:0 14px;background:#f3f3f3;border-bottom:1px solid #ccc;box-sizing:border-box;z-index:10;overflow-x:auto}
.tester strong{font-size:13px;margin-right:6px;font-weight:600;white-space:nowrap}
.tester button{appearance:none;border:1px solid #c9c9c9;background:#fff;padding:9px 12px;font-size:12px;cursor:pointer;white-space:nowrap}
.tester button.active{background:#111;color:#fff;border-color:#111}
iframe{width:100%;height:100%;border:0;background:#fff;display:block}
</style>
</head>
<body>
<div class="tester">
<strong>Bildkante vergleichen</strong>
<button data-v="original" class="active">Original</button>
<button data-v="line">1 · Feine Linie</button>
<button data-v="soft">2 · Linie + weicher Fade</button>
<button data-v="shadow">3 · Helle Kante + Schatten</button>
<button data-v="glass">4 · Schmale Glasfuge</button>
<button data-v="cut">5 · Editorial-Kante</button>
</div>
<iframe id="site" src="./index.html"></iframe>
<script>
const frame=document.getElementById('site');
const buttons=[...document.querySelectorAll('button[data-v]')];
let current='original';
const testCSS=`
@media(min-width:801px){
  html[class*="hero-edge-"] body .home-hero{position:relative!important}
  html[class*="hero-edge-"] body .home-hero .home-hero__content::after{
    content:""!important;
    position:absolute!important;
    top:50%!important;
    left:calc(max(32px,(100vw - 1227px)/2) + min(26vw - 16.64px,319.02px) - max(32px,(100vw - 1227px)/2))!important;
    transform:translateY(-50%)!important;
    height:min(32.625vw,calc((100svh - 116px)*.68),600px)!important;
    pointer-events:none!important;
    z-index:5!important;
  }

  html.hero-edge-line body .home-hero .home-hero__content::after{
    width:1px!important;
    background:rgba(96,92,85,.42)!important;
  }

  html.hero-edge-soft body .home-hero .home-hero__content::after{
    width:28px!important;
    background:linear-gradient(90deg,rgba(96,92,85,.28) 0,rgba(96,92,85,.10) 2px,rgba(255,255,255,.16) 8px,rgba(255,255,255,0) 100%)!important;
  }

  html.hero-edge-shadow body .home-hero .home-hero__content::after{
    width:22px!important;
    border-left:1px solid rgba(232,229,223,.72)!important;
    background:linear-gradient(90deg,rgba(23,23,21,.12),rgba(23,23,21,0))!important;
  }

  html.hero-edge-glass body .home-hero .home-hero__content::after{
    width:18px!important;
    background:rgba(255,255,255,.16)!important;
    border-left:1px solid rgba(255,255,255,.52)!important;
    border-right:1px solid rgba(96,92,85,.10)!important;
    backdrop-filter:blur(8px)!important;
    -webkit-backdrop-filter:blur(8px)!important;
  }

  html.hero-edge-cut body .home-hero .home-hero__content::after{
    width:36px!important;
    background:linear-gradient(90deg,rgba(232,229,223,.76) 0 1px,transparent 1px 13px,rgba(96,92,85,.16) 13px 14px,transparent 14px 100%)!important;
  }
}
`;
function apply(v){
  const d=frame.contentDocument;if(!d)return;
  [...d.documentElement.classList].filter(c=>c.startsWith('hero-edge-')).forEach(c=>d.documentElement.classList.remove(c));
  let st=d.getElementById('hero-edge-test-styles');
  if(!st){st=d.createElement('style');st.id='hero-edge-test-styles';st.textContent=testCSS;d.head.appendChild(st)}
  if(v!=='original')d.documentElement.classList.add('hero-edge-'+v);
  buttons.forEach(b=>b.classList.toggle('active',b.dataset.v===v));
  current=v;
}
frame.addEventListener('load',()=>apply(current));
buttons.forEach(b=>b.addEventListener('click',()=>apply(b.dataset.v)));
</script>
</body>
</html>
