name: Unify headings

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Unify global heading typography'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply global heading typography
        shell: python
        run: |
          from pathlib import Path

          style = '''
          <style id="global-heading-system">
            .home-hero h1,
            .home-values .section-heading h2,
            .expectation-compass__heading h2,
            .home-paths__heading h2,
            .home-contact-band h2,
            .section-heading h1,
            .section-heading h2,
            .page-hero h1,
            .contact-section h1,
            .legal-page h1,
            .article-detail h1,
            .service-page__heading h1,
            .services-table-heading h2,
            .service-principles h2,
            .process-details h2,
            .knowledge-note h2,
            .mandate-faq__heading h2 {
              font-family: var(--font-cormorant), Georgia, serif !important;
              font-size: 60px !important;
              font-weight: 400 !important;
              line-height: 1.05 !important;
              letter-spacing: -.02em !important;
              margin-top: 0 !important;
              margin-bottom: 0 !important;
              max-width: 650px !important;
            }

            .section-label,
            .expectation-compass__heading .section-label,
            .mandate-faq__heading .section-label,
            .process-section .section-heading .section-label {
              margin-bottom: 30px !important;
            }

            /* Startseite: Zusammenarbeit sauber als Editorial-Raster */
            .expectation-editorial {
              display: grid !important;
              grid-template-columns: 390px minmax(0, 1fr) !important;
              column-gap: 110px !important;
              row-gap: 0 !important;
              align-items: start !important;
              padding: 118px max(32px, calc((100vw - 1320px) / 2)) 120px !important;
            }

            .expectation-editorial .expectation-compass__heading {
              grid-column: 1 !important;
              grid-row: 1 !important;
              width: 100% !important;
              max-width: 390px !important;
              margin: 0 !important;
            }

            .expectation-editorial .expectation-editorial__grid {
              grid-column: 2 !important;
              grid-row: 1 !important;
              width: 100% !important;
              max-width: none !important;
              margin: 112px 0 0 !important;
              display: grid !important;
              grid-template-columns: repeat(2, minmax(260px, 1fr)) !important;
              gap: 64px 72px !important;
            }

            .expectation-editorial .expectation-editorial__item {
              max-width: 360px !important;
              margin: 0 !important;
            }

            .expectation-editorial .expectation-editorial__more {
              grid-column: 2 !important;
              grid-row: 2 !important;
              width: 100% !important;
              max-width: none !important;
              margin: 58px 0 0 !important;
              display: block !important;
            }

            .expectation-editorial .expectation-editorial__more .text-link {
              display: inline-block !important;
              justify-self: auto !important;
            }

            @media (max-width: 1050px) {
              .expectation-editorial {
                grid-template-columns: 330px minmax(0, 1fr) !important;
                column-gap: 64px !important;
              }
              .expectation-editorial .expectation-compass__heading {
                max-width: 330px !important;
              }
              .expectation-editorial .expectation-editorial__grid {
                grid-template-columns: 1fr !important;
                gap: 38px !important;
                margin-top: 88px !important;
              }
            }

            @media (max-width: 800px) {
              .home-hero h1,
              .home-values .section-heading h2,
              .expectation-compass__heading h2,
              .home-paths__heading h2,
              .home-contact-band h2,
              .section-heading h1,
              .section-heading h2,
              .page-hero h1,
              .contact-section h1,
              .legal-page h1,
              .article-detail h1,
              .service-page__heading h1,
              .services-table-heading h2,
              .service-principles h2,
              .process-details h2,
              .knowledge-note h2,
              .mandate-faq__heading h2 {
                font-size: 48px !important;
                line-height: 1.05 !important;
              }

              .expectation-editorial {
                grid-template-columns: 1fr !important;
                row-gap: 48px !important;
                padding: 82px 24px 90px !important;
              }
              .expectation-editorial .expectation-compass__heading,
              .expectation-editorial .expectation-editorial__grid,
              .expectation-editorial .expectation-editorial__more {
                grid-column: 1 !important;
                grid-row: auto !important;
                width: 100% !important;
                max-width: none !important;
                margin: 0 !important;
              }
              .expectation-editorial .expectation-editorial__grid {
                grid-template-columns: 1fr !important;
                gap: 38px !important;
              }
              .expectation-editorial .expectation-editorial__more {
                margin-top: 6px !important;
              }
            }
          </style>
          '''

          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              if 'id="global-heading-system"' in text:
                  start = text.index('<style id="global-heading-system">')
                  end = text.index('</style>', start) + len('</style>')
                  text = text[:start] + style.strip() + text[end:]
              elif '</head>' in text:
                  text = text.replace('</head>', style + '</head>', 1)
              path.write_text(text, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '**/*.html'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Unify global heading typography"
          git push
