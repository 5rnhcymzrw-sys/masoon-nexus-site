name: Normalize repeated selectors
on:
  push:
    branches: [main]
    paths: ['.github/workflows/normalize-multiselectors.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize repeated class selectors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/unified-design.css')
          s=p.read_text(encoding='utf-8')
          repls={
            '.section-label.section-label.section-label.section-label.section-label.section-label':'.section-label',
            '.contact-split__form-label.contact-split__form-label.contact-split__form-label.contact-split__form-label.contact-split__form-label.contact-split__form-label':'.contact-split__form-label',
            '.home-paths__grid.home-paths__grid.home-paths__grid.home-paths__grid.home-paths__grid.home-paths__grid':'.home-paths__grid',
            '.article-card.article-card.article-card.article-card.article-card.article-card':'.article-card',
            '.home-action-button.home-action-button.home-action-button.home-action-button.home-action-button.home-action-button':'.home-action-button',
            '.home-values__all-services.home-values__all-services.home-values__all-services.home-values__all-services.home-values__all-services.home-values__all-services':'.home-values__all-services',
            '.details-action.details-action.details-action.details-action.details-action.details-action':'.details-action',
            '.article-action.article-action.article-action.article-action.article-action.article-action':'.article-action',
            '.services-contact-button.services-contact-button.services-contact-button.services-contact-button.services-contact-button.services-contact-button':'.services-contact-button'
          }
          changed=0
          for a,b in repls.items():
              c=s.count(a)
              if c:
                  s=s.replace(a,b)
                  changed+=c
          if changed == 0:
              raise SystemExit('No repeated selectors found')
          p.write_text(s,encoding='utf-8')
          print('normalized',changed,'selector occurrences')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/unified-design.css
          git commit -m "Mehrfachselektoren in unified-design normalisieren"
          git rm .github/workflows/normalize-multiselectors.yml
          git commit -m "Temporären Mehrfachselektor-Workflow entfernen"
          git push
