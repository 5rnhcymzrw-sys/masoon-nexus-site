name: Report knowledge card markup
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/report-knowledge-card-markup.yml
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report markup and selectors
        run: |
          echo '=== HOME MARKUP ==='
          grep -n -A45 -B8 'home-paths__grid' index.html || true
          echo '=== KNOWLEDGE MARKUP ==='
          grep -n -A70 -B8 'articles-grid' fachwissen/index.html || true
          echo '=== HOME CSS GLOBAL ==='
          grep -n -A80 -B10 'Fachwissen-Kacheln' assets/global.css || true
          echo '=== KNOWLEDGE CSS UNIFIED ==='
          grep -n -A120 -B20 'Fachwissen Hauptseite' assets/unified-design.css || true
      - name: Remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/report-knowledge-card-markup.yml
          git commit -m "Temporären Kartenreport entfernen"
          git push
