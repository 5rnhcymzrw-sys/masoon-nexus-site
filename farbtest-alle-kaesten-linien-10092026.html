<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MASOON TREUHAND – Kästen Farb- und Linientest</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;background:#fff;font-family:Arial,sans-serif}
  iframe{display:block;width:100%;height:100vh;border:0;background:#fff}
  .test-panel{position:fixed;left:14px;bottom:14px;z-index:9999;width:380px;max-width:calc(100vw - 28px);max-height:78vh;overflow:auto;padding:10px;background:rgba(255,255,255,.97);border:1px solid #cfcfcf;box-shadow:0 4px 18px rgba(0,0,0,.12)}
  .test-row{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin:0 0 7px}
  .test-label{width:48px;font-size:9px;letter-spacing:.08em;color:#666;text-transform:uppercase;flex:0 0 48px}
  .test-panel button{appearance:none;border:1px solid #aaa;background:#fff;color:#171715;padding:6px 7px;font-size:9px;line-height:1;cursor:pointer}
  .test-panel button.active{background:#171715;color:#fff;border-color:#171715}
  .section-controls{border-top:1px solid #ddd;margin-top:8px;padding-top:8px}
  .section-block{padding:7px 0;border-bottom:1px solid #e7e7e7}
  .section-block:last-child{border-bottom:0}
  .section-title{font-size:10px;font-weight:700;letter-spacing:.04em;margin:0 0 5px;color:#171715;text-transform:uppercase}
  .mini-row{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin:3px 0}
  .mini-label{width:42px;font-size:8px;color:#777;text-transform:uppercase;letter-spacing:.06em;flex:0 0 42px}
  .all-block{background:#f7f7f5;margin:0 -4px 7px;padding:7px 4px}
  .button-block{border-top:1px solid #cfcfcf;margin-top:8px;padding-top:8px}
  .hint{font-size:8px;line-height:1.35;color:#777;margin-top:6px}
  @media(max-width:560px){.test-panel{left:8px;bottom:8px;width:calc(100vw - 16px);max-height:72vh}}
</style>
</head>
<body>
<iframe id="site" src="./index.html?v=all-box-test-8"></iframe>

<div class="test-panel" aria-label="Teststeuerung">
  <div class="test-row" id="pages">
    <span class="test-label">Seite</span>
    <button data-page="./index.html" class="active">Start</button>
    <button data-page="./unternehmen/index.html">Unternehmen</button>
    <button data-page="./dienstleistungen/index.html">DL</button>
    <button data-page="./fachwissen/index.html">Fachwissen</button>
    <button data-page="./kontakt/index.html">Formular</button>
  </div>

  <div id="section-controls" class="section-controls"></div>

  <div class="button-block">
    <div class="section-title">Alle Buttons</div>
    <div class="mini-row" id="button-color-row">
      <span class="mini-label">Farbe</span>
      <button data-button-color="off" class="active">ohne</button>
      <button data-button-color="2">2 kräftiger</button>
      <button data-button-color="3">3 deutlicher</button>
    </div>
    <div class="mini-row" id="button-line-row">
      <span class="mini-label">Linien</span>
      <button data-button-lines="on" class="active">mit</button>
      <button data-button-lines="off">ohne</button>
    </div>
  </div>
  <div class="hint">Jeder Bereich kann unabhängig auf Farbe, Linien und Weichzeichnung gestellt werden. „Alle Bereiche“ ändert nur die aktuell ausgewählte Seite.</div>
</div>

<script>
const frame=document.getElementById('site');
let page='./index.html';
const variants={
  '2':[[244,228,201],[232,227,218],[193,199,214],[132,144,171]],
  '3':[[245,225,194],[232,225,214],[187,196,216],[124,139,173]]
};
const borderFull='linear-gradient(110deg,#f3e8d4 0%,#e8e5df 38%,#c7cbd3 66%,#8d96a8 100%) 1';
const borderLeft='linear-gradient(110deg,#f3e8d4 0%,#e8e5df 100%) 1';
const borderMid='linear-gradient(110deg,#e8e5df 0%,#c7cbd3 100%) 1';
const borderRight='linear-gradient(110deg,#c7cbd3 0%,#8d96a8 100%) 1';

const pageSections={
  './index.html':[
    {id:'hero',label:'Hero',type:'hero'},
    {id:'home-dl',label:'DL',selector:'.home-values__items>.home-values__item',group:true},
    {id:'home-knowledge',label:'Fachwissen',selector:'.home-paths__grid>a',group:true},
    {id:'home-contact',label:'Kontakt',selector:'.home-contact-band'}
  ],
  './unternehmen/index.html':[
    {id:'company-values',label:'Werte',selector:'.company-values-grid>.company-value-card',group:true},
    {id:'company-collaboration',label:'Zusammenarbeit',selector:'.company-collaboration-box'}
  ],
  './dienstleistungen/index.html':[
    {id:'service-cards',label:'DL-Kacheln',selector:'.services-grid>.service-card',group:true},
    {id:'services-contact',label:'Kontaktkasten',selector:'.services-closing'}
  ],
  './fachwissen/index.html':[
    {id:'article-cards',label:'Beiträge',selector:'.articles-grid>.article-card',group:true},
    {id:'knowledge-note',label:'Info-Kasten',selector:'.knowledge-note'}
  ],
  './kontakt/index.html':[
    {id:'contact-form',label:'Formular',selector:'.contact-split__form'}
  ]
};

const states={};
Object.values(pageSections).flat().forEach(s=>{
  if(!states[s.id]) states[s.id]={color:'2',lines:'on',soft:'on'};
});
const buttonState={color:'off',lines:'on'};

function gradient(mode){
  if(mode==='off') return 'none';
  const c=variants[mode],a=.11;
  return `linear-gradient(to right in oklab,rgba(${c[0].join(',')},${a}) 0%,rgba(${c[1].join(',')},${a}) 36%,rgba(${c[2].join(',')},${a}) 68%,rgba(${c[3].join(',')},${a}) 100%)`;
}
function setImp(el,prop,val){el.style.setProperty(prop,val,'important')}
function remember(el){
  if(!el.hasAttribute('data-masoon-test-original-style')){
    el.setAttribute('data-masoon-test-original-style',el.getAttribute('style')||'');
  }
}
function restore(el){
  remember(el);
  const original=el.getAttribute('data-masoon-test-original-style')||'';
  if(original) el.setAttribute('style',original); else el.removeAttribute('style');
  el.setAttribute('data-masoon-test-original-style',original);
}
function setLine(el,which,on){
  setImp(el,'border','1px solid transparent');
  setImp(el,'border-image',on?which:'none');
  if(!on) setImp(el,'border-color','transparent');
}
function setSoft(el,on){
  const value=on?'blur(32px)':'none';
  setImp(el,'-webkit-backdrop-filter',value);
  setImp(el,'backdrop-filter',value);
}
function paintGroup(items,state){
  const g=gradient(state.color);
  items.forEach((el,i)=>{
    remember(el);restore(el);
    const mod=i%3;
    if(state.color==='off'){
      setImp(el,'background','transparent');
      setImp(el,'background-image','none');
    }else{
      setImp(el,'background',g);
      setImp(el,'background-size','calc(300% + 44px) 100%');
      setImp(el,'background-repeat','no-repeat');
      setImp(el,'background-origin','border-box');
      setImp(el,'background-position',mod===0?'0% 0':mod===1?'50% 0':'100% 0');
    }
    setLine(el,mod===0?borderLeft:mod===1?borderMid:borderRight,state.lines==='on');
    setSoft(el,state.soft==='on');
    el.querySelectorAll(':scope > summary,:scope > ul').forEach(ch=>{
      remember(ch);restore(ch);
      if(state.color!=='off') setImp(ch,'background','transparent');
    });
  });
}
function paintSingle(items,state){
  const g=gradient(state.color);
  items.forEach(el=>{
    remember(el);restore(el);
    if(state.color==='off'){
      setImp(el,'background','transparent');
      setImp(el,'background-image','none');
    }else{
      setImp(el,'background',g);
      setImp(el,'background-size','100% 100%');
      setImp(el,'background-position','0 0');
      setImp(el,'background-repeat','no-repeat');
      setImp(el,'background-origin','border-box');
    }
    setLine(el,borderFull,state.lines==='on');
    setSoft(el,state.soft==='on');
  });
}
function ensureHeroBackplate(d){
  const hero=d.querySelector('.home-hero__copy');
  if(!hero)return;
  let backplate=hero.querySelector(':scope > .masoon-hero-white-backplate');
  if(!backplate){
    backplate=d.createElement('div');
    backplate.className='masoon-hero-white-backplate';
    backplate.setAttribute('aria-hidden','true');
    hero.prepend(backplate);
  }
  requestAnimationFrame(()=>syncHeroBackplate(d));
  setTimeout(()=>syncHeroBackplate(d),80);
}
function syncHeroBackplate(d){
  const hero=d.querySelector('.home-hero__copy');
  const backplate=hero?.querySelector(':scope > .masoon-hero-white-backplate');
  if(!hero||!backplate)return;
  const pseudo=d.defaultView.getComputedStyle(hero,'::before');
  setImp(backplate,'left',pseudo.left);
  setImp(backplate,'top',pseudo.top);
  setImp(backplate,'width',pseudo.width);
  setImp(backplate,'height',pseudo.height);
  setImp(backplate,'right','auto');
  setImp(backplate,'bottom','auto');
}
function heroCss(state){
  const bg=state.color==='off'?'transparent':gradient(state.color);
  return `
html body.page-home.site-light-page main.home section.home-hero .home-hero__copy{position:relative!important;isolation:isolate!important}
html body.page-home.site-light-page main.home section.home-hero .home-hero__copy>.masoon-hero-white-backplate{display:block!important;position:absolute!important;box-sizing:border-box!important;background:#fff!important;border:0!important;box-shadow:none!important;pointer-events:none!important;z-index:1!important}
html body.page-home.site-light-page main.home section.home-hero .home-hero__copy::before{
  background:${bg}!important;
  background-size:100% 100%!important;
  background-position:0 0!important;
  background-repeat:no-repeat!important;
  border:1px solid transparent!important;
  border-image:${state.lines==='on'?borderFull:'none'}!important;
  border-color:${state.lines==='on'?'transparent':'transparent'}!important;
  box-shadow:none!important;
  -webkit-backdrop-filter:${state.soft==='on'?'blur(32px)':'none'}!important;
  backdrop-filter:${state.soft==='on'?'blur(32px)':'none'}!important;
  z-index:2!important
}
html body.page-home.site-light-page main.home section.home-hero .home-hero__copy>:not(.masoon-hero-white-backplate){position:relative;z-index:3}
`;
}
function applyButtons(d){
  const selector='.home-action-button,.services-contact-button,.contact-split__form button[type="submit"]';
  const buttons=[...d.querySelectorAll(selector)];
  buttons.forEach(el=>{
    remember(el);restore(el);
    if(buttonState.color==='off'){
      setImp(el,'background','transparent');
      setImp(el,'background-image','none');
    }else{
      setImp(el,'background',gradient(buttonState.color));
      setImp(el,'background-size','100% 100%');
      setImp(el,'background-position','0 0');
      setImp(el,'background-repeat','no-repeat');
    }
    setLine(el,borderFull,buttonState.lines==='on');
  });
}
function apply(){
  const d=frame.contentDocument;
  if(!d||!d.body||!d.head)return;
  const sections=pageSections[page]||[];
  sections.forEach(section=>{
    const state=states[section.id];
    if(section.type==='hero'){
      ensureHeroBackplate(d);
      let style=d.getElementById('hero-box-test-style');
      if(!style){style=d.createElement('style');style.id='hero-box-test-style';d.head.appendChild(style)}
      style.textContent=heroCss(state);
      requestAnimationFrame(()=>syncHeroBackplate(d));
      return;
    }
    const nodes=[...d.querySelectorAll(section.selector)];
    if(section.group) paintGroup(nodes,state); else paintSingle(nodes,state);
  });
  applyButtons(d);
}

function sectionBlock(section){
  const state=states[section.id];
  return `<div class="section-block" data-section="${section.id}">
    <div class="section-title">${section.label}</div>
    <div class="mini-row"><span class="mini-label">Farbe</span>
      <button data-section-color="off" class="${state.color==='off'?'active':''}">ohne</button>
      <button data-section-color="2" class="${state.color==='2'?'active':''}">2</button>
      <button data-section-color="3" class="${state.color==='3'?'active':''}">3</button>
    </div>
    <div class="mini-row"><span class="mini-label">Linien</span>
      <button data-section-lines="on" class="${state.lines==='on'?'active':''}">mit</button>
      <button data-section-lines="off" class="${state.lines==='off'?'active':''}">ohne</button>
    </div>
    <div class="mini-row"><span class="mini-label">Weich</span>
      <button data-section-soft="on" class="${state.soft==='on'?'active':''}">mit</button>
      <button data-section-soft="off" class="${state.soft==='off'?'active':''}">ohne</button>
    </div>
  </div>`;
}
function sameForAll(key,value){return (pageSections[page]||[]).every(s=>states[s.id][key]===value)}
function renderControls(){
  const host=document.getElementById('section-controls');
  const sections=pageSections[page]||[];
  host.innerHTML=`<div class="section-block all-block" data-all="1">
    <div class="section-title">Alle Bereiche dieser Seite</div>
    <div class="mini-row"><span class="mini-label">Farbe</span>
      <button data-all-color="off" class="${sameForAll('color','off')?'active':''}">ohne</button>
      <button data-all-color="2" class="${sameForAll('color','2')?'active':''}">2</button>
      <button data-all-color="3" class="${sameForAll('color','3')?'active':''}">3</button>
    </div>
    <div class="mini-row"><span class="mini-label">Linien</span>
      <button data-all-lines="on" class="${sameForAll('lines','on')?'active':''}">mit</button>
      <button data-all-lines="off" class="${sameForAll('lines','off')?'active':''}">ohne</button>
    </div>
    <div class="mini-row"><span class="mini-label">Weich</span>
      <button data-all-soft="on" class="${sameForAll('soft','on')?'active':''}">mit</button>
      <button data-all-soft="off" class="${sameForAll('soft','off')?'active':''}">ohne</button>
    </div>
  </div>`+sections.map(sectionBlock).join('');
}

frame.addEventListener('load',()=>setTimeout(apply,140));

document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{
  page=b.dataset.page;
  document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x===b));
  renderControls();
  frame.src=page+'?v=all-box-test-'+Date.now();
}));

document.getElementById('section-controls').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  const block=b.closest('[data-section]');
  if(block){
    const state=states[block.dataset.section];
    if(b.dataset.sectionColor) state.color=b.dataset.sectionColor;
    if(b.dataset.sectionLines) state.lines=b.dataset.sectionLines;
    if(b.dataset.sectionSoft) state.soft=b.dataset.sectionSoft;
    renderControls();apply();return;
  }
  const sections=pageSections[page]||[];
  if(b.dataset.allColor) sections.forEach(s=>states[s.id].color=b.dataset.allColor);
  if(b.dataset.allLines) sections.forEach(s=>states[s.id].lines=b.dataset.allLines);
  if(b.dataset.allSoft) sections.forEach(s=>states[s.id].soft=b.dataset.allSoft);
  renderControls();apply();
});

document.querySelectorAll('[data-button-color]').forEach(b=>b.addEventListener('click',()=>{
  buttonState.color=b.dataset.buttonColor;
  document.querySelectorAll('[data-button-color]').forEach(x=>x.classList.toggle('active',x===b));
  apply();
}));
document.querySelectorAll('[data-button-lines]').forEach(b=>b.addEventListener('click',()=>{
  buttonState.lines=b.dataset.buttonLines;
  document.querySelectorAll('[data-button-lines]').forEach(x=>x.classList.toggle('active',x===b));
  apply();
}));

renderControls();
</script>
</body>
</html>
