name: Hero exact layering

on:
  push:
    paths:
      - '.github/workflows/hero-layering-exact.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Existing Hero rules auf Testseiten Layering setzen
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('assets/unified-design.css')
          css = css_path.read_text(encoding='utf-8')

          replacements = [
              (
                  'html body.page-home.site-light-page main.home section.home-hero .home-hero__copy h1,\nhtml body.page-home.site-light-page main.home section.home-hero .home-hero__copy p{\n  text-align:left!important;\n}',
                  'html body.page-home.site-light-page main.home section.home-hero .home-hero__copy h1,\nhtml body.page-home.site-light-page main.home section.home-hero .home-hero__copy p{\n  text-align:left!important;\n  position:relative;\n  z-index:3;\n}'
              ),
              (
                  '  inset:16px -28px 16px -220px;\n  z-index:-1;\n  background:rgba(255,255,255,.16);',
                  '  inset:16px -28px 16px -220px;\n  z-index:2;\n  background:rgba(255,255,255,.16);'
              ),
              (
                  '    inset:0 -18px;\n    z-index:-1;\n    background:rgba(255,255,255,.22);',
                  '    inset:0 -18px;\n    z-index:2;\n    background:rgba(255,255,255,.22);'
              ),
              (
                  '  height:calc(58% + 4.64px);\n  z-index:-2;\n  pointer-events:none;',
                  '  height:calc(58% + 4.64px);\n  z-index:1;\n  pointer-events:none;'
              ),
          ]

          for n, (old, new) in enumerate(replacements, 1):
              count = css.count(old)
              if count != 1:
                  raise SystemExit(f'Replacement {n}: {count} Treffer statt 1')
              css = css.replace(old, new, 1)

          css_path.write_text(css, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          old_link = 'assets/unified-design.css?v=hero-final-testwerte-20260911-3'
          new_link = 'assets/unified-design.css?v=hero-testwerte-layering-20260911-4'
          if index.count(old_link) != 1:
              raise SystemExit('Stylesheet Cache Link nicht eindeutig gefunden')
          index_path.write_text(index.replace(old_link, new_link, 1), encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "5rnhcymzrw-sys"
          git config user.email "5rnhcymzrw@privaterelay.appleid.com"
          git add assets/unified-design.css index.html
          git diff --cached --quiet && exit 0
          git commit -m "Hero: Testseiten Werte und Layering exakt übernehmen"
          git push origin main
