name: Normalize double knowledge selectors
on:
  push:
    branches: [main]
    paths: ['.github/workflows/normalize-double-knowledge-selectors.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize remaining Fachwissen selector hacks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/unified-design.css')
          s=p.read_text(encoding='utf-8')
          before=s
          s=s.replace('.article-card.article-card', '.article-card')
          s=s.replace('.article-action.article-action', '.article-action')
          if s == before:
              raise SystemExit('No double Fachwissen selectors found')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/unified-design.css
          git commit -m "Doppelte Fachwissen-Selektoren normalisieren"
          git rm .github/workflows/normalize-double-knowledge-selectors.yml
          git commit -m "Temporären Fachwissen-Selektor-Workflow entfernen"
          git push
