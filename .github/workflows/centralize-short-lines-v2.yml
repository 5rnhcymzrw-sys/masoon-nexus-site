name: Centralize short lines v2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/centralize-short-lines-v2.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Centralize short line rules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base=Path('assets/unified-design-base-20260907.css')
          glob=Path('assets/global.css')
          b=base.read_text(encoding='utf-8')
          g=glob.read_text(encoding='utf-8')
          anchor='--action-arrow-gap:10px;--content-width:1227px;'
          repl='--action-arrow-gap:10px;--short-line-width:48px;--short-line-color:#868279;--short-line-gap:11px;--content-width:1227px;'
          if anchor not in g:
              raise SystemExit('root anchor missing')
          g=g.replace(anchor,repl,1)
          obsolete='''/* Alle Titellinien: oben und unten je 11 Pixel Abstand */
html body .section-label{
  margin-bottom:11px!important;
}

'''
          if obsolete not in b:
              raise SystemExit('obsolete section-label rule missing')
          b=b.replace(obsolete,'',1)
          start='/* Einheitliche kurze Linien zwischen kleinen Titeln und nachfolgendem Text */'
          end='/* Kleine Bereichstitel: ursprüngliche Abstände wiederherstellen */'
          i=b.find(start); j=b.find(end,i)
          if i<0 or j<0:
              raise SystemExit('short line block markers missing')
          block=b[i:j]
          b=b[:i]+b[j:]
          block=block.replace('width:48px!important;','width:var(--short-line-width)!important;')
          block=block.replace('max-width:48px!important;','max-width:var(--short-line-width)!important;')
          block=block.replace('background:#868279!important;','background:var(--short-line-color)!important;')
          block=block.replace('margin-top:11px!important;','margin-top:var(--short-line-gap)!important;')
          block=block.replace('margin:11px 0 0!important;','margin:var(--short-line-gap) 0 0!important;')
          g += '\n/* Einheitliche Kurzlinien – global */\n' + block.strip() + '\n'
          base.write_text(b,encoding='utf-8')
          glob.write_text(g,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/global.css assets/unified-design-base-20260907.css
          git commit -m "Kurzlinien global zentralisieren und Altregel entfernen"
          git rm .github/workflows/centralize-short-lines-v2.yml
          git commit -m "Temporären Kurzlinien-Workflow entfernen"
          git push