name: Header footer token fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/header-footer-token-fix.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply safe header footer fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          g = Path('assets/global.css')
          u = Path('assets/unified-design.css')
          gs = g.read_text(encoding='utf-8')
          us = u.read_text(encoding='utf-8')

          bad = '--mt-gradient-frame-reverse:var(--mt-gradient-frame-reverse);'
          good = '--mt-gradient-frame-reverse:linear-gradient(110deg,#8d96a8 0%,#c7cbd3 34%,#e8e5df 62%,#f3e8d4 100%);'
          assert bad in gs, 'reverse gradient bug not found'
          gs = gs.replace(bad, good, 1)

          replacements = {
            'padding-top:108px!important;':'padding-top:var(--header-height)!important;',
            'min-height:calc(100svh - 108px)!important;':'min-height:calc(100svh - var(--header-height))!important;',
            'calc((100svh - 108px)*.68)':'calc((100svh - var(--header-height))*.68)',
          }
          counts = {}
          for old,new in replacements.items():
            counts[old] = us.count(old)
            assert counts[old] > 0, f'missing {old}'
            us = us.replace(old,new)

          g.write_text(gs, encoding='utf-8')
          u.write_text(us, encoding='utf-8')

          assert '--mt-gradient-frame-reverse:var(--mt-gradient-frame-reverse);' not in g.read_text(encoding='utf-8')
          assert '100svh - 108px' not in u.read_text(encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/global.css assets/unified-design.css
          git commit -m "Header-Höhen tokenisieren und Footer-Verlauf reparieren"
          git rm .github/workflows/header-footer-token-fix.yml
          git commit -m "Temporären Header-Footer-Workflow entfernen"
          git push