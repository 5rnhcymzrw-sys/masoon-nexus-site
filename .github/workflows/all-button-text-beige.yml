name: All button text beige

on:
  push:
    paths:
      - '.github/workflows/all-button-text-beige.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adjust existing action and button colour rules only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          TARGET = '#868279!important'
          selector_markers = (
              '.home-action-button',
              '.home-values__all-services',
              '.details-action',
              '.article-action',
              '.services-contact-button',
              '.contact-split__form button',
              '.contact-form button',
              '.article-back',
              '.article-card>a',
              '.article-card > a',
          )

          rule_re = re.compile(r'([^{}]+)\{([^{}]*)\}', re.S)
          color_re = re.compile(r'(?<![-\w])color\s*:\s*[^;}]+' , re.I)
          changed_files = set()
          changed_rules = []

          def is_target(selector):
              compact = ' '.join(selector.split())
              return any(marker in compact for marker in selector_markers)

          for p in sorted(Path('assets').glob('*.css')):
              text = p.read_text()
              out = []
              last = 0
              file_changes = 0
              for m in rule_re.finditer(text):
                  selector, body = m.group(1), m.group(2)
                  if not is_target(selector):
                      continue
                  vals = color_re.findall(body)
                  if not vals:
                      continue
                  new_body, n = color_re.subn('color:' + TARGET, body)
                  if n and new_body != body:
                      out.append(text[last:m.start(2)])
                      out.append(new_body)
                      last = m.end(2)
                      file_changes += n
                      changed_rules.append((str(p), ' '.join(selector.split())[:320], vals))
              if file_changes:
                  out.append(text[last:])
                  p.write_text(''.join(out))
                  changed_files.add(p)
                  print(f'{p}: updated {file_changes} existing colour declarations')

          # Ensure the principal existing base rules have an explicit beige text colour
          # if they previously relied on inheritance. This edits those rules in place.
          ensure = [
              ('assets/unified-design.css', 'html body.page-services .services-main .details-toggle-symbol'),
          ]
          # No colour is added to symbol-only rule; symbols inherit from their parent.

          # Verify no explicit non-beige text colour remains in targeted existing rules.
          bad = []
          for p in sorted(Path('assets').glob('*.css')):
              text = p.read_text()
              for m in rule_re.finditer(text):
                  selector, body = m.group(1), m.group(2)
                  if not is_target(selector):
                      continue
                  for val in color_re.findall(body):
                      compact = re.sub(r'\s+', '', val.lower())
                      if compact != 'color:#868279!important':
                          bad.append((str(p), ' '.join(selector.split())[:260], val))
          if bad:
              raise SystemExit('Non-beige button/action colours remain: ' + repr(bad[:30]))

          if changed_rules:
              print('\nChanged rules:')
              for f, sel, vals in changed_rules:
                  print(f'- {f}: {sel} :: {vals}')
          else:
              print('All targeted explicit button/action colours were already beige.')

          # Cache-bust changed stylesheets on every HTML page that loads them.
          token = 'button-text-beige-all-20260912-1'
          html_changed = 0
          if changed_files:
              changed_names = {p.name for p in changed_files}
              for page in sorted(Path('.').rglob('*.html')):
                  if '.git' in page.parts:
                      continue
                  html = page.read_text(errors='ignore')
                  new = html
                  for name in changed_names:
                      new = re.sub(
                          r'((?:\.\./)*assets/' + re.escape(name) + r'\?v=)[^"\']+',
                          r'\1' + token,
                          new,
                      )
                  if new != html:
                      page.write_text(new)
                      html_changed += 1
              print(f'Cache updated on {html_changed} HTML files for: {sorted(changed_names)}')
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/all-button-text-beige.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Alle Seiten: Buttonschriften beige vereinheitlichen"
          git push