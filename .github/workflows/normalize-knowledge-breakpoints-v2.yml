name: Normalize knowledge breakpoints v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-knowledge-breakpoints-v2.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: python3 .github/scripts/normalize_knowledge_breakpoints.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/unified-design.css
          git commit -m "Fachwissen-Breakpoints ohne Überlappung strukturieren"
          git rm .github/workflows/normalize-knowledge-breakpoints-v2.yml .github/scripts/normalize_knowledge_breakpoints.py
          git commit -m "Temporären Breakpoint-Workflow entfernen"
          git push
