name: Centralize card title typography
on:
  push:
    branches: [main]
    paths: ['.github/workflows/centralize-card-title-typography.yml']
permissions:
  contents: write
jobs:
  centralize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Centralize shared card-title typography
        shell: python
        run: |
          from pathlib import Path
          import re

          g = Path('assets/global.css')
          b = Path('assets/unified-design-base-20260907.css')
          gs = g.read_text()
          bs = b.read_text()

          old_root = '--card-title:24px;'
          new_root = '--card-title:24px;--card-title-weight:600;--card-title-line-height:1.12;--card-title-letter-spacing:0;'
          assert old_root in gs
          gs = gs.replace(old_root, new_root, 1)

          pat = re.compile(r'\.home-values__item h3,\n\.home-paths__grid strong,\n\.services-section \.service-card h2\{font-family:var\(--font-cormorant\)!important;font-size:var\(--card-title\)!important;font-weight:500!important;line-height:1\.12!important;letter-spacing:-\.01em!important;\}')
          repl = '.home-values__item h3,\n.home-paths__grid strong,\n.services-section .service-card h2{font-family:var(--font-cormorant)!important;font-size:var(--card-title)!important;font-weight:var(--card-title-weight)!important;line-height:var(--card-title-line-height)!important;letter-spacing:var(--card-title-letter-spacing)!important;}'
          gs, n = pat.subn(repl, gs, count=1)
          assert n == 1, n

          blocks = [
            r'/\* Einheitliche Grösse für sämtliche Kacheltitel \*/\nhtml body \.home-values__item h3,\nhtml body \.home-paths__grid strong,\nhtml body \.article-card h2,\nhtml body \.services-section \.service-card h2\{\n  font-size:24px!important;\n\}\n',
            r'/\* Kacheltitel auf allen Seiten etwas kräftiger \*/\nhtml body \.home-values__item h3,\nhtml body \.home-paths__grid strong,\nhtml body \.article-card h2,\nhtml body \.services-section \.service-card h2\{\n  font-weight:600!important;\n\}\n',
            r'/\* Schriftstärke 600 gegen ältere spezifische Kachelregeln durchsetzen \*/\nhtml body \.home>\.home-values \.home-values__item h3,\nhtml body\.site-light-page \.services-main \.services-section \.services-grid>\.service-card h2,\nhtml body \.home>\.home-paths \.home-paths__grid strong,\nhtml body \.knowledge-section \.articles-grid>\.article-card h2\{\n  font-weight:600!important;\n\}\n',
            r'/\* Kleine Titel: neutraler Buchstabenabstand für bessere Lesbarkeit \*/\nhtml body \.home>\.home-values \.home-values__item h3,\nhtml body \.home>\.home-paths \.home-paths__grid strong,\nhtml body \.page-main>\.home-values \.home-values__item h3,\nhtml body \.services-main \.services-section \.service-card h2\{\n  letter-spacing:0!important;\n\}\n',
            r'/\* Gemeinsame Typografie der Kacheltitel \*/\nhtml body \.home>\.home-values \.home-values__item h3,\nhtml body \.home>\.home-paths \.home-paths__grid strong,\nhtml body \.page-main>\.home-values \.home-values__item h3,\nhtml body \.services-main \.services-section \.service-card h2\{\n  font-family:var\(--font-cormorant\),Georgia,serif!important;\n  font-size:24px!important;\n  font-weight:600!important;\n  -webkit-text-stroke:0!important;\n\}\n',
            r'/\* Alle kleinen Titel: einheitlicher Zeilenabstand 1\.12 \*/\nhtml body \.home-values__item h3,\nhtml body \.home-paths__grid strong,\nhtml body \.services-section \.service-card h2,\nhtml body \.knowledge-section \.article-card h2\{\n  line-height:1\.12!important;\n\}\n'
          ]
          removed = 0
          for p in blocks:
            bs2, n = re.subn(p, '', bs, count=1)
            if n:
              bs = bs2
              removed += 1
          assert removed >= 5, removed

          g.write_text(gs)
          b.write_text(bs)
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/global.css assets/unified-design-base-20260907.css
          git commit -m "Kacheltitel-Typografie global zentralisieren"
          git rm .github/workflows/centralize-card-title-typography.yml
          git commit -m "Temporären Kacheltitel-Workflow entfernen"
          git push
