name: Centralize layout tokens
on:
  push:
    paths:
      - '.github/workflows/centralize-layout-tokens.yml'
permissions:
  contents: write
jobs:
  centralize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Centralize layout tokens
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/global.css')
          s = p.read_text()

          anchor = '--content-width:1320px;--title-width:650px;'
          repl = '--content-width:1320px;--content-width-narrow:1227px;--page-gutter:64px;--page-gutter-mobile:36px;--section-y:126px;--section-y-mobile:82px;--header-height:108px;--accent-bar-height:8px;--title-width:650px;'
          if anchor not in s:
              raise SystemExit('Layout token anchor not found')
          s = s.replace(anchor, repl, 1)

          replacements = {
              'width:min(100% - 64px,1320px)!important;':'width:min(100% - var(--page-gutter),var(--content-width))!important;',
              'width:min(100% - 36px,1320px)!important;':'width:min(100% - var(--page-gutter-mobile),var(--content-width))!important;',
              'width:min(100% - 64px,1227px)!important;':'width:min(100% - var(--page-gutter),var(--content-width-narrow))!important;',
              'width:min(100% - 36px,1227px)!important;':'width:min(100% - var(--page-gutter-mobile),var(--content-width-narrow))!important;',
              'max-width:1227px!important;':'max-width:var(--content-width-narrow)!important;',
              'padding-top:126px!important;padding-bottom:126px!important;':'padding-top:var(--section-y)!important;padding-bottom:var(--section-y)!important;',
              'padding:126px 0;':'padding:var(--section-y) 0;',
              'padding:82px 0;':'padding:var(--section-y-mobile) 0;',
              'height:108px!important;min-height:108px!important;':'height:var(--header-height)!important;min-height:var(--header-height)!important;',
              'top:108px!important;':'top:var(--header-height)!important;',
              'height:8px!important;':'height:var(--accent-bar-height)!important;',
              'top:-8px!important;':'top:calc(-1 * var(--accent-bar-height))!important;',
              'padding-top:108px!important;':'padding-top:var(--header-height)!important;'
          }
          counts = {}
          for old,new in replacements.items():
              c = s.count(old)
              if c:
                  s = s.replace(old,new)
                  counts[old]=c
          required = [
              'width:min(100% - 64px,1227px)!important;',
              'padding-top:126px!important;padding-bottom:126px!important;',
              'height:108px!important;min-height:108px!important;'
          ]
          missing = [x for x in required if x not in counts]
          if missing:
              raise SystemExit('Required layout patterns missing: '+repr(missing))
          print('Replacements:', counts)
          p.write_text(s)
          PY
          rm -f .github/workflows/centralize-layout-tokens.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/global.css .github/workflows/centralize-layout-tokens.yml
          git commit -m 'Breiten und Standardabstände global zentralisieren'
          git push
