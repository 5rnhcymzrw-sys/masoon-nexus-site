name: Report global large boxes
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/report-global-large-boxes.yml
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report box rules
        run: |
          for f in assets/global.css assets/unified-design.css assets/dienstleistungen.css assets/contact.css assets/article-detail.css assets/index-CZfMKxM_.css; do
            echo "=== $f ==="
            grep -n -B2 -A8 -E 'knowledge-note|services-closing|company-collaboration-box|home-contact-band' "$f" || true
          done
      - name: Remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/report-global-large-boxes.yml
          git commit -m "Temporären Grosskasten-Report entfernen"
          git push
