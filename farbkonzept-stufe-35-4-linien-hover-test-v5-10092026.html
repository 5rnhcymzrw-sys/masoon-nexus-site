<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MASOON – Farbkonzept Stufe 3.5/4 Test V5</title>
<style>
html,body{margin:0;min-height:100%;background:#f4f4f2;font-family:Arial,sans-serif;color:#171715}
.testbar{position:sticky;top:0;z-index:99999;background:#fff;border-bottom:1px solid #d8d8d4;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.testbar strong{font-size:12px;margin-right:6px}.testbar button{appearance:none;border:1px solid #cfcfca;background:#fff;padding:7px 10px;font-size:11px;cursor:pointer}.testbar button:hover,.testbar button.active{background:#171715;color:#fff;border-color:#171715}.group{display:flex;gap:5px;align-items:center;margin-left:8px;padding-left:10px;border-left:1px solid #ddd}.group span{font-size:11px;color:#666;margin-right:2px}.status{font-size:11px;font-weight:700;min-width:150px}.note{font-size:11px;color:#666;margin-left:auto}#siteFrame{display:block;width:100%;height:calc(100vh - 58px);min-height:700px;border:0;background:#fff}@media(max-width:1050px){.note{width:100%;margin-left:0}#siteFrame{height:calc(100vh - 112px)}}
</style>
</head>
<body>
<div class="testbar">
<strong>FARBKONZEPT TEST V5</strong>
<button data-src="index.html?v=colorv5-10092026" data-page="home" class="active">Startseite</button>
<button data-src="dienstleistungen/index.html?v=colorv5-10092026" data-page="services">Dienstleistungen</button>
<button data-src="fachwissen/index.html?v=colorv5-10092026" data-page="knowledge">Fachwissen</button>
<div class="group"><span>Stärke:</span><button data-level="3.5">3.5</button><button data-level="4" class="active">4</button></div>
<div class="group"><span>Linien:</span><button data-lines="on" class="active">AN</button><button data-lines="off">AUS</button></div>
<span class="status" id="status">Stufe 4 · Linien an</span>
<span class="note">Weichzeichnung immer AUS · Fachwissen normal transparent, Hover = gewählte Stufe</span>
</div>
<iframe id="siteFrame" src="index.html?v=colorv5-10092026" title="Farbkonzept Test V5"></iframe>
<script>
const frame=document.getElementById('siteFrame');
const pageButtons=[...document.querySelectorAll('[data-page]')];
const levelButtons=[...document.querySelectorAll('[data-level]')];
const lineButtons=[...document.querySelectorAll('[data-lines]')];
const status=document.getElementById('status');
let currentPage='home';
let level=4;
let linesOn=true;
const alpha={'3.5':.145,'4':.18};
function gradientFor(levelValue){
 const a=alpha[String(levelValue)];
 return `linear-gradient(to right in oklab, rgba(243,232,212,${a}) 0%, rgba(232,229,223,${a}) 36%, rgba(199,203,211,${a}) 68%, rgba(141,150,168,${a}) 100%)`;
}
function important(el,prop,value){el.style.setProperty(prop,value,'important')}
function clearInterior(el){
 important(el,'background','transparent');
 important(el,'background-image','none');
 important(el,'background-color','transparent');
 important(el,'backdrop-filter','none');
 important(el,'-webkit-backdrop-filter','none');
}
function applyGradient(el,index){
 const g=gradientFor(level);
 important(el,'background',g);
 important(el,'background-image',g);
 important(el,'background-color','transparent');
 important(el,'background-origin','border-box');
 important(el,'background-size','calc(300% + 44px) 100%');
 important(el,'background-repeat','no-repeat');
 important(el,'background-position',index%3===0?'left top':index%3===1?'center top':'right top');
 important(el,'backdrop-filter','none');
 important(el,'-webkit-backdrop-filter','none');
}
function applyLine(el,index,on){
 const g=gradientFor(level);
 important(el,'box-sizing','border-box');
 important(el,'border-width','1px');
 important(el,'border-style','solid');
 if(on){
   important(el,'border-color','transparent');
   important(el,'border-image',g+' 1');
 }else{
   important(el,'border-color','transparent');
   important(el,'border-image','none');
 }
}
function wireHover(items){
 items.forEach((el,i)=>{
   if(el.dataset.mtV5Hover==='1')return;
   el.dataset.mtV5Hover='1';
   el.addEventListener('mouseenter',()=>{
     applyGradient(el,i);
     applyLine(el,i,linesOn);
   });
   el.addEventListener('mouseleave',()=>{
     clearInterior(el);
     applyLine(el,i,linesOn);
   });
 });
}
function updateStatus(){status.textContent=`Stufe ${level} · Linien ${linesOn?'an':'aus'}`}
function apply(){
 try{
   const d=frame.contentDocument;if(!d||!d.body)return;
   if(currentPage==='home'){
     const dl=[...d.querySelectorAll('main.home section.home-values .home-values__items>.home-values__item')];
     dl.forEach((el,i)=>{applyGradient(el,i);applyLine(el,i,linesOn)});
     const fw=[...d.querySelectorAll('main.home section.home-paths .home-paths__grid>a')];
     fw.forEach((el,i)=>{clearInterior(el);applyLine(el,i,linesOn)});
     wireHover(fw);
   } else if(currentPage==='services'){
     const cards=[...d.querySelectorAll('main.services-main .services-section .services-grid>.service-card')];
     cards.forEach((el,i)=>{applyGradient(el,i);applyLine(el,i,linesOn)});
   } else if(currentPage==='knowledge'){
     const fw=[...d.querySelectorAll('main .knowledge-section#knowledge-articles .articles-grid>.article-card')];
     fw.forEach((el,i)=>{clearInterior(el);applyLine(el,i,linesOn)});
     wireHover(fw);
   }
 }catch(e){console.error('Farbkonzept Test V5:',e)}
}
function runRepeated(){apply();setTimeout(apply,180);setTimeout(apply,500);setTimeout(apply,1100);setTimeout(apply,2200)}
frame.addEventListener('load',runRepeated);
pageButtons.forEach(b=>b.addEventListener('click',()=>{
 currentPage=b.dataset.page;
 pageButtons.forEach(x=>x.classList.remove('active'));
 b.classList.add('active');
 frame.src=b.dataset.src;
}));
levelButtons.forEach(b=>b.addEventListener('click',()=>{
 level=Number(b.dataset.level);
 levelButtons.forEach(x=>x.classList.remove('active'));
 b.classList.add('active');
 updateStatus();
 runRepeated();
}));
lineButtons.forEach(b=>b.addEventListener('click',()=>{
 linesOn=b.dataset.lines==='on';
 lineButtons.forEach(x=>x.classList.remove('active'));
 b.classList.add('active');
 updateStatus();
 runRepeated();
}));
</script>
</body>
</html>
