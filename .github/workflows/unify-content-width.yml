name: Unify content width

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unify-content-width.yml'

permissions:
  contents: write

jobs:
  unify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unify all shared content widths to 1227px
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = sorted(Path('assets').glob('*.css'))
          global_css = Path('assets/global.css')
          text = global_css.read_text()

          old = '--content-width:1320px;--content-width-narrow:1227px;'
          if old in text:
              text = text.replace(old, '--content-width:1227px;', 1)
          else:
              text = text.replace('--content-width:1320px;', '--content-width:1227px;', 1)
              text = text.replace('--content-width-narrow:1227px;', '', 1)
          global_css.write_text(text)

          for path in files:
              css = path.read_text()
              css = css.replace('var(--content-width-narrow)', 'var(--content-width)')
              css = css.replace('1320px', 'var(--content-width)')
              path.write_text(css)

          # Safety checks: one canonical width only.
          all_css = '\n'.join(p.read_text() for p in files)
          if '--content-width-narrow' in all_css:
              raise SystemExit('content-width-narrow remains')
          if '1320px' in all_css:
              raise SystemExit('literal 1320px remains in CSS')
          if '--content-width:1227px;' not in global_css.read_text():
              raise SystemExit('global content width is not 1227px')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/unify-content-width.yml
          git add assets/*.css
          git commit -m "Inhaltsbreite global auf 1227 px vereinheitlichen"
          git push
