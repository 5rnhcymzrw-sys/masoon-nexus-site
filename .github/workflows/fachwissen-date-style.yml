name: Fachwissen date style

on:
  push:
    paths:
      - '.github/workflows/fachwissen-date-style.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adjust existing article date rules
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # 1) Alte mt-nav-Regel für die Datumszeilen ausschliessen,
          # damit nur die spezifische Fachwissen-Regel den Abstand steuert.
          global_css = Path('assets/global.css')
          g = global_css.read_text()
          old_sel = 'html body main :is(#mt-nav-typography,.mt-nav-typography):not(.section-label){'
          new_sel = 'html body main :is(#mt-nav-typography,.mt-nav-typography):not(.section-label):not(.article-card-date){'
          if g.count(old_sel) != 1:
              raise SystemExit(f'mt-nav selector count unexpected: {g.count(old_sel)}')
          g = g.replace(old_sel, new_sel, 1)
          global_css.write_text(g)

          # 2) Bestehende Fachwissen-Hauptseiten-Regel anpassen.
          unified = Path('assets/unified-design.css')
          u = unified.read_text()
          selector = 'html body.page-knowledge.site-light-page main .knowledge-section#knowledge-articles .articles-grid>.article-card.article-card>.article-card-date'

          matches = []
          pos = 0
          while True:
              s = u.find(selector + '{', pos)
              if s == -1:
                  break
              e = u.find('}', s)
              if e == -1:
                  raise SystemExit('unterminated article-card-date rule')
              block = u[s:e+1]
              matches.append((s, e, block))
              pos = e + 1

          target = None
          for s, e, block in matches:
              if 'letter-spacing:' in block and 'color:' in block:
                  target = (s, e, block)
                  break
          if target is None:
              raise SystemExit(f'typography article-card-date rule not found; occurrences={len(matches)}')

          s, e, block = target
          block2, n1 = re.subn(r'letter-spacing\s*:\s*[^;}]+' , 'letter-spacing:1.1px!important', block, count=1)
          if n1 != 1:
              raise SystemExit('letter-spacing declaration not found in target article-card-date rule')
          block3, n2 = re.subn(r'color\s*:\s*[^;}]+' , 'color:#777777!important', block2, count=1)
          if n2 != 1:
              raise SystemExit('color declaration not found in target article-card-date rule')
          u = u[:s] + block3 + u[e+1:]
          unified.write_text(u)

          # 3) Cache nur auf der Fachwissen-Hauptseite aktualisieren.
          page = Path('fachwissen/index.html')
          html = page.read_text()
          html, n3 = re.subn(r'(../assets/global\.css\?v=)[^"\']+', r'\1fachwissen-date-grey-spacing-20260912-1', html, count=1)
          if n3 != 1:
              raise SystemExit('global.css cache ref not found in fachwissen/index.html')
          html, n4 = re.subn(r'(../assets/unified-design\.css\?v=)[^"\']+', r'\1fachwissen-date-grey-spacing-20260912-1', html, count=1)
          if n4 != 1:
              raise SystemExit('unified-design.css cache ref not found in fachwissen/index.html')
          page.write_text(html)

          print('Updated article-card-date block:')
          print(block3)
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/fachwissen-date-style.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fachwissen: Datumszeilen grau und 1.1px"
          git push