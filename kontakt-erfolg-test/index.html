<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MASOON TREUHAND – Kontakt Erfolgstest</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:Arial,sans-serif}.toolbar{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:99999;padding:8px 12px;background:rgba(255,255,255,.96);border:1px solid rgba(23,23,21,.14);box-shadow:0 8px 24px rgba(23,23,21,.10);font-size:12px;color:#171715}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><div class="toolbar">Test: Nachricht erfolgreich versendet</div><iframe id="site" src="../kontakt/index.html"></iframe><script>const frame=document.getElementById('site');frame.addEventListener('load',()=>{const d=frame.contentDocument||frame.contentWindow.document;if(!d)return;const form=d.querySelector('.contact-split__form');const button=form?.querySelector('button[type="submit"]');if(!form||!button)return;form.querySelector('.test-success')?.remove();const status=d.createElement('div');status.className='form-status test-success';status.innerHTML='<strong>Vielen Dank für Ihre Anfrage.</strong><br>Wir haben Ihre Nachricht erhalten und melden uns in Kürze bei Ihnen.';button.insertAdjacentElement('afterend',status);const s=d.createElement('style');s.id='kontakt-erfolg-test-style';s.textContent='.contact-split__form .test-success{display:block!important;margin:26px 20px 0!important;padding:0!important;color:#171715!important;font-family:var(--font-inter),Arial,sans-serif!important;font-size:14px!important;font-weight:300!important;line-height:1.6!important;letter-spacing:0!important}.contact-split__form .test-success strong{font-weight:500!important}';d.head.appendChild(s);setTimeout(()=>status.scrollIntoView({block:"center"}),200);});</script></body></html>
