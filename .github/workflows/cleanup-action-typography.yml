name: Cleanup action typography

on:
  push:
    paths:
      - '.github/workflows/cleanup-action-typography.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate core action typography and remove empty rules
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          CACHE = 'action-typography-clean-20260912-3'
          base = Path('assets/unified-design-base-20260907.css')
          text = base.read_text()
          rule_re = re.compile(r'([^{}]+)\{([^{}]*)\}', re.S)

          home = 'html body main .home-action-button.home-action-button.home-action-button.home-action-button.home-action-button.home-action-button'
          details = 'html body main .details-action.details-action.details-action.details-action.details-action.details-action'
          article = 'html body main .article-action.article-action.article-action.article-action.article-action.article-action'
          services = 'html body main .services-contact-button.services-contact-button.services-contact-button.services-contact-button.services-contact-button.services-contact-button'
          generic_article = 'html body main .article-card.article-card.article-card.article-card.article-card.article-card>a'

          rules = list(rule_re.finditer(text))
          home_rules = [m for m in rules if home in ' '.join(m.group(1).split())]
          grouped_rules = [m for m in rules if details in ' '.join(m.group(1).split()) and article in ' '.join(m.group(1).split()) and services in ' '.join(m.group(1).split())]
          if len(home_rules) != 1 or len(grouped_rules) != 1:
              raise SystemExit(f'Expected one home canonical and one stripped grouped rule, found {len(home_rules)} / {len(grouped_rules)}')

          hm = home_rules[0]
          gm = grouped_rules[0]
          body = hm.group(2)
          compact = body.replace(' ', '').lower()
          required = [
              'font-family:var(--font-inter),arial,sans-serif!important',
              'font-size:11px!important',
              'font-weight:500!important',
              'line-height:1.4!important',
              'letter-spacing:1.1px!important',
              'text-transform:uppercase!important',
              'color:#777777!important',
          ]
          missing = [x for x in required if x not in compact]
          if missing:
              raise SystemExit('Canonical home action rule missing values: ' + repr(missing))

          combined_selector = ',\n'.join([home, details, article, services])
          replacement_home = combined_selector + '{' + body + '}'

          # Replace home owner first, then delete the old stripped grouped rule by positions from the original text.
          edits = [
              (hm.start(), hm.end(), replacement_home),
              (gm.start(), gm.end(), ''),
          ]
          for start, end, replacement in sorted(edits, reverse=True):
              text = text[:start] + replacement + text[end:]
          base.write_text(text)

          # Remove semicolon-only/empty rules created by earlier typography stripping.
          changed_css = {base}
          empty_total = 0
          empty_re = re.compile(r'([^{}]+)\{([\s;]*)\}', re.S)
          for path in sorted(Path('assets').glob('*.css')):
              t = path.read_text()
              n = 0
              while True:
                  t2, count = empty_re.subn('', t)
                  n += count
                  if count == 0:
                      break
                  t = t2
              if n:
                  path.write_text(t)
                  changed_css.add(path)
                  empty_total += n

          # Verify all four core classes are now in the same single owner rule.
          final = base.read_text()
          final_rules = list(rule_re.finditer(final))
          owners = []
          for m in final_rules:
              sel = ' '.join(m.group(1).split())
              if home in sel or details in sel or article in sel or services in sel:
                  if 'font-family:' in m.group(2) or 'font-size:' in m.group(2) or 'font-weight:' in m.group(2) or 'letter-spacing:' in m.group(2) or 'color:' in m.group(2):
                      owners.append(m)
          if len(owners) != 1:
              raise SystemExit('Expected exactly one core typography rule after consolidation, found ' + str(len(owners)))
          owner_sel = ' '.join(owners[0].group(1).split())
          for required_selector in (home, details, article, services):
              if required_selector not in owner_sel:
                  raise SystemExit('Core selector missing from owner: ' + required_selector)
          if generic_article in owner_sel:
              raise SystemExit('Generic article-card link must not be part of core typography owner')
          owner_body = owners[0].group(2).replace(' ', '').lower()
          if 'letter-spacing:1.1px!important' not in owner_body or 'color:#777777!important' not in owner_body:
              raise SystemExit('Core owner target values missing')

          # Verify no semicolon-only empty rules remain anywhere.
          leftovers = []
          for path in sorted(Path('assets').glob('*.css')):
              if empty_re.search(path.read_text()):
                  leftovers.append(str(path))
          if leftovers:
              raise SystemExit('Empty CSS rules remain: ' + repr(leftovers))

          # Cache-bust base import and directly linked changed stylesheets.
          unified = Path('assets/unified-design.css')
          ut = unified.read_text()
          nu = re.sub(r"(@import url\('\./unified-design-base-20260907\.css\?v=)[^']+", r'\1' + CACHE, ut, count=1)
          if nu == ut:
              raise SystemExit('Could not update base import cache token')
          unified.write_text(nu)
          changed_css.add(unified)

          html_changed = 0
          changed_names = {p.name for p in changed_css}
          for page in [p for p in sorted(Path('.').rglob('*.html')) if '.git' not in p.parts]:
              h = page.read_text(errors='ignore')
              nh = h
              for name in changed_names:
                  nh = re.sub(r'((?:\.\./)*assets/' + re.escape(name) + r'\?v=)[^"\']+', r'\1' + CACHE, nh)
              if nh != h:
                  page.write_text(nh)
                  html_changed += 1

          print('Core typography owner consolidated for:', [home, details, article, services])
          print('Empty rules removed:', empty_total)
          print('Changed CSS:', [str(p) for p in sorted(changed_css)])
          print('Cache-updated HTML files:', html_changed)
          PY
      - name: Commit CSS cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets '*.html' */*.html */*/*.html || true
          git diff --cached --quiet && { echo 'No cleanup changes'; exit 1; }
          git commit -m "Button-Typografie: gemeinsame Regel vervollständigen"
          git push
