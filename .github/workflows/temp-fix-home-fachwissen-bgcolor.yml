name: temp fix home fachwissen bgcolor
on:
  push:
    paths:
      - '.github/workflows/temp-fix-home-fachwissen-bgcolor.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix existing Startseite Fachwissen background color overlap
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path('assets/unified-design.css')
          s = css.read_text(encoding='utf-8')
          old = '''html body.page-home.site-light-page main.home section.home-paths .home-paths__grid.home-paths__grid>a{\n  position:relative!important;\n  cursor:pointer!important;\n  border:0!important;\n  border-color:transparent!important;\n  border-image:none!important;\n  background-size:calc(300% + 44px) 100%!important;'''
          new = '''html body.page-home.site-light-page main.home section.home-paths .home-paths__grid.home-paths__grid>a{\n  position:relative!important;\n  cursor:pointer!important;\n  border:0!important;\n  border-color:transparent!important;\n  border-image:none!important;\n  background-color:transparent!important;\n  background-size:calc(300% + 44px) 100%!important;'''
          if s.count(old) != 1:
              raise SystemExit(f'Expected existing Fachwissen card rule once, found {s.count(old)}')
          css.write_text(s.replace(old,new,1),encoding='utf-8')

          index = Path('index.html')
          h = index.read_text(encoding='utf-8')
          old_link = 'assets/unified-design.css?v=home-fachwissen-overlap-fix-20260911-1'
          new_link = 'assets/unified-design.css?v=home-fachwissen-bgcolor-fix-20260911-1'
          if h.count(old_link) != 1:
              raise SystemExit(f'Expected current stylesheet version once, found {h.count(old_link)}')
          index.write_text(h.replace(old_link,new_link,1),encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/unified-design.css index.html
          git diff --cached --check
          git commit -m 'Fix Startseite Fachwissen background color overlap'
          git push
