name: Tokenize strong card gradient
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tokenize-strong-card-gradient.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tokenize strong glass gradient and remove duplicate shorthand
        run: |
          python3 - <<'PY'
          from pathlib import Path
          g=Path('assets/global.css')
          u=Path('assets/unified-design.css')
          gs=g.read_text(encoding='utf-8')
          us=u.read_text(encoding='utf-8')
          literal='linear-gradient(to right in oklab,rgba(244,228,201,.24) 0%,rgba(232,227,218,.24) 36%,rgba(193,199,214,.24) 68%,rgba(158,165,184,.24) 100%)'
          token='var(--mt-gradient-card-glass-strong)'
          assert literal in us
          root_anchor='--mt-gradient-card-glass:linear-gradient(to right in oklab,rgba(244,228,201,.11) 0%,rgba(232,227,218,.11) 36%,rgba(193,199,214,.11) 68%,rgba(132,144,171,.11) 100%);'
          assert root_anchor in gs
          if '--mt-gradient-card-glass-strong:' not in gs:
              gs=gs.replace(root_anchor,root_anchor+'--mt-gradient-card-glass-strong:'+literal+';',1)
          us=us.replace(literal,token)
          dup='  background:var(--mt-gradient-card-glass-strong)!important;\n  background-color:transparent!important;\n  background-image:var(--mt-gradient-card-glass-strong)!important;'
          clean='  background-color:transparent!important;\n  background-image:var(--mt-gradient-card-glass-strong)!important;'
          assert dup in us
          us=us.replace(dup,clean,1)
          g.write_text(gs,encoding='utf-8')
          u.write_text(us,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/global.css assets/unified-design.css
          git commit -m "Stärkeren Kartenverlauf global tokenisieren"
          git rm .github/workflows/tokenize-strong-card-gradient.yml
          git commit -m "Temporären Verlauf-Workflow entfernen"
          git push
