name: Consolidate knowledge arrow rule
on:
  push:
    branches: [main]
    paths: ['.github/workflows/consolidate-knowledge-arrow.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate arrow rule
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/unified-design.css')
          s=p.read_text(encoding='utf-8')
          old='''html body.site-light-page main .knowledge-section .article-card .article-action::after{\n  position:absolute!important;\n  left:calc(100% + 10px)!important;\n  top:50%!important;\n  margin:0!important;\n  transform:translateY(-50%)!important;\n}\n'''
          new='''html body.site-light-page main .knowledge-section .article-card .article-action::after{\n  position:absolute!important;\n  left:calc(100% + 10px)!important;\n  top:50%!important;\n  margin:0!important;\n  transform:translateY(calc(-50% - 1px))!important;\n}\n'''
          assert old in s, 'base arrow rule missing'
          s=s.replace(old,new,1)
          override='''/* Fachwissen: Pfeil bei Beitrag anzeigen optisch 1 Pixel hoeher */\nhtml body.site-light-page main .knowledge-section .articles-grid>.article-card>.article-action::after{\n  transform:translateY(calc(-50% - 1px))!important;\n}\n\n'''
          assert override in s, 'arrow override missing'
          s=s.replace(override,'',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/unified-design.css
          git commit -m "Fachwissen-Pfeilregel zusammenfassen"
          git rm .github/workflows/consolidate-knowledge-arrow.yml
          git commit -m "Temporären Fachwissen-Pfeil-Workflow entfernen"
          git push
