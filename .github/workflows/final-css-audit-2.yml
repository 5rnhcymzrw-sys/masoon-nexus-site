name: Final CSS audit 2
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/final-css-audit-2.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit
        run: |
          echo 'REPEATED'
          grep -nE '\.([A-Za-z0-9_-]+)(\.\1){1,}' assets/unified-design.css assets/global.css assets/dienstleistungen.css assets/contact.css assets/article-detail.css || true
          echo 'UNIFIED ARTICLE CONTACT SERVICES'
          grep -nE 'page-article-|page-contact|page-services' assets/unified-design.css || true
          echo 'EMPTY LEGACY COMMENTS'
          grep -nE '/\* .*index\.html|FINAL:|ursprüng|alte|Alt|verbleib' assets/unified-design.css assets/global.css assets/dienstleistungen.css assets/contact.css assets/article-detail.css || true
          echo 'EXACT TOKEN CANDIDATES'
          grep -nE 'width:min\(100% - 36px,1227px\)|width:min\(100% - 64px,1227px\)|padding:126px 72px|padding:82px 0|margin-bottom:126px|padding-bottom:126px' assets/unified-design.css assets/global.css assets/dienstleistungen.css assets/contact.css assets/article-detail.css || true
      - name: Remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/final-css-audit-2.yml
          git commit -m "Temporären Schlussaudit entfernen"
          git push
