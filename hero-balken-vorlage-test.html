<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hero Balken – Vorlage</title><style>html,body{margin:0;height:100%;background:#111;font-family:Arial,sans-serif}body{display:grid;grid-template-rows:58px 1fr;overflow:hidden}.tester{display:flex;align-items:center;gap:7px;padding:0 14px;background:#f3f3f3;border-bottom:1px solid #ccc;overflow-x:auto}.tester strong{font-size:13px;margin-right:6px;white-space:nowrap}.tester button{appearance:none;border:1px solid #c9c9c9;background:#fff;padding:9px 12px;font-size:12px;cursor:pointer;white-space:nowrap}.tester button.active{background:#111;color:#fff;border-color:#111}iframe{width:100%;height:100%;border:0;background:#fff;display:block}@media(max-width:900px){.tester strong{display:none}}</style></head><body><div class="tester"><strong>Balken vergleichen</strong><button data-v="original" class="active">Original</button><button data-v="v1">1 · Weich</button><button data-v="v2">2 · Schmal</button><button data-v="v3">3 · Asymmetrisch</button><button data-v="v4">4 · Nur oben</button><button data-v="v5">5 · Nur unten</button><button data-v="v6">6 · Verlauf</button><button data-v="v7">7 · Rahmenartig</button><button data-v="v8">8 · Offen</button></div><iframe id="site" src="./index.html"></iframe><script>const f=document.getElementById('site'),bs=[...document.querySelectorAll('button[data-v]')];let current='original';function ensure(d){const h=d.querySelector('main.home section.home-hero');if(!h)return null;h.style.position='relative';for(const n of ['top','bottom','mid']){let e=h.querySelector('.bar-test-'+n);if(!e){e=d.createElement('div');e.className='bar-test-'+n;e.style.cssText='position:absolute;left:0;right:0;pointer-events:none;z-index:3;';h.appendChild(e)}}return h}function clear(h){for(const e of h.querySelectorAll('[class^="bar-test-"]'))e.style.cssText='position:absolute;left:0;right:0;pointer-events:none;z-index:3;display:none;'}function apply(v){const d=f.contentDocument;if(!d)return;const h=ensure(d);if(!h)return;clear(h);if(v!=='original'){const t=h.querySelector('.bar-test-top'),b=h.querySelector('.bar-test-bottom'),m=h.querySelector('.bar-test-mid');const grad='linear-gradient(110deg,rgba(243,232,212,.52),rgba(232,229,223,.34) 38%,rgba(199,203,211,.22) 66%,rgba(141,150,168,.12))';if(v==='v1'){t.style.cssText+='display:block;top:18%;height:7%;background:'+grad+';opacity:.62;';b.style.cssText+='display:block;bottom:14%;height:7%;background:'+grad+';opacity:.50;'}if(v==='v2'){t.style.cssText+='display:block;top:21%;height:3.5%;background:'+grad+';opacity:.72;';b.style.cssText+='display:block;bottom:17%;height:3.5%;background:'+grad+';opacity:.58;'}if(v==='v3'){t.style.cssText+='display:block;top:18%;height:6%;right:32%;background:'+grad+';opacity:.70;';b.style.cssText+='display:block;bottom:14%;height:6%;left:18%;background:'+grad+';opacity:.52;'}if(v==='v4'){t.style.cssText+='display:block;top:18%;height:8%;background:'+grad+';opacity:.65;';}if(v==='v5'){b.style.cssText+='display:block;bottom:14%;height:9%;background:'+grad+';opacity:.58;';}if(v==='v6'){t.style.cssText+='display:block;top:16%;height:11%;background:linear-gradient(90deg,rgba(243,232,212,.58),rgba(232,229,223,.20),rgba(199,203,211,0));';b.style.cssText+='display:block;bottom:12%;height:10%;background:linear-gradient(90deg,rgba(199,203,211,.08),rgba(232,229,223,.22),rgba(243,232,212,.46));';}if(v==='v7'){t.style.cssText+='display:block;top:18%;height:1px;background:linear-gradient(90deg,#f3e8d4,#e8e5df,#c7cbd3,#8d96a8);opacity:.8;';b.style.cssText+='display:block;bottom:14%;height:1px;background:linear-gradient(90deg,#f3e8d4,#e8e5df,#c7cbd3,#8d96a8);opacity:.8;';m.style.cssText+='display:block;top:18%;bottom:14%;left:0;right:auto;width:1px;background:rgba(141,150,168,.28);';}if(v==='v8'){t.style.cssText+='display:block;top:18%;height:5%;background:linear-gradient(90deg,rgba(243,232,212,.48),rgba(232,229,223,.18),transparent 62%);';b.style.cssText+='display:block;bottom:14%;height:5%;background:linear-gradient(90deg,transparent 32%,rgba(199,203,211,.16),rgba(141,150,168,.10));';}}bs.forEach(x=>x.classList.toggle('active',x.dataset.v===v));current=v}f.addEventListener('load',()=>apply(current));bs.forEach(b=>b.addEventListener('click',()=>apply(b.dataset.v)));</script></body></html>
