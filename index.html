<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MASOON TREUHAND</title>
  <style>
    html,body{height:100%;margin:0;background:#111;font-family:Arial,sans-serif}
    body{overflow:hidden}
    #status{position:fixed;inset:0;display:grid;place-items:center;color:#fff;background:#111;z-index:2;font-size:14px;letter-spacing:.04em}
    iframe{width:100%;height:100%;border:0;display:block;background:#fff}
  </style>
</head>
<body>
  <div id="status">Website wird geladen …</div>
  <iframe id="site" title="MASOON TREUHAND Website" sandbox="allow-scripts allow-forms allow-popups allow-downloads allow-same-origin"></iframe>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script>
  (() => {
    const ZIP_NAME = 'MASOON_TREUHAND_Mehrseitige_Website_1zu1.zip';
    const frame = document.getElementById('site');
    const status = document.getElementById('status');
    let zip;
    const dataUrlCache = new Map();
    const textCache = new Map();

    const mime = path => {
      const ext = path.split('.').pop().toLowerCase();
      return ({png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp',svg:'image/svg+xml',woff2:'font/woff2',woff:'font/woff',css:'text/css',js:'text/javascript',ico:'image/x-icon'})[ext] || 'application/octet-stream';
    };

    const clean = path => path.replace(/^\/+/, '').replace(/\?.*$/, '').replace(/#.*$/, '');
    const baseDir = path => path.includes('/') ? path.slice(0, path.lastIndexOf('/') + 1) : '';
    const resolvePath = (fromFile, ref) => {
      if (!ref || /^(?:data:|https?:|mailto:|tel:|javascript:|#)/i.test(ref)) return ref;
      const base = 'https://zip.local/' + baseDir(fromFile);
      return clean(decodeURIComponent(new URL(ref, base).pathname));
    };

    async function getText(path) {
      path = clean(path);
      if (textCache.has(path)) return textCache.get(path);
      const file = zip.file(path);
      if (!file) throw new Error('Datei fehlt: ' + path);
      const text = await file.async('text');
      textCache.set(path, text);
      return text;
    }

    async function getDataUrl(path) {
      path = clean(path);
      if (dataUrlCache.has(path)) return dataUrlCache.get(path);
      const file = zip.file(path);
      if (!file) return null;
      const bytes = await file.async('uint8array');
      const blob = new Blob([bytes], {type:mime(path)});
      const url = await new Promise((resolve,reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
      dataUrlCache.set(path, url);
      return url;
    }

    async function rewriteCss(css, cssFile) {
      const re = /url\(\s*(['"]?)([^)'"\s]+)\1\s*\)/g;
      let out = '', last = 0;
      for (const match of css.matchAll(re)) {
        out += css.slice(last, match.index);
        const ref = match[2];
        if (/^(?:data:|https?:|#)/i.test(ref)) {
          out += match[0];
        } else {
          const target = resolvePath(cssFile, ref);
          const data = await getDataUrl(target);
          out += data ? `url("${data}")` : match[0];
        }
        last = match.index + match[0].length;
      }
      return out + css.slice(last);
    }

    async function render(pagePath, pushHash = true) {
      pagePath = clean(pagePath || 'index.html');
      if (!pagePath || pagePath.endsWith('/')) pagePath += 'index.html';
      if (!zip.file(pagePath)) pagePath = 'index.html';
      status.style.display = 'grid';
      status.textContent = 'Website wird geladen …';

      const source = await getText(pagePath);
      const doc = new DOMParser().parseFromString(source, 'text/html');

      doc.querySelectorAll('link[rel="stylesheet"], link[as="font"]').forEach(el => el.remove());
      doc.querySelectorAll('style').forEach(el => { el.dataset.rewrite = '1'; });

      const cssPath = 'assets/index-CZfMKxM_.css';
      const css = await rewriteCss(await getText(cssPath), cssPath);
      const style = doc.createElement('style');
      style.textContent = css;
      doc.head.appendChild(style);

      for (const el of [...doc.querySelectorAll('style[data-rewrite="1"]')]) {
        el.textContent = await rewriteCss(el.textContent, pagePath);
      }

      for (const el of [...doc.querySelectorAll('[src]')]) {
        const ref = el.getAttribute('src');
        if (!ref || /^(?:data:|https?:)/i.test(ref)) continue;
        const target = resolvePath(pagePath, ref);
        if (target.endsWith('.js')) {
          el.remove();
          continue;
        }
        const data = await getDataUrl(target);
        if (data) el.setAttribute('src', data);
        el.removeAttribute('srcset');
      }

      for (const el of [...doc.querySelectorAll('link[href]')]) {
        const rel = (el.getAttribute('rel') || '').toLowerCase();
        if (!/icon/.test(rel)) continue;
        const target = resolvePath(pagePath, el.getAttribute('href'));
        const data = await getDataUrl(target);
        if (data) el.setAttribute('href', data);
      }

      for (const a of [...doc.querySelectorAll('a[href]')]) {
        const href = a.getAttribute('href');
        if (!href || /^(?:mailto:|tel:|https?:|#)/i.test(href)) continue;
        let target = resolvePath(pagePath, href);
        if (!target) target = 'index.html';
        if (target.endsWith('/')) target += 'index.html';
        if (target.endsWith('.html')) {
          a.setAttribute('href', '#');
          a.setAttribute('data-zip-target', target);
        }
      }

      const siteJs = await getText('assets/site.js');
      const script = doc.createElement('script');
      script.textContent = siteJs;
      doc.body.appendChild(script);

      const bridge = doc.createElement('script');
      bridge.textContent = `document.addEventListener('click',function(e){const a=e.target.closest('a[data-zip-target]');if(!a)return;e.preventDefault();parent.postMessage({type:'zip-nav',target:a.dataset.zipTarget},'*');});`;
      doc.body.appendChild(bridge);

      frame.srcdoc = '<!doctype html>\n' + doc.documentElement.outerHTML;
      frame.onload = () => { status.style.display = 'none'; };
      if (pushHash) {
        const nextHash = pagePath === 'index.html' ? '' : '#' + pagePath;
        if (location.hash !== nextHash) history.pushState(null, '', location.pathname + nextHash);
      }
    }

    window.addEventListener('message', e => {
      if (e.data && e.data.type === 'zip-nav') render(e.data.target, true).catch(showError);
    });
    window.addEventListener('popstate', () => render(location.hash.slice(1) || 'index.html', false).catch(showError));

    function showError(err) {
      console.error(err);
      status.style.display = 'grid';
      status.textContent = 'Die Website konnte nicht geladen werden. Bitte Seite neu laden.';
    }

    async function start() {
      if (!window.JSZip) throw new Error('JSZip konnte nicht geladen werden.');
      const response = await fetch(ZIP_NAME, {cache:'no-store'});
      if (!response.ok) throw new Error('Website-Paket fehlt: ' + response.status);
      zip = await JSZip.loadAsync(await response.arrayBuffer());
      await render(location.hash.slice(1) || 'index.html', false);
    }

    start().catch(showError);
  })();
  </script>
</body>
</html>
