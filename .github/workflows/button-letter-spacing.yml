name: Button letter spacing

on:
  push:
    paths:
      - '.github/workflows/button-letter-spacing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update existing action letter-spacing rules only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          TARGET = '1.1px!important'
          markers = (
              '.home-action-button',
              '.home-values__all-services',
              '.details-action',
              '.article-action',
              '.services-contact-button',
              '.contact-split__form button',
              '.contact-form button',
              '.article-back',
              '.article-card>a',
              '.article-card > a',
          )

          def split_selectors(selector):
              parts, buf, depth = [], [], 0
              for ch in selector:
                  if ch == '(':
                      depth += 1
                  elif ch == ')':
                      depth = max(0, depth - 1)
                  if ch == ',' and depth == 0:
                      part = ''.join(buf).strip()
                      if part:
                          parts.append(part)
                      buf = []
                  else:
                      buf.append(ch)
              part = ''.join(buf).strip()
              if part:
                  parts.append(part)
              return parts

          def selector_without_not(s):
              old = None
              while old != s:
                  old = s
                  s = re.sub(r':not\([^()]*\)', '', s)
              return s

          def is_action_selector(s):
              compact = ' '.join(selector_without_not(s).split())
              if '::before' in compact or '::after' in compact or '.details-toggle-symbol' in compact:
                  return False
              return any(m in compact for m in markers)

          rule_re = re.compile(r'([^{}]+)\{([^{}]*)\}', re.S)
          ls_re = re.compile(r'letter-spacing\s*:\s*[^;}]+' , re.I)
          changed_files = set()
          changes = []

          # Replace old spacing values inside existing button/action rules.
          for p in sorted(Path('assets').glob('*.css')):
              text = p.read_text()
              out = []
              last = 0
              file_changed = False
              for m in rule_re.finditer(text):
                  selector, body = m.group(1), m.group(2)
                  parts = split_selectors(selector)
                  target_parts = [x for x in parts if is_action_selector(x)]
                  if not target_parts:
                      continue
                  non_target_parts = [x for x in parts if not is_action_selector(x)]
                  vals = ls_re.findall(body)
                  if not vals:
                      continue
                  new_body = ls_re.sub('letter-spacing:' + TARGET, body)
                  if non_target_parts:
                      replacement = ',\n'.join(non_target_parts) + '{' + body + '}\n' + ',\n'.join(target_parts) + '{' + new_body + '}'
                  else:
                      replacement = selector + '{' + new_body + '}'
                  if replacement != m.group(0):
                      out.append(text[last:m.start()])
                      out.append(replacement)
                      last = m.end()
                      file_changed = True
                      changes.append((str(p), ' '.join(selector.split())[:300], vals))
              if file_changed:
                  out.append(text[last:])
                  p.write_text(''.join(out))
                  changed_files.add(p)

          # Ensure each principal action family has one existing rule carrying 1.1px.
          principal = [
              '.home-action-button',
              '.details-action',
              '.article-action',
              '.services-contact-button',
              '.contact-split__form button',
              '.contact-form button',
              '.article-back',
          ]
          for marker in principal:
              found_explicit = False
              candidates = []
              for p in sorted(Path('assets').glob('*.css')):
                  text = p.read_text()
                  for m in rule_re.finditer(text):
                      selector, body = m.group(1), m.group(2)
                      matching = [x for x in split_selectors(selector) if marker in ' '.join(selector_without_not(x).split()) and is_action_selector(x)]
                      if not matching:
                          continue
                      candidates.append((p, selector))
                      vals = ls_re.findall(body)
                      if vals and all(v.replace(' ','').lower() == 'letter-spacing:1.1px!important' for v in vals):
                          found_explicit = True
              if found_explicit or not candidates:
                  continue
              p, _ = candidates[-1]
              text = p.read_text()
              matches = []
              for m in rule_re.finditer(text):
                  if any(marker in ' '.join(selector_without_not(x).split()) and is_action_selector(x) for x in split_selectors(m.group(1))):
                      matches.append(m)
              if not matches:
                  raise SystemExit(f'Cannot relocate canonical rule for {marker}')
              mm = matches[-1]
              body2 = mm.group(2)
              if body2 and not body2.rstrip().endswith(';'):
                  body2 = body2.rstrip() + ';'
              body2 += 'letter-spacing:' + TARGET + ';'
              text = text[:mm.start(2)] + body2 + text[mm.end(2):]
              p.write_text(text)
              changed_files.add(p)
              changes.append((str(p), ' '.join(mm.group(1).split())[:300], ['(added to existing rule)']))

          # Existing mt-nav rule must not impose its old 1.55px on action labels.
          html_action_classes = set()
          class_re = re.compile(r'class=["\']([^"\']+)["\']')
          for page in Path('.').rglob('*.html'):
              if '.git' in page.parts:
                  continue
              txt = page.read_text(errors='ignore')
              for cm in class_re.finditer(txt):
                  classes = cm.group(1).split()
                  if 'mt-nav-typography' not in classes:
                      continue
                  for c in classes:
                      if c in {'article-action','home-action-button','details-action','services-contact-button','article-back'}:
                          html_action_classes.add(c)

          for p in sorted(Path('assets').glob('*.css')):
              text = p.read_text()
              out = []
              last = 0
              file_changed = False
              for m in rule_re.finditer(text):
                  selector, body = m.group(1), m.group(2)
                  if '.mt-nav-typography' not in selector or not ls_re.search(body):
                      continue
                  parts = split_selectors(selector)
                  new_parts = []
                  changed = False
                  for part in parts:
                      if '.mt-nav-typography' not in part or is_action_selector(part):
                          new_parts.append(part)
                          continue
                      new_part = part
                      for cls in sorted(html_action_classes):
                          exc = f':not(.{cls})'
                          if exc not in new_part:
                              pos = new_part.find('.mt-nav-typography') + len('.mt-nav-typography')
                              new_part = new_part[:pos] + exc + new_part[pos:]
                              changed = True
                      new_parts.append(new_part)
                  if changed:
                      replacement = ',\n'.join(new_parts) + '{' + body + '}'
                      out.append(text[last:m.start()])
                      out.append(replacement)
                      last = m.end()
                      file_changed = True
                      changes.append((str(p), 'mt-nav exclusions', sorted(html_action_classes)))
              if file_changed:
                  out.append(text[last:])
                  p.write_text(''.join(out))
                  changed_files.add(p)

          # Verify no old explicit spacing remains in action rules.
          bad = []
          for p in sorted(Path('assets').glob('*.css')):
              text = p.read_text()
              for m in rule_re.finditer(text):
                  selector, body = m.group(1), m.group(2)
                  if not any(is_action_selector(x) for x in split_selectors(selector)):
                      continue
                  for val in ls_re.findall(body):
                      if val.replace(' ','').lower() != 'letter-spacing:1.1px!important':
                          bad.append((str(p), ' '.join(selector.split())[:260], val))
          if bad:
              raise SystemExit('Old/different button spacing remains: ' + repr(bad[:30]))

          if not changed_files:
              raise SystemExit('No button/action spacing changes were necessary/found')

          print('Changed files:', [str(p) for p in sorted(changed_files)])
          print('Action classes excluded from mt-nav:', sorted(html_action_classes))
          for row in changes:
              print(row)

          # Cache-bust changed stylesheets everywhere they are loaded.
          token = 'button-spacing-1-1-20260912-1'
          names = {p.name for p in changed_files}
          pages_changed = 0
          for page in sorted(Path('.').rglob('*.html')):
              if '.git' in page.parts:
                  continue
              html = page.read_text(errors='ignore')
              new = html
              for name in names:
                  new = re.sub(r'((?:\.\./)*assets/' + re.escape(name) + r'\?v=)[^"\']+', r'\1' + token, new)
              if new != html:
                  page.write_text(new)
                  pages_changed += 1
          print('Cache-updated HTML files:', pages_changed)
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/button-letter-spacing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Alle Seiten: Button-Buchstabenabstand auf 1.1 Pixel setzen"
          git push