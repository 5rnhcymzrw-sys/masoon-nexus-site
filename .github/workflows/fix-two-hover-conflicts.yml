name: Fix two hover conflicts

on:
  push:
    paths:
      - '.github/workflows/fix-two-hover-conflicts.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bestehende Konfliktregeln bereinigen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          cache = 'hover-two-conflicts-20260913-1'

          unified = Path('assets/unified-design.css')
          text = unified.read_text()
          old = 'html body.page-home.site-light-page main.home section.home-values .home-action-button{margin-left:20px!important;color:#777777!important;}'
          new = 'html body.page-home.site-light-page main.home section.home-values .home-action-button{margin-left:20px!important;}'
          if text.count(old) != 1:
              raise SystemExit(f'unified-design.css: expected exactly one conflicting home-values rule, found {text.count(old)}')
          text = text.replace(old, new, 1)
          unified.write_text(text)

          dl = Path('assets/dienstleistungen.css')
          text = dl.read_text()
          old = 'html body .services-main .services-section .services-grid>.service-card:nth-of-type(2) .details-action{display:inline-block!important;color:#777777!important;}'
          new = 'html body .services-main .services-section .services-grid>.service-card:nth-of-type(2) .details-action{display:inline-block!important;}'
          if text.count(old) != 1:
              raise SystemExit(f'dienstleistungen.css: expected exactly one conflicting card-2 action rule, found {text.count(old)}')
          text = text.replace(old, new, 1)
          dl.write_text(text)

          # Verify the existing owner/state rules now control colour.
          u = unified.read_text()
          required_u = [
              'html body.page-home .home-action-button{',
              'color:#777777!important;',
              'html body.page-home .home-action-button:hover,',
              'color:#171715!important;',
          ]
          for needle in required_u:
              if needle not in u:
                  raise SystemExit(f'unified-design.css verification missing: {needle}')

          d = dl.read_text()
          required_d = [
              '.services-section .service-card[open] .details-action{display:inline-block!important;color:#777777!important;',
              '.services-section .service-card:hover .details-action{display:inline-block!important;color:#171715!important;',
          ]
          for needle in required_d:
              if needle not in d:
                  raise SystemExit(f'dienstleistungen.css verification missing: {needle}')

          # Cache-bust only existing links to the two changed files.
          html_changed = 0
          for page in [p for p in sorted(Path('.').rglob('*.html')) if '.git' not in p.parts]:
              h = page.read_text(errors='ignore')
              nh = h
              for name in ('unified-design.css', 'dienstleistungen.css'):
                  nh = re.sub(
                      r'((?:\.\./)*assets/' + re.escape(name) + r'\?v=)[^"\']+',
                      r'\1' + cache,
                      nh,
                  )
              if nh != h:
                  page.write_text(nh)
                  html_changed += 1

          print('Removed 2 obsolete conflicting colour declarations')
          print('HTML cache tokens changed:', html_changed)
          PY
      - name: Commit und temporären Workflow entfernen
        run: |
          rm -f .github/workflows/fix-two-hover-conflicts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'No changes'; exit 1; }
          git commit -m "Button-Hover: zwei alte Farbkonflikte entfernen"
          git push
