name: temp testpage decorative gradients
on:
  push:
    paths:
      - '.github/workflows/temp-testpage-decorative-gradients.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update test page decorative gradient areas only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('farbtest-alle-kaesten-linien-10092026.html')
          s=p.read_text(encoding='utf-8')

          old="""  './unternehmen/index.html':[\n    {id:'company-values',label:'Werte',selector:'.company-values-grid>.company-value-card',group:true},\n    {id:'company-collaboration',label:'Zusammenarbeit',selector:'.company-collaboration-box'}\n  ],"""
          new="""  './unternehmen/index.html':[\n    {id:'company-accent',label:'Bild Akzent',type:'company-accent'},\n    {id:'company-values',label:'Werte',selector:'.company-values-grid>.company-value-card',group:true},\n    {id:'company-collaboration',label:'Zusammenarbeit',selector:'.company-collaboration-box'}\n  ],"""
          if s.count(old)!=1: raise SystemExit(f'company sections match count {s.count(old)}')
          s=s.replace(old,new,1)

          old="""function syncHeroBackplate(d){const hero=d.querySelector('.home-hero__copy'),b=hero?.querySelector(':scope > .masoon-hero-white-backplate');if(!hero||!b)return;const p=d.defaultView.getComputedStyle(hero,'::before');setImp(b,'left',p.left);setImp(b,'top',p.top);setImp(b,'width',p.width);setImp(b,'height',p.height);setImp(b,'right','auto');setImp(b,'bottom','auto')}\nfunction heroCss(s){const bg=s.color==='off'?'transparent':gradient(s.color);return`html body.page-home.site-light-page main.home section.home-hero .home-hero__copy{position:relative!important;isolation:isolate!important}html body.page-home.site-light-page main.home section.home-hero .home-hero__copy>.masoon-hero-white-backplate{display:block!important;position:absolute!important;box-sizing:border-box!important;background:#fff!important;border:0!important;box-shadow:none!important;pointer-events:none!important;z-index:1!important}html body.page-home.site-light-page main.home section.home-hero .home-hero__copy::before{background:${bg}!important;background-size:100% 100%!important;background-position:0 0!important;background-repeat:no-repeat!important;border:1px solid transparent!important;border-image:${s.lines==='on'?borderFull:'none'}!important;border-color:transparent!important;box-shadow:none!important;-webkit-backdrop-filter:${s.soft==='on'?'blur(32px)':'none'}!important;backdrop-filter:${s.soft==='on'?'blur(32px)':'none'}!important;z-index:2!important}html body.page-home.site-light-page main.home section.home-hero .home-hero__copy>:not(.masoon-hero-white-backplate){position:relative;z-index:3}`}"""
          new="""function syncHeroBackplate(d){const hero=d.querySelector('.home-hero__copy'),b=hero?.querySelector(':scope > .masoon-hero-white-backplate');if(!hero||!b)return;const p=d.defaultView.getComputedStyle(hero,'::before');const left=parseFloat(p.left)||0,top=parseFloat(p.top)||0,width=parseFloat(p.width)||hero.getBoundingClientRect().width,height=parseFloat(p.height)||hero.getBoundingClientRect().height;setImp(b,'left',`${left-28}px`);setImp(b,'top',`${top+height*.42}px`);setImp(b,'width',`${width*.72}px`);setImp(b,'height',`${height*.58}px`);setImp(b,'right','auto');setImp(b,'bottom','auto')}\nfunction heroCss(s){const bg=s.color==='off'?'transparent':gradient(s.color);return`html body.page-home.site-light-page main.home section.home-hero .home-hero__copy{position:relative!important;isolation:isolate!important}html body.page-home.site-light-page main.home section.home-hero .home-hero__copy>.masoon-hero-white-backplate{display:block!important;position:absolute!important;box-sizing:border-box!important;background:${bg}!important;background-size:100% 100%!important;background-position:0 0!important;background-repeat:no-repeat!important;border:0!important;box-shadow:none!important;-webkit-backdrop-filter:${s.soft==='on'?'blur(32px)':'none'}!important;backdrop-filter:${s.soft==='on'?'blur(32px)':'none'}!important;pointer-events:none!important;z-index:1!important}html body.page-home.site-light-page main.home section.home-hero .home-hero__copy::before{background:#fff!important;background-image:none!important;border:1px solid transparent!important;border-image:${s.lines==='on'?borderFull:'none'}!important;border-color:transparent!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;z-index:2!important}html body.page-home.site-light-page main.home section.home-hero .home-hero__copy>:not(.masoon-hero-white-backplate){position:relative;z-index:3}`}\nfunction companyAccentCss(s){const bg=s.color==='off'?'transparent':gradient(s.color);return`html body.page-company.site-light-page .company-legal-card .home-company__image::before{background:${bg}!important;background-size:100% 100%!important;background-position:0 0!important;background-repeat:no-repeat!important;border:${s.lines==='on'?'1px solid transparent':'0'}!important;border-image:${s.lines==='on'?borderFull:'none'}!important;border-color:transparent!important;box-shadow:none!important;-webkit-backdrop-filter:${s.soft==='on'?'blur(32px)':'none'}!important;backdrop-filter:${s.soft==='on'?'blur(32px)':'none'}!important}`}"""
          if s.count(old)!=1: raise SystemExit(f'hero functions match count {s.count(old)}')
          s=s.replace(old,new,1)

          old="""function apply(){const d=frame.contentDocument;if(!d||!d.body||!d.head)return;(pageSections[page]||[]).forEach(section=>{const s=states[section.id];if(section.type==='hero'){ensureHeroBackplate(d);let style=d.getElementById('hero-box-test-style');if(!style){style=d.createElement('style');style.id='hero-box-test-style';d.head.appendChild(style)}style.textContent=heroCss(s);requestAnimationFrame(()=>syncHeroBackplate(d));return}const nodes=[...d.querySelectorAll(section.selector)];if(section.softOnly)paintSoftOnly(nodes,s);else if(section.group)paintGroup(nodes,s);else paintSingle(nodes,s)});if(!(pageSections[page]||[]).every(s=>s.softOnly))applyButtons(d)}"""
          new="""function apply(){const d=frame.contentDocument;if(!d||!d.body||!d.head)return;(pageSections[page]||[]).forEach(section=>{const s=states[section.id];if(section.type==='hero'){ensureHeroBackplate(d);let style=d.getElementById('hero-box-test-style');if(!style){style=d.createElement('style');style.id='hero-box-test-style';d.head.appendChild(style)}style.textContent=heroCss(s);requestAnimationFrame(()=>syncHeroBackplate(d));return}if(section.type==='company-accent'){let style=d.getElementById('company-accent-test-style');if(!style){style=d.createElement('style');style.id='company-accent-test-style';d.head.appendChild(style)}style.textContent=companyAccentCss(s);return}const nodes=[...d.querySelectorAll(section.selector)];if(section.softOnly)paintSoftOnly(nodes,s);else if(section.group)paintGroup(nodes,s);else paintSingle(nodes,s)});if(!(pageSections[page]||[]).every(s=>s.softOnly))applyButtons(d)}"""
          if s.count(old)!=1: raise SystemExit(f'apply function match count {s.count(old)}')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add farbtest-alle-kaesten-linien-10092026.html
          git diff --cached --check
          git commit -m 'Test decorative gradients behind portrait and hero box'
          git push
