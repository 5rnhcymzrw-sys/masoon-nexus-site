name: temp fix home fachwissen overlap
on:
  push:
    paths:
      - '.github/workflows/temp-fix-home-fachwissen-overlap.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove overlapping old Fachwissen background selector
        run: |
          python - <<'PY'
          from pathlib import Path

          base = Path('assets/unified-design-base-20260907.css')
          s = base.read_text(encoding='utf-8')
          old = '''html body.site-light-page .home-values__item,\nhtml body.site-light-page .home-paths__grid a,\nhtml body.site-light-page .article-card,'''
          new = '''html body.site-light-page .home-values__item,\nhtml body.site-light-page .article-card,'''
          if s.count(old) != 1:
              raise SystemExit(f'Expected old grouped selector once, found {s.count(old)}')
          base.write_text(s.replace(old,new,1),encoding='utf-8')

          unified = Path('assets/unified-design.css')
          u = unified.read_text(encoding='utf-8')
          old_import = "@import url('./unified-design-base-20260907.css?v=fachwissen-action-align-20260911-1');"
          new_import = "@import url('./unified-design-base-20260907.css?v=home-fachwissen-overlap-fix-20260911-1');"
          if u.count(old_import) != 1:
              raise SystemExit(f'Expected base import once, found {u.count(old_import)}')
          unified.write_text(u.replace(old_import,new_import,1),encoding='utf-8')

          index = Path('index.html')
          h = index.read_text(encoding='utf-8')
          old_link = 'assets/unified-design.css?v=home-fachwissen-final-gradient-20260911-1'
          new_link = 'assets/unified-design.css?v=home-fachwissen-overlap-fix-20260911-1'
          if h.count(old_link) != 1:
              raise SystemExit(f'Expected current Startseite stylesheet link once, found {h.count(old_link)}')
          index.write_text(h.replace(old_link,new_link,1),encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/unified-design-base-20260907.css assets/unified-design.css index.html
          git diff --cached --check
          git commit -m 'Remove old Startseite Fachwissen background overlap'
          git push
