name: Move closing box positioning global v2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/move-closing-box-positioning-global-v2.yml']
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move closing box positioning
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base=Path('assets/unified-design-base-20260907.css')
          glob=Path('assets/global.css')
          b=base.read_text(encoding='utf-8')
          g=glob.read_text(encoding='utf-8')
          start='/* Abschlusskästen: transparent,\nkleine Titel mittig und ohne Zeichen */'
          end='/* Unternehmen: kleine Bereichstitel farblich vereinheitlichen */'
          i=b.find(start); j=b.find(end,i)
          if i<0 or j<0: raise SystemExit('closing box block markers missing')
          block=b[i:j].strip()
          b=b[:i]+b[j:]
          marker='/* Abschlusskästen – gemeinsame Positionierung global */'
          if marker not in g:
              g += '\n' + marker + '\n' + block + '\n'
          base.write_text(b,encoding='utf-8')
          glob.write_text(g,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/global.css assets/unified-design-base-20260907.css
          git commit -m "Abschlusskasten-Positionierung global zentralisieren"
          git rm .github/workflows/move-closing-box-positioning-global-v2.yml
          git commit -m "Temporären Abschlusskasten-Workflow entfernen"
          git push
