name: Report legacy knowledge rules
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/report-legacy-knowledge-rules.yml
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report legacy rules
        run: |
          grep -n -B3 -A8 -E 'knowledge-section.*article-card|article-card.*knowledge-section' assets/global.css || true
      - name: Remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/report-legacy-knowledge-rules.yml
          git commit -m "Temporären Fachwissen-Regelreport entfernen"
          git push
