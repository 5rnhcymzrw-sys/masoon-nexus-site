name: Report remaining page article classes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/report-page-article-classes.yml']
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report classes
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('assets/global.css').read_text(encoding='utf-8')
          names=sorted(set(re.findall(r'page-article-[a-z0-9-]+',s)))
          print('\n'.join(names) if names else 'NONE')
          PY
      - name: Remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/report-page-article-classes.yml
          git commit -m "Temporären Artikelklassen-Workflow entfernen"
          git push