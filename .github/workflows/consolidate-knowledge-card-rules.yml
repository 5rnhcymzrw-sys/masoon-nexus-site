name: Consolidate knowledge card rules
on:
  push:
    branches: [main]
    paths: ['.github/workflows/consolidate-knowledge-card-rules.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate Fachwissen card rules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('assets/unified-design.css')
          s=p.read_text(encoding='utf-8')

          # Remove early card padding/background block; final values are consolidated later.
          s, n = re.subn(r'/\* Fachwissen Hauptseite: Kacheln wie auf der Dienstleistungs-Hauptseite \*/\n@media\(min-width:801px\)\{\n  html body\.site-light-page \.knowledge-section \.articles-grid>\.article-card\{\n    padding:42px 42px 36px!important;\n    background:transparent!important;\n    background-color:transparent!important;\n    background-image:none!important;\n  \}\n\}\n\n', '', s, count=1)
          assert n == 1, 'early card block not found'

          # Consolidate title typography and position into one rule.
          old_title = '''html body.site-light-page .knowledge-section .articles-grid>.article-card>h2{\n  font-family:var(--font-cormorant),Georgia,serif!important;\n  font-size:24px!important;\n  font-weight:600!important;\n  line-height:1.12!important;\n  letter-spacing:0!important;\n  text-transform:none!important;\n  color:#171715!important;\n  -webkit-text-stroke:0!important;\n}\n@media(min-width:1051px){\n  html body.site-light-page .knowledge-section .articles-grid>.article-card{\n    box-sizing:border-box!important;\n    width:100%!important;\n    height:351px!important;\n    min-height:351px!important;\n    max-height:351px!important;\n    padding:42px 42px 36px!important;\n  }\n}\n\n/* Fachwissen Hauptseite: Abstand Beitragstitel zu Fliesstext exakt wie DL Kacheln */\nhtml body.site-light-page .knowledge-section .articles-grid>.article-card>h2{\n  position:relative!important;\n  margin:0!important;\n}\n'''
          new_title = '''/* Fachwissen Hauptseite: Kacheltitel */\nhtml body.site-light-page .knowledge-section .articles-grid>.article-card>h2{\n  position:relative!important;\n  margin:0!important;\n  font-family:var(--font-cormorant),Georgia,serif!important;\n  font-size:24px!important;\n  font-weight:600!important;\n  line-height:1.12!important;\n  letter-spacing:0!important;\n  text-transform:none!important;\n  color:#171715!important;\n  -webkit-text-stroke:0!important;\n}\n'''
          assert old_title in s, 'title/card block not found'
          s=s.replace(old_title,new_title,1)

          # Consolidate knowledge section width/grid rules.
          old_grid = '''/* Fachwissen-Kaesten: exakt gleiche Aussenmasse wie DL-Hauptseite */\n@media(min-width:1051px){\n  html body.site-light-page .knowledge-section{\n    width:min(100% - var(--page-gutter),var(--content-width))!important;\n  }\n  html body.site-light-page .knowledge-section .articles-grid{\n    display:grid!important;\n    width:100%!important;\n    grid-template-columns:repeat(3,minmax(0,1fr))!important;\n    gap:22px!important;\n  }\n}\n@media(min-width:801px) and (max-width:1050px){\n  html body.site-light-page .knowledge-section{\n    width:min(100% - var(--page-gutter),var(--content-width))!important;\n  }\n  html body.site-light-page .knowledge-section .articles-grid{\n    display:grid!important;\n    width:100%!important;\n    grid-template-columns:repeat(2,minmax(0,1fr))!important;\n    gap:22px!important;\n  }\n}\n@media(min-width:801px){\n  html body.site-light-page .knowledge-section .articles-grid>.article-card{\n    box-sizing:border-box!important;\n    width:100%!important;\n    height:351px!important;\n    min-height:351px!important;\n    max-height:351px!important;\n  }\n}\n'''
          new_grid = '''/* Fachwissen Hauptseite: Raster und Kartenmasse */\n@media(min-width:801px){\n  html body.site-light-page .knowledge-section{\n    width:min(100% - var(--page-gutter),var(--content-width))!important;\n  }\n  html body.site-light-page .knowledge-section .articles-grid{\n    display:grid!important;\n    width:100%!important;\n    gap:22px!important;\n  }\n  html body.site-light-page .knowledge-section .articles-grid>.article-card{\n    box-sizing:border-box!important;\n    width:100%!important;\n    height:351px!important;\n    min-height:351px!important;\n    max-height:351px!important;\n    padding:88px 42px 36px!important;\n    background:transparent!important;\n    background-color:transparent!important;\n    background-image:none!important;\n  }\n}\n@media(min-width:1051px){\n  html body.site-light-page .knowledge-section .articles-grid{grid-template-columns:repeat(3,minmax(0,1fr))!important;}\n}\n@media(min-width:801px) and (max-width:1050px){\n  html body.site-light-page .knowledge-section .articles-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;}\n}\n'''
          assert old_grid in s, 'grid block not found'
          s=s.replace(old_grid,new_grid,1)

          # Remove later desktop padding-top override, now folded into canonical card rule.
          s, n = re.subn(r'/\* Fachwissen Hauptseite: Kacheltitel 2 Pixel kleiner,\noberer Abstand 88 Pixel \*/\n@media\(min-width:801px\)\{\n  html body\.site-light-page main \.knowledge-section \.articles-grid>\.article-card\{\n    padding-top:88px!important;\n  \}\n\}\n\n', '', s, count=1)
          assert n == 1, 'desktop padding override not found'

          # Consolidate article action rules while preserving exact final values.
          old_action = '''/* Mehr anzeigen und Beitrag anzeigen: identische Schrift- und Boxwerte */\nhtml body.site-light-page main .services-section .service-card .details-action,\nhtml body.site-light-page main .knowledge-section .article-card .article-action{\n  display:inline-block!important;\n  position:relative!important;\n  height:auto!important;\n  min-height:0!important;\n  margin-bottom:0!important;\n  padding:0!important;\n  border:0!important;\n  text-decoration:none!important;\n  text-shadow:none!important;\n  -webkit-text-stroke:0!important;\n  opacity:1!important;\n  transform:translateY(-3px)!important;\n}\nhtml body.site-light-page main .knowledge-section .article-card .article-action{\n  margin-top:auto!important;\n  align-self:flex-start!important;\n}\n/* Der Pfeil verändert die Höhe der Beschriftung nicht */\nhtml body.site-light-page main .knowledge-section .article-card .article-action::after{\n  position:absolute!important;\n  left:calc(100% + 10px)!important;\n  top:50%!important;\n  margin:0!important;\n  transform:translateY(-50%)!important;\n}\n\n/* Endgültiger Vorrang: beide Aktionsbeschriftungen exakt gleich */\nhtml body.site-light-page main .knowledge-section .articles-grid>.article-card>.article-action{\n  display:inline-block!important;\n  position:relative!important;\n  height:auto!important;\n  min-height:0!important;\n  margin-top:auto!important;\n  margin-right:0!important;\n  margin-bottom:0!important;\n  margin-left:0!important;\n  padding:0!important;\n  border:0!important;\n  align-self:flex-start!important;\n  text-decoration:none!important;\n  text-shadow:none!important;\n  -webkit-text-stroke:0!important;\n  color:var(--article-action-color,#777777)!important;\n  opacity:1!important;\n}\n\n/* Gemessener Positionsausgleich: Beitrag anzeigen auf gleicher Hoehe */\nhtml body.site-light-page main .knowledge-section .articles-grid>.article-card>.article-action{\n  transform:translateY(-3px)!important;\n}\n'''
          new_action = '''/* Fachwissen Hauptseite: Beitragsaktion */\nhtml body.site-light-page main .knowledge-section .article-card .article-action{\n  display:inline-block!important;\n  position:relative!important;\n  height:auto!important;\n  min-height:0!important;\n  margin:auto 0 0!important;\n  padding:0!important;\n  border:0!important;\n  align-self:flex-start!important;\n  text-decoration:none!important;\n  text-shadow:none!important;\n  -webkit-text-stroke:0!important;\n  color:var(--article-action-color,#777777)!important;\n  opacity:1!important;\n  transform:translateY(-3px)!important;\n}\nhtml body.site-light-page main .knowledge-section .article-card .article-action::after{\n  position:absolute!important;\n  left:calc(100% + 10px)!important;\n  top:50%!important;\n  margin:0!important;\n  transform:translateY(-50%)!important;\n}\n/* Dienstleistungen Hauptseite: Aktionsposition */\nhtml body.site-light-page main .services-section .service-card .details-action{\n  display:inline-block!important;\n  position:relative!important;\n  height:auto!important;\n  min-height:0!important;\n  margin-bottom:0!important;\n  padding:0!important;\n  border:0!important;\n  text-decoration:none!important;\n  text-shadow:none!important;\n  -webkit-text-stroke:0!important;\n  opacity:1!important;\n  transform:translateY(-3px)!important;\n}\n'''
          assert old_action in s, 'action block not found'
          s=s.replace(old_action,new_action,1)

          # Fold mobile top padding into the date/card mobile block and keep exact values.
          old_mobile = '''@media(max-width:800px){\n  html body.site-light-page main .knowledge-section .articles-grid>.article-card{\n    padding-top:78px!important;\n  }\n  html body.site-light-page main .knowledge-section .articles-grid>.article-card>.article-card-date{\n    top:28px!important;\n    left:26px!important;\n  }\n}\n'''
          new_mobile = '''@media(max-width:800px){\n  html body.site-light-page main .knowledge-section .articles-grid>.article-card{padding-top:78px!important;}\n  html body.site-light-page main .knowledge-section .articles-grid>.article-card>.article-card-date{top:28px!important;left:26px!important;}\n}\n'''
          assert old_mobile in s
          s=s.replace(old_mobile,new_mobile,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/unified-design.css
          git commit -m "Fachwissen-Kartenregeln zusammenfassen"
          git rm .github/workflows/consolidate-knowledge-card-rules.yml
          git commit -m "Temporären Fachwissen-Karten-Workflow entfernen"
          git push
