<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MASOON TREUHAND – Hero Weichheit Test</title>
<style>
html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#111}body{display:grid;grid-template-rows:58px 1fr;overflow:hidden}.tester{display:flex;align-items:center;gap:7px;padding:0 14px;background:#f3f3f3;border-bottom:1px solid #ccc;overflow-x:auto;z-index:10}.tester strong{font-size:13px;white-space:nowrap;margin-right:5px}.tester button{border:1px solid #c9c9c9;background:#fff;padding:9px 13px;font-size:12px;cursor:pointer;white-space:nowrap}.tester button.active{background:#111;color:#fff;border-color:#111}iframe{width:100%;height:100%;border:0;background:#fff}
</style>
</head><body>
<div class="tester"><strong>Bücherregal-Weichheit</strong><button data-v="0" class="active">Original</button><button data-v="1">1 · Sehr leicht</button><button data-v="2">2 · Leicht</button><button data-v="3">3 · Mittel</button><button data-v="4">4 · Weich</button><button data-v="5">5 · Sehr weich</button><button data-v="6">6 · Maximal weich</button></div>
<iframe id="site" src="./index.html"></iframe>
<script>
const f=document.getElementById('site'),bs=[...document.querySelectorAll('button[data-v]')];let current='0';
const css=`@media(min-width:801px){
html[class*="hero-soft-"] body .home-hero__portrait-image{will-change:filter!important}
html.hero-soft-1 body .home-hero__portrait-image{filter:blur(1px)!important;transform:scale(1.003)!important}
html.hero-soft-2 body .home-hero__portrait-image{filter:blur(2px)!important;transform:scale(1.006)!important}
html.hero-soft-3 body .home-hero__portrait-image{filter:blur(3px)!important;transform:scale(1.009)!important}
html.hero-soft-4 body .home-hero__portrait-image{filter:blur(4.5px)!important;transform:scale(1.014)!important}
html.hero-soft-5 body .home-hero__portrait-image{filter:blur(6px)!important;transform:scale(1.019)!important}
html.hero-soft-6 body .home-hero__portrait-image{filter:blur(8px)!important;transform:scale(1.026)!important}
}`;
function apply(v){const d=f.contentDocument;if(!d)return;[...d.documentElement.classList].filter(c=>c.startsWith('hero-soft-')).forEach(c=>d.documentElement.classList.remove(c));let s=d.getElementById('hero-soft-test');if(!s){s=d.createElement('style');s.id='hero-soft-test';s.textContent=css;d.head.appendChild(s)}if(v!=='0')d.documentElement.classList.add('hero-soft-'+v);bs.forEach(b=>b.classList.toggle('active',b.dataset.v===v));current=v}
f.addEventListener('load',()=>apply(current));bs.forEach(b=>b.addEventListener('click',()=>apply(b.dataset.v)));
</script></body></html>
