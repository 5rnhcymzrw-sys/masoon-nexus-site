name: optimize-hero-image

on:
  push:
    paths:
      - '.github/workflows/optimize-hero-image.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Optimize hero image and update HTML
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path('Foto-hero.png')
          dst = Path('Foto-hero.webp')
          html_path = Path('index.html')

          if not src.exists():
              raise SystemExit('Foto-hero.png is missing')

          source_size = src.stat().st_size
          with Image.open(src) as im:
              icc = im.info.get('icc_profile')
              exif = im.info.get('exif')
              if im.mode not in ('RGB', 'RGBA'):
                  im = im.convert('RGBA' if 'A' in im.getbands() else 'RGB')
              save_args = {
                  'format': 'WEBP',
                  'quality': 94,
                  'method': 6,
              }
              if icc:
                  save_args['icc_profile'] = icc
              if exif:
                  save_args['exif'] = exif
              im.save(dst, **save_args)
              print('dimensions', im.size)

          target_size = dst.stat().st_size
          print('source_bytes', source_size)
          print('target_bytes', target_size)
          if target_size >= source_size:
              raise SystemExit('WebP is not smaller than PNG')

          html = html_path.read_text(encoding='utf-8')
          old_preload = '<link rel="preload" as="image" href="Foto-hero.png" fetchpriority="high" />'
          new_preload = '<link rel="preload" as="image" href="Foto-hero.webp" type="image/webp" fetchpriority="high" />'
          if html.count(old_preload) != 1:
              raise SystemExit('Unexpected hero preload occurrence count')
          if html.count('src="Foto-hero.png"') != 1:
              raise SystemExit('Unexpected hero img occurrence count')
          html = html.replace(old_preload, new_preload)
          html = html.replace('src="Foto-hero.png"', 'src="Foto-hero.webp"')
          html_path.write_text(html, encoding='utf-8')
          PY

      - name: Commit optimized asset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html Foto-hero.webp
          git rm .github/workflows/optimize-hero-image.yml
          git commit -m "Hero image: optimized WebP for faster first paint"
          git push
