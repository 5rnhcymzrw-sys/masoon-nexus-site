<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MASOON TREUHAND – Hero Weichheit Test</title>
<style>
html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#111}body{display:grid;grid-template-rows:58px 1fr;overflow:hidden}.tester{display:flex;align-items:center;gap:7px;padding:0 14px;background:#f3f3f3;border-bottom:1px solid #ccc;overflow-x:auto;z-index:10}.tester strong{font-size:13px;white-space:nowrap;margin-right:5px}.tester button{border:1px solid #c9c9c9;background:#fff;padding:9px 13px;font-size:12px;cursor:pointer;white-space:nowrap}.tester button.active{background:#111;color:#fff;border-color:#111}iframe{width:100%;height:100%;border:0;background:#fff}
</style>
</head><body>
<div class="tester"><strong>Bücherregal-Weichheit</strong><button data-v="0">Original</button><button data-v="8">8</button><button data-v="9">9</button><button data-v="10">10</button><button data-v="11">11</button><button data-v="12">12</button><button data-v="13">13</button><button data-v="14">14</button><button data-v="15">15</button><button data-v="15clean" class="active">15 · ohne Text</button></div>
<iframe id="site" src="./index.html"></iframe>
<script>
const f=document.getElementById('site'),bs=[...document.querySelectorAll('button[data-v]')];let current='15clean';
const css=`@media(min-width:801px){
html[class*="hero-soft-"] body .home-hero__portrait-image{will-change:filter,transform!important}
html[class*="hero-soft-"] body .home-hero__text-surface{will-change:backdrop-filter!important}
html.hero-soft-8 body .home-hero__portrait-image{filter:blur(8px)!important;transform:scale(1.026)!important}html.hero-soft-8 body .home-hero__text-surface{backdrop-filter:blur(8px)!important;-webkit-backdrop-filter:blur(8px)!important}
html.hero-soft-9 body .home-hero__portrait-image{filter:blur(9px)!important;transform:scale(1.029)!important}html.hero-soft-9 body .home-hero__text-surface{backdrop-filter:blur(9px)!important;-webkit-backdrop-filter:blur(9px)!important}
html.hero-soft-10 body .home-hero__portrait-image{filter:blur(10px)!important;transform:scale(1.032)!important}html.hero-soft-10 body .home-hero__text-surface{backdrop-filter:blur(10px)!important;-webkit-backdrop-filter:blur(10px)!important}
html.hero-soft-11 body .home-hero__portrait-image{filter:blur(11px)!important;transform:scale(1.035)!important}html.hero-soft-11 body .home-hero__text-surface{backdrop-filter:blur(11px)!important;-webkit-backdrop-filter:blur(11px)!important}
html.hero-soft-12 body .home-hero__portrait-image{filter:blur(12px)!important;transform:scale(1.038)!important}html.hero-soft-12 body .home-hero__text-surface{backdrop-filter:blur(12px)!important;-webkit-backdrop-filter:blur(12px)!important}
html.hero-soft-13 body .home-hero__portrait-image{filter:blur(13px)!important;transform:scale(1.041)!important}html.hero-soft-13 body .home-hero__text-surface{backdrop-filter:blur(13px)!important;-webkit-backdrop-filter:blur(13px)!important}
html.hero-soft-14 body .home-hero__portrait-image{filter:blur(14px)!important;transform:scale(1.044)!important}html.hero-soft-14 body .home-hero__text-surface{backdrop-filter:blur(14px)!important;-webkit-backdrop-filter:blur(14px)!important}
html.hero-soft-15 body .home-hero__portrait-image,html.hero-soft-15clean body .home-hero__portrait-image{filter:blur(15px)!important;transform:scale(1.047)!important}html.hero-soft-15 body .home-hero__text-surface,html.hero-soft-15clean body .home-hero__text-surface{backdrop-filter:blur(15px)!important;-webkit-backdrop-filter:blur(15px)!important}
html.hero-soft-15clean body .home-hero__copy h1,html.hero-soft-15clean body .home-hero__copy p{visibility:hidden!important}
}`;
function apply(v){const d=f.contentDocument;if(!d)return;[...d.documentElement.classList].filter(c=>c.startsWith('hero-soft-')).forEach(c=>d.documentElement.classList.remove(c));let s=d.getElementById('hero-soft-test');if(!s){s=d.createElement('style');s.id='hero-soft-test';s.textContent=css;d.head.appendChild(s)}if(v!=='0')d.documentElement.classList.add('hero-soft-'+v);bs.forEach(b=>b.classList.toggle('active',b.dataset.v===v));current=v}
f.addEventListener('load',()=>apply(current));bs.forEach(b=>b.addEventListener('click',()=>apply(b.dataset.v)));
</script></body></html>
