name: Centralize section labels
on:
  push:
    branches: [main]
    paths: ['.github/workflows/centralize-section-labels.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Centralize section labels
        run: python .github/scripts/centralize_section_labels.py
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.css
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m "Kleine Bereichstitel global vereinheitlichen"
          git push origin main
