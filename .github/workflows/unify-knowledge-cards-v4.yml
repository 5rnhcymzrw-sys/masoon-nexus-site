name: Unify knowledge cards v4
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/unify-knowledge-cards-v4.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch cleanup script
        run: python3 scripts/patch-unify-knowledge-cards.py
      - name: Apply shared knowledge card component
        run: python3 scripts/unify-knowledge-cards.py
      - name: Verify single source
        run: |
          grep -n 'home-paths__grid articles-grid' index.html
          if grep -n '<style>' fachwissen/index.html; then exit 1; fi
          if grep -nE 'home-path-date|home-path-copy|page-home\.site-light-page main\.home section\.home-paths \.home-paths__grid>a' assets/global.css; then exit 1; fi
          if grep -nE 'knowledge-section.*article-card' assets/global.css; then exit 1; fi
          if grep -nE 'page-knowledge.*article-card' assets/unified-design.css; then exit 1; fi
          grep -n -A35 'Fachwissen-Karten: gemeinsame globale Komponente' assets/global.css
          if grep -n 'lineStyle' assets/site.js; then exit 1; fi
          grep -n "document.querySelectorAll('.article-card')" assets/site.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html fachwissen/index.html assets/global.css assets/unified-design.css assets/site.js
          git commit -m "Fachwissen-Karten global vereinheitlichen"
          git rm scripts/unify-knowledge-cards.py scripts/patch-unify-knowledge-cards.py .github/workflows/unify-knowledge-cards.yml .github/workflows/unify-knowledge-cards-v2.yml .github/workflows/unify-knowledge-cards-v3.yml .github/workflows/unify-knowledge-cards-v4.yml
          git commit -m "Temporäre Karten-Bereinigung entfernen"
          git push
