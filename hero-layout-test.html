<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>MASOON TREUHAND – Hero Layout Test</title>
<style>
html,body{margin:0;height:100%;background:#111;font-family:Arial,sans-serif}
body{display:grid;grid-template-rows:58px 1fr;overflow:hidden}
.tester{display:flex;align-items:center;gap:7px;padding:0 14px;background:#f3f3f3;border-bottom:1px solid #ccc;box-sizing:border-box;z-index:10;overflow-x:auto}
.tester strong{font-size:13px;margin-right:6px;font-weight:600;white-space:nowrap}
.tester button{appearance:none;border:1px solid #c9c9c9;background:#fff;padding:9px 12px;font-size:12px;cursor:pointer;white-space:nowrap}
.tester button.active{background:#111;color:#fff;border-color:#111}
.tester small{margin-left:auto;color:#666;font-size:11px;white-space:nowrap}
iframe{width:100%;height:100%;border:0;background:#fff;display:block}
@media(max-width:900px){.tester strong,.tester small{display:none}}
</style>
</head>
<body>
<div class="tester">
<strong>Hero vergleichen</strong>
<button data-v="original">Original</button>
<button data-v="v3" class="active">3 · Foto dominant</button>
<button data-v="v4">4 · Transparente Fläche</button>
<button data-v="v5">5 · Transparent links</button>
<button data-v="v6">6 · Editorial Vollbild</button>
<button data-v="v7">7 · Glasfläche</button>
<button data-v="v8">8 · Horizontales Band</button>
<button data-v="v9">9 · Diagonaler Schleier</button>
<button data-v="v10">10 · Rahmenfläche</button>
<button data-v="v11">11 · Weiss auslaufend</button>
<button data-v="v12">12 · Blaugrau Akzent</button>
<button data-v="v13">13 · Frosted Panel</button>
<button data-v="v14">14 · Doppelter Verlauf</button>
<small>Nur Vorschau – Startseite bleibt unverändert</small>
</div>
<iframe id="site" src="./index.html"></iframe>
<script>
const frame=document.getElementById('site');
const buttons=[...document.querySelectorAll('button[data-v]')];
let current='v3';
const css=`
/* Gemeinsame Regel: Textposition bleibt exakt wie auf der aktuellen Startseite. */
html[class*="hero-test-"] body.site-light-page main.home section.home-hero{overflow:hidden!important;background:#f4f2ee!important}
html[class*="hero-test-"] body.site-light-page main.home section.home-hero::before{background:none!important;transform:none!important}
html[class*="hero-test-"] body.site-light-page main.home section.home-hero .home-hero__copy{position:relative!important;z-index:4!important;background:transparent!important;border:0!important;border-image:none!important;box-shadow:none!important}
html[class*="hero-test-"] body.site-light-page main.home section.home-hero .home-hero__copy::before{content:'';position:absolute;z-index:-1;pointer-events:none}

@media(min-width:801px){
/* 3: Foto über ganzen Hero, aber Text bleibt an der ursprünglichen Position. */
html.hero-test-v3 body.site-light-page main.home section.home-hero .home-hero__portrait{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;transform:none!important;clip-path:none!important;z-index:1!important}
html.hero-test-v3 body.site-light-page main.home section.home-hero .home-hero__portrait-image{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;object-fit:cover!important;object-position:right 18%!important;transform:none!important}
html.hero-test-v3 body.site-light-page main.home section.home-hero .home-hero__portrait::after{content:''!important;position:absolute!important;inset:0!important;width:100%!important;background:linear-gradient(90deg,rgba(243,232,212,.94) 0%,rgba(232,229,223,.72) 28%,rgba(199,203,211,.28) 49%,rgba(0,0,0,.03) 69%,rgba(0,0,0,.04) 100%)!important}

/* 4: transparente Fläche exakt hinter dem bestehenden Textblock. */
html.hero-test-v4 body.site-light-page main.home section.home-hero .home-hero__copy::before{inset:-18px -28px;background:linear-gradient(110deg,rgba(255,255,255,.60),rgba(243,232,212,.42),rgba(199,203,211,.18));backdrop-filter:blur(2px)}

/* 5: transparente Fläche weiter nach links bis zur Logo-/Containerachse, Text bleibt stehen. */
html.hero-test-v5 body.site-light-page main.home section.home-hero .home-hero__copy::before{top:-18px;bottom:-18px;left:-46px;right:-28px;background:rgba(255,255,255,.58);backdrop-filter:blur(3px)}

/* 6: Editorial Vollbild – gewünschte grosse Bildversion. */
html.hero-test-v6 body.site-light-page main.home section.home-hero .home-hero__portrait{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;transform:none!important;clip-path:none!important;z-index:1!important}
html.hero-test-v6 body.site-light-page main.home section.home-hero .home-hero__portrait-image{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;object-fit:cover!important;object-position:right 18%!important;transform:none!important}
html.hero-test-v6 body.site-light-page main.home section.home-hero .home-hero__portrait::after{content:''!important;position:absolute!important;inset:0!important;width:100%!important;background:linear-gradient(90deg,rgba(243,232,212,.88) 0%,rgba(232,229,223,.54) 31%,rgba(199,203,211,.12) 53%,transparent 70%)!important}
html.hero-test-v6 body.site-light-page main.home section.home-hero .home-hero__copy::before{inset:-22px -30px;background:rgba(255,255,255,.25);backdrop-filter:blur(2px)}

/* 7: Glasfläche – klare vertikale Glaskante, ohne Textverschiebung. */
html.hero-test-v7 body.site-light-page main.home section.home-hero::after{content:''!important;position:absolute!important;z-index:2!important;top:10%!important;bottom:10%!important;left:0!important;width:48%!important;background:linear-gradient(90deg,rgba(255,255,255,.62),rgba(243,232,212,.28),rgba(232,229,223,.12))!important;backdrop-filter:blur(3px)!important;border-right:1px solid rgba(141,150,168,.18)!important;pointer-events:none!important}

/* 8: horizontales transparentes Band quer durch den Hero. */
html.hero-test-v8 body.site-light-page main.home section.home-hero::after{content:''!important;position:absolute!important;z-index:2!important;left:0!important;right:0!important;top:38%!important;height:37%!important;background:linear-gradient(90deg,rgba(243,232,212,.68),rgba(232,229,223,.42) 44%,rgba(199,203,211,.16) 66%,rgba(255,255,255,0) 82%)!important;pointer-events:none!important}

/* 9: diagonaler Schleier aus der bestehenden Palette. */
html.hero-test-v9 body.site-light-page main.home section.home-hero::after{content:''!important;position:absolute!important;z-index:2!important;inset:-10% 38% -10% -12%!important;background:linear-gradient(125deg,rgba(243,232,212,.82) 0%,rgba(232,229,223,.50) 56%,rgba(199,203,211,.10) 100%)!important;clip-path:polygon(0 0,76% 0,100% 100%,0 100%)!important;pointer-events:none!important}

/* 10: fast transparente Fläche nur mit feinem Verlaufsrahmen. */
html.hero-test-v10 body.site-light-page main.home section.home-hero .home-hero__copy::before{inset:-20px -30px;background:rgba(255,255,255,.16);border:1px solid transparent;border-image:linear-gradient(110deg,#f3e8d4 0%,#e8e5df 38%,#c7cbd3 66%,#8d96a8 100%) 1}

/* 11: links nahezu weiss, weich und vollständig ins Bild auslaufend. */
html.hero-test-v11 body.site-light-page main.home section.home-hero::after{content:''!important;position:absolute!important;z-index:2!important;inset:0!important;background:linear-gradient(90deg,rgba(255,255,255,.96) 0%,rgba(243,232,212,.78) 28%,rgba(232,229,223,.34) 46%,rgba(199,203,211,.08) 59%,transparent 72%)!important;pointer-events:none!important}

/* 12: schmaler Blaugrau-Akzent links neben dem Textbereich. */
html.hero-test-v12 body.site-light-page main.home section.home-hero::after{content:''!important;position:absolute!important;z-index:2!important;left:0!important;top:0!important;bottom:0!important;width:17%!important;background:linear-gradient(180deg,rgba(199,203,211,.18),rgba(141,150,168,.12))!important;pointer-events:none!important}
html.hero-test-v12 body.site-light-page main.home section.home-hero .home-hero__copy::before{inset:-18px -28px;background:linear-gradient(110deg,rgba(243,232,212,.58),rgba(255,255,255,.22));}

/* 13: Frosted Panel – milchig, aber ohne weissen Kastencharakter. */
html.hero-test-v13 body.site-light-page main.home section.home-hero .home-hero__copy::before{inset:-28px -38px;background:linear-gradient(110deg,rgba(255,255,255,.42),rgba(232,229,223,.24),rgba(199,203,211,.10));backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.38)}

/* 14: zwei weich überlagerte Verläufe, ohne zusätzliche Form. */
html.hero-test-v14 body.site-light-page main.home section.home-hero::after{content:''!important;position:absolute!important;z-index:2!important;inset:0!important;background:radial-gradient(ellipse at 16% 46%,rgba(243,232,212,.72) 0%,rgba(232,229,223,.34) 34%,transparent 61%),linear-gradient(90deg,rgba(199,203,211,.10) 0%,transparent 58%)!important;pointer-events:none!important}
}

@media(max-width:800px){
html[class*="hero-test-"] body.site-light-page main.home section.home-hero .home-hero__copy::before{inset:-14px!important;background:rgba(255,255,255,.72)!important;backdrop-filter:none!important;border:0!important}
}
`;
function apply(v){
 const d=frame.contentDocument;if(!d)return;
 [...d.documentElement.classList].filter(c=>c.startsWith('hero-test-')).forEach(c=>d.documentElement.classList.remove(c));
 if(v!=='original')d.documentElement.classList.add('hero-test-'+v);
 let st=d.getElementById('hero-layout-test-styles');
 if(!st){st=d.createElement('style');st.id='hero-layout-test-styles';st.textContent=css;d.head.appendChild(st)}
 buttons.forEach(b=>b.classList.toggle('active',b.dataset.v===v));
 current=v;
}
frame.addEventListener('load',()=>apply(current));
buttons.forEach(b=>b.addEventListener('click',()=>apply(b.dataset.v)));
</script>
</body>
</html>
