name: temp dl cards final
on:
  push:
    paths:
      - '.github/workflows/temp-dl-cards-final.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update existing DL card rule only
        run: |
          python - <<'PY'
          from pathlib import Path

          base = Path('assets/unified-design-base-20260907.css')
          s = base.read_text(encoding='utf-8')
          old = '''/* Dienstleistungen Hauptseite: Karten wie Startseite Dienstleistungen */
html body.site-light-page .services-main .services-section .services-grid>.service-card,
html body.site-light-page .services-main .services-section .services-grid>.service-card:hover,
html body.site-light-page .services-main .services-section .services-grid>.service-card[open]{
  background:linear-gradient(to right in oklab,rgba(243,232,212,.11) 0%,rgba(232,229,223,.11) 36%,rgba(199,203,211,.11) 68%,rgba(141,150,168,.11) 100%)!important;
  background-size:calc(300% + 44px) 100%!important;
  background-position:left top!important;
  background-repeat:no-repeat!important;
  background-origin:border-box!important;
  -webkit-backdrop-filter:blur(32px)!important;
  backdrop-filter:blur(32px)!important;
}'''
          new = '''/* Dienstleistungen Hauptseite: Karten wie Startseite Dienstleistungen */
html body.site-light-page .services-main .services-section .services-grid>.service-card,
html body.site-light-page .services-main .services-section .services-grid>.service-card:hover,
html body.site-light-page .services-main .services-section .services-grid>.service-card[open]{
  background:linear-gradient(to right in oklab,rgba(244,228,201,.11) 0%,rgba(232,227,218,.11) 36%,rgba(193,199,214,.11) 68%,rgba(132,144,171,.11) 100%)!important;
  background-size:calc(300% + 44px) 100%!important;
  background-position:left top!important;
  background-repeat:no-repeat!important;
  background-origin:border-box!important;
  border:0!important;
  border-image:none!important;
  -webkit-backdrop-filter:blur(32px)!important;
  backdrop-filter:blur(32px)!important;
}'''
          if s.count(old) != 1:
              raise SystemExit(f'Expected one DL card block, found {s.count(old)}')
          base.write_text(s.replace(old,new,1), encoding='utf-8')

          unified = Path('assets/unified-design.css')
          u = unified.read_text(encoding='utf-8')
          old_import = "@import url('./unified-design-base-20260907.css?v=pt-serif-bold-20260910-1');"
          new_import = "@import url('./unified-design-base-20260907.css?v=dl-cards-final-20260911-1');"
          if u.count(old_import) != 1:
              raise SystemExit(f'Expected one base import, found {u.count(old_import)}')
          unified.write_text(u.replace(old_import,new_import,1), encoding='utf-8')

          page = Path('dienstleistungen/index.html')
          h = page.read_text(encoding='utf-8')
          old_link = '../assets/unified-design.css?v=logo-icon-restored-20260910-1'
          new_link = '../assets/unified-design.css?v=dl-cards-final-20260911-1'
          if h.count(old_link) != 1:
              raise SystemExit(f'Expected one unified stylesheet link, found {h.count(old_link)}')
          page.write_text(h.replace(old_link,new_link,1), encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/unified-design-base-20260907.css assets/unified-design.css dienstleistungen/index.html
          git diff --cached --check
          git commit -m 'Style DL cards with variant 2 blur and no borders'
          git push
