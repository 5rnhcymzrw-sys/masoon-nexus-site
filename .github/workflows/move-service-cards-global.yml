name: Move service cards global
on:
  push:
    branches: [main]
    paths: ['.github/workflows/move-service-cards-global.yml']
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move service card rules
        run: |
          python3 <<'PY'
          from pathlib import Path
          src = Path('assets/dienstleistungen.css')
          dst = Path('assets/global.css')
          css = src.read_text(encoding='utf-8')
          marker = '/* Dienstleistungskacheln – zentrale globale Komponente */'
          closing_start = css.index('/* Abschluss der Dienstleistungsseite */')
          cards_again = css.index('/* Dienstleistungskacheln: leichter,', closing_start)
          closing = css[closing_start:cards_again].strip() + '\n'
          cards = (css[:closing_start].rstrip() + '\n\n' + css[cards_again:].lstrip()).strip() + '\n'
          assert '.service-card' in cards
          assert '.service-card' not in closing
          g = dst.read_text(encoding='utf-8')
          assert marker not in g
          src.write_text(closing, encoding='utf-8')
          dst.write_text(g.rstrip() + '\n\n' + marker + '\n' + cards + '\n', encoding='utf-8')
          assert '.service-card' not in src.read_text(encoding='utf-8')
          assert marker in dst.read_text(encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/global.css assets/dienstleistungen.css
          git commit -m "Dienstleistungskacheln nach global.css verschieben"
          git rm .github/workflows/move-service-cards-global.yml
          git commit -m "Temporären Dienstleistungskachel-Workflow entfernen"
          git push