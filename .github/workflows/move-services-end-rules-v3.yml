name: Move services end rules v3
on:
  push:
    branches: [main]
    paths: ['.github/workflows/move-services-end-rules-v3.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply service rule move
        run: python3 scripts/move_services_rules.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/unified-design.css assets/dienstleistungen.css
          git commit -m "Dienstleistungs-Endregeln vollständig zentralisieren"
          git rm .github/workflows/move-services-end-rules-v3.yml scripts/move_services_rules.py
          git commit -m "Temporäre Dienstleistungs-Hilfsdateien entfernen"
          git push
