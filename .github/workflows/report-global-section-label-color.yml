name: Report global section label color
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/report-global-section-label-color.yml
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('assets/global.css').read_text(encoding='utf-8')
          for i,m in enumerate(re.finditer(r'[^{}]*\.section-label[^{}]*\{[^{}]*\}', s, re.S),1):
              block=m.group(0)
              if re.search(r'\bcolor\s*:', block):
                  line=s[:m.start()].count('\n')+1
                  print(f'--- HIT {i} line {line} ---')
                  print(block)
          PY
      - name: Remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/report-global-section-label-color.yml
          git commit -m "Temporären Bereichstitel-Farbreport entfernen"
          git push
