name: Optimize image loading
on:
  push:
    branches: [main]
    paths: ['.github/workflows/optimize-image-loading.yml']
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create optimized background
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
          cwebp -quiet -q 90 -m 6 -metadata none "Hintergrundbild 2.png" -o "Hintergrundbild 2.webp"
          echo "PNG bytes:  $(stat -c%s 'Hintergrundbild 2.png')"
          echo "WebP bytes: $(stat -c%s 'Hintergrundbild 2.webp')"
      - name: Update image loading
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          css = Path('assets/global.css')
          s = css.read_text(encoding='utf-8')
          old = 'background-image:url("../Hintergrundbild 2.png")!important;'
          assert old in s
          s = s.replace(old, 'background-image:url("../Hintergrundbild 2.webp")!important;', 1)
          old_fixed = 'background-attachment:fixed!important;'
          assert old_fixed in s
          s = s.replace(old_fixed, 'background-attachment:scroll!important;', 1)
          css.write_text(s, encoding='utf-8')

          production = [Path('index.html')]
          for folder in ['unternehmen','dienstleistungen','fachwissen','kontakt','disclaimer','impressum','datenschutz']:
              root = Path(folder)
              if root.exists():
                  production.extend(root.rglob('index.html'))

          for html in sorted(set(production)):
              text = html.read_text(encoding='utf-8')
              rel_bg = os.path.relpath('Hintergrundbild 2.webp', html.parent).replace(os.sep, '/')
              preload = f'<link rel="preload" as="image" href="{rel_bg}" type="image/webp" />'
              if 'Hintergrundbild 2.webp' not in text:
                  matches = list(re.finditer(r'<link\s+rel="preload"\s+as="image"[^>]*>', text))
                  if matches:
                      pos = matches[-1].end()
                      text = text[:pos] + '\n' + preload + text[pos:]
                  else:
                      m = re.search(r'<link\s+[^>]*rel="stylesheet"', text)
                      assert m, f'Kein Stylesheet-Marker in {html}'
                      text = text[:m.start()] + preload + '\n' + text[m.start():]

              def tune_logo(match):
                  tag = match.group(0)
                  tag = tag.replace('decoding="sync"', 'decoding="async"')
                  tag = tag.replace(' fetchpriority="high"', '')
                  return tag
              text = re.sub(r'<img\b[^>]*class="home-logo-icon"[^>]*>', tune_logo, text)
              text = re.sub(r'<img\b[^>]*class="home-logo-text"[^>]*>', tune_logo, text)
              text = re.sub(r'global\.css\?v=[^"\']+', 'global.css?v=image-loading-20260915-1', text)
              html.write_text(text, encoding='utf-8')

          assert Path('Hintergrundbild 2.webp').stat().st_size < Path('Hintergrundbild 2.png').stat().st_size
          assert 'Hintergrundbild 2.webp' in Path('assets/global.css').read_text(encoding='utf-8')
          assert 'background-attachment:fixed' not in Path('assets/global.css').read_text(encoding='utf-8')
          PY
      - name: Verify critical image settings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          home = Path('index.html').read_text(encoding='utf-8')
          company = Path('unternehmen/index.html').read_text(encoding='utf-8')
          assert 'href="Foto-hero.webp"' in home and 'fetchpriority="high"' in home
          assert 'href="../Foto-unternehmen.webp"' in company and 'fetchpriority="high"' in company
          assert 'Hintergrundbild 2.webp' in home
          assert 'Hintergrundbild 2.webp' in company
          for text in [home, company]:
              for cls in ['home-logo-icon','home-logo-text']:
                  m = re.search(rf'<img\b[^>]*class="{cls}"[^>]*>', text)
                  assert m
                  assert 'decoding="async"' in m.group(0)
                  assert 'fetchpriority="high"' not in m.group(0)
          print('Critical image settings verified')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Hintergrundbild 2.webp" assets/global.css index.html unternehmen dienstleistungen fachwissen kontakt disclaimer impressum datenschutz
          git commit -m "Bildladen optimieren"
          git push
      - name: Remove temporary workflow
        run: |
          git pull --rebase
          git rm .github/workflows/optimize-image-loading.yml
          git commit -m "Temporären Bildlade-Workflow entfernen"
          git push
