<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MASOON TREUHAND – Test stärkere Farben</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#fff;font-family:Arial,sans-serif}
iframe{display:block;width:100%;height:100vh;border:0;background:#fff}
.test-panel{position:fixed;right:10px;top:10px;z-index:99999;width:245px;max-width:calc(100vw - 20px);padding:9px;background:rgba(255,255,255,.98);border:1px solid #bdbdbd;box-shadow:0 4px 18px rgba(0,0,0,.14)}
.test-title{margin:0 0 8px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#171715}
.test-row{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 7px}
.test-label{width:100%;font-size:8px;letter-spacing:.06em;color:#777;text-transform:uppercase;margin-bottom:2px}
.test-panel button{appearance:none;border:1px solid #aaa;background:#fff;color:#171715;padding:6px 7px;font-size:9px;line-height:1;cursor:pointer}
.test-panel button.active{background:#171715;color:#fff;border-color:#171715}
.hint{font-size:8px;line-height:1.35;color:#777;margin-top:5px}
@media(max-width:560px){.test-panel{right:6px;top:6px;width:225px;max-width:calc(100vw - 12px)}}
</style>
</head>
<body>
<iframe id="site" src="./index.html?v=strong-colors-test-5"></iframe>
<div class="test-panel" aria-label="Teststeuerung">
  <p class="test-title">Farben + Start Typografie</p>
  <div class="test-row" id="pages">
    <span class="test-label">Seite</span>
    <button data-page="./index.html" class="active">Start</button>
    <button data-page="./unternehmen/index.html">Unternehmen</button>
    <button data-page="./dienstleistungen/index.html">DL</button>
    <button data-page="./fachwissen/index.html">Fachwissen</button>
    <button data-page="./kontakt/index.html">Kontakt</button>
    <button data-page="./fachwissen/checkliste-steuererklaerung/index.html">Beitrag</button>
    <button data-page="./impressum/index.html">Impressum</button>
    <button data-page="./disclaimer/index.html">Disclaimer</button>
    <button data-page="./datenschutz/index.html">Datenschutz</button>
  </div>
  <div class="test-row" id="strengths">
    <span class="test-label">Farbintensität für alle Kästen</span>
    <button data-alpha="0.11">11%</button>
    <button data-alpha="0.18">18%</button>
    <button data-alpha="0.24" class="active">24%</button>
    <button data-alpha="0.30">30%</button>
  </div>
  <div class="hint">Startseite zusätzlich: Bereichstitel Dienstleistungen, Fachwissen und Kontakt sowie sämtliche Buttonschriften schwarz. Bereichstitel mit 1.1 px Buchstabenabstand wie die Buttons.</div>
</div>
<script>
const frame=document.getElementById('site');
const pages=document.getElementById('pages');
const strengths=document.getElementById('strengths');
let alpha=.24;

function gradient(a){
  return `linear-gradient(to right in oklab,rgba(244,228,201,${a}) 0%,rgba(232,227,218,${a}) 36%,rgba(193,199,214,${a}) 68%,rgba(158,165,184,${a}) 100%)`;
}
function imp(el,prop,value){
  if(el) el.style.setProperty(prop,value,'important');
}
function paintSingle(el,g){
  imp(el,'background',g);
  imp(el,'background-color','transparent');
  imp(el,'background-image',g);
  imp(el,'background-size','100% 100%');
  imp(el,'background-position','0 0');
  imp(el,'background-repeat','no-repeat');
  imp(el,'background-origin','border-box');
  imp(el,'-webkit-backdrop-filter','blur(32px)');
  imp(el,'backdrop-filter','blur(32px)');
}
function paintGroup(items,g){
  items.forEach((el,i)=>{
    const mod=i%3;
    imp(el,'background',g);
    imp(el,'background-color','transparent');
    imp(el,'background-image',g);
    imp(el,'background-size','calc(300% + 44px) 100%');
    imp(el,'background-position',mod===0?'left top':mod===1?'center top':'right top');
    imp(el,'background-repeat','no-repeat');
    imp(el,'background-origin','border-box');
    imp(el,'-webkit-backdrop-filter','blur(32px)');
    imp(el,'backdrop-filter','blur(32px)');
  });
}
function applyDirectBoxes(d,g){
  paintGroup([...d.querySelectorAll('body.page-home .home-values__items>.home-values__item')],g);
  paintGroup([...d.querySelectorAll('body.page-home .home-paths__grid>a')],g);
  paintGroup([...d.querySelectorAll('body.page-company .company-values-grid>.company-value-card')],g);
  paintGroup([...d.querySelectorAll('body.page-services .services-grid>.service-card')],g);
  paintGroup([...d.querySelectorAll('body.page-knowledge .articles-grid>.article-card')],g);

  [
    'body.page-home .home-contact-band',
    'body.page-company .company-collaboration-box',
    'body.page-services .services-closing',
    'body.page-knowledge .knowledge-note',
    'body.page-contact .contact-split__form',
    'body[class*="page-article-"] .article-shell',
    'body.page-imprint .disclaimer-card',
    'body.page-disclaimer .disclaimer-card',
    'body.page-privacy .disclaimer-card'
  ].forEach(selector=>d.querySelectorAll(selector).forEach(el=>paintSingle(el,g)));

  d.querySelectorAll('body.page-services .services-grid>.service-card>summary, body.page-services .services-grid>.service-card>ul').forEach(el=>{
    imp(el,'background','transparent');
    imp(el,'background-color','transparent');
    imp(el,'background-image','none');
  });
}

function applyTest(){
  const d=frame.contentDocument;
  if(!d||!d.head||!d.body)return;
  const g=gradient(alpha);
  applyDirectBoxes(d,g);

  let style=d.getElementById('masoon-strong-colors-test');
  if(!style){
    style=d.createElement('style');
    style.id='masoon-strong-colors-test';
    d.head.appendChild(style);
  }
  style.textContent=`
html body.page-home.site-light-page main.home section.home-hero .home-hero__copy::after,
html body.page-home.site-light-page main.home section.home-hero .home-hero__soft-gradient,
html body.page-company.site-light-page .company-legal-card .home-company__image::before{
  background:${g}!important;
  background-color:transparent!important;
  background-image:${g}!important;
  background-size:100% 100%!important;
  background-position:0 0!important;
  background-repeat:no-repeat!important;
}

html body.page-home.site-light-page main.home>section.home-values .section-label,
html body.page-home.site-light-page main.home>section.home-paths .section-label,
html body.page-home.site-light-page main.home>section.home-contact-band .section-label{
  color:#171715!important;
  letter-spacing:1.1px!important;
}

html body.page-home.site-light-page main.home .home-action-button,
html body.page-home.site-light-page main.home .home-action-button:hover,
html body.page-home.site-light-page main.home .home-action-button:focus-visible,
html body.page-home.site-light-page main.home .home-action-button:active,
html body.page-home.site-light-page main.home .home-paths__action,
html body.page-home.site-light-page main.home .home-paths__action:hover,
html body.page-home.site-light-page main.home .home-paths__action:focus-visible,
html body.page-home.site-light-page main.home button{
  color:#171715!important;
}
`;
}

pages.addEventListener('click',e=>{
  const b=e.target.closest('button[data-page]');
  if(!b)return;
  pages.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  frame.src=b.dataset.page+'?v=strong-colors-'+Date.now();
});

strengths.addEventListener('click',e=>{
  const b=e.target.closest('button[data-alpha]');
  if(!b)return;
  alpha=Number(b.dataset.alpha);
  strengths.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  applyTest();
});

frame.addEventListener('load',()=>{
  applyTest();
  setTimeout(applyTest,80);
  setTimeout(applyTest,250);
});
</script>
</body>
</html>
