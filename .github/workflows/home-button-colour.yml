name: Home button colour

on:
  push:
    paths:
      - '.github/workflows/home-button-colour.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adjust existing homepage button colour rules
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          target = '#868279!important'
          changed_files = []
          changes = []

          rule_re = re.compile(r'([^{}]+)\{([^{}]*)\}', re.S)
          color_re = re.compile(r'(?<![-\w])color\s*:\s*[^;}]+' , re.I)

          for p in sorted(Path('assets').glob('*.css')):
              text = p.read_text()
              out = []
              last = 0
              file_changes = 0
              for m in rule_re.finditer(text):
                  selector = m.group(1)
                  body = m.group(2)
                  if '.home-action-button' not in selector:
                      continue
                  vals = color_re.findall(body)
                  if not vals:
                      continue
                  new_body, n = color_re.subn('color:' + target, body)
                  if n:
                      out.append(text[last:m.start(2)])
                      out.append(new_body)
                      last = m.end(2)
                      file_changes += n
                      changes.append((str(p), ' '.join(selector.split())[:260], vals))
              if file_changes:
                  out.append(text[last:])
                  new_text = ''.join(out)
                  p.write_text(new_text)
                  changed_files.append(p)
                  print(f'{p}: updated {file_changes} existing color declarations')

          if not changes:
              raise SystemExit('No existing .home-action-button color declarations found')

          print('\nChanged rules:')
          for f, sel, vals in changes:
              print(f'- {f}: {sel} :: {vals}')

          # Verify every explicit text color in existing home-action-button rules is now beige.
          bad = []
          for p in sorted(Path('assets').glob('*.css')):
              text = p.read_text()
              for m in rule_re.finditer(text):
                  selector, body = m.group(1), m.group(2)
                  if '.home-action-button' not in selector:
                      continue
                  for val in color_re.findall(body):
                      compact = re.sub(r'\s+', '', val.lower())
                      if compact != 'color:#868279!important':
                          bad.append((str(p), ' '.join(selector.split())[:220], val))
          if bad:
              raise SystemExit('Non-unified homepage button colors remain: ' + repr(bad[:20]))

          # Cache-bust only stylesheets that were actually changed and are loaded on the homepage.
          page = Path('index.html')
          html = page.read_text()
          for p in changed_files:
              name = p.name
              pattern = re.compile(r'(assets/' + re.escape(name) + r'\?v=)[^"\']+')
              html2, n = pattern.subn(r'\1home-buttons-beige-20260912-1', html, count=1)
              if n == 1:
                  html = html2
                  print(f'Cache updated for {name}')
          page.write_text(html)
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/home-button-colour.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Startseite: alle Buttonschriften beige vereinheitlichen"
          git push