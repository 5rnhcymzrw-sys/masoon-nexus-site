name: temp add company accent level 1
on:
  push:
    paths:
      - '.github/workflows/temp-add-company-accent-level1.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add third strength level to existing Bild Akzent control
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('farbtest-alle-kaesten-linien-10092026.html')
          s=p.read_text(encoding='utf-8')

          old="""function companyAccentCss(s){const bg=s.color==='off'?'transparent':gradient(s.color);return`html body.page-company.site-light-page .company-legal-card .home-company__image::before{background:${bg}!important;background-size:100% 100%!important;background-position:0 0!important;background-repeat:no-repeat!important;border:${s.lines==='on'?'1px solid transparent':'0'}!important;border-image:${s.lines==='on'?borderFull:'none'}!important;border-color:transparent!important;box-shadow:none!important;-webkit-backdrop-filter:${s.soft==='on'?'blur(32px)':'none'}!important;backdrop-filter:${s.soft==='on'?'blur(32px)':'none'}!important}`}"""
          new="""function companyAccentGradient(mode){if(mode==='off')return'transparent';const c=[[244,228,201],[232,227,218],[193,199,214],[132,144,171]],a=mode==='1'?.08:mode==='3'?.14:.11;return`linear-gradient(to right in oklab,rgba(${c[0].join(',')},${a}) 0%,rgba(${c[1].join(',')},${a}) 36%,rgba(${c[2].join(',')},${a}) 68%,rgba(${c[3].join(',')},${a}) 100%)`}\nfunction companyAccentCss(s){const bg=companyAccentGradient(s.color);return`html body.page-company.site-light-page .company-legal-card .home-company__image::before{background:${bg}!important;background-size:100% 100%!important;background-position:0 0!important;background-repeat:no-repeat!important;border:${s.lines==='on'?'1px solid transparent':'0'}!important;border-image:${s.lines==='on'?borderFull:'none'}!important;border-color:transparent!important;box-shadow:none!important;-webkit-backdrop-filter:${s.soft==='on'?'blur(32px)':'none'}!important;backdrop-filter:${s.soft==='on'?'blur(32px)':'none'}!important}`}"""
          if s.count(old)!=1: raise SystemExit(f'companyAccentCss match count {s.count(old)}')
          s=s.replace(old,new,1)

          old="""function sectionBlock(section){const s=states[section.id];if(section.softOnly)return`<div class=\"section-block\" data-section=\"${section.id}\"><div class=\"section-title\">${section.label}</div><div class=\"mini-row\"><span class=\"mini-label\">Weich</span><button data-section-soft=\"on\" class=\"${s.soft==='on'?'active':''}\">mit</button><button data-section-soft=\"off\" class=\"${s.soft==='off'?'active':''}\">ohne</button></div></div>`;return`<div class=\"section-block\" data-section=\"${section.id}\"><div class=\"section-title\">${section.label}</div><div class=\"mini-row\"><span class=\"mini-label\">Farbe</span><button data-section-color=\"off\" class=\"${s.color==='off'?'active':''}\">ohne</button><button data-section-color=\"2\" class=\"${s.color==='2'?'active':''}\">2</button><button data-section-color=\"3\" class=\"${s.color==='3'?'active':''}\">3</button></div><div class=\"mini-row\"><span class=\"mini-label\">Linien</span><button data-section-lines=\"on\" class=\"${s.lines==='on'?'active':''}\">mit</button><button data-section-lines=\"off\" class=\"${s.lines==='off'?'active':''}\">ohne</button></div><div class=\"mini-row\"><span class=\"mini-label\">Weich</span><button data-section-soft=\"on\" class=\"${s.soft==='on'?'active':''}\">mit</button><button data-section-soft=\"off\" class=\"${s.soft==='off'?'active':''}\">ohne</button></div></div>`}"""
          new="""function sectionBlock(section){const s=states[section.id];if(section.softOnly)return`<div class=\"section-block\" data-section=\"${section.id}\"><div class=\"section-title\">${section.label}</div><div class=\"mini-row\"><span class=\"mini-label\">Weich</span><button data-section-soft=\"on\" class=\"${s.soft==='on'?'active':''}\">mit</button><button data-section-soft=\"off\" class=\"${s.soft==='off'?'active':''}\">ohne</button></div></div>`;const colorButtons=section.id==='company-accent'?`<button data-section-color=\"off\" class=\"${s.color==='off'?'active':''}\">ohne</button><button data-section-color=\"1\" class=\"${s.color==='1'?'active':''}\">1</button><button data-section-color=\"2\" class=\"${s.color==='2'?'active':''}\">2</button><button data-section-color=\"3\" class=\"${s.color==='3'?'active':''}\">3</button>`:`<button data-section-color=\"off\" class=\"${s.color==='off'?'active':''}\">ohne</button><button data-section-color=\"2\" class=\"${s.color==='2'?'active':''}\">2</button><button data-section-color=\"3\" class=\"${s.color==='3'?'active':''}\">3</button>`;return`<div class=\"section-block\" data-section=\"${section.id}\"><div class=\"section-title\">${section.label}</div><div class=\"mini-row\"><span class=\"mini-label\">Farbe</span>${colorButtons}</div><div class=\"mini-row\"><span class=\"mini-label\">Linien</span><button data-section-lines=\"on\" class=\"${s.lines==='on'?'active':''}\">mit</button><button data-section-lines=\"off\" class=\"${s.lines==='off'?'active':''}\">ohne</button></div><div class=\"mini-row\"><span class=\"mini-label\">Weich</span><button data-section-soft=\"on\" class=\"${s.soft==='on'?'active':''}\">mit</button><button data-section-soft=\"off\" class=\"${s.soft==='off'?'active':''}\">ohne</button></div></div>`}"""
          if s.count(old)!=1: raise SystemExit(f'sectionBlock match count {s.count(old)}')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add farbtest-alle-kaesten-linien-10092026.html
          git diff --cached --check
          git commit -m 'Add three strength levels to test Bild Akzent'
          git push
