name: Tokenize company legal width
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tokenize-company-legal-width.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace company legal width values
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/unified-design-base-20260907.css')
          s=p.read_text(encoding='utf-8')
          old1='width:min(100% - 64px,1227px)!important;'
          old2='width:calc(100% - 36px)!important;'
          if old1 not in s or old2 not in s:
              raise SystemExit('expected width values missing')
          s=s.replace(old1,'width:min(100% - var(--page-gutter),var(--content-width))!important;',1)
          s=s.replace(old2,'width:calc(100% - var(--page-gutter-mobile))!important;',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/unified-design-base-20260907.css
          git commit -m "Unternehmensbreite über globale Tokens steuern"
          git rm .github/workflows/tokenize-company-legal-width.yml
          git commit -m "Temporären Unternehmensbreiten-Workflow entfernen"
          git push