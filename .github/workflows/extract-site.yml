name: Extract and publish MASOON website

on:
  push:
    branches: [main]
    paths:
      - 'MASOON_TREUHAND_Mehrseitige_Website_1zu1.zip'
      - '.github/workflows/extract-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract website
        run: |
          test -f MASOON_TREUHAND_Mehrseitige_Website_1zu1.zip
          rm -rf kontakt ablauf datenschutz impressum assets fachwissen images unternehmen dienstleistungen
          rm -f hero1.png logo-white.png portrait-unternehmen.png portrait-kontakt.png BITTE_LESEN.txt
          unzip -o MASOON_TREUHAND_Mehrseitige_Website_1zu1.zip -d .
          touch .nojekyll
          rm -f MASOON_TREUHAND_Mehrseitige_Website_1zu1.zip

      - name: Commit extracted website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Publish MASOON TREUHAND website [skip ci]"
          git pull --rebase origin main
          git push origin main
