<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>MASOON TREUHAND – Hero Ecken Test</title>
<style>
html,body{margin:0;height:100%;background:#111;font-family:Arial,sans-serif}
body{display:grid;grid-template-rows:58px 1fr;overflow:hidden}
.tester{display:flex;align-items:center;gap:7px;padding:0 14px;background:#f3f3f3;border-bottom:1px solid #ccc;box-sizing:border-box;z-index:10;overflow-x:auto}
.tester strong{font-size:13px;margin-right:6px;font-weight:600;white-space:nowrap}
.tester button{appearance:none;border:1px solid #c9c9c9;background:#fff;padding:9px 12px;font-size:12px;cursor:pointer;white-space:nowrap}
.tester button.active{background:#111;color:#fff;border-color:#111}
iframe{width:100%;height:100%;border:0;background:#fff;display:block}
@media(max-width:900px){.tester strong{display:none}}
</style>
</head>
<body>
<div class="tester">
<strong>Ecken vergleichen</strong>
<button data-v="original" class="active">Original</button>
<button data-v="r20">1 · Alle Ecken rund</button>
<button data-v="r44">2 · Deutlich rund</button>
<button data-v="right">3 · Nur rechts rund</button>
<button data-v="soft">4 · Rechte Ecken weich</button>
<button data-v="asym">5 · Asymmetrisch</button>
<button data-v="cut">6 · Abgeschrägt</button>
</div>
<iframe id="site" src="./index.html"></iframe>
<script>
const frame=document.getElementById('site');
const buttons=[...document.querySelectorAll('button[data-v]')];
let current='original';

const testCSS=`
@media(min-width:801px){
  /* Ziel ist die sichtbare transparente Ebene, nicht nur der Textblock. */
  html[class*="hero-corner-"] body .home-hero .home-hero__content,
  html[class*="hero-corner-"] body .home-hero .home-hero__copy,
  html[class*="hero-corner-"] body .home-hero .home-hero__content::before,
  html[class*="hero-corner-"] body .home-hero .home-hero__content::after,
  html[class*="hero-corner-"] body .home-hero .home-hero__copy::before,
  html[class*="hero-corner-"] body .home-hero .home-hero__copy::after{
    overflow:hidden!important;
  }

  html.hero-corner-r20 body .home-hero .home-hero__content,
  html.hero-corner-r20 body .home-hero .home-hero__copy,
  html.hero-corner-r20 body .home-hero .home-hero__content::before,
  html.hero-corner-r20 body .home-hero .home-hero__content::after,
  html.hero-corner-r20 body .home-hero .home-hero__copy::before,
  html.hero-corner-r20 body .home-hero .home-hero__copy::after{
    border-radius:20px!important;
  }

  html.hero-corner-r44 body .home-hero .home-hero__content,
  html.hero-corner-r44 body .home-hero .home-hero__copy,
  html.hero-corner-r44 body .home-hero .home-hero__content::before,
  html.hero-corner-r44 body .home-hero .home-hero__content::after,
  html.hero-corner-r44 body .home-hero .home-hero__copy::before,
  html.hero-corner-r44 body .home-hero .home-hero__copy::after{
    border-radius:44px!important;
  }

  html.hero-corner-right body .home-hero .home-hero__content,
  html.hero-corner-right body .home-hero .home-hero__copy,
  html.hero-corner-right body .home-hero .home-hero__content::before,
  html.hero-corner-right body .home-hero .home-hero__content::after,
  html.hero-corner-right body .home-hero .home-hero__copy::before,
  html.hero-corner-right body .home-hero .home-hero__copy::after{
    border-radius:0 52px 52px 0!important;
  }

  html.hero-corner-soft body .home-hero .home-hero__content,
  html.hero-corner-soft body .home-hero .home-hero__copy,
  html.hero-corner-soft body .home-hero .home-hero__content::before,
  html.hero-corner-soft body .home-hero .home-hero__content::after,
  html.hero-corner-soft body .home-hero .home-hero__copy::before,
  html.hero-corner-soft body .home-hero .home-hero__copy::after{
    border-radius:0 70px 70px 0!important;
    -webkit-mask-image:linear-gradient(90deg,#000 0%,#000 82%,rgba(0,0,0,.95) 88%,rgba(0,0,0,.7) 94%,transparent 100%)!important;
    mask-image:linear-gradient(90deg,#000 0%,#000 82%,rgba(0,0,0,.95) 88%,rgba(0,0,0,.7) 94%,transparent 100%)!important;
  }

  html.hero-corner-asym body .home-hero .home-hero__content,
  html.hero-corner-asym body .home-hero .home-hero__copy,
  html.hero-corner-asym body .home-hero .home-hero__content::before,
  html.hero-corner-asym body .home-hero .home-hero__content::after,
  html.hero-corner-asym body .home-hero .home-hero__copy::before,
  html.hero-corner-asym body .home-hero .home-hero__copy::after{
    border-radius:0 72px 20px 0!important;
  }

  html.hero-corner-cut body .home-hero .home-hero__content,
  html.hero-corner-cut body .home-hero .home-hero__copy,
  html.hero-corner-cut body .home-hero .home-hero__content::before,
  html.hero-corner-cut body .home-hero .home-hero__content::after,
  html.hero-corner-cut body .home-hero .home-hero__copy::before,
  html.hero-corner-cut body .home-hero .home-hero__copy::after{
    border-radius:0!important;
    clip-path:polygon(0 0,96% 0,100% 9%,100% 91%,96% 100%,0 100%)!important;
  }
}
`;

function apply(v){
  const d=frame.contentDocument;if(!d)return;
  [...d.documentElement.classList].filter(c=>c.startsWith('hero-corner-')).forEach(c=>d.documentElement.classList.remove(c));
  let st=d.getElementById('hero-corner-test-styles');
  if(!st){st=d.createElement('style');st.id='hero-corner-test-styles';st.textContent=testCSS;d.head.appendChild(st)}
  if(v!=='original')d.documentElement.classList.add('hero-corner-'+v);
  buttons.forEach(b=>b.classList.toggle('active',b.dataset.v===v));
  current=v;
}
frame.addEventListener('load',()=>apply(current));
buttons.forEach(b=>b.addEventListener('click',()=>apply(b.dataset.v)));
</script>
</body>
</html>
