name: Home Fachwissen category dark

on:
  push:
    paths:
      - '.github/workflows/home-fachwissen-category-dark.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bestehende Kategorienfarben anpassen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) Bestehende Startseiten-Regel direkt anpassen.
          g = Path('assets/global.css')
          gt = g.read_text()
          old_global = '.home-paths__grid span{order:2!important;margin:12px 0 0!important;font-family:var(--font-inter)!important;font-size:11px!important;font-weight:500!important;line-height:1.4!important;letter-spacing:.14em!important;text-transform:uppercase!important;color:#868279!important;}'
          new_global = '.home-paths__grid span{order:2!important;margin:12px 0 0!important;font-family:var(--font-inter)!important;font-size:11px!important;font-weight:500!important;line-height:1.4!important;letter-spacing:.14em!important;text-transform:uppercase!important;color:#171715!important;}'
          if gt.count(old_global) != 1:
              raise SystemExit(f'global.css: expected 1 home-paths span rule, found {gt.count(old_global)}')
          gt = gt.replace(old_global, new_global, 1)
          g.write_text(gt)

          # 2) Bestehende hochspezifische Metadaten-Regel anpassen, damit nichts darüberliegt.
          b = Path('assets/unified-design-base-20260907.css')
          bt = b.read_text()
          marker = 'html body main .home-paths__grid.home-paths__grid.home-paths__grid.home-paths__grid.home-paths__grid.home-paths__grid span{'
          start = bt.find(marker)
          if start == -1:
              raise SystemExit('Base CSS: home-paths metadata selector not found')
          end = bt.find('}', start)
          if end == -1:
              raise SystemExit('Base CSS: selector block end not found')
          block = bt[start:end+1]
          if block.count('color:#868279!important;') != 1:
              raise SystemExit(f'Base CSS: expected one old color in target block, found {block.count("color:#868279!important;")}')
          new_block = block.replace('color:#868279!important;', 'color:#171715!important;', 1)
          bt = bt[:start] + new_block + bt[end+1:]
          b.write_text(bt)

          # 3) Import-Cache der bestehenden Base-Datei aktualisieren.
          u = Path('assets/unified-design.css')
          ut = u.read_text()
          old_import = "@import url('./unified-design-base-20260907.css?v=article-action-hover-nachname-20260913-3');"
          new_import = "@import url('./unified-design-base-20260907.css?v=home-fachwissen-category-dark-20260913-1');"
          if ut.count(old_import) != 1:
              raise SystemExit(f'unified-design.css: expected current base import once, found {ut.count(old_import)}')
          ut = ut.replace(old_import, new_import, 1)
          u.write_text(ut)

          # 4) Nur Startseite cache-busten, da nur diese drei Kategorien betroffen sind.
          page = Path('index.html')
          ht = page.read_text()
          ht2 = re.sub(r'(assets/global\.css\?v=)[^"\']+', r'\1home-fachwissen-category-dark-20260913-1', ht, count=1)
          ht2 = re.sub(r'(assets/unified-design\.css\?v=)[^"\']+', r'\1home-fachwissen-category-dark-20260913-1', ht2, count=1)
          if ht2 == ht:
              raise SystemExit('index.html cache tokens were not updated')
          page.write_text(ht2)

          # Verifikation: keine neue CSS-Regel angelegt, nur vorhandene Farbwerte ersetzt.
          if old_global in g.read_text():
              raise SystemExit('Old global category color still present')
          if 'color:#171715!important;' not in new_block:
              raise SystemExit('New base category color missing')
          print('Existing category color declarations changed to #171715; no new CSS selector added')
          PY
      - name: Commit und temporären Workflow entfernen
        run: |
          rm -f .github/workflows/home-fachwissen-category-dark.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'No changes'; exit 1; }
          git commit -m "Startseite Fachwissen: Kategorien wie Nachname abdunkeln"
          git push
