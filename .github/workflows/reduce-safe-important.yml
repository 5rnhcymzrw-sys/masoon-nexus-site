name: Reduce safe important declarations
on:
  push:
    branches: [main]
    paths: ['.github/workflows/reduce-safe-important.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove safe important flags from portrait internals
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/unified-design.css')
          s=p.read_text(encoding='utf-8')
          start=s.index('/* Unternehmen: Porträtbereich */')
          end=s.index('/* Dienstleistungen Hauptseite: kleine Bereichstitel wie Unternehmen */',start)
          block=s[start:end]
          targets=[
            'overflow:visible!important','width:100%!important','min-height:0!important','margin:0!important','align-self:center!important',
            'content:none!important','display:none!important','height:auto!important','display:block!important',
            'width:440px!important','height:565px!important','min-height:565px!important','position:relative!important',
            'transform:translateY(20.25px) scale(.972)!important','transform-origin:center center!important',
            'width:92%!important','height:92%!important','position:absolute!important','top:0!important','right:0!important',
            'object-fit:cover!important','object-position:center 18%!important','box-shadow:none!important'
          ]
          # Only remove inside portrait block. Keep card-level layout and section spacing !important declarations.
          for t in targets:
            block=block.replace(t,t.replace('!important',''))
          s=s[:start]+block+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/unified-design.css
          git commit -m "Sichere important Angaben im Porträt reduzieren"
          git rm .github/workflows/reduce-safe-important.yml
          git commit -m "Temporären Important-Workflow entfernen"
          git push
