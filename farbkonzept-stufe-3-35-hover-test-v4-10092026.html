<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MASOON – Farbkonzept Test V4</title>
<style>
html,body{margin:0;min-height:100%;background:#f4f4f2;font-family:Arial,sans-serif;color:#171715}
.testbar{position:sticky;top:0;z-index:99999;background:#fff;border-bottom:1px solid #d8d8d4;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.testbar strong{font-size:12px;margin-right:6px}.testbar button{appearance:none;border:1px solid #cfcfca;background:#fff;padding:7px 10px;font-size:11px;cursor:pointer}.testbar button:hover,.testbar button.active{background:#171715;color:#fff;border-color:#171715}.group{display:flex;gap:5px;align-items:center;margin-left:8px;padding-left:10px;border-left:1px solid #ddd}.group span{font-size:11px;color:#666;margin-right:2px}.status{font-size:11px;font-weight:700;min-width:130px}.note{font-size:11px;color:#666;margin-left:auto}#siteFrame{display:block;width:100%;height:calc(100vh - 58px);min-height:700px;border:0;background:#fff}@media(max-width:1050px){.note{width:100%;margin-left:0}#siteFrame{height:calc(100vh - 120px)}}
</style>
</head>
<body>
<div class="testbar">
<strong>FARBKONZEPT TEST V4</strong>
<button data-src="index.html?v=colorv4-10092026" data-page="home" class="active">Startseite</button>
<button data-src="dienstleistungen/index.html?v=colorv4-10092026" data-page="services">Dienstleistungen</button>
<button data-src="fachwissen/index.html?v=colorv4-10092026" data-page="knowledge">Fachwissen</button>
<div class="group">
<span>Stärke:</span>
<button data-level="1">1</button><button data-level="2">2</button><button data-level="3" class="active">3</button><button data-level="3.5">3.5</button><button data-level="4">4</button><button data-level="5">5</button>
</div>
<div class="group"><span>Weichzeichnung:</span><button data-blur="on" class="active">AN</button><button data-blur="off">AUS</button></div>
<div class="group"><span>Linien:</span><button data-lines="on" class="active">AN</button><button data-lines="off">AUS</button></div>
<span class="status" id="status">Stufe 3 · weich · Linien</span>
<span class="note">Fachwissen: normal transparent, Hover = Farbverlauf Stufe 3</span>
</div>
<iframe id="siteFrame" src="index.html?v=colorv4-10092026" title="Farbkonzept Test V4"></iframe>
<script>
const frame=document.getElementById('siteFrame');
const pageButtons=[...document.querySelectorAll('[data-page]')];
const levelButtons=[...document.querySelectorAll('[data-level]')];
const blurButtons=[...document.querySelectorAll('[data-blur]')];
const lineButtons=[...document.querySelectorAll('[data-lines]')];
const status=document.getElementById('status');
let currentPage='home';
let level=3;
let blurOn=true;
let linesOn=true;
const alpha={1:.025,2:.06,3:.11,3.5:.145,4:.18,5:.28};
const hoverAlpha=.11;
function gradient(a){return `linear-gradient(to right in oklab, rgba(243,232,212,${a}) 0%, rgba(232,229,223,${a}) 36%, rgba(199,203,211,${a}) 68%, rgba(141,150,168,${a}) 100%)`}
function important(el,prop,value){el.style.setProperty(prop,value,'important')}
function clearInterior(el){
 important(el,'background','transparent');important(el,'background-image','none');important(el,'background-color','transparent');important(el,'backdrop-filter','none');important(el,'-webkit-backdrop-filter','none');
}
function setGradient(el,index,a,useBlur){
 const g=gradient(a);important(el,'background',g);important(el,'background-image',g);important(el,'background-color','transparent');important(el,'background-origin','border-box');important(el,'background-size','calc(300% + 44px) 100%');important(el,'background-repeat','no-repeat');
 important(el,'background-position',index%3===0?'left top':index%3===1?'center top':'right top');
 important(el,'backdrop-filter',useBlur?'blur(32px)':'none');important(el,'-webkit-backdrop-filter',useBlur?'blur(32px)':'none');
}
function setLines(el,on){
 if(!on){important(el,'border','0');important(el,'border-image','none');}
 else{el.style.removeProperty('border');el.style.removeProperty('border-image');el.style.removeProperty('border-color');el.style.removeProperty('border-left');el.style.removeProperty('border-left-color');}
}
function wireKnowledgeHover(items){
 items.forEach((el,i)=>{
  if(el.dataset.mtHoverWired==='1')return;
  el.dataset.mtHoverWired='1';
  el.addEventListener('mouseenter',()=>{setGradient(el,i,hoverAlpha,false)});
  el.addEventListener('mouseleave',()=>{clearInterior(el)});
 });
}
function updateStatus(){status.textContent=`Stufe ${level} · ${blurOn?'weich':'ohne weich'} · ${linesOn?'Linien':'ohne Linien'}`}
function apply(){
 try{
  const d=frame.contentDocument;if(!d||!d.body)return;
  if(currentPage==='home'){
   const dl=[...d.querySelectorAll('main.home section.home-values .home-values__items>.home-values__item')];
   dl.forEach((el,i)=>{setGradient(el,i,alpha[level],blurOn);setLines(el,linesOn)});
   const fw=[...d.querySelectorAll('main.home section.home-paths .home-paths__grid>a')];
   fw.forEach(el=>{clearInterior(el);setLines(el,true)});wireKnowledgeHover(fw);
  } else if(currentPage==='services'){
   const cards=[...d.querySelectorAll('main.services-main .services-section .services-grid>.service-card')];
   cards.forEach((el,i)=>{setGradient(el,i,alpha[level],blurOn);setLines(el,linesOn)});
  } else if(currentPage==='knowledge'){
   const fw=[...d.querySelectorAll('main .knowledge-section#knowledge-articles .articles-grid>.article-card')];
   fw.forEach(el=>{clearInterior(el);setLines(el,true)});wireKnowledgeHover(fw);
  }
 }catch(e){console.error('Farbkonzept Test V4:',e)}
}
function runRepeated(){apply();setTimeout(apply,180);setTimeout(apply,500);setTimeout(apply,1100);setTimeout(apply,2200)}
frame.addEventListener('load',runRepeated);
pageButtons.forEach(b=>b.addEventListener('click',()=>{currentPage=b.dataset.page;pageButtons.forEach(x=>x.classList.remove('active'));b.classList.add('active');frame.src=b.dataset.src;}));
levelButtons.forEach(b=>b.addEventListener('click',()=>{level=Number(b.dataset.level);levelButtons.forEach(x=>x.classList.remove('active'));b.classList.add('active');if(level===3.5){blurOn=false;blurButtons.forEach(x=>x.classList.toggle('active',x.dataset.blur==='off'));}updateStatus();runRepeated();}));
blurButtons.forEach(b=>b.addEventListener('click',()=>{blurOn=b.dataset.blur==='on';blurButtons.forEach(x=>x.classList.remove('active'));b.classList.add('active');updateStatus();runRepeated();}));
lineButtons.forEach(b=>b.addEventListener('click',()=>{linesOn=b.dataset.lines==='on';lineButtons.forEach(x=>x.classList.remove('active'));b.classList.add('active');updateStatus();runRepeated();}));
</script>
</body>
</html>
