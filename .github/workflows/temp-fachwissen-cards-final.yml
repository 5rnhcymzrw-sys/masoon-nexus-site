name: temp fachwissen cards final
on:
  push:
    paths:
      - '.github/workflows/temp-fachwissen-cards-final.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update existing Fachwissen card rules only
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Commit change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/unified-design.css
          git diff --cached --check
          git commit -m 'Style Fachwissen cards with variant 2 blur and no borders'
          git push
