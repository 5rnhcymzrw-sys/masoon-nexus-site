name: fachwissen-arrow-hover-color

on:
  push:
    paths:
      - '.github/workflows/fachwissen-arrow-hover-color.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: update-existing-arrow-color
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          css = Path('assets/unified-design.css')
          text = css.read_text()
          pattern = r'(html body\.page-knowledge\.site-light-page main \.knowledge-section \.article-card \.article-action::after\{[^}]*?)color:#777777!important;'
          text2, count = re.subn(pattern, r'\1color:inherit!important;', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'expected one arrow color replacement, got {count}')
          css.write_text(text2)

          page = Path('fachwissen/index.html')
          html = page.read_text()
          html2, count2 = re.subn(r'(\.\./assets/unified-design\.css\?v=)[^"\']+', r'\1fachwissen-arrow-inherit-20260913-1', html, count=1)
          if count2 != 1:
              raise SystemExit(f'expected one cache replacement, got {count2}')
          page.write_text(html2)
          PY
      - name: commit
        run: |
          rm -f .github/workflows/fachwissen-arrow-hover-color.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "Fachwissen: arrow color follows action text"
          git push
