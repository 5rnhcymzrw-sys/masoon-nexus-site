name: Consolidate knowledge note v2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/consolidate-knowledge-note-v2.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply cleanup
        run: python3 scripts/consolidate_knowledge_note.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/unified-design.css
          git commit -m "Einordnungskasten-Regeln konsolidieren"
          git rm scripts/consolidate_knowledge_note.py .github/workflows/consolidate-knowledge-note-v2.yml
          git commit -m "Temporäre Einordnungskasten-Dateien entfernen"
          git push
