name: Temporary button state colour update
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-button-hover-color.yml
permissions:
  contents: write
jobs:
  update-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update existing startpage button state colours
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('assets/unified-design.css')
          s = p.read_text()
          old1 = 'html body.page-home .home-action-button:active{background:transparent!important;box-shadow:none!important;color:#605c55!important;text-decoration:none!important;}'
          new1 = 'html body.page-home .home-action-button:active{background:transparent!important;box-shadow:none!important;color:#171715!important;text-decoration:none!important;}'
          old2 = 'html body.page-home .home-values .home-action-button:focus-visible{color:#605c55!important;}'
          new2 = 'html body.page-home .home-values .home-action-button:focus-visible{color:#171715!important;}'
          if s.count(old1) != 1 or s.count(old2) != 1:
              raise SystemExit('Expected existing button state rules not found exactly once')
          s = s.replace(old1,new1,1).replace(old2,new2,1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/unified-design.css
          git commit -m "Align startpage button state colours"
          git push
