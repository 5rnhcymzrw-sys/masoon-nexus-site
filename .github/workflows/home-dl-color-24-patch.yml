name: Home DL color 24 patch

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/home-dl-color-24-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update existing home services gradient only
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path('assets/unified-design.css')
          text = css.read_text()
          selector = 'html body.page-home.site-light-page:has(main.home) main.home>section.home-values .home-values__items>.home-values__item.home-values__item.home-values__item.home-values__item{'
          start = text.find(selector)
          if start == -1:
              raise SystemExit('Existing home-values final rule not found')
          end = text.find('\n}', start)
          if end == -1:
              raise SystemExit('Existing home-values final rule end not found')
          block = text[start:end+2]
          old = 'background:linear-gradient(to right in oklab,rgba(244,228,201,.11) 0%,rgba(232,227,218,.11) 36%,rgba(193,199,214,.11) 68%,rgba(132,144,171,.11) 100%)!important;'
          new = 'background:linear-gradient(to right in oklab,rgba(244,228,201,.24) 0%,rgba(232,227,218,.24) 36%,rgba(193,199,214,.24) 68%,rgba(158,165,184,.24) 100%)!important;'
          if block.count(old) != 1:
              raise SystemExit(f'Expected exactly 1 existing gradient in home-values final rule, found {block.count(old)}')
          new_block = block.replace(old, new, 1)
          css.write_text(text[:start] + new_block + text[end+2:])

          index = Path('index.html')
          html = index.read_text()
          old_cache = 'assets/unified-design.css?v=hero-color-24-20260912-1'
          new_cache = 'assets/unified-design.css?v=home-dl-color-24-20260912-1'
          if html.count(old_cache) != 1:
              raise SystemExit('Expected exactly 1 stylesheet cache reference')
          index.write_text(html.replace(old_cache, new_cache, 1))
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/home-dl-color-24-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/unified-design.css index.html .github/workflows/home-dl-color-24-patch.yml
          git commit -m "Startseite Dienstleistungen: sechs Kästen auf 24 Prozent anpassen"
          git push
