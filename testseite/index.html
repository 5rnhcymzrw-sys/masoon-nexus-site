<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>MASOON TREUHAND | Testversion 1</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
    #site-test{display:block;width:100%;height:100%;border:0;background:#fff}
  </style>
</head>
<body>
  <iframe id="site-test" src="../index.html?v=testversion-1-20260914" title="MASOON TREUHAND Testversion 1"></iframe>

  <script>
  (() => {
    const frame = document.getElementById('site-test');
    const gradient = 'linear-gradient(110deg,#f3e8d4 0%,#e8e5df 38%,#c7cbd3 66%,#8d96a8 100%)';

    function applyTestDesign(){
      const doc = frame.contentDocument;
      const win = frame.contentWindow;
      if(!doc || !win) return;

      if(doc.getElementById('masoon-test-overrides')) return;

      const font = doc.createElement('link');
      font.rel = 'stylesheet';
      font.href = 'https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&display=swap';
      doc.head.appendChild(font);

      const style = doc.createElement('style');
      style.id = 'masoon-test-overrides';
      style.textContent = `
        :root{--test-gradient:${gradient};}

        /* TEST 1: nur besprochene Gestaltungsanpassungen auf der bestehenden Website */

        /* Bestehenden Seitenhintergrund beruhigen; Markensymbol statt dekorativem Hintergrund */
        html,body{background-image:none!important;}
        body.site-light-page::before,
        body.site-light-page::after{background-image:none!important;}

        .masoon-test-key-watermark{
          position:fixed!important;
          right:-82px!important;
          bottom:-86px!important;
          width:360px!important;
          height:auto!important;
          opacity:.065!important;
          filter:brightness(0)!important;
          pointer-events:none!important;
          user-select:none!important;
          z-index:0!important;
        }
        .site-header,.page-main,main,.site-footer{position:relative;z-index:1;}

        /* Hero: rechter Blaugrau Anteil bewusst etwas stärker */
        body.page-home .home-hero__gradient-panel{
          background:linear-gradient(100deg,#f4ead8 0%,#e9e5df 41%,#c8cdd6 66%,#94a0b3 100%)!important;
        }
        body.page-home .home-hero__text-surface{
          background:linear-gradient(90deg,rgba(248,244,237,.88) 0%,rgba(239,236,231,.74) 70%,rgba(214,219,227,.55) 100%)!important;
        }

        /* 01–06 überall einheitlich grau */
        .service-number,.card-number{
          color:#aaa8a3!important;
        }

        /* Dienstleistungstitel etwas grösser */
        body.page-home .home-values__item h3,
        body .service-card summary h2{
          font-size:24px!important;
        }

        /* Farbige Trennlinien auf Startseite und Fachwissen */
        body.page-home .home-paths__grid a strong::after,
        body.page-knowledge .article-card h2::after{
          content:""!important;
          display:block!important;
          width:100%!important;
          height:1.5px!important;
          margin-top:18px!important;
          background:${gradient}!important;
          border:0!important;
        }

        /* Ruhiger, einheitlicher Hover bei Kacheln */
        body.page-home .home-values__item,
        body.page-home .home-paths__grid a,
        body.page-knowledge .article-card,
        body .service-card{
          transition:transform .24s ease,background .24s ease,box-shadow .24s ease!important;
        }
        body.page-home .home-values__item:hover,
        body.page-home .home-paths__grid a:hover,
        body.page-knowledge .article-card:hover,
        body .service-card:hover{
          transform:translateY(-2px)!important;
        }

        /* Buttons: Grunddesign bleibt, nur dezenter Verlauf beim Hover */
        .home-action-button,
        .services-contact-button,
        .contact-submit,
        button[type="submit"]{
          transition:background .25s ease,color .25s ease,border-color .25s ease,transform .25s ease!important;
        }
        .home-action-button:hover,
        .services-contact-button:hover,
        .contact-submit:hover,
        button[type="submit"]:hover{
          background:${gradient}!important;
          color:#171715!important;
          border-color:transparent!important;
          transform:translateY(-1px)!important;
        }

        /* Fachwissen: redaktioneller, ohne sichtbares 'Beitrag anzeigen' */
        body.page-knowledge .article-card{
          cursor:pointer!important;
        }
        body.page-knowledge .article-card h2{
          font-family:"PT Serif",Georgia,serif!important;
          font-size:22px!important;
          font-weight:700!important;
          line-height:1.12!important;
          font-synthesis:none!important;
        }
        body.page-knowledge .article-action{
          display:none!important;
        }

        /* Bestehende Inhaltsbereiche als dezente Farbflächen, ohne neue Inhalte */
        body.page-home .home-contact-band,
        body.page-knowledge .knowledge-note,
        body .services-closing{
          background:linear-gradient(105deg,rgba(243,232,212,.72) 0%,rgba(232,229,223,.68) 43%,rgba(199,203,211,.62) 72%,rgba(141,150,168,.48) 100%)!important;
        }
        body.page-home .home-contact-band,
        body .services-closing{
          padding-left:max(4vw,42px)!important;
          padding-right:max(4vw,42px)!important;
          box-sizing:border-box!important;
        }

        /* Fachartikel: gleiche Originalinhalte, nur besprochener Leseaufbau */
        body .article-shell{
          border:1px solid transparent!important;
          border-image:${gradient} 1!important;
        }
        body .article-hero{
          width:min(760px,100%)!important;
          max-width:760px!important;
          margin-left:auto!important;
          margin-right:auto!important;
          padding-bottom:0!important;
          border-bottom:0!important;
          text-align:left!important;
        }
        body .article-title{
          font-family:"PT Serif",Georgia,serif!important;
          font-weight:700!important;
          font-size:45px!important;
          line-height:1.04!important;
          letter-spacing:0!important;
          text-align:left!important;
          font-synthesis:none!important;
        }
        body .article-title::after{
          content:""!important;
          display:block!important;
          width:108px!important;
          height:4px!important;
          margin:25px 0 28px!important;
          background:${gradient}!important;
        }
        body .article-lead{
          width:100%!important;
          max-width:none!important;
          margin:0!important;
          text-align:left!important;
        }
        body .article-body{
          width:min(600px,100%)!important;
          max-width:600px!important;
          margin-left:auto!important;
          margin-right:auto!important;
          padding-top:54px!important;
          text-align:left!important;
        }
        body .article-body h2{
          font-family:"PT Serif",Georgia,serif!important;
          font-size:22px!important;
          font-weight:700!important;
          line-height:1.12!important;
          text-align:left!important;
          font-synthesis:none!important;
        }
        body .article-body p,
        body .article-body li{
          text-align:left!important;
        }

        /* Mobile wird erst ganz am Schluss separat optimiert. */
      `;
      doc.head.appendChild(style);

      /* Grosses graues Schlüsselsymbol als Test anstelle des bisherigen Hintergrunds */
      if(!doc.querySelector('.masoon-test-key-watermark')){
        const key = doc.createElement('img');
        key.className = 'masoon-test-key-watermark';
        key.alt = '';
        key.setAttribute('aria-hidden','true');
        key.src = new URL('/masoon-nexus-site/07.09.2026%20white_icon_transparent_background.png', win.location.origin).href;
        doc.body.appendChild(key);
      }

      /* Dienstleistungen: Text 'Mehr anzeigen' entfernen, vorhandenes + / - behalten */
      doc.querySelectorAll('.details-action').forEach(action => {
        const symbol = action.querySelector('.details-toggle-symbol');
        action.textContent = '';
        if(symbol) action.appendChild(symbol);
        action.setAttribute('aria-label','Details einblenden');
      });

      /* Fachwissen: ganze bestehende Kachel klickbar machen */
      doc.querySelectorAll('.article-card').forEach(card => {
        const link = card.querySelector('.article-action');
        if(!link || card.dataset.testClickable === '1') return;
        card.dataset.testClickable = '1';
        card.setAttribute('tabindex','0');
        const go = () => { win.location.href = link.href; };
        card.addEventListener('click', e => {
          if(e.target.closest('a')) return;
          go();
        });
        card.addEventListener('keydown', e => {
          if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go(); }
        });
      });
    }

    frame.addEventListener('load', () => {
      try{ applyTestDesign(); }catch(e){ console.error('Testdesign konnte nicht angewendet werden',e); }
    });
  })();
  </script>
</body>
</html>
