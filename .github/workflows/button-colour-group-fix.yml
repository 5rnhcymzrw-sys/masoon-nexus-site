name: Button colour group fix

on:
  push:
    paths:
      - '.github/workflows/button-colour-group-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split grouped rules so only button text changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # 1) Restore white text for the dark second service card, while keeping
          # only MEHR ANZEIGEN beige. There are desktop and mobile occurrences.
          p = Path('assets/global.css')
          text = p.read_text()
          rule_re = re.compile(r'([^{}]*\.services-section>\.services-grid>\.service-card:nth-child\(2\)[^{}]*\.details-action[^{}]*)\{color:#868279!important;\}', re.S)
          matches = list(rule_re.finditer(text))
          if len(matches) != 2:
              raise SystemExit(f'Expected 2 grouped dark-card rules, found {len(matches)}')

          out = []
          last = 0
          for m in matches:
              selector = m.group(1)
              parts = [s.strip() for s in selector.split(',') if s.strip()]
              action = [s for s in parts if '.details-action' in s]
              other = [s for s in parts if '.details-action' not in s]
              if len(action) != 1 or not other:
                  raise SystemExit('Unexpected grouped dark-card selector structure')
              replacement = ',\n'.join(other) + '{color:rgba(255,255,255,.88)!important;}\n' + action[0] + '{color:#868279!important;}'
              out.append(text[last:m.start()])
              out.append(replacement)
              last = m.end()
          out.append(text[last:])
          p.write_text(''.join(out))
          print('global.css: split 2 dark-card grouped rules')

          # 2) Restore original stone colour source for section label/card number
          # in the legacy bundled stylesheet, while keeping details-action beige.
          p2 = Path('assets/index-CZfMKxM_.css')
          t2 = p2.read_text()
          pat = re.compile(r'(\.section--intro>\.section-heading \.section-label,\s*\.service-card \.card-number,\s*\.service-card \.details-action)\{color:#868279!important;\}')
          m = pat.search(t2)
          if not m:
              raise SystemExit('Legacy grouped stone/details rule not found')
          replacement = '.section--intro>.section-heading .section-label,\n.service-card .card-number{color:var(--stone);}\n.service-card .details-action{color:#868279!important;}'
          t2 = t2[:m.start()] + replacement + t2[m.end():]
          p2.write_text(t2)
          print('index-CZfMKxM_.css: restored non-button grouped colours')

          # Verify the two dark-card non-button groups are white and actions beige.
          check = p.read_text()
          if check.count('.details-action{color:#868279!important;}') < 2:
              raise SystemExit('Dark-card action beige rules missing after split')
          if check.count('color:rgba(255,255,255,.88)!important;') < 2:
              raise SystemExit('Dark-card non-button white rules missing after split')
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/button-colour-group-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Buttonfarben: gruppierte Nicht-Button-Texte wiederherstellen"
          git push