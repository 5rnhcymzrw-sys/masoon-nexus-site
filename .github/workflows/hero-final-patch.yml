name: Hero final patch

on:
  push:
    paths:
      - '.github/workflows/hero-final-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bestehende Hero-Regeln direkt anpassen
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('assets/unified-design.css')
          css = css_path.read_text(encoding='utf-8')

          old = '''html body.page-home.site-light-page main.home section.home-hero .home-hero__soft-gradient{
  position:absolute;
  left:-4vw;
  top:50%;
  width:54vw;
  height:calc(clamp(420px,32.625vw,600px) + 240px);
  transform:translateY(-50%);
  z-index:0;
  pointer-events:none;
  background:linear-gradient(110deg,rgba(243,232,212,.40) 0%,rgba(232,229,223,.38) 38%,rgba(199,203,211,.42) 66%,rgba(141,150,168,.44) 100%);
  filter:blur(32px);
  -webkit-mask-image:linear-gradient(to right,transparent 0%,#000 16%,#000 76%,transparent 100%),linear-gradient(to bottom,transparent 0%,#000 18%,#000 82%,transparent 100%);
  mask-image:linear-gradient(to right,transparent 0%,#000 16%,#000 76%,transparent 100%),linear-gradient(to bottom,transparent 0%,#000 18%,#000 82%,transparent 100%);
  -webkit-mask-composite:source-in;
  mask-composite:intersect;
}
@media(max-width:800px){
  html body.page-home.site-light-page main.home section.home-hero .home-hero__soft-gradient{
    top:0;
    left:0;
    width:100%;
    height:72%;
    transform:none;
    filter:blur(24px);
  }
}
'''

          new = '''html body.page-home.site-light-page main.home section.home-hero .home-hero__soft-gradient{
  position:absolute;
  left:calc(max(32px,(100vw - 1227px)/2) - 113.6px);
  top:calc(50% + 5px);
  width:482.112px;
  height:192px;
  transform:none;
  z-index:0;
  pointer-events:none;
  display:block;
  visibility:visible;
  opacity:1;
  background:linear-gradient(to right in oklab,rgba(244,228,201,.14) 0%,rgba(232,227,218,.14) 36%,rgba(193,199,214,.14) 68%,rgba(132,144,171,.14) 100%);
  background-size:100% 100%;
  background-position:0 0;
  background-repeat:no-repeat;
  filter:none;
  -webkit-backdrop-filter:blur(32px);
  backdrop-filter:blur(32px);
  -webkit-mask-image:none;
  mask-image:none;
  -webkit-mask-composite:initial;
  mask-composite:initial;
}
@media(max-width:800px){
  html body.page-home.site-light-page main.home section.home-hero .home-hero__soft-gradient{
    display:none;
    visibility:hidden;
  }
}
'''

          if old not in css:
              raise SystemExit('Bestehender Hero-Soft-Gradient-Block nicht eindeutig gefunden; keine Änderung vorgenommen.')
          css = css.replace(old, new, 1)

          old_hide = '''/* Startseite Hero: linken Farbverlauf vollständig entfernen. */
html body.page-home.site-light-page main.home section.home-hero .home-hero__soft-gradient{
  display:none!important;
  visibility:hidden!important;
  background:none!important;
  background-image:none!important;
  filter:none!important;
  opacity:0!important;
}
'''
          if old_hide not in css:
              raise SystemExit('Alte Hero-Ausblendregel nicht eindeutig gefunden; keine Änderung vorgenommen.')
          css = css.replace(old_hide, '''/* Startseite Hero: separater Akzent ist in der bestehenden .home-hero__soft-gradient-Regel definiert. */\n''', 1)

          css_path.write_text(css, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          old_link = 'assets/unified-design.css?v=home-fachwissen-bgcolor-fix-20260911-1'
          new_link = 'assets/unified-design.css?v=hero-final-separat-20260911-1'
          if old_link not in index:
              raise SystemExit('Stylesheet-Verweis in index.html nicht gefunden; keine Änderung vorgenommen.')
          index = index.replace(old_link, new_link, 1)
          index_path.write_text(index, encoding='utf-8')
          PY

      - name: Änderung committen
        shell: bash
        run: |
          git config user.name "5rnhcymzrw-sys"
          git config user.email "5rnhcymzrw@privaterelay.appleid.com"
          git add assets/unified-design.css index.html
          git diff --cached --quiet && exit 0
          git commit -m "Startseite Hero final: separater Verlauf mit Linie und Weichzeichnung"
          git push origin main
