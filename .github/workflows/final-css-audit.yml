name: Final CSS audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/final-css-audit.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit remaining legacy patterns
        run: |
          echo '=== repeated class selectors ==='
          grep -nE '\.([A-Za-z0-9_-]+)(\.\1){1,}' assets/unified-design.css || true
          echo '=== page scoped classes in unified ==='
          grep -nE 'page-(home|company|knowledge|privacy|disclaimer|article)-' assets/unified-design.css || true
          echo '=== hardcoded common values ==='
          grep -nE '1227px|126px|82px|64px|36px' assets/unified-design.css assets/global.css assets/dienstleistungen.css assets/contact.css assets/article-detail.css || true
          echo '=== suspicious comments ==='
          grep -nE '/\* .*index\.html|FINAL:|ursprüng|Endregel|alte|Alt|verbleib' assets/unified-design.css assets/global.css assets/dienstleistungen.css assets/contact.css assets/article-detail.css || true
      - name: Remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/final-css-audit.yml
          git commit -m "Temporären CSS-Audit entfernen"
          git push
