name: Centralize gradient tokens
on:
  push:
    branches: [main]
    paths: ['.github/workflows/centralize-gradient-tokens.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add and use gradient tokens
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gp=Path('assets/global.css')
          up=Path('assets/unified-design.css')
          g=gp.read_text(encoding='utf-8')
          u=up.read_text(encoding='utf-8')
          needle='--mt-gradient-line:linear-gradient(90deg,#f3e8d4 0%,#e8e5df 38%,#c7cbd3 66%,#8d96a8 100%);'
          assert needle in g
          insert=(needle+
            '--mt-gradient-frame-left:linear-gradient(110deg,#f3e8d4 0%,#e8e5df 100%);'
            '--mt-gradient-frame-middle:linear-gradient(110deg,#e8e5df 0%,#c7cbd3 100%);'
            '--mt-gradient-frame-right:linear-gradient(110deg,#c7cbd3 0%,#8d96a8 100%);'
            '--mt-gradient-card-glass:linear-gradient(to right in oklab,rgba(244,228,201,.11) 0%,rgba(232,227,218,.11) 36%,rgba(193,199,214,.11) 68%,rgba(132,144,171,.11) 100%);')
          g=g.replace(needle,insert,1)
          replacements={
            'linear-gradient(110deg,#f3e8d4 0%,#e8e5df 100%)':'var(--mt-gradient-frame-left)',
            'linear-gradient(110deg,#e8e5df 0%,#c7cbd3 100%)':'var(--mt-gradient-frame-middle)',
            'linear-gradient(110deg,#c7cbd3 0%,#8d96a8 100%)':'var(--mt-gradient-frame-right)',
            'linear-gradient(to right in oklab,rgba(244,228,201,.11) 0%,rgba(232,227,218,.11) 36%,rgba(193,199,214,.11) 68%,rgba(132,144,171,.11) 100%)':'var(--mt-gradient-card-glass)'
          }
          counts={}
          for old,new in replacements.items():
            counts[old]=u.count(old)
            assert counts[old] >= 1, (old, counts[old])
            u=u.replace(old,new)
          gp.write_text(g,encoding='utf-8')
          up.write_text(u,encoding='utf-8')
          print(counts)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/global.css assets/unified-design.css
          git commit -m "Kartenverläufe als globale Tokens zentralisieren"
          git rm .github/workflows/centralize-gradient-tokens.yml
          git commit -m "Temporären Verlaufstoken-Workflow entfernen"
          git push
