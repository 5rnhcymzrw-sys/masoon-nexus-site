name: Section label cleanup followup

on:
  push:
    paths:
      - '.github/workflows/section-label-cleanup-followup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore unrelated spacing and keep one section-label source
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # global.css: keep section-label free of any old letter-spacing,
          # but restore the original spacing for card numbers and actions.
          global_css = Path('assets/global.css')
          g = global_css.read_text()
          old = '.section-label,\n.card-number,\n.details-action{font-family:var(--font-inter)!important;font-size:var(--label-size)!important;font-weight:500!important;line-height:1.4!important;text-transform:uppercase!important;}'
          new = '.section-label,\n.card-number,\n.details-action{font-family:var(--font-inter)!important;font-size:var(--label-size)!important;font-weight:500!important;line-height:1.4!important;text-transform:uppercase!important;}\n.card-number,\n.details-action{letter-spacing:.14em!important;}'
          if g.count(old) != 1:
              raise SystemExit(f'global.css shared label rule not found exactly once: {g.count(old)}')
          g = g.replace(old, new, 1)
          global_css.write_text(g)

          # Restore the two unrelated prose declarations accidentally removed.
          base = Path('assets/unified-design-base-20260907.css')
          b = base.read_text()
          targets = [
              ('html body.site-light-page main .contact-split__intro{', 'color:#484a4f!important;'),
              ('html body main .form-status{', 'color:#484a4f!important;')
          ]
          for selector, marker in targets:
              s = b.find(selector)
              if s == -1:
                  raise SystemExit(f'Block not found: {selector}')
              e = b.find('}', s)
              block = b[s:e+1]
              if 'letter-spacing:normal!important;' not in block:
                  if marker not in block:
                      raise SystemExit(f'Marker not found in {selector}')
                  block = block.replace(marker, 'letter-spacing:normal!important;\n  ' + marker, 1)
                  b = b[:s] + block + b[e+1:]

          # Verify canonical section label is the sole section-label letter-spacing source
          # in active CSS, excluding pseudo-only or :not(.section-label) selectors.
          canonical = 'html body main .section-label.section-label.section-label.section-label.section-label.section-label'
          cs = b.find(canonical + '{')
          if cs == -1:
              raise SystemExit('Canonical section-label rule missing')
          ce = b.find('}', cs)
          cblock = b[cs:ce+1]
          if 'letter-spacing:1.1px!important;' not in cblock:
              raise SystemExit('Canonical section-label rule is not 1.1px')
          base.write_text(b)

          # Cache bust the changed active CSS files.
          unified = Path('assets/unified-design.css')
          u = unified.read_text()
          u, n = re.subn(
              r"@import url\('\./unified-design-base-20260907\.css\?v=[^']+'\);",
              "@import url('./unified-design-base-20260907.css?v=section-label-clean-20260912-4');",
              u,
              count=1
          )
          if n != 1:
              raise SystemExit('Unified base import not found')
          unified.write_text(u)

          html_count = 0
          for page in Path('.').rglob('*.html'):
              html = page.read_text()
              updated = re.sub(r'(global\.css\?v=)[^"\']+', r'\1section-label-clean-20260912-4', html)
              updated = re.sub(r'(unified-design\.css\?v=)[^"\']+', r'\1section-label-clean-20260912-4', updated)
              if updated != html:
                  page.write_text(updated)
                  html_count += 1
          print('Updated HTML files:', html_count)
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/section-label-cleanup-followup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bereichstitel: alte Abstände bereinigen ohne andere Typografie zu ändern"
          git push
