<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MASOON TREUHAND – Grau und Fachwissen Test</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#fff;font-family:Arial,sans-serif}
iframe{display:block;width:100%;height:100vh;border:0;background:#fff}
.test-panel{position:fixed;right:10px;top:10px;z-index:99999;width:236px;max-width:calc(100vw - 20px);padding:10px;background:rgba(255,255,255,.98);border:1px solid #a9a9a9;box-shadow:0 4px 18px rgba(0,0,0,.14)}
.test-active{margin:0 0 8px;padding:6px 7px;background:#171715;color:#fff;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-align:center}
.test-title{margin:0 0 8px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#171715}
.test-row{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 7px}
.test-panel button{appearance:none;border:1px solid #aaa;background:#fff;color:#171715;padding:6px 7px;font-size:9px;line-height:1;cursor:pointer}
.test-panel button.active{background:#171715;color:#fff;border-color:#171715}
.test-panel .success-toggle{width:100%;margin-top:4px;text-align:center}
.test-note{font-size:8px;line-height:1.4;color:#666;margin-top:7px}
@media(max-width:560px){.test-panel{right:6px;top:6px;width:212px;max-width:calc(100vw - 12px)}}
</style>
</head>
<body>
<iframe id="site" src="./fachwissen/index.html?v=grau-test-3"></iframe>
<div class="test-panel" aria-label="Teststeuerung">
  <div class="test-active">TEST AKTIV · GRAU / FACHWISSEN</div>
  <p class="test-title">Testansicht</p>
  <div class="test-row" id="pages">
    <button data-page="./index.html">Start</button>
    <button data-page="./unternehmen/index.html">Unternehmen</button>
    <button data-page="./dienstleistungen/index.html">DL</button>
    <button data-page="./fachwissen/index.html" class="active">Fachwissen</button>
    <button data-page="./fachwissen/checkliste-steuererklaerung/index.html">Blog</button>
    <button data-page="./kontakt/index.html">Kontakt</button>
  </div>
  <button id="success-toggle" class="success-toggle" type="button" hidden>Bestätigung anzeigen</button>
  <div class="test-note">Nur Testansicht. Produktionsseiten bleiben unverändert.</div>
</div>
<script>
const frame=document.getElementById('site');
const pages=document.getElementById('pages');
const successToggle=document.getElementById('success-toggle');
let successPreview=false;
const GREY='#868279';
const BORDER='linear-gradient(110deg,#f3e8d4 0%,#e8e5df 38%,#c7cbd3 66%,#8d96a8 100%) 1';

const testCss=`
:root{--masoon-test-grey:${GREY}}

/* Bereichstitel */
html body.site-light-page .section-label,
html body.site-light-page .article-card-date,
html body.site-light-page .home-paths__category{
  color:var(--masoon-test-grey)!important;
}

/* Sämtliche Aktionsschriften grau, auch in Hover-/Focus-Zuständen */
html body.site-light-page .home-action-button,
html body.site-light-page .home-action-button:hover,
html body.site-light-page .home-action-button:focus-visible,
html body.site-light-page .home-action-button:active,
html body.site-light-page .details-action,
html body.site-light-page .details-action:hover,
html body.site-light-page .article-action,
html body.site-light-page .article-action:hover,
html body.site-light-page .article-action:focus-visible,
html body.site-light-page .services-contact-button,
html body.site-light-page .services-contact-button:hover,
html body.site-light-page .contact-split__form button[type="submit"],
html body.site-light-page .contact-split__form button[type="submit"]:hover,
html body.site-light-page .home-paths__action,
html body.site-light-page .article-back,
html body.site-light-page .article-back:hover,
html body.site-light-page .article-back:focus-visible{
  color:var(--masoon-test-grey)!important;
}

/* Fusszeile */
html body.site-light-page .site-footer,
html body.site-light-page .site-footer a,
html body.site-light-page .footer-simple,
html body.site-light-page .footer-simple a{
  color:var(--masoon-test-grey)!important;
}

/* Unternehmen: feiner Verlaufsrahmen direkt um das Portrait */
html body.page-company .company-legal-card .home-company__image-primary{
  box-sizing:border-box!important;
  border:1px solid transparent!important;
  border-image:${BORDER}!important;
}

/* Fachwissen: Beitrag anzeigen im Ruhezustand 3px höher. */
html body.page-knowledge #knowledge-articles .article-card .article-action{
  transform:translateY(-3px)!important;
  color:var(--masoon-test-grey)!important;
}

/* Fachwissen: Titel + Titel-Trennlinie + Fliesstext leicht nach unten */
html body.page-knowledge #knowledge-articles .article-card>h2,
html body.page-knowledge #knowledge-articles .article-card>p.mt-body-copy{
  transform:translateY(8px)!important;
}

/* Einzelne Fachbeiträge: Titel etwas kompakter */
html body.site-light-page .article-shell .article-title{
  letter-spacing:-.02em!important;
}

/* Kontakt: Verlaufsvariante nur im Bestätigungskasten */
html body.page-contact .contact-success__message{
  background-color:rgba(255,255,255,.72)!important;
  background-image:linear-gradient(to right in oklab,rgba(244,228,201,.14) 0%,rgba(232,227,218,.14) 36%,rgba(193,199,214,.14) 68%,rgba(132,144,171,.14) 100%)!important;
  background-size:100% 100%!important;
  background-position:0 0!important;
  background-repeat:no-repeat!important;
  border:1px solid transparent!important;
  border-image:${BORDER}!important;
  box-shadow:none!important;
  -webkit-backdrop-filter:blur(32px)!important;
  backdrop-filter:blur(32px)!important;
}
`;

function setImportant(el,prop,value){
  if(el) el.style.setProperty(prop,value,'important');
}

function formatKnowledgeDates(d){
  d.querySelectorAll('#knowledge-articles time.article-card-date[datetime]').forEach(time=>{
    const iso=time.getAttribute('datetime')||'';
    const m=iso.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if(!m)return;

    /* Kategorie genau einmal sichern. Dadurch bleibt die Funktion auch bei
       mehrfacher Ausführung idempotent und kann kein Datum duplizieren. */
    if(!time.dataset.masoonTestCategory){
      const original=(time.textContent||'').trim();
      time.dataset.masoonTestCategory=original.replace(/^\d{2}\.\d{2}\.\d{4}\s*/,'').trim();
    }
    const category=time.dataset.masoonTestCategory;
    time.textContent=category ? `${m[2]}.${m[1]}  ${category}` : `${m[2]}.${m[1]}`;
  });
}

function applyDirectStyles(d){
  d.querySelectorAll('.section-label,.article-card-date,.home-paths__category').forEach(el=>setImportant(el,'color',GREY));
  d.querySelectorAll('.home-action-button,.details-action,.article-action,.services-contact-button,.contact-split__form button[type="submit"],.home-paths__action,.article-back').forEach(el=>setImportant(el,'color',GREY));
  d.querySelectorAll('.site-footer,.site-footer a,.footer-simple,.footer-simple a').forEach(el=>setImportant(el,'color',GREY));

  const portrait=d.querySelector('body.page-company .company-legal-card .home-company__image-primary');
  if(portrait){
    setImportant(portrait,'border','1px solid transparent');
    setImportant(portrait,'border-image',BORDER);
  }

  if(d.body.classList.contains('page-knowledge')){
    d.querySelectorAll('#knowledge-articles .article-card .article-action').forEach(el=>setImportant(el,'transform','translateY(-3px)'));
    d.querySelectorAll('#knowledge-articles .article-card>h2,#knowledge-articles .article-card>p.mt-body-copy').forEach(el=>setImportant(el,'transform','translateY(8px)'));
  }

  d.querySelectorAll('.article-shell .article-title').forEach(el=>setImportant(el,'letter-spacing','-.02em'));
}

function applyTest(){
  const d=frame.contentDocument;
  if(!d||!d.head||!d.body)return;
  let style=d.getElementById('masoon-grey-fachwissen-test');
  if(!style){
    style=d.createElement('style');
    style.id='masoon-grey-fachwissen-test';
    d.head.appendChild(style);
  }
  style.textContent=testCss;
  formatKnowledgeDates(d);
  applyDirectStyles(d);

  const path=frame.contentWindow.location.pathname;
  const isContact=/\/kontakt\/(?:index\.html)?$/.test(path);
  successToggle.hidden=!isContact;
  if(!isContact){
    successPreview=false;
    successToggle.textContent='Bestätigung anzeigen';
  }
}

function setSuccessPreview(on){
  const d=frame.contentDocument;
  if(!d)return;
  const form=d.querySelector('form.contact-split__form, form.contact-form');
  const success=d.querySelector('.contact-success');
  if(!form||!success)return;
  form.querySelectorAll(':scope>label,:scope>button[type="submit"],:scope>.form-status').forEach(el=>{el.hidden=on});
  success.hidden=!on;
  successPreview=on;
  successToggle.textContent=on?'Formular anzeigen':'Bestätigung anzeigen';
  if(on){
    applyTest();
    success.scrollIntoView({block:'center',behavior:'auto'});
  }
}

pages.addEventListener('click',event=>{
  const button=event.target.closest('button[data-page]');
  if(!button)return;
  pages.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
  button.classList.add('active');
  successPreview=false;
  successToggle.textContent='Bestätigung anzeigen';
  frame.src=button.dataset.page+'?v=grau-test-'+Date.now();
});

successToggle.addEventListener('click',()=>setSuccessPreview(!successPreview));
frame.addEventListener('load',()=>{
  applyTest();
  setTimeout(applyTest,80);
  setTimeout(applyTest,300);
});
</script>
</body>
</html>
