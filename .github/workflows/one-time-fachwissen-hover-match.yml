name: One-time Fachwissen hover match

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-fachwissen-hover-match.yml

permissions:
  contents: write

jobs:
  fix-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch CSS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('assets/unified-design.css')
          s = p.read_text(encoding='utf-8')
          transparent = '{background:transparent!important;background-color:transparent!important;background-image:none!important;}'
          prefix = 'html body.site-light-page main.home>section.home-paths.home-paths .home-paths__grid.home-paths__grid>a:nth-child('
          for n in (1, 2, 3):
              old = prefix + str(n) + ')' + transparent
              new = prefix + str(n) + '):not(:hover):not(:active)' + transparent
              if old not in s:
                  raise SystemExit('missing normal selector ' + str(n))
              s = s.replace(old, new, 1)
          blocks = [
              ('html body.page-home.site-light-page main.home section.home-paths .home-paths__grid.home-paths__grid>a:nth-child(1){\n  border-image:linear-gradient(110deg,#f3e8d4 0%,#e8e5df 100%) 1!important;\n}', 'html body.page-home.site-light-page main.home section.home-paths .home-paths__grid.home-paths__grid>a:nth-child(1){\n  border-image:linear-gradient(110deg,#f3e8d4 0%,#e8e5df 100%) 1!important;\n  background-position:left top!important;\n}'),
              ('html body.page-home.site-light-page main.home section.home-paths .home-paths__grid.home-paths__grid>a:nth-child(2){\n  border-image:linear-gradient(110deg,#e8e5df 0%,#c7cbd3 100%) 1!important;\n}', 'html body.page-home.site-light-page main.home section.home-paths .home-paths__grid.home-paths__grid>a:nth-child(2){\n  border-image:linear-gradient(110deg,#e8e5df 0%,#c7cbd3 100%) 1!important;\n  background-position:center top!important;\n}'),
              ('html body.page-home.site-light-page main.home section.home-paths .home-paths__grid.home-paths__grid>a:nth-child(3){\n  border-image:linear-gradient(110deg,#c7cbd3 0%,#8d96a8 100%) 1!important;\n}', 'html body.page-home.site-light-page main.home section.home-paths .home-paths__grid.home-paths__grid>a:nth-child(3){\n  border-image:linear-gradient(110deg,#c7cbd3 0%,#8d96a8 100%) 1!important;\n  background-position:right top!important;\n}')
          ]
          for old, new in blocks:
              if old not in s:
                  raise SystemExit('missing nth-child position block')
              s = s.replace(old, new, 1)
          old = 'background:linear-gradient(to right in oklab,rgba(243,232,212,.18) 0%,rgba(232,229,223,.18) 36%,rgba(199,203,211,.18) 68%,rgba(141,150,168,.18) 100%)!important;    box-shadow:0 10px 26px rgba(23,23,21,.08)!important;'
          new = 'background:linear-gradient(to right in oklab,rgba(243,232,212,.11) 0%,rgba(232,229,223,.11) 36%,rgba(199,203,211,.11) 68%,rgba(141,150,168,.11) 100%)!important;\n    background-size:calc(300% + 44px) 100%!important;\n    background-repeat:no-repeat!important;\n    background-origin:border-box!important;\n    -webkit-backdrop-filter:blur(32px)!important;\n    backdrop-filter:blur(32px)!important;\n    box-shadow:none!important;'
          if old not in s:
              raise SystemExit('missing hover background line')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/unified-design.css
          git commit -m "Match Fachwissen hover gradient to Dienstleistungen cards"
          git push
