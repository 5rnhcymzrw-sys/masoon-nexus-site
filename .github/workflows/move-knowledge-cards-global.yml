name: Move knowledge cards to global
on:
  push:
    branches: [main]
    paths: ['.github/workflows/move-knowledge-cards-global.yml']
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move Fachwissen card blocks into global.css
        shell: python
        run: |
          from pathlib import Path

          g = Path('assets/global.css')
          u = Path('assets/unified-design.css')
          b = Path('assets/unified-design-base-20260907.css')
          gs, us, bs = g.read_text(), u.read_text(), b.read_text()
          marker = '/* Fachwissen-Kacheln – zentrale globale Komponente */'
          assert marker not in gs
          moved = []

          def move_between(text, start, end, label):
              a = text.find(start)
              assert a >= 0, f'Startanker fehlt: {label}'
              z = text.find(end, a)
              assert z >= 0, f'Endanker fehlt: {label}'
              block = text[a:z]
              return text[:a] + text[z:], block

          # Startseite: kompletter Hauptblock der Fachwissen-Karten inkl. Hover/Focus.
          us, block = move_between(
              us,
              'html body.page-home.site-light-page main.home section.home-paths .home-paths__grid.home-paths__grid>a{',
              'html body.page-home.site-light-page main.home .home-values__inner>p,',
              'Startseite Fachwissen Interaktion'
          )
          moved.append(block)

          # Startseite: aktuelles finales Kartenlayout, Titel, Meta und Text.
          us, block = move_between(
              us,
              'html body.page-home.site-light-page main.home section.home-paths .home-paths__grid>a{justify-content:flex-start!important;',
              'html body.page-home.site-light-page main.home section.home-values .home-action-button::before',
              'Startseite Fachwissen finales Layout'
          )
          moved.append(block)

          # Fachwissen-Hauptseite: kompletter seitenspezifischer Kartenblock.
          us, block = move_between(
              us,
              '/* fachwissen/index.html */',
              '/* fachwissen/gewinnverwendung/index.html */',
              'Fachwissen Hauptseite'
          )
          moved.append(block)

          # Basisdatei: explizite Fachwissen-Kartenblöcke.
          anchors = [
              ('/* Desktop: Fachwissen Kacheln auf der Startseite gleich hoch wie Werte */', '/* Desktop Dienstleistungsseite: Abstände exakt wie bei Dienstleistungen auf der Startseite */'),
              ('/* Fachwissen: einheitliche Titellinie und Fliesstext */', '/* Einheitliche kurze Linien zwischen kleinen Titeln und nachfolgendem Text */')
          ]
          for i, (start, end) in enumerate(anchors, 1):
              if start in bs and end in bs:
                  bs, block = move_between(bs, start, end, f'Basis Fachwissen {i}')
                  moved.append(block)

          assert len(moved) >= 3
          gs = gs.rstrip() + '\n\n' + marker + '\n' + '\n'.join(moved).rstrip() + '\n'

          g.write_text(gs)
          u.write_text(us)
          b.write_text(bs)

          # Kontrolle: zentrale Datei enthält beide Kartentypen und Hauptseite.
          chk = g.read_text()
          assert '.home-paths__grid' in chk
          assert '.article-card' in chk
          assert '/* fachwissen/index.html */' in chk
          print('Fachwissen-Kachelblöcke verschoben:', len(moved))
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/global.css assets/unified-design.css assets/unified-design-base-20260907.css
          git commit -m "Alle Fachwissen-Kacheln nach global.css verschieben"
          git rm .github/workflows/move-knowledge-cards-global.yml
          git commit -m "Temporären Fachwissen-Kachel-Workflow entfernen"
          git push
