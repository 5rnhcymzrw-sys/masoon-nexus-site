<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MASOON TREUHAND – Farbtest Startseite</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:Arial,sans-serif}.toolbar{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:99999;display:flex;gap:8px;padding:8px;background:rgba(255,255,255,.96);border:1px solid rgba(23,23,21,.14);box-shadow:0 8px 24px rgba(23,23,21,.10)}.toolbar button{appearance:none;border:1px solid #b9b5af;background:#fff;padding:9px 14px;font-size:12px;cursor:pointer;color:#171715}.toolbar button.active{background:#171715;color:#fff;border-color:#171715}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><div class="toolbar"><button data-mode="a" class="active">A – empfohlen</button><button data-mode="b">B – wärmer</button><button data-mode="c">C – dezenter</button></div><iframe id="site" src="../index.html"></iframe><script>
const frame=document.getElementById('site'),buttons=[...document.querySelectorAll('button[data-mode]')];
const C1='#E2DED8',C2='#EFECE7',C3='#F6F4F1';
const variants={
 a:{fw:'linear-gradient(110deg,#EFECE7 0%,#F8F7F5 100%)',contact:'linear-gradient(110deg,#F6F4F1 0%,#E4E6EA 100%)'},
 b:{fw:'linear-gradient(110deg,#E8E2DA 0%,#F5F1EC 100%)',contact:'linear-gradient(110deg,#F1EDE7 0%,#E7E2DB 100%)'},
 c:{fw:'linear-gradient(110deg,#F2EFEB 0%,#FAF9F7 100%)',contact:'linear-gradient(110deg,#F7F5F2 0%,#ECEEF1 100%)'}
};
function apply(mode){const d=frame.contentDocument||frame.contentWindow.document;if(!d)return;d.getElementById('start-farbtest-style')?.remove();const s=d.createElement('style');s.id='start-farbtest-style';const dl='html body.site-light-page:has(main.home) main.home>section.home-values .home-values__items>.home-values__item.home-values__item.home-values__item.home-values__item';const fw='html body.site-light-page main.home section.home-paths .home-paths__grid>a,html body.site-light-page main.home section.home-paths .home-paths__grid>article,html body.site-light-page main.home section.home-paths .home-paths__grid>.home-paths__item';const noborder=`border:0!important;border-image:none!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;`;const v=variants[mode];s.textContent=`${dl}{${noborder}background:${C1}!important;background-image:none!important}${dl}::before,${dl}::after{content:none!important;display:none!important}${dl}:nth-child(3n+2){background:${C2}!important;background-image:none!important}${dl}:nth-child(3n){background:${C3}!important;background-image:none!important}${fw}{${noborder}background:${v.fw}!important;background-image:${v.fw}!important}html body.site-light-page main.home section.home-contact-band{background:${v.contact}!important;background-image:${v.contact}!important}html body.site-light-page main.home section.home-contact-band>div,html body.site-light-page main.home section.home-contact-band>.home-contact-band__inner,html body.site-light-page main.home section.home-contact-band .home-contact-band__inner,html body.site-light-page main.home section.home-contact-band .home-contact-card,html body.site-light-page main.home section.home-contact-band .contact-card{background:transparent!important;background-color:transparent!important;background-image:none!important}`;d.head.appendChild(s);buttons.forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));}
frame.addEventListener('load',()=>{apply('a');setTimeout(()=>{const d=frame.contentDocument||frame.contentWindow.document;d.querySelector('.home-values')?.scrollIntoView({block:'start'});},180)});buttons.forEach(b=>b.addEventListener('click',()=>apply(b.dataset.mode)));
</script></body></html>
