name: Globalize subheadings
on:
  push:
    branches: [main]
    paths: ['.github/workflows/globalize-subheadings.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply single global subheading source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def remove_rules_with_selector(text, needle):
              pos = 0
              removed = 0
              while True:
                  j = text.find(needle, pos)
                  if j < 0:
                      break
                  prev_open = text.rfind('{', 0, j)
                  prev_close = text.rfind('}', 0, j)
                  start = max(prev_open, prev_close) + 1
                  open_brace = text.find('{', j)
                  if open_brace < 0:
                      break
                  selector = text[start:open_brace]
                  if needle not in selector:
                      pos = j + len(needle)
                      continue
                  depth = 0
                  end = None
                  for k in range(open_brace, len(text)):
                      if text[k] == '{':
                          depth += 1
                      elif text[k] == '}':
                          depth -= 1
                          if depth == 0:
                              end = k + 1
                              break
                  if end is None:
                      raise RuntimeError(f'Unclosed rule for {needle}')
                  text = text[:start] + text[end:]
                  removed += 1
                  pos = max(0, start - 1)
              return text, removed

          global_css = Path('assets/global.css')
          g = global_css.read_text(encoding='utf-8')
          old = '''/* Einheitliche Zwischentitel auf allen Seiten */
          html body.site-light-page main .article-body h2,
          html body.site-light-page main .prose h2{
            font-family:"PT Serif",Georgia,serif!important;
            font-size:22px!important;
            font-weight:700!important;
            line-height:1.12!important;
            letter-spacing:0!important;
            font-synthesis:none!important;
          }
          '''
          if old not in g:
              old = old.replace('          ','')
          assert old in g, 'Globaler Zwischentitel Ausgangsblock nicht gefunden'
          new = '''/* Globale Zwischentitel – Referenz 01.2026 Konkursrecht */
          html body.site-light-page main :is(.article-body,.prose)>h2{
            position:relative!important;
            max-width:none!important;
            margin:48px 0 16px!important;
            font-family:"PT Serif",Georgia,serif!important;
            font-size:22px!important;
            font-weight:700!important;
            line-height:1.12!important;
            letter-spacing:0!important;
            font-synthesis:none!important;
            text-align:left!important;
            color:#171715!important;
          }
          html body.site-light-page main :is(.article-body,.prose)>h2:first-child{margin-top:0!important;}
          html body.site-light-page main :is(.article-body,.prose)>h2::after{content:none!important;display:none!important;}
          html body.site-light-page main :is(.article-body,.prose)>h2+p{margin-top:0!important;}
          @media(max-width:800px){
            html body.site-light-page main :is(.article-body,.prose)>h2:not(:first-child){margin-top:40px!important;}
          }
          '''.replace('          ','')
          g = g.replace(old, new, 1)
          global_css.write_text(g, encoding='utf-8')

          targets = [
              Path('assets/article-detail.css'),
              Path('assets/unified-design.css'),
              Path('assets/index-CZfMKxM_.css'),
              Path('assets/contact.css'),
              Path('assets/dienstleistungen.css'),
          ]
          total_removed = 0
          for p in targets:
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              for needle in ('.article-body h2', '.prose h2', '.disclaimer-card .prose h2'):
                  s, n = remove_rules_with_selector(s, needle)
                  total_removed += n
              p.write_text(s, encoding='utf-8')

          assert total_removed > 0, 'Keine alten Zwischentitelregeln entfernt'

          for html in Path('.').rglob('*.html'):
              s = html.read_text(encoding='utf-8')
              s = re.sub(r'global\.css\?v=[^"\']+', 'global.css?v=subheading-global-20260915-1', s)
              s = re.sub(r'article-detail\.css\?v=[^"\']+', 'article-detail.css?v=subheading-global-20260915-1', s)
              s = re.sub(r'unified-design\.css\?v=[^"\']+', 'unified-design.css?v=subheading-global-20260915-1', s)
              s = re.sub(r'index-CZfMKxM_\.css\?v=[^"\']+', 'index-CZfMKxM_.css?v=subheading-global-20260915-1', s)
              html.write_text(s, encoding='utf-8')
          PY
      - name: Verify one source only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          g=Path('assets/global.css').read_text(encoding='utf-8')
          assert 'Globale Zwischentitel – Referenz 01.2026 Konkursrecht' in g
          assert 'margin:48px 0 16px!important' in g
          assert 'font-size:22px!important' in g
          assert 'line-height:1.12!important' in g
          offenders=[]
          for p in Path('assets').glob('*.css'):
              if p.name == 'global.css':
                  continue
              s=p.read_text(encoding='utf-8')
              if '.article-body h2' in s or '.prose h2' in s or '.disclaimer-card .prose h2' in s:
                  offenders.append(p.name)
          assert not offenders, f'Alte Zwischentitelregeln verblieben: {offenders}'
          print('Single global subheading source verified')
          PY
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets *.html */*.html */*/*.html 2>/dev/null || true
          git commit -m "Zwischentitel global vereinheitlichen"
          git rm .github/workflows/globalize-subheadings.yml
          git commit -m "Temporären Zwischentitel Workflow entfernen"
          git push
