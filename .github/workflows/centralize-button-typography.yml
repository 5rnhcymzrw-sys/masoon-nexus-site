name: Centralize button typography
on:
  push:
    branches: [main]
    paths: ['.github/workflows/centralize-button-typography.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Centralize button typography
        run: python .github/scripts/centralize_button_typography.py
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.css '*.html' */*.html */*/*.html
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m "Button-Schriften global vereinheitlichen"
          git push origin main
# generic button class included
