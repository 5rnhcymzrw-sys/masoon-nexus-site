<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>MASOON TREUHAND – Hero Layout Test</title>
<style>
html,body{margin:0;height:100%;background:#111;font-family:Arial,sans-serif}
body{display:grid;grid-template-rows:58px 1fr;overflow:hidden}
.tester{display:flex;align-items:center;gap:7px;padding:0 14px;background:#f3f3f3;border-bottom:1px solid #ccc;box-sizing:border-box;z-index:10;overflow-x:auto}
.tester strong{font-size:13px;margin-right:6px;font-weight:600;white-space:nowrap}
.tester button{appearance:none;border:1px solid #c9c9c9;background:#fff;padding:9px 12px;font-size:12px;cursor:pointer;white-space:nowrap}
.tester button.active{background:#111;color:#fff;border-color:#111}
.tester small{margin-left:auto;color:#666;font-size:11px;white-space:nowrap}
iframe{width:100%;height:100%;border:0;background:#fff;display:block}
@media(max-width:900px){.tester strong,.tester small{display:none}}
</style>
</head>
<body>
<div class="tester">
<strong>Hero vergleichen</strong>
<button data-v="original">Original</button>
<button data-v="v3" class="active">3 · Foto dominant</button>
<button data-v="v4">4 · Offen links</button>
<button data-v="v5">5 · Transparente Fläche</button>
<button data-v="v6">6 · Titel über Bildkante</button>
<button data-v="v7">7 · Text unten</button>
<small>Nur Vorschau – Startseite bleibt unverändert</small>
</div>
<iframe id="site" src="./index.html"></iframe>
<script>
const frame=document.getElementById('site');
const buttons=[...document.querySelectorAll('button[data-v]')];
let current='v3';
const css=`
/* Gemeinsame Testbasis: kein strukturiertes Hero-Hintergrundbild */
html[class*="hero-test-"] body.site-light-page main.home section.home-hero::before{
  background:none!important;transform:none!important;
}
html[class*="hero-test-"] body.site-light-page main.home section.home-hero{
  overflow:hidden!important;
  background:linear-gradient(105deg,rgba(243,232,212,.34) 0%,rgba(232,229,223,.22) 42%,rgba(199,203,211,.13) 68%,rgba(255,255,255,.50) 100%)!important;
}
html[class*="hero-test-"] body.site-light-page main.home section.home-hero::after{
  content:''!important;position:absolute!important;inset:0!important;pointer-events:none!important;
  background:linear-gradient(90deg,rgba(243,232,212,.24) 0%,rgba(243,232,212,0) 52%)!important;z-index:0!important;
}

/* 3: bisherige dominante Version */
@media(min-width:801px){
html.hero-test-v3 body.site-light-page main.home section.home-hero{min-height:calc(100svh - 108px)!important;background:linear-gradient(105deg,rgba(243,232,212,.36) 0%,rgba(232,229,223,.18) 45%,rgba(199,203,211,.12) 72%,rgba(255,255,255,.18) 100%)!important}
html.hero-test-v3 body.site-light-page main.home section.home-hero .home-hero__portrait{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;transform:none!important;clip-path:none!important;z-index:1!important}
html.hero-test-v3 body.site-light-page main.home section.home-hero .home-hero__portrait-image{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;object-fit:cover!important;object-position:right 18%!important;transform:none!important}
html.hero-test-v3 body.site-light-page main.home section.home-hero .home-hero__portrait::after{content:''!important;position:absolute!important;inset:0!important;width:100%!important;background:linear-gradient(90deg,rgba(243,232,212,.96) 0%,rgba(232,229,223,.78) 26%,rgba(199,203,211,.30) 49%,rgba(0,0,0,.06) 68%,rgba(0,0,0,.06) 100%)!important}
html.hero-test-v3 body.site-light-page main.home section.home-hero .home-hero__content{width:min(100% - 64px,1227px)!important;margin:0 auto!important;padding:0 0 9vh!important;min-height:calc(100svh - 108px)!important;display:flex!important;align-items:flex-end!important;position:relative!important;z-index:3!important}
html.hero-test-v3 body.site-light-page main.home section.home-hero .home-hero__copy{width:46%!important;padding:0!important;background:transparent!important;border:0!important;border-image:none!important}
html.hero-test-v3 body.site-light-page main.home section.home-hero h1.global-title{font-size:58px!important;line-height:1.02!important}
}

/* Varianten 4–7: Fotogrösse und Bildausschnitt bleiben exakt wie auf der aktuellen Startseite. */
@media(min-width:801px){
html.hero-test-v4 body.site-light-page main.home section.home-hero .home-hero__copy,
html.hero-test-v5 body.site-light-page main.home section.home-hero .home-hero__copy,
html.hero-test-v6 body.site-light-page main.home section.home-hero .home-hero__copy,
html.hero-test-v7 body.site-light-page main.home section.home-hero .home-hero__copy{border:0!important;border-image:none!important;box-shadow:none!important}

/* 4: ganz offen – kein Kasten, nur klare Typografie */
html.hero-test-v4 body.site-light-page main.home section.home-hero .home-hero__copy{
  width:44%!important;padding:0!important;background:transparent!important;
}
html.hero-test-v4 body.site-light-page main.home section.home-hero .home-hero__content{
  display:flex!important;align-items:center!important;
}
html.hero-test-v4 body.site-light-page main.home section.home-hero::after{
  background:linear-gradient(90deg,rgba(243,232,212,.82) 0%,rgba(232,229,223,.52) 30%,rgba(199,203,211,.12) 52%,rgba(255,255,255,0) 68%)!important;
}

/* 5: sehr leichte transparente Editorial-Fläche */
html.hero-test-v5 body.site-light-page main.home section.home-hero .home-hero__copy{
  width:46%!important;padding:42px 46px!important;background:rgba(255,255,255,.58)!important;backdrop-filter:blur(3px)!important;
}
html.hero-test-v5 body.site-light-page main.home section.home-hero .home-hero__content{
  display:flex!important;align-items:center!important;
}

/* 6: Titel ragt bewusst in Richtung Bild, Text bleibt links */
html.hero-test-v6 body.site-light-page main.home section.home-hero .home-hero__content{
  display:flex!important;align-items:center!important;overflow:visible!important;
}
html.hero-test-v6 body.site-light-page main.home section.home-hero .home-hero__copy{
  width:55%!important;padding:0!important;background:transparent!important;position:relative!important;z-index:4!important;
}
html.hero-test-v6 body.site-light-page main.home section.home-hero h1.global-title{
  width:118%!important;font-size:66px!important;line-height:1.02!important;
}
html.hero-test-v6 body.site-light-page main.home section.home-hero .home-hero__services{max-width:520px!important}
html.hero-test-v6 body.site-light-page main.home section.home-hero::after{
  background:linear-gradient(90deg,rgba(243,232,212,.88) 0%,rgba(232,229,223,.54) 34%,rgba(199,203,211,.18) 55%,rgba(255,255,255,0) 70%)!important;
}

/* 7: Text tiefer gesetzt – mehr Ruhe oben */
html.hero-test-v7 body.site-light-page main.home section.home-hero .home-hero__content{
  min-height:calc(100svh - 108px)!important;display:flex!important;align-items:flex-end!important;padding-bottom:9vh!important;
}
html.hero-test-v7 body.site-light-page main.home section.home-hero .home-hero__copy{
  width:46%!important;padding:0!important;background:transparent!important;
}
html.hero-test-v7 body.site-light-page main.home section.home-hero h1.global-title{font-size:60px!important;line-height:1.02!important}
html.hero-test-v7 body.site-light-page main.home section.home-hero::after{
  background:linear-gradient(90deg,rgba(243,232,212,.86) 0%,rgba(232,229,223,.48) 31%,rgba(199,203,211,.12) 53%,rgba(255,255,255,0) 68%)!important;
}
}

@media(max-width:800px){
html[class*="hero-test-"] body.site-light-page main.home section.home-hero .home-hero__copy{
  background:rgba(255,255,255,.76)!important;border:0!important;border-image:none!important;
}
}
`;
function apply(v){
 const d=frame.contentDocument;if(!d)return;
 d.documentElement.classList.remove('hero-test-v3','hero-test-v4','hero-test-v5','hero-test-v6','hero-test-v7');
 if(v!=='original')d.documentElement.classList.add('hero-test-'+v);
 let st=d.getElementById('hero-layout-test-styles');
 if(!st){st=d.createElement('style');st.id='hero-layout-test-styles';st.textContent=css;d.head.appendChild(st)}
 buttons.forEach(b=>b.classList.toggle('active',b.dataset.v===v));
 current=v;
}
frame.addEventListener('load',()=>apply(current));
buttons.forEach(b=>b.addEventListener('click',()=>apply(b.dataset.v)));
</script>
</body>
</html>
