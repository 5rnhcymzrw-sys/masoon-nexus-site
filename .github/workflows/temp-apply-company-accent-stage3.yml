name: temp apply company accent stage3
on:
  push:
    paths:
      - '.github/workflows/temp-apply-company-accent-stage3.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update existing Unternehmen Bild Akzent rule to stage 3
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path('assets/index-CZfMKxM_.css')
          s = css.read_text(encoding='utf-8')
          old = '.home-company__image:before{content:"";z-index:-1;background:var(--portrait-accent);width:72%;height:58%;position:absolute;bottom:19px;left:8px;}'
          new = '.home-company__image:before{content:"";z-index:-1;background:linear-gradient(to right in oklab,rgba(244,228,201,.14) 0%,rgba(232,227,218,.14) 36%,rgba(193,199,214,.14) 68%,rgba(132,144,171,.14) 100%);width:72%;height:58%;position:absolute;bottom:19px;left:8px;-webkit-backdrop-filter:blur(32px);backdrop-filter:blur(32px);}'
          if s.count(old) != 1:
              raise SystemExit(f'Expected existing portrait accent rule once, found {s.count(old)}')
          css.write_text(s.replace(old,new,1),encoding='utf-8')

          page = Path('unternehmen/index.html')
          h = page.read_text(encoding='utf-8')
          old_link = '../assets/index-CZfMKxM_.css?v=20260908-clean-rules'
          new_link = '../assets/index-CZfMKxM_.css?v=unternehmen-bild-akzent-stufe3-20260911-1'
          if h.count(old_link) != 1:
              raise SystemExit(f'Expected Unternehmen bundle link once, found {h.count(old_link)}')
          page.write_text(h.replace(old_link,new_link,1),encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/index-CZfMKxM_.css unternehmen/index.html
          git diff --cached --check
          git commit -m 'Set Unternehmen Bild Akzent to stage 3 gradient'
          git push
