name: One-time Fachwissen cards fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-fachwissen-cards-fix.yml'

permissions:
  contents: write

jobs:
  fix-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch unified-design.css
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/unified-design.css')
          s = p.read_text(encoding='utf-8')

          # 1) Entfernt die zwei fehlerhaften Zeilen, die versehentlich entstanden sind.
          bad = """html body.page-home.site-light-page:has(main.home) main.home>section.home-paths .home-paths__grid.home-paths__grid.home-paths__grid>a{\nhtml body.page-home.site-light-page:has(main.home) main.home>section.home-paths .home-paths__grid.home-paths__grid.home-paths__grid>a:focus{}\n"""
          if bad not in s:
              raise SystemExit('Fehlerhafter Fachwissen-Block nicht gefunden')
          s = s.replace(bad, '', 1)

          # 2) Der bestehende allgemeine Kartenverlauf bleibt nur bei Dienstleistungen/Werte,
          #    nicht mehr bei den drei Fachwissen-Karten auf der Startseite.
          old_selector = """html body.page-home.site-light-page:has(main.home) main.home>section.home-values .home-values__items>.home-values__item.home-values__item.home-values__item,\nhtml body.page-home.site-light-page:has(main.home) main.home>section.home-paths .home-paths__grid.home-paths__grid.home-paths__grid>a{\n"""
          new_selector = """html body.page-home.site-light-page:has(main.home) main.home>section.home-values .home-values__items>.home-values__item.home-values__item.home-values__item{\n"""
          if old_selector not in s:
              raise SystemExit('Gemeinsamer Kartenverlauf-Selektor nicht gefunden')
          s = s.replace(old_selector, new_selector, 1)

          # 3) Vorhandenen Hover-Block auch für den Mausklick (:active) verwenden.
          old_hover = """  html body.page-home.site-light-page main.home section.home-paths .home-paths__grid>a:hover{\n"""
          new_hover = """  html body.page-home.site-light-page main.home section.home-paths .home-paths__grid>a:hover,\n  html body.page-home.site-light-page main.home section.home-paths .home-paths__grid>a:active{\n"""
          if old_hover not in s:
              raise SystemExit('Hover-Selektor nicht gefunden')
          s = s.replace(old_hover, new_hover, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit CSS fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/unified-design.css
          git commit -m "Fix Startseite Fachwissen card hover state"
          git push
