name: Hero layer fix

on:
  push:
    paths:
      - '.github/workflows/hero-layer-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bestehende Hero-Regel korrigieren
        shell: bash
        run: echo '' | base64 -d | python
      - name: Änderung committen
        shell: bash
        run: |
          git config user.name "5rnhcymzrw-sys"
          git config user.email "5rnhcymzrw@privaterelay.appleid.com"
          git add assets/unified-design.css index.html
          git diff --cached --quiet && exit 0
          git commit -m "Hero: separaten Verlauf über Foto legen und Höhe angleichen"
          git push origin main
