name: One-time final card colors

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-final-card-colors.yml

permissions:
  contents: write

jobs:
  patch-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch CSS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('assets/unified-design-base-20260907.css')
          s=p.read_text(encoding='utf-8')
          pat=r'/\* Dienstleistungen Hauptseite: alle Karten transparent \*/.*?\n}\n\n/\* Dienstleistungen Hauptseite: gesamter Karteninhalt 3 Pixel höher \*/'
          rep="/* Dienstleistungen Hauptseite: Karten wie Startseite Dienstleistungen */\nhtml body.site-light-page .services-main .services-section .services-grid>.service-card,\nhtml body.site-light-page .services-main .services-section .services-grid>.service-card:hover,\nhtml body.site-light-page .services-main .services-section .services-grid>.service-card[open]{\n  background:linear-gradient(to right in oklab,rgba(243,232,212,.11) 0%,rgba(232,229,223,.11) 36%,rgba(199,203,211,.11) 68%,rgba(141,150,168,.11) 100%)!important;\n  background-size:calc(300% + 44px) 100%!important;\n  background-position:left top!important;\n  background-repeat:no-repeat!important;\n  background-origin:border-box!important;\n  -webkit-backdrop-filter:blur(32px)!important;\n  backdrop-filter:blur(32px)!important;\n}\nhtml body.site-light-page .services-main .services-section .services-grid>.service-card>summary,\nhtml body.site-light-page .services-main .services-section .services-grid>.service-card:hover>summary,\nhtml body.site-light-page .services-main .services-section .services-grid>.service-card[open]>summary,\nhtml body.site-light-page .services-main .services-section .services-grid>.service-card>ul,\nhtml body.site-light-page .services-main .services-section .services-grid>.service-card:hover>ul,\nhtml body.site-light-page .services-main .services-section .services-grid>.service-card[open]>ul{\n  background:transparent!important;\n  background-color:transparent!important;\n  background-image:none!important;\n}\n\n/* Dienstleistungen Hauptseite: gesamter Karteninhalt 3 Pixel höher */"
          s,n=re.subn(pat,rep,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('services block not found')
          s=s.replace('border-image:linear-gradient(110deg,#f3e8d4 0%,#e8e5df 100%) 1!important;\n}', 'border-image:linear-gradient(110deg,#f3e8d4 0%,#e8e5df 100%) 1!important;\n  background-position:left top!important;\n}',1)
          s=s.replace('border-image:linear-gradient(110deg,#e8e5df 0%,#c7cbd3 100%) 1!important;\n}', 'border-image:linear-gradient(110deg,#e8e5df 0%,#c7cbd3 100%) 1!important;\n  background-position:center top!important;\n}',1)
          s=s.replace('border-image:linear-gradient(110deg,#c7cbd3 0%,#8d96a8 100%) 1!important;\n}', 'border-image:linear-gradient(110deg,#c7cbd3 0%,#8d96a8 100%) 1!important;\n  background-position:right top!important;\n}',1)
          p.write_text(s,encoding='utf-8')
          p=Path('assets/unified-design.css')
          s=p.read_text(encoding='utf-8')
          pat=r'html body\.page-knowledge\.site-light-page main \.knowledge-section#knowledge-articles \.articles-grid>\.article-card\.article-card\{\n  background:linear-gradient\(to right in oklab,rgba\(243,232,212,\.06\).*?backdrop-filter:blur\(32px\)!important;\n\}'
          rep="html body.page-knowledge.site-light-page main .knowledge-section#knowledge-articles .articles-grid>.article-card.article-card{\n  background:transparent!important;\n  background-color:transparent!important;\n  background-image:none!important;\n  background-origin:border-box!important;\n  background-size:100% 100%!important;\n  background-repeat:no-repeat!important;\n  -webkit-backdrop-filter:none!important;\n  backdrop-filter:none!important;\n}\n@media(hover:hover){\n  html body.page-knowledge.site-light-page main .knowledge-section#knowledge-articles .articles-grid>.article-card.article-card:hover{\n    transform:translateY(-3px)!important;\n    background:linear-gradient(to right in oklab,rgba(243,232,212,.11) 0%,rgba(232,229,223,.11) 36%,rgba(199,203,211,.11) 68%,rgba(141,150,168,.11) 100%)!important;\n    background-repeat:no-repeat!important;\n    background-origin:border-box!important;\n    -webkit-backdrop-filter:blur(32px)!important;\n    backdrop-filter:blur(32px)!important;\n    box-shadow:none!important;\n  }\n}"
          s,n=re.subn(pat,rep,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('knowledge block not found')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/unified-design-base-20260907.css assets/unified-design.css
          git rm .github/workflows/one-time-final-card-colors.yml
          git commit -m "Apply selected service and knowledge card colors"
          git push
