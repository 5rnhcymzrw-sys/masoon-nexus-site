name: Centralize gradient strokes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/centralize-gradient-strokes.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Centralize gradient line and frame strokes
        run: python .github/scripts/centralize_gradient_strokes.py
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.css
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m "Verlaufslinien und Rahmenstärken global vereinheitlichen"
          git push origin main
# retry after primary-root correction
