name: fachwissen-browser-back

on:
  push:
    paths:
      - '.github/workflows/fachwissen-browser-back.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply existing-code changes
        run: python .github/fachwissen_browser_back_update.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/site.js assets/global.css assets/unified-design.css assets/article-detail.css fachwissen/index.html fachwissen/*/index.html
          git rm .github/workflows/fachwissen-browser-back.yml .github/fachwissen_browser_back_update.py
          git commit -m "Fachwissen: browser back restores previous article position"
          git push
