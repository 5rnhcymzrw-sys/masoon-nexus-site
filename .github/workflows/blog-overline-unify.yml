name: Blog overline unify

on:
  push:
    paths:
      - '.github/workflows/blog-overline-unify.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unify individual blog overlines with section labels
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css = Path('assets/unified-design.css')
          text = css.read_text()
          pattern = re.compile(r'(body\.page-article-[^{]+ \.article-hero \.section-label\{[^{}]*?color:)#868279(!important[^{}]*?\})')
          text2, n = pattern.subn(r'\1#777777\2', text)
          if n != 7:
              raise SystemExit(f'Expected 7 individual article overline color rules, found {n}')
          css.write_text(text2)

          # Verify central section-label typography remains the source for font/spacing.
          base = Path('assets/unified-design-base-20260907.css').read_text()
          canonical = 'html body main .section-label.section-label.section-label.section-label.section-label.section-label'
          s = base.find(canonical + '{')
          if s == -1:
              raise SystemExit('Canonical section-label rule missing')
          e = base.find('}', s)
          block = base[s:e+1]
          required = ['font-size:11px!important', 'font-weight:500!important', 'line-height:1.4!important', 'letter-spacing:1.1px!important', 'color:#777777!important']
          for item in required:
              if item not in block:
                  raise SystemExit(f'Canonical section-label value missing: {item}')

          # Cache bust only the individual Fachwissen article pages.
          article_dirs = [
              'checkliste-steuererklaerung',
              'unternehmen-gruenden',
              'unternehmensformen',
              'kuendigung-arbeitsvertrag',
              'unwahre-buchfuehrung',
              'gewinnverwendung',
              'missbraeuchliche-konkurse',
          ]
          changed = 0
          for d in article_dirs:
              p = Path('fachwissen') / d / 'index.html'
              if not p.exists():
                  raise SystemExit(f'Missing article page: {p}')
              html = p.read_text()
              updated, count = re.subn(
                  r'(\.\./\.\./assets/unified-design\.css\?v=)[^"\']+',
                  r'\1blog-overline-unified-20260912-1',
                  html,
                  count=1
              )
              if count != 1:
                  raise SystemExit(f'unified-design cache ref not found exactly once in {p}: {count}')
              p.write_text(updated)
              changed += 1

          print(f'Updated {n} article overline color rules and {changed} article cache refs.')
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/blog-overline-unify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Blogs: Datumszeilen wie Bereichstitel vereinheitlichen"
          git push