name: Report service selectors
on:
  push:
    branches: [main]
    paths: ['.github/workflows/report-service-selectors.yml']
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report page-services selectors
        run: grep -n "page-services" assets/unified-design.css || true
      - name: Remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/report-service-selectors.yml
          git commit -m "Temporären Dienstleistungsreport entfernen"
          git push
