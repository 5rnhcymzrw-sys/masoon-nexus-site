name: Move closing box base to global
on:
  push:
    branches: [main]
    paths: ['.github/workflows/move-closing-box-base-global.yml']
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move shared closing box base into global.css
        run: |
          python <<'PY'
          from pathlib import Path
          src = Path('assets/unified-design.css')
          dst = Path('assets/global.css')
          marker = '/* Abschlusskästen – globale Grundkomponente */'
          block = '''/* Nur die vier grossen Abschlusskästen: ohne Farbverlauf und Weichzeichnung. */
html body.site-light-page main .knowledge-section>.knowledge-note,
html body.site-light-page main.services-main>.services-closing,
html body.site-light-page main.page-main>.company-collaboration-box,
html body.site-light-page main.home>.home-contact-band{
  background-image:none!important;
 border-color:transparent!important;
border-image:var(--mt-gradient-frame) 1!important;
  box-shadow:none!important;
  filter:none!important;
  backdrop-filter:none!important;
  -webkit-backdrop-filter:none!important;
}
'''
          s = src.read_text()
          g = dst.read_text()
          assert block in s, 'Gemeinsamer Abschlusskasten-Block nicht gefunden'
          assert marker not in g, 'Abschlusskasten-Komponente bereits global vorhanden'
          src.write_text(s.replace(block, '', 1))
          dst.write_text(g.rstrip() + '\n\n' + marker + '\n' + block + '\n')
          assert block not in src.read_text()
          assert marker in dst.read_text()
          PY
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/global.css assets/unified-design.css
          git commit -m "Abschlusskasten-Grundstil global zentralisieren"
          git rm .github/workflows/move-closing-box-base-global.yml
          git commit -m "Temporären Abschlusskasten-Workflow entfernen"
          git push