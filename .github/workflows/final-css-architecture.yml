name: Final CSS architecture cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/final-css-architecture.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move service-only rules to dienstleistungen.css
        run: |
          python3 - <<'PY'
          from pathlib import Path
          up=Path('assets/unified-design.css')
          dp=Path('assets/dienstleistungen.css')
          u=up.read_text(encoding='utf-8')
          d=dp.read_text(encoding='utf-8')
          def cut(start_marker,end_marker):
            global u
            start=u.index(start_marker)
            end=u.index(end_marker,start)
            block=u[start:end].strip()+"\n\n"
            u=u[:start]+u[end:]
            return block
          blocks=[]
          blocks.append(cut('/* Dienstleistungen Hauptseite: Aktionsposition */','/* Fachwissen: Daten in der Typografie der DL-Kartenzahlen 01–06 */'))
          blocks.append(cut('/* Dienstleistungs Hauptseite: kurze Linien wie auf der Startseite */','/* Unternehmen: kleine Bereichstitel farblich vereinheitlichen */'))
          blocks.append(cut('/* Dienstleistungen Hauptseite: kleine Bereichstitel wie Unternehmen */','/* Startseite – keine grossflächigen Seitenverläufe */'))
          blocks.append(cut('/* Dienstleistungen Hauptseite: Silbentrennung nur im Fliesstext der Kästen. */','/* Seitenspezifische Regeln, aus dem HTML konsolidiert. */'))
          # Service cards are currently explicitly borderless later in their own block.
          # Remove them from the shared gradient-border group so moving the service block earlier does not alter the final cascade.
          selectors=[
            'html body.site-light-page main.services-main .services-section .services-grid>.service-card,\n',
            'html body.site-light-page main.services-main .services-section .services-grid>.service-card:nth-child(3n/**/+1),\n',
            'html body.site-light-page main.services-main .services-section .services-grid>.service-card:nth-child(3n/**/+2),\n',
            'html body.site-light-page main.services-main .services-section .services-grid>.service-card:nth-child(3n/**/+3),\n'
          ]
          for sel in selectors:
            assert sel in u
            u=u.replace(sel,'',1)
          header='/* DIENSTLEISTUNGEN: Seitenspezifische Regeln und Kartenkomponenten. */\n'
          if not d.startswith(header):
            d=header+d
          d=d.rstrip()+"\n\n"+''.join(blocks)
          up_header='/* SEITENKOMPOSITION: Startseite, Unternehmen, Fachwissen und gemeinsame Seitenregeln. */\n'
          if not u.startswith(up_header):
            u=up_header+u
          up.write_text(u,encoding='utf-8')
          dp.write_text(d,encoding='utf-8')
          PY
      - name: Add responsibility headers and validate old base is gone
        run: |
          python3 - <<'PY'
          from pathlib import Path
          headers={
            'assets/global.css':'/* GLOBAL: Design-Tokens, Typografie und gemeinsam genutzte Komponenten. */\n',
            'assets/contact.css':'/* KONTAKT: Seitenspezifisches Kontakt- und Formularlayout. */\n',
            'assets/article-detail.css':'/* FACHARTIKEL: Gemeinsames Layout aller Artikel-Detailseiten. */\n'
          }
          for fn,h in headers.items():
            p=Path(fn); s=p.read_text(encoding='utf-8')
            if not s.startswith(h): p.write_text(h+s,encoding='utf-8')
          assert not Path('assets/unified-design-base-20260907.css').exists()
          assert 'unified-design-base-20260907.css' not in Path('assets/unified-design.css').read_text(encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/global.css assets/unified-design.css assets/dienstleistungen.css assets/contact.css assets/article-detail.css
          git commit -m "CSS-Zuständigkeiten final strukturieren"
          git rm .github/workflows/final-css-architecture.yml
          git commit -m "Temporären Architektur-Workflow entfernen"
          git push
