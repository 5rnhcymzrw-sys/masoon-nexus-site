name: Consolidate company portrait
on:
  push:
    branches: [main]
    paths: ['.github/workflows/consolidate-company-portrait.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate company portrait rules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/unified-design.css')
          s=p.read_text(encoding='utf-8')
          old='''/* Unternehmen Desktop: Porträt ausgewogen zur Höhe des Textbereichs */\n@media(min-width:801px){\n  html body .home-company__image{\n    width:440px!important;\n    height:565px!important;\n    min-height:565px!important;\n  }\n  html body .home-company__image-primary{\n    width:92%!important;\n    height:92%!important;\n  }\n}\n\n'''
          assert old in s
          s=s.replace(old,'',1)
          start=s.index('/* Unternehmen: Porträtbereich im einheitlichen Kastensystem */')
          end=s.index('/* Dienstleistungen Hauptseite: kleine Bereichstitel wie Unternehmen */',start)
          new='''/* Unternehmen: Porträtbereich */\nhtml body.site-light-page .company-legal-section,\nhtml body.site-light-page .company-legal-section .company-legal-card{overflow:visible!important;}\nhtml body.site-light-page .company-legal-section .company-legal-card{\n  width:100%!important;\n  height:auto!important;\n  min-height:0!important;\n  max-height:none!important;\n  padding:67.5px 72px 53.5px!important;\n  display:grid!important;\n  grid-template-columns:351px minmax(0,1fr)!important;\n  gap:80px!important;\n  align-items:center!important;\n  box-sizing:border-box!important;\n  background:transparent!important;\n  background-color:transparent!important;\n  background-image:none!important;\n  border:1px solid rgba(23,23,21,.16)!important;\n  border-radius:0!important;\n  box-shadow:none!important;\n}\nhtml body.site-light-page .company-legal-card .home-company__image{\n  width:100%!important;\n  min-height:0!important;\n  margin:0!important;\n  align-self:center!important;\n}\nhtml body.site-light-page .company-legal-card .home-company__image::after{content:none!important;display:none!important;}\nhtml body.site-light-page .company-legal-card .home-company__image-primary{\n  width:100%!important;\n  height:auto!important;\n  display:block!important;\n}\n@media(min-width:801px){\n  html body.site-light-page .company-legal-section{padding-bottom:15.12px!important;}\n  html body.site-light-page .company-legal-section .company-legal-card{padding:32.34px 72px 54.372px!important;}\n  html body.site-light-page .company-legal-card .home-company__image{\n    width:440px!important;\n    height:565px!important;\n    min-height:565px!important;\n    position:relative!important;\n    transform:translateY(20.25px) scale(.972)!important;\n    transform-origin:center center!important;\n  }\n  html body.site-light-page .company-legal-card .home-company__image-primary{\n    width:92%!important;\n    height:92%!important;\n    position:absolute!important;\n    top:0!important;\n    right:0!important;\n    object-fit:cover!important;\n    object-position:center 18%!important;\n    box-shadow:none!important;\n  }\n}\n@media(max-width:800px){\n  html body.site-light-page .company-legal-section .company-legal-card{\n    padding:62px 26px!important;\n    grid-template-columns:1fr!important;\n    gap:34px!important;\n  }\n}\n\n'''
          s=s[:start]+new+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/unified-design.css
          git commit -m "Unternehmensportrait-Regeln konsolidieren"
          git rm .github/workflows/consolidate-company-portrait.yml
          git commit -m "Temporären Unternehmensportrait-Workflow entfernen"
          git push
