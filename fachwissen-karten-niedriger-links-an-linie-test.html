<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MASOON – Fachwissen kompakter Test</title>
<style>
html,body{margin:0;min-height:100%;background:#f4f4f2;font-family:Arial,sans-serif;color:#171715}
.testbar{position:sticky;top:0;z-index:99999;background:#fff;border-bottom:1px solid #d8d8d4;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.testbar strong{font-size:12px}.note{font-size:11px;color:#666;margin-left:auto}
#siteFrame{display:block;width:100%;height:calc(100vh - 48px);min-height:700px;border:0;background:#fff}
@media(max-width:800px){.note{width:100%;margin-left:0}#siteFrame{height:calc(100vh - 82px)}}
</style>
</head>
<body>
<div class="testbar">
<strong>FACHWISSEN TEST · niedrigere Kästen · Text ganz links · ohne Farbverlauf</strong>
<span class="note">Nur Testseite · KEINE FOTOS · Original unverändert</span>
</div>
<iframe id="siteFrame" src="fachwissen/index.html?v=fwcompact-leftline-10092026" title="Fachwissen Test"></iframe>
<script>
const frame=document.getElementById('siteFrame');
function apply(){
 try{
  const d=frame.contentDocument;
  if(!d||!d.head||!d.body)return;
  let css=d.getElementById('mt-fw-compact-leftline-test');
  if(!css){
   css=d.createElement('style');
   css.id='mt-fw-compact-leftline-test';
   css.textContent=`
     html body img:not([data-preserve-logo]),
     html body picture,
     html body video{display:none!important}

     html body .knowledge-section .articles-grid>.article-card{
       text-align:left!important;
       align-items:flex-start!important;
       justify-items:start!important;
       background-image:none!important;
       box-sizing:border-box!important;
     }

     html body .knowledge-section .articles-grid>.article-card>*{
       text-align:left!important;
       margin-left:0!important;
       padding-left:0!important;
     }

     html body .knowledge-section .articles-grid>.article-card h2::after{
       background:#868279!important;
       background-image:none!important;
     }

     @media(min-width:901px){
       html body .knowledge-section .articles-grid{
         gap:18px!important;
       }
       html body .knowledge-section .articles-grid>.article-card{
         min-height:215px!important;
         height:215px!important;
         padding:22px 24px 20px 0!important;
       }
     }

     @media(max-width:900px){
       html body .knowledge-section .articles-grid>.article-card{
         min-height:0!important;
         height:auto!important;
         padding:20px 20px 20px 0!important;
       }
     }
   `;
   d.head.appendChild(css);
  }
 }catch(e){console.error(e)}
}
frame.addEventListener('load',()=>{apply();setTimeout(apply,300);setTimeout(apply,900);setTimeout(apply,1600)});
</script>
</body>
</html>
