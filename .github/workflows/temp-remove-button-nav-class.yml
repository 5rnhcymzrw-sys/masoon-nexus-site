name: Temporary remove homepage button nav class
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-remove-button-nav-class.yml
permissions:
  contents: write
jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove conflicting class from existing homepage buttons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'class="home-action-button mt-nav-typography"'
          new = 'class="home-action-button"'
          count = s.count(old)
          if count != 3:
              raise SystemExit(f'Expected exactly 3 homepage button class matches, found {count}')
          s = s.replace(old,new)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Remove conflicting nav typography class from homepage buttons"
          git push
