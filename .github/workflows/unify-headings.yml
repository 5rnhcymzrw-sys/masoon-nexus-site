name: Unify headings

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Unify global heading typography'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply global heading typography and homepage collaboration layout
        shell: python
        run: |
          from pathlib import Path
          import re

          style = '''
          <style id="global-heading-system">
            .home-hero h1,
            .home-values .section-heading h2,
            .expectation-compass__heading h2,
            .home-paths__heading h2,
            .home-contact-band h2,
            .section-heading h1,
            .section-heading h2,
            .page-hero h1,
            .contact-section h1,
            .legal-page h1,
            .article-detail h1,
            .service-page__heading h1,
            .services-table-heading h2,
            .service-principles h2,
            .process-details h2,
            .knowledge-note h2,
            .mandate-faq__heading h2 {
              font-family: var(--font-cormorant), Georgia, serif !important;
              font-size: 60px !important;
              font-weight: 400 !important;
              line-height: 1.05 !important;
              letter-spacing: -.02em !important;
              margin-top: 0 !important;
              margin-bottom: 0 !important;
              max-width: 650px !important;
            }
            .section-label,
            .expectation-compass__heading .section-label,
            .mandate-faq__heading .section-label,
            .process-section .section-heading .section-label {
              margin-bottom: 30px !important;
            }

            /* Startseite: exakt nach der Referenzstruktur */
            .expectation-editorial {
              display: block !important;
              padding: 82px max(32px, calc((100vw - 1320px) / 2)) 92px !important;
            }
            .expectation-editorial .expectation-compass__heading {
              width: 100% !important;
              max-width: 650px !important;
              margin: 0 0 64px 0 !important;
            }
            .expectation-editorial .expectation-editorial__grid {
              width: min(100%, 860px) !important;
              margin: 0 0 0 210px !important;
              display: grid !important;
              grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
              gap: 54px 72px !important;
            }
            .expectation-editorial .expectation-editorial__item {
              max-width: 360px !important;
              margin: 0 !important;
            }
            .expectation-editorial .expectation-editorial__item h3 {
              margin: 0 0 14px !important;
            }
            .expectation-editorial .expectation-editorial__item p {
              margin: 0 !important;
            }
            .expectation-editorial .expectation-editorial__more {
              display: none !important;
            }

            @media (max-width: 1050px) {
              .expectation-editorial .expectation-editorial__grid {
                margin-left: 110px !important;
                width: min(100%, 760px) !important;
              }
            }
            @media (max-width: 800px) {
              .home-hero h1,
              .home-values .section-heading h2,
              .expectation-compass__heading h2,
              .home-paths__heading h2,
              .home-contact-band h2,
              .section-heading h1,
              .section-heading h2,
              .page-hero h1,
              .contact-section h1,
              .legal-page h1,
              .article-detail h1,
              .service-page__heading h1,
              .services-table-heading h2,
              .service-principles h2,
              .process-details h2,
              .knowledge-note h2,
              .mandate-faq__heading h2 {
                font-size: 48px !important;
                line-height: 1.05 !important;
              }
              .expectation-editorial {
                padding: 68px 24px 76px !important;
              }
              .expectation-editorial .expectation-compass__heading {
                margin-bottom: 48px !important;
              }
              .expectation-editorial .expectation-editorial__grid {
                width: 100% !important;
                margin-left: 0 !important;
                grid-template-columns: 1fr !important;
                gap: 38px !important;
              }
              .expectation-editorial .expectation-editorial__item {
                max-width: none !important;
              }
            }
          </style>
          '''

          collaboration = '''
          <section class="mandate-compass expectation-compass expectation-editorial">
            <div class="expectation-compass__heading">
              <p class="section-label">Zusammenarbeit</p>
              <h2 class="global-title">Was Sie von uns erwarten können.</h2>
            </div>
            <div class="expectation-editorial__grid">
              <article class="expectation-editorial__item"><h3>Persönliche Betreuung</h3><p>Sie haben eine feste Ansprechperson, die Ihr Unternehmen und Ihr Mandat kennt.</p></article>
              <article class="expectation-editorial__item"><h3>Entlastung im Geschäftsalltag</h3><p>Wir übernehmen die vereinbarten administrativen und treuhänderischen Aufgaben, damit Sie sich auf Ihr Kerngeschäft konzentrieren können.</p></article>
              <article class="expectation-editorial__item"><h3>Digitale Zusammenarbeit</h3><p>Moderne Prozesse ermöglichen einen einfachen, sicheren und weitgehend papierlosen Austausch Ihrer Unterlagen.</p></article>
              <article class="expectation-editorial__item"><h3>Vorausschauende Begleitung</h3><p>Wir weisen Sie rechtzeitig auf wichtige Fristen, Handlungsbedarf und mögliche steuerliche Gestaltungsmöglichkeiten hin.</p></article>
              <article class="expectation-editorial__item"><h3>Fachliche Einordnung</h3><p>Sie erhalten verständliche und fundierte Einschätzungen zu finanziellen, steuerlichen und unternehmerischen Fragestellungen.</p></article>
              <article class="expectation-editorial__item"><h3>Langfristige Kontinuität</h3><p>Wir begleiten Ihr Unternehmen über den laufenden Geschäftsalltag hinaus auch bei Veränderungen und wichtigen Entscheidungen.</p></article>
            </div>
          </section>
          '''

          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              if 'id="global-heading-system"' in text:
                  start = text.index('<style id="global-heading-system">')
                  end = text.index('</style>', start) + len('</style>')
                  text = text[:start] + style.strip() + text[end:]
              elif '</head>' in text:
                  text = text.replace('</head>', style + '</head>', 1)

              if path.as_posix() == 'index.html':
                  text = re.sub(
                      r'<section class="mandate-compass expectation-compass expectation-editorial">.*?</section>',
                      collaboration.strip(),
                      text,
                      count=1,
                      flags=re.S,
                  )
              path.write_text(text, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '**/*.html'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Unify global heading typography"
          git push
