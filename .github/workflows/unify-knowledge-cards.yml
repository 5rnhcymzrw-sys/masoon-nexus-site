name: Unify knowledge cards
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/unify-knowledge-cards.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply shared knowledge card component
        run: python3 scripts/unify-knowledge-cards.py
      - name: Verify single source
        run: |
          echo '=== HOME ARTICLE CARDS ==='
          grep -n 'home-paths__grid articles-grid' index.html
          echo '=== INLINE STYLE CHECK ==='
          if grep -n '<style>' fachwissen/index.html; then exit 1; fi
          echo '=== OLD HOME CARD CSS CHECK ==='
          if grep -n 'home-path-date\|home-path-copy\|home-paths__grid>a' assets/global.css; then exit 1; fi
          echo '=== PAGE KNOWLEDGE CARD OVERRIDE CHECK ==='
          if grep -nE 'page-knowledge.*article-card' assets/unified-design.css; then exit 1; fi
          echo '=== SHARED COMPONENT ==='
          grep -n -A25 'Fachwissen-Karten: gemeinsame globale Komponente' assets/global.css
          echo '=== JS STYLE INJECTION CHECK ==='
          if grep -n 'lineStyle' assets/site.js; then exit 1; fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html fachwissen/index.html assets/global.css assets/unified-design.css assets/site.js
          git commit -m "Fachwissen-Karten global vereinheitlichen"
          git rm scripts/unify-knowledge-cards.py .github/workflows/unify-knowledge-cards.yml
          git commit -m "Temporäre Karten-Bereinigung entfernen"
          git push
