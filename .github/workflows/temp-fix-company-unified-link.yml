name: temp fix company unified link
on:
  push:
    paths:
      - '.github/workflows/temp-fix-company-unified-link.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix existing Unternehmen stylesheet link only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('unternehmen/index.html')
          s=p.read_text(encoding='utf-8')
          old='./assets/unified-design.css?v=unternehmen-werte-final-20260911-2'
          new='../assets/unified-design.css?v=unternehmen-werte-final-20260911-3'
          if s.count(old)!=1:
              raise SystemExit(f'Expected one existing stylesheet link, found {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add unternehmen/index.html
          git diff --cached --check
          git commit -m 'Fix Unternehmen stylesheet path for Werte cards'
          git push
