name: Button text grey

on:
  push:
    paths:
      - '.github/workflows/button-text-grey.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update existing button and action colour rules only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          TARGET = '#777777!important'
          markers = (
              '.home-action-button',
              '.home-values__all-services',
              '.details-action',
              '.article-action',
              '.services-contact-button',
              '.contact-split__form button',
              '.contact-form button',
              '.article-back',
              '.article-card>a',
              '.article-card > a',
          )

          rule_re = re.compile(r'([^{}]+)\{([^{}]*)\}', re.S)
          color_re = re.compile(r'(?<![-\w])color\s*:\s*([^;}]*)', re.I)

          def split_selectors(selector):
              parts=[]; buf=[]; p=b=0; quote=None
              for ch in selector:
                  if quote:
                      buf.append(ch)
                      if ch == quote: quote=None
                      continue
                  if ch in "'\"": quote=ch; buf.append(ch); continue
                  if ch == '(': p += 1
                  elif ch == ')': p = max(0,p-1)
                  elif ch == '[': b += 1
                  elif ch == ']': b = max(0,b-1)
                  if ch == ',' and p == 0 and b == 0:
                      parts.append(''.join(buf).strip()); buf=[]
                  else:
                      buf.append(ch)
              if ''.join(buf).strip(): parts.append(''.join(buf).strip())
              return parts

          def is_target(sel):
              compact = ' '.join(sel.split())
              return any(m in compact for m in markers)

          changed_files=set(); changed_rules=[]
          for path in sorted(Path('assets').glob('*.css')):
              text=path.read_text()
              out=[]; last=0; changed=False
              for m in rule_re.finditer(text):
                  selector, body = m.group(1), m.group(2)
                  sels = split_selectors(selector)
                  t = [s for s in sels if is_target(s)]
                  nt = [s for s in sels if not is_target(s)]
                  if not t:
                      continue
                  colours = color_re.findall(body)
                  if not colours:
                      continue

                  def recolour(src):
                      def repl(cm):
                          raw = cm.group(1).strip()
                          low = raw.lower().replace(' ','')
                          if low.startswith('inherit') or low.startswith('currentcolor'):
                              return cm.group(0)
                          return 'color:' + TARGET
                      return color_re.sub(repl, src)

                  target_body = recolour(body)
                  if target_body == body:
                      continue

                  if nt:
                      replacement = ',\n'.join(nt) + '{' + body + '}\n' + ',\n'.join(t) + '{' + target_body + '}'
                  else:
                      replacement = selector + '{' + target_body + '}'

                  out.append(text[last:m.start()]); out.append(replacement); last=m.end(); changed=True
                  changed_rules.append((str(path), ' | '.join(t)[:320], colours))
              if changed:
                  out.append(text[last:]); path.write_text(''.join(out)); changed_files.add(path)

          if not changed_rules:
              raise SystemExit('No existing button/action colour rules needed changing')

          print('Changed existing rules:')
          for f, s, vals in changed_rules:
              print(f'- {f}: {s} :: {vals}')

          # Verify canonical section-label colour still exists.
          base = Path('assets/unified-design-base-20260907.css').read_text()
          if 'color:#777777!important' not in base:
              raise SystemExit('Canonical section-label #777777 rule not found')

          # Verify no concrete non-grey colour remains in targeted selectors.
          bad=[]
          for path in sorted(Path('assets').glob('*.css')):
              text=path.read_text()
              for m in rule_re.finditer(text):
                  sels=split_selectors(m.group(1)); body=m.group(2)
                  if not any(is_target(s) for s in sels):
                      continue
                  for val in color_re.findall(body):
                      low=val.strip().lower().replace(' ','')
                      if low.startswith('inherit') or low.startswith('currentcolor'):
                          continue
                      if not low.startswith('#777777!important'):
                          # Mixed selector rules are allowed only when target selectors were split above; any remaining concrete colour is a real conflict.
                          bad.append((str(path), ' | '.join([s for s in sels if is_target(s)])[:240], val.strip()))
          if bad:
              raise SystemExit('Conflicting button/action colours remain: ' + repr(bad[:30]))

          token='button-text-grey-20260912-1'
          names={p.name for p in changed_files}
          html_count=0
          for page in sorted(Path('.').rglob('*.html')):
              if '.git' in page.parts: continue
              html=page.read_text(errors='ignore'); new=html
              for name in names:
                  new=re.sub(r'((?:\.\./)*assets/' + re.escape(name) + r'\?v=)[^"\']+', r'\1'+token, new)
              if new != html:
                  page.write_text(new); html_count += 1
          print(f'Cache updated on {html_count} HTML files for {sorted(names)}')
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/button-text-grey.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Alle Seiten: Buttonschriften auf Bereichstitel-Grau setzen"
          git push