name: temp align fachwissen action
on:
  push:
    paths:
      - '.github/workflows/temp-align-fachwissen-action.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adjust existing Fachwissen action rule only
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Commit change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/unified-design-base-20260907.css assets/unified-design.css fachwissen/index.html
          git diff --cached --check
          git commit -m 'Align Fachwissen contribution action with Mehr anzeigen'
          git push