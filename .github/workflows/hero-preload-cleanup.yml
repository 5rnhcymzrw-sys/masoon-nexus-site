name: Hero preload cleanup

on:
  push:
    paths:
      - '.github/workflows/hero-preload-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bestehenden Hero-Ladevorgang bereinigen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) Hero-Preload: exakt dieselbe URL wie im CSS verwenden und vor die Stylesheets ziehen.
          page = Path('index.html')
          html = page.read_text()
          preload_re = re.compile(r'\s*<link rel="preload" as="image" href="Foto-hero\.png(?:\?v=[^"]+)?" fetchpriority="high"\s*/>\s*')
          matches = list(preload_re.finditer(html))
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one existing hero preload, found {len(matches)}')
          html = preload_re.sub('\n', html, count=1)

          marker = '<meta name="description" content="Treuhand, Buchhaltung, Personaladministration, Jahresabschluss, Steuern und Unternehmensberatung in Luzern." />'
          if html.count(marker) != 1:
              raise SystemExit('Description marker not found exactly once')
          preload = '\n  <link rel="preload" as="image" href="Foto-hero.png" fetchpriority="high" />'
          html = html.replace(marker, marker + preload, 1)

          # Cache-Busting der auf der Startseite geladenen CSS-Dateien.
          token = 'hero-preload-clean-20260913-1'
          html = re.sub(r'(assets/global\.css\?v=)[^"\']+', rf'\1{token}', html, count=1)
          html = re.sub(r'(assets/unified-design\.css\?v=)[^"\']+', rf'\1{token}', html, count=1)
          page.write_text(html)

          # 2) Doppelte Hero-Regel bereinigen: die Basisdatei bleibt die einzige Quelle.
          global_css = Path('assets/global.css')
          base_css = Path('assets/unified-design-base-20260907.css')
          g = global_css.read_text()
          b = base_css.read_text()

          hero_rule = '.home-hero{background-image:linear-gradient(90deg,#060605f7 0%,#060605e3 24%,#06060594 49%,#06060514 75%,#06060505 100%),linear-gradient(#05050500,#0505054d),url("../Foto-hero.png")!important;background-position:50% 50%,50% 50%,50% 12%!important;background-size:cover!important;background-repeat:no-repeat!important;}'
          if g.count(hero_rule) != 1:
              raise SystemExit(f'global.css: expected one hero rule, found {g.count(hero_rule)}')
          if b.count(hero_rule) != 1:
              raise SystemExit(f'base CSS: expected one hero rule, found {b.count(hero_rule)}')

          g = g.replace(hero_rule, '', 1)
          global_css.write_text(g)

          # Verifikation.
          check_html = page.read_text()
          if check_html.count('href="Foto-hero.png" fetchpriority="high"') != 1:
              raise SystemExit('Hero preload does not use the exact CSS image URL')
          if 'Foto-hero.png?v=' in check_html:
              raise SystemExit('Old versioned hero preload URL is still present')
          if check_html.find('href="Foto-hero.png" fetchpriority="high"') > check_html.find('assets/index-CZfMKxM_.css'):
              raise SystemExit('Hero preload is still after the stylesheets')
          if global_css.read_text().count(hero_rule) != 0:
              raise SystemExit('Duplicate hero rule still remains in global.css')
          if base_css.read_text().count(hero_rule) != 1:
              raise SystemExit('Canonical hero rule missing from base CSS')
          PY
      - name: Commit und temporaeren Workflow entfernen
        run: |
          rm -f .github/workflows/hero-preload-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'No changes'; exit 1; }
          git commit -m "Hero: Bild-Preload und doppelte Regel bereinigen"
          git push
