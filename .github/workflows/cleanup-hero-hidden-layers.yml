name: Cleanup hero hidden layers
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-hero-hidden-layers.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply hero cleanup
        run: python3 scripts/cleanup_hero_hidden_layers.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/unified-design.css
          git commit -m "Hero-Hilfsebenen und Hardcodes bereinigen"
          git rm .github/workflows/cleanup-hero-hidden-layers.yml scripts/cleanup_hero_hidden_layers.py
          git commit -m "Temporäre Hero-Hilfsdateien entfernen"
          git push
