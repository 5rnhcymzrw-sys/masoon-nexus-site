name: Remove duplicate home paths base
on:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-duplicate-home-paths-base.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate home paths block
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/global.css')
          s=p.read_text(encoding='utf-8')
          start=s.index('html body.page-home.site-light-page main.home section.home-paths.home-paths .home-paths__grid>a>strong::after')
          keep=s.index('.home-paths__grid i{display:none!important;}', start)
          s=s[:start]+s[keep:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/global.css
          git commit -m "Doppelten Startseiten-Fachwissenblock entfernen"
          git rm .github/workflows/remove-duplicate-home-paths-base.yml
          git commit -m "Temporären Fachwissen-Doppelblock-Workflow entfernen"
          git push
