<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dienstleistungen – Rahmenvergleich</title><style>html,body{margin:0;width:100%;height:100%;background:#fff;font-family:Arial,sans-serif}body{display:flex;flex-direction:column;overflow:hidden}.toolbar{height:52px;display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;border-bottom:1px solid #ddd;position:relative;z-index:10}.toolbar button{appearance:none;border:1px solid #bbb;background:#fff;padding:9px 16px;font-size:13px;cursor:pointer}.toolbar button.active{background:#111;color:#fff;border-color:#111}.frame-wrap{flex:1;min-height:0}.frame-wrap iframe{display:block;width:100%;height:100%;border:0}</style></head><body><div class="toolbar"><button data-w="1">1 px</button><button data-w="2">2 px</button><button data-w="3">3 px</button><button data-w="4">4 px</button><button data-w="5">5 px</button><button data-w="6" class="active">6 px</button></div><div class="frame-wrap"><iframe id="page" src="dienstleistungen/index.html?v=rahmen-vergleich" title="Dienstleistungen Rahmenvergleich"></iframe></div><script>const f=document.getElementById('page');const buttons=[...document.querySelectorAll('button[data-w]')];let current=6;function apply(){try{const d=f.contentDocument;if(!d)return;let s=d.getElementById('rahmenvergleich-style');if(!s){s=d.createElement('style');s.id='rahmenvergleich-style';d.head.appendChild(s)}s.textContent=`html body.site-light-page main.services-main section.services-section div.services-grid details.service-card{border-width:${current}px!important;border-style:solid!important;box-sizing:border-box!important}html body.site-light-page main.services-main section.services-section div.services-grid details.service-card:nth-child(1),html body.site-light-page main.services-main section.services-section div.services-grid details.service-card:nth-child(4){border-color:#e8dcc7!important}html body.site-light-page main.services-main section.services-section div.services-grid details.service-card:nth-child(2),html body.site-light-page main.services-main section.services-section div.services-grid details.service-card:nth-child(5){border-color:#d7d5d1!important}html body.site-light-page main.services-main section.services-section div.services-grid details.service-card:nth-child(3),html body.site-light-page main.services-main section.services-section div.services-grid details.service-card:nth-child(6){border-color:#b9c0cc!important}`;}catch(e){console.error(e)}}f.addEventListener('load',apply);buttons.forEach(b=>b.addEventListener('click',()=>{current=Number(b.dataset.w);buttons.forEach(x=>x.classList.toggle('active',x===b));apply()}));</script></body></html>
