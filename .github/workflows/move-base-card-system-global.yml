name: Move base card system global
on:
  push:
    branches: [main]
    paths: ['.github/workflows/move-base-card-system-global.yml']
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move shared value and service card rules to global
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('assets/unified-design-base-20260907.css')
          dst = Path('assets/global.css')
          s = src.read_text(encoding='utf-8')
          g = dst.read_text(encoding='utf-8')

          start_marker = '/* Kacheltexte auf Startseite und Unternehmen vertikal mittig,'
          end_marker = '/* Desktop Zusammenarbeit: drei Spalten,'
          start = s.find(start_marker)
          end = s.find(end_marker)
          assert start >= 0 and end > start, 'card-system range not found'
          block = s[start:end].rstrip()
          marker = '/* Werte- und Dienstleistungskacheln – globale gemeinsame Regeln */'
          assert marker not in g, 'global marker already exists'

          s = s[:start] + s[end:]
          g = g.rstrip() + '\n\n' + marker + '\n' + block + '\n'

          src.write_text(s, encoding='utf-8')
          dst.write_text(g, encoding='utf-8')
          assert start_marker not in src.read_text(encoding='utf-8')
          assert marker in dst.read_text(encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/global.css assets/unified-design-base-20260907.css
          git commit -m "Werte- und Dienstleistungskacheln vollständig globalisieren"
          git rm .github/workflows/move-base-card-system-global.yml
          git commit -m "Temporären Kachelbasis-Workflow entfernen"
          git push