<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MASOON TREUHAND – Hero Bild Test</title>
<style>
html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#111}body{display:grid;grid-template-rows:58px 1fr;overflow:hidden}.tester{display:flex;align-items:center;gap:7px;padding:0 14px;background:#f3f3f3;border-bottom:1px solid #ccc;overflow-x:auto;z-index:10}.tester strong{font-size:13px;white-space:nowrap;margin-right:5px}.tester button{border:1px solid #c9c9c9;background:#fff;padding:9px 13px;font-size:12px;cursor:pointer;white-space:nowrap}.tester button.active{background:#111;color:#fff;border-color:#111}iframe{width:100%;height:100%;border:0;background:#fff}
</style>
</head><body>
<div class="tester">
<strong>Hero-Bild vergleichen</strong>
<button data-v="original">Original</button>
<button data-v="new">Neues Bild</button>
<button data-v="newsoft">Neues Bild · weich</button>
<button data-v="newclean" class="active">Neues Bild · weich · ohne Text</button>
</div>
<iframe id="site" src="./index.html"></iframe>
<script>
const f=document.getElementById('site'),bs=[...document.querySelectorAll('button[data-v]')];
let current='newclean', originalSrc='';
const css=`@media(min-width:801px){
html.hero-image-newsoft body .home-hero__portrait-image,
html.hero-image-newclean body .home-hero__portrait-image{filter:blur(19.5px)!important;transform:scale(1.061)!important}
html.hero-image-newclean body .home-hero__copy h1,
html.hero-image-newclean body .home-hero__copy p{visibility:hidden!important}
}`;
function apply(v){
  const d=f.contentDocument;if(!d)return;
  [...d.documentElement.classList].filter(c=>c.startsWith('hero-image-')).forEach(c=>d.documentElement.classList.remove(c));
  let st=d.getElementById('hero-image-test');if(!st){st=d.createElement('style');st.id='hero-image-test';st.textContent=css;d.head.appendChild(st)}
  const img=d.querySelector('.home-hero__portrait-image');
  if(img){
    if(!originalSrc) originalSrc=img.getAttribute('src')||img.src;
    if(v==='original') img.setAttribute('src',originalSrc);
    else img.setAttribute('src','assets/hero-background-20260907.png');
  }
  if(v!=='original') d.documentElement.classList.add('hero-image-'+v);
  bs.forEach(b=>b.classList.toggle('active',b.dataset.v===v));
  current=v;
}
f.addEventListener('load',()=>apply(current));
bs.forEach(b=>b.addEventListener('click',()=>apply(b.dataset.v)));
</script></body></html>
