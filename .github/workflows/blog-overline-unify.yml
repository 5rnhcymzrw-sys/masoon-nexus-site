name: Blog overline unify

on:
  push:
    paths:
      - '.github/workflows/blog-overline-unify.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unify individual blog overlines with section labels
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          article_dirs = [
              'checkliste-steuererklaerung',
              'unternehmen-gruenden',
              'unternehmensformen',
              'kuendigung-arbeitsvertrag',
              'unwahre-buchfuehrung',
              'gewinnverwendung',
              'missbraeuchliche-konkurse',
          ]

          for d in article_dirs:
              p = Path('fachwissen') / d / 'index.html'
              if not p.exists():
                  raise SystemExit(f'Missing article page: {p}')
              html = p.read_text()
              if html.count('class="section-label article-overline-label mt-nav-typography"') != 1:
                  raise SystemExit(f'Unexpected article overline markup in {p}')

          unified = Path('assets/unified-design.css')
          u = unified.read_text()
          legacy_pattern = re.compile(r'(body\.page-article-[^{]+ \.article-hero \.section-label\{[^{}]*?)color:#868279!important;?([^{}]*?\})')
          u2, unified_removed = legacy_pattern.subn(r'\1\2', u)
          if unified_removed != 5:
              raise SystemExit(f'Expected 5 legacy page-specific article colours, found {unified_removed}')
          unified.write_text(u2)

          detail = Path('assets/article-detail.css')
          dcss = detail.read_text()
          old = '.article-hero .section-label{margin-bottom:38px!important;color:#868279!important}'
          new = '.article-hero .section-label{margin-bottom:38px!important}'
          if dcss.count(old) != 1:
              raise SystemExit(f'Expected one shared legacy article colour rule, found {dcss.count(old)}')
          detail.write_text(dcss.replace(old, new, 1))

          base = Path('assets/unified-design-base-20260907.css').read_text()
          canonical = 'html body main .section-label.section-label.section-label.section-label.section-label.section-label'
          s = base.find(canonical + '{')
          if s == -1:
              raise SystemExit('Canonical section-label rule missing')
          e = base.find('}', s)
          block = base[s:e+1]
          required = [
              'font-family:var(--font-inter),Arial,sans-serif!important',
              'font-size:11px!important',
              'font-weight:500!important',
              'line-height:1.4!important',
              'letter-spacing:1.1px!important',
              'text-transform:uppercase!important',
              'color:#777777!important',
          ]
          for item in required:
              if item not in block:
                  raise SystemExit(f'Canonical section-label value missing: {item}')

          detail_refs = 0
          for folder in article_dirs:
              p = Path('fachwissen') / folder / 'index.html'
              html = p.read_text()
              html, n1 = re.subn(
                  r'(\.\./\.\./assets/unified-design\.css\?v=)[^"\']+',
                  r'\1blog-overline-unified-20260912-3',
                  html,
                  count=1
              )
              if n1 != 1:
                  raise SystemExit(f'unified-design cache ref not found exactly once in {p}: {n1}')
              html, n2 = re.subn(
                  r'(\.\./\.\./assets/article-detail\.css\?v=)[^"\']+',
                  r'\1blog-overline-unified-20260912-3',
                  html,
                  count=1
              )
              if n2 not in (0, 1):
                  raise SystemExit(f'Unexpected article-detail cache refs in {p}: {n2}')
              detail_refs += n2
              p.write_text(html)

          if detail_refs < 1:
              raise SystemExit('No article-detail stylesheet references found on any blog page')

          print(f'Removed 6 legacy colour declarations. Updated all 7 blog pages; article-detail refs updated on {detail_refs} pages.')
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/blog-overline-unify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Blogs: Datumszeilen exakt wie Bereichstitel"
          git push