name: temp fachwissen page gradient cleanup
on:
  push:
    paths:
      - '.github/workflows/temp-fachwissen-page-gradient-cleanup.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Edit existing Fachwissen page background rule only
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Commit change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/unified-design.css fachwissen/index.html
          git diff --cached --check
          git commit -m 'Remove extra Fachwissen page gradient layer'
          git push
