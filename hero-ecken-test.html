<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>MASOON TREUHAND – Hero Ecken Test</title>
<style>
html,body{margin:0;height:100%;background:#111;font-family:Arial,sans-serif}
body{display:grid;grid-template-rows:58px 1fr;overflow:hidden}
.tester{display:flex;align-items:center;gap:7px;padding:0 14px;background:#f3f3f3;border-bottom:1px solid #ccc;box-sizing:border-box;z-index:10;overflow-x:auto}
.tester strong{font-size:13px;margin-right:6px;font-weight:600;white-space:nowrap}
.tester button{appearance:none;border:1px solid #c9c9c9;background:#fff;padding:9px 12px;font-size:12px;cursor:pointer;white-space:nowrap}
.tester button.active{background:#111;color:#fff;border-color:#111}
iframe{width:100%;height:100%;border:0;background:#fff;display:block}
@media(max-width:900px){.tester strong{display:none}}
</style>
</head>
<body>
<div class="tester">
<strong>Ecken vergleichen</strong>
<button data-v="original" class="active">Original</button>
<button data-v="r12">1 · Rund 12</button>
<button data-v="r24">2 · Rund 24</button>
<button data-v="r40">3 · Rund 40</button>
<button data-v="right24">4 · Nur rechts 24</button>
<button data-v="right40">5 · Nur rechts 40</button>
<button data-v="asym">6 · Rechts asymmetrisch</button>
</div>
<iframe id="site" src="./index.html"></iframe>
<script>
const frame=document.getElementById('site');
const buttons=[...document.querySelectorAll('button[data-v]')];
let current='original';

const testCSS=`
@media(min-width:801px){
  /* Wichtig: keine Breite, Höhe, Position, Maske oder clip-path verändern. */
  html[class*="hero-corner-"] body .home-hero .home-hero__content,
  html[class*="hero-corner-"] body .home-hero .home-hero__copy,
  html[class*="hero-corner-"] body .home-hero .home-hero__content::before,
  html[class*="hero-corner-"] body .home-hero .home-hero__content::after,
  html[class*="hero-corner-"] body .home-hero .home-hero__copy::before,
  html[class*="hero-corner-"] body .home-hero .home-hero__copy::after{
    overflow:hidden!important;
    clip-path:none!important;
    -webkit-mask-image:none!important;
    mask-image:none!important;
  }

  html.hero-corner-r12 body .home-hero .home-hero__content,
  html.hero-corner-r12 body .home-hero .home-hero__copy,
  html.hero-corner-r12 body .home-hero .home-hero__content::before,
  html.hero-corner-r12 body .home-hero .home-hero__content::after,
  html.hero-corner-r12 body .home-hero .home-hero__copy::before,
  html.hero-corner-r12 body .home-hero .home-hero__copy::after{border-radius:12px!important}

  html.hero-corner-r24 body .home-hero .home-hero__content,
  html.hero-corner-r24 body .home-hero .home-hero__copy,
  html.hero-corner-r24 body .home-hero .home-hero__content::before,
  html.hero-corner-r24 body .home-hero .home-hero__content::after,
  html.hero-corner-r24 body .home-hero .home-hero__copy::before,
  html.hero-corner-r24 body .home-hero .home-hero__copy::after{border-radius:24px!important}

  html.hero-corner-r40 body .home-hero .home-hero__content,
  html.hero-corner-r40 body .home-hero .home-hero__copy,
  html.hero-corner-r40 body .home-hero .home-hero__content::before,
  html.hero-corner-r40 body .home-hero .home-hero__content::after,
  html.hero-corner-r40 body .home-hero .home-hero__copy::before,
  html.hero-corner-r40 body .home-hero .home-hero__copy::after{border-radius:40px!important}

  html.hero-corner-right24 body .home-hero .home-hero__content,
  html.hero-corner-right24 body .home-hero .home-hero__copy,
  html.hero-corner-right24 body .home-hero .home-hero__content::before,
  html.hero-corner-right24 body .home-hero .home-hero__content::after,
  html.hero-corner-right24 body .home-hero .home-hero__copy::before,
  html.hero-corner-right24 body .home-hero .home-hero__copy::after{border-radius:0 24px 24px 0!important}

  html.hero-corner-right40 body .home-hero .home-hero__content,
  html.hero-corner-right40 body .home-hero .home-hero__copy,
  html.hero-corner-right40 body .home-hero .home-hero__content::before,
  html.hero-corner-right40 body .home-hero .home-hero__content::after,
  html.hero-corner-right40 body .home-hero .home-hero__copy::before,
  html.hero-corner-right40 body .home-hero .home-hero__copy::after{border-radius:0 40px 40px 0!important}

  html.hero-corner-asym body .home-hero .home-hero__content,
  html.hero-corner-asym body .home-hero .home-hero__copy,
  html.hero-corner-asym body .home-hero .home-hero__content::before,
  html.hero-corner-asym body .home-hero .home-hero__content::after,
  html.hero-corner-asym body .home-hero .home-hero__copy::before,
  html.hero-corner-asym body .home-hero .home-hero__copy::after{border-radius:0 42px 14px 0!important}
}
`;

function apply(v){
  const d=frame.contentDocument;if(!d)return;
  [...d.documentElement.classList].filter(c=>c.startsWith('hero-corner-')).forEach(c=>d.documentElement.classList.remove(c));
  let st=d.getElementById('hero-corner-test-styles');
  if(!st){st=d.createElement('style');st.id='hero-corner-test-styles';st.textContent=testCSS;d.head.appendChild(st)}
  if(v!=='original')d.documentElement.classList.add('hero-corner-'+v);
  buttons.forEach(b=>b.classList.toggle('active',b.dataset.v===v));
  current=v;
}
frame.addEventListener('load',()=>apply(current));
buttons.forEach(b=>b.addEventListener('click',()=>apply(b.dataset.v)));
</script>
</body>
</html>
