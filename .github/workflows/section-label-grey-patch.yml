name: Section label grey patch

on:
  push:
    paths:
      - '.github/workflows/section-label-grey-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update existing section label rule
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          base = Path('assets/unified-design-base-20260907.css')
          text = base.read_text()
          old = '''html body .section-label{
  gap:10px!important;
}'''
          new = '''html body .section-label{
  gap:10px!important;
  color:#777777!important;
  letter-spacing:1.1px!important;
}'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly 1 existing Bereichstitel rule, found {text.count(old)}')
          base.write_text(text.replace(old, new, 1))

          unified = Path('assets/unified-design.css')
          utext = unified.read_text()
          utext, count = re.subn(
              r"@import url\('\./unified-design-base-20260907\.css\?v=[^']+'\);",
              "@import url('./unified-design-base-20260907.css?v=section-label-grey-20260912-1');",
              utext,
              count=1
          )
          if count != 1:
              raise SystemExit('Existing unified-design base import not found exactly once')
          unified.write_text(utext)

          changed = 0
          for page in Path('.').rglob('*.html'):
              html = page.read_text()
              updated, n = re.subn(
                  r'(unified-design\.css\?v=)[^"\']+',
                  r'\1section-label-grey-20260912-1',
                  html
              )
              if n:
                  page.write_text(updated)
                  changed += n
          if changed == 0:
              raise SystemExit('No unified-design cache references found')
          print(f'Updated {changed} page cache references')
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/section-label-grey-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bereichstitel global grau mit 1.1px Buchstabenabstand"
          git push