name: temp add company accent levels 4 to 6
on:
  push:
    paths:
      - '.github/workflows/temp-add-company-accent-levels-4-6.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extend existing Bild Akzent control to six levels
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('farbtest-alle-kaesten-linien-10092026.html')
          s=p.read_text(encoding='utf-8')

          old="""function companyAccentGradient(mode){if(mode==='off')return'transparent';const c=[[244,228,201],[232,227,218],[193,199,214],[132,144,171]],a=mode==='1'?.08:mode==='3'?.14:.11;return`linear-gradient(to right in oklab,rgba(${c[0].join(',')},${a}) 0%,rgba(${c[1].join(',')},${a}) 36%,rgba(${c[2].join(',')},${a}) 68%,rgba(${c[3].join(',')},${a}) 100%)`}"""
          new="""function companyAccentGradient(mode){if(mode==='off')return'transparent';const c=[[244,228,201],[232,227,218],[193,199,214],[132,144,171]],levels={'1':.08,'2':.11,'3':.14,'4':.17,'5':.20,'6':.23},a=levels[mode]??.11;return`linear-gradient(to right in oklab,rgba(${c[0].join(',')},${a}) 0%,rgba(${c[1].join(',')},${a}) 36%,rgba(${c[2].join(',')},${a}) 68%,rgba(${c[3].join(',')},${a}) 100%)`}"""
          if s.count(old)!=1: raise SystemExit(f'companyAccentGradient match count {s.count(old)}')
          s=s.replace(old,new,1)

          old="""const colorButtons=section.id==='company-accent'?`<button data-section-color=\"off\" class=\"${s.color==='off'?'active':''}\">ohne</button><button data-section-color=\"1\" class=\"${s.color==='1'?'active':''}\">1</button><button data-section-color=\"2\" class=\"${s.color==='2'?'active':''}\">2</button><button data-section-color=\"3\" class=\"${s.color==='3'?'active':''}\">3</button>`"""
          new="""const colorButtons=section.id==='company-accent'?`<button data-section-color=\"off\" class=\"${s.color==='off'?'active':''}\">ohne</button><button data-section-color=\"1\" class=\"${s.color==='1'?'active':''}\">1</button><button data-section-color=\"2\" class=\"${s.color==='2'?'active':''}\">2</button><button data-section-color=\"3\" class=\"${s.color==='3'?'active':''}\">3</button><button data-section-color=\"4\" class=\"${s.color==='4'?'active':''}\">4</button><button data-section-color=\"5\" class=\"${s.color==='5'?'active':''}\">5</button><button data-section-color=\"6\" class=\"${s.color==='6'?'active':''}\">6</button>`"""
          if s.count(old)!=1: raise SystemExit(f'company accent colorButtons match count {s.count(old)}')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add farbtest-alle-kaesten-linien-10092026.html
          git diff --cached --check
          git commit -m 'Extend test Bild Akzent to six strength levels'
          git push
