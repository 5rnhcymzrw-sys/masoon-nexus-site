<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MASOON TREUHAND – Hero Original Test</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{border:0;width:100%;height:100%;display:block}.tag{position:fixed;z-index:99999;top:10px;left:50%;transform:translateX(-50%);padding:8px 12px;background:rgba(255,255,255,.96);border:1px solid rgba(23,23,21,.16);font:12px Arial,sans-serif;color:#171715;box-shadow:0 6px 18px rgba(0,0,0,.10)}</style></head><body><div class="tag">Hero-Test – Originalseite</div><iframe id="site" src="../index.html"></iframe><script>
const frame=document.getElementById('site');
frame.addEventListener('load',()=>{
  const d=frame.contentDocument||frame.contentWindow.document;
  if(!d)return;
  const hero=d.querySelector('.home-hero');
  const header=d.querySelector('.site-header');
  const box=d.querySelector('.home-hero__content')||d.querySelector('.home-hero h1')?.parentElement;
  if(!hero||!box)return;
  let grad='linear-gradient(110deg,#f3e8d4 0%,#e8e5df 38%,#c7cbd3 66%,#8d96a8 100%)';
  let thick='1px';
  if(header){
    const hs=frame.contentWindow.getComputedStyle(header);
    const ps=frame.contentWindow.getComputedStyle(header,'::after');
    const bgi=(ps&&ps.backgroundImage&&ps.backgroundImage!=='none')?ps.backgroundImage:((hs.backgroundImage&&hs.backgroundImage!=='none')?hs.backgroundImage:null);
    if(bgi)grad=bgi;
    const bw=parseFloat(hs.borderBottomWidth||'0');
    const ph=parseFloat(ps?.height||'0');
    if(bw>0)thick=bw+'px'; else if(ph>0&&ph<20)thick=ph+'px';
  }
  d.getElementById('hero-original-test-style')?.remove();
  const s=d.createElement('style');s.id='hero-original-test-style';
  s.textContent=`
    html body main.home .home-hero{background:#fff!important;background-color:#fff!important;background-image:none!important;}
    html body main.home .home-hero::before,html body main.home .home-hero::after{background:none!important;background-image:none!important;}
    html body main.home .home-hero .home-hero__content{background:#fff!important;background-color:#fff!important;background-image:none!important;border-style:solid!important;border-width:${thick}!important;border-color:transparent!important;border-image:${grad} 1!important;box-shadow:none!important;}
  `;
  d.head.appendChild(s);
  if(!box.classList.contains('home-hero__content')){
    box.style.background='#fff';
    box.style.borderStyle='solid';
    box.style.borderWidth=thick;
    box.style.borderColor='transparent';
    box.style.borderImage=`${grad} 1`;
    box.style.boxShadow='none';
  }
  setTimeout(()=>hero.scrollIntoView({block:'start'}),80);
});
</script></body></html>
