<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MASOON – gesamte Seite Kästen Test</title>
<style>
html,body{margin:0;min-height:100%;background:#f4f4f2;font-family:Arial,sans-serif;color:#171715}
.testbar{position:sticky;top:0;z-index:99999;background:#fff;border-bottom:1px solid #d8d8d4;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.testbar strong{font-size:12px;margin-right:6px}.testbar button{appearance:none;border:1px solid #cfcfca;background:#fff;padding:7px 10px;font-size:11px;cursor:pointer}.testbar button:hover,.testbar button.active{background:#171715;color:#fff;border-color:#171715}.group{display:flex;gap:5px;align-items:center;margin-left:8px;padding-left:10px;border-left:1px solid #ddd}.group span{font-size:11px;color:#666;margin-right:2px}.status{font-size:11px;font-weight:700;min-width:170px}.note{font-size:11px;color:#666;margin-left:auto}#siteFrame{display:block;width:100%;height:calc(100vh - 58px);min-height:720px;border:0;background:#fff}@media(max-width:1200px){.note{width:100%;margin-left:0}#siteFrame{height:calc(100vh - 112px)}}
</style>
</head>
<body>
<div class="testbar">
<strong>GESAMTE SEITE · KÄSTEN TEST</strong>
<button data-src="index.html?v=allcards354v1" class="active">Startseite</button>
<button data-src="unternehmen/index.html?v=allcards354v1">Unternehmen</button>
<button data-src="dienstleistungen/index.html?v=allcards354v1">Dienstleistungen</button>
<button data-src="fachwissen/index.html?v=allcards354v1">Fachwissen</button>
<button data-src="kontakt/index.html?v=allcards354v1">Kontakt</button>
<button data-src="impressum/index.html?v=allcards354v1">Impressum</button>
<button data-src="datenschutz/index.html?v=allcards354v1">Datenschutz</button>
<button data-src="disclaimer/index.html?v=allcards354v1">Disclaimer</button>
<div class="group"><span>Stärke:</span><button data-level="3.5">3.5</button><button data-level="4" class="active">4</button></div>
<div class="group"><span>Linien:</span><button data-lines="on" class="active">AN</button><button data-lines="off">AUS</button></div>
<span class="status" id="status">Stufe 4 · Linien an</span>
<span class="note">Weichzeichnung immer AUS · Originalseiten unverändert</span>
</div>
<iframe id="siteFrame" src="index.html?v=allcards354v1" title="Gesamte Seite Kästen Test"></iframe>
<script>
const frame=document.getElementById('siteFrame');
const pageButtons=[...document.querySelectorAll('[data-src]')];
const levelButtons=[...document.querySelectorAll('[data-level]')];
const lineButtons=[...document.querySelectorAll('[data-lines]')];
const status=document.getElementById('status');
let level=4;
let linesOn=true;
const alpha={'3.5':.145,'4':.18};
const selectors=[
  'main.home .home-values__items>.home-values__item',
  'main.home .home-paths__grid>a',
  'main.home>.home-contact-band',
  '.company-values-grid>.company-value-card',
  '.company-collaboration-box',
  'main.services-main .services-grid>.service-card',
  'main.services-main>.services-closing',
  '.knowledge-section#knowledge-articles .articles-grid>.article-card',
  '.knowledge-section#knowledge-articles>.knowledge-note',
  '.disclaimer-card'
];
function gradientFor(v){
  const a=alpha[String(v)];
  return `linear-gradient(to right in oklab, rgba(243,232,212,${a}) 0%, rgba(232,229,223,${a}) 36%, rgba(199,203,211,${a}) 68%, rgba(141,150,168,${a}) 100%)`;
}
function important(el,p,v){el.style.setProperty(p,v,'important')}
function targets(d){
  const set=new Set();
  selectors.forEach(sel=>d.querySelectorAll(sel).forEach(el=>set.add(el)));
  return [...set].filter(el=>{
    const r=el.getBoundingClientRect();
    return r.width>120 && r.height>60;
  });
}
function applyGradient(el,index){
  const g=gradientFor(level);
  important(el,'background',g);
  important(el,'background-image',g);
  important(el,'background-color','transparent');
  important(el,'background-origin','border-box');
  important(el,'background-repeat','no-repeat');
  important(el,'background-size','calc(300% + 44px) 100%');
  important(el,'background-position',index%3===0?'left top':index%3===1?'center top':'right top');
  important(el,'backdrop-filter','none');
  important(el,'-webkit-backdrop-filter','none');
  important(el,'filter','none');
}
function applyLines(el,on){
  const g=gradientFor(level);
  important(el,'box-sizing','border-box');
  important(el,'border-width','1px');
  important(el,'border-style','solid');
  important(el,'border-color','transparent');
  important(el,'border-image',on?g+' 1':'none');
}
function apply(){
  try{
    const d=frame.contentDocument;
    if(!d||!d.body)return;
    const els=targets(d);
    els.forEach((el,i)=>{applyGradient(el,i);applyLines(el,linesOn)});
    status.textContent=`Stufe ${level} · Linien ${linesOn?'an':'aus'} · ${els.length} Kästen`;
  }catch(e){console.error('Gesamte-Seite-Kästentest:',e)}
}
function runRepeated(){apply();setTimeout(apply,180);setTimeout(apply,500);setTimeout(apply,1100);setTimeout(apply,2200)}
frame.addEventListener('load',()=>{
  runRepeated();
  try{
    const d=frame.contentDocument;
    d.addEventListener('click',()=>setTimeout(apply,80),true);
  }catch(e){}
});
pageButtons.forEach(b=>b.addEventListener('click',()=>{
  pageButtons.forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  frame.src=b.dataset.src;
}));
levelButtons.forEach(b=>b.addEventListener('click',()=>{
  level=Number(b.dataset.level);
  levelButtons.forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  runRepeated();
}));
lineButtons.forEach(b=>b.addEventListener('click',()=>{
  linesOn=b.dataset.lines==='on';
  lineButtons.forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  runRepeated();
}));
</script>
</body>
</html>
