name: Centralize header styles

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/centralize-header.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Centralize header and background styles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def require_replace(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 exact match, found {count}')
              return text.replace(old, new, 1)

          def require_sub(text, pattern, repl, label, flags=0):
              new_text, count = re.subn(pattern, repl, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 regex match, found {count}')
              return new_text

          # global.css: one canonical header source, preserving the current effective appearance.
          path = Path('assets/global.css')
          s = path.read_text(encoding='utf-8')

          legacy_compact = '.site-header{isolation:isolate!important;}.brand{z-index:100!important;opacity:1!important;filter:none!important;mix-blend-mode:normal!important;}.brand img{position:relative!important;z-index:2!important;opacity:1!important;filter:brightness(0) invert(1)!important;mix-blend-mode:normal!important;}.site-nav a:after{height:1px!important;background:#b8b8b8!important;background-image:none!important;transition:none!important;box-shadow:none!important;filter:none!important;}\n'
          s = require_replace(s, legacy_compact, '', 'global compact legacy header')

          canonical_header = '''/* Einheitliche Kopfzeile auf allen Seiten */
html body header.site-header{
  height:108px!important;
  min-height:108px!important;
  color:#fff!important;
  background:#000!important;
  background-color:#000!important;
  background-image:none!important;
  border-bottom:1px solid #ffffff29!important;
  position:fixed!important;
  top:0!important;
  right:0!important;
  left:0!important;
  opacity:1!important;
  isolation:isolate!important;
  transform:none!important;
  transition:none!important;
  backdrop-filter:none!important;
  -webkit-backdrop-filter:none!important;
  mix-blend-mode:normal!important;
}
html body header.site-header::before{content:none!important;display:none!important;}
html body header.site-header::after{
  content:""!important;
  position:fixed!important;
  z-index:49!important;
  top:108px!important;
  right:0!important;
  left:0!important;
  width:100%!important;
  height:8px!important;
  background:linear-gradient(110deg,#f3e8d4 0%,#e8e5df 38%,#c7cbd3 66%,#8d96a8 100%)!important;
}

html body .home .home-hero{margin-top:0!important;min-height:calc(100svh - 100px)!important;}
@media(min-width:801px){
  html body header.site-header .header-inner{
    position:relative!important;
    width:min(100% - 64px,1320px)!important;
    height:108px!important;
    min-height:108px!important;
    margin:0 auto!important;
    padding:0!important;
    display:flex!important;
    align-items:center!important;
    justify-content:flex-end!important;
  }
  html body header.site-header .header-inner .home-text-logo{
    position:absolute!important;
    z-index:100!important;
    top:0!important;
    right:auto!important;
    left:calc(max(0px,(100% - 1227px)/2) - 7.9872px)!important;
    width:240px!important;
    height:108px!important;
    margin:0!important;
    padding:0!important;
    display:flex!important;
    align-items:center!important;
    opacity:1!important;
    filter:none!important;
    mix-blend-mode:normal!important;
    background:transparent!important;
    background-color:transparent!important;
    background-image:none!important;
    border:0!important;
    border-radius:0!important;
    box-shadow:none!important;
    backdrop-filter:none!important;
    -webkit-backdrop-filter:none!important;
    transform:none!important;
    overflow:visible!important;
  }
  html body header.site-header .header-inner .home-text-logo img{
    height:auto!important;
    max-height:none!important;
    object-fit:contain!important;
    filter:none!important;
    mix-blend-mode:normal!important;
  }
  html body header.site-header .header-inner .home-text-logo .home-logo-icon{
    position:absolute!important;
    z-index:1!important;
    top:50%!important;
    left:50%!important;
    width:165.517241px!important;
    height:auto!important;
    opacity:.18!important;
    pointer-events:none!important;
    transform:translate(-50%,-50%)!important;
  }
  html body header.site-header .header-inner .home-text-logo .home-logo-text{
    position:relative!important;
    z-index:2!important;
    width:240px!important;
    height:auto!important;
    max-height:none!important;
    opacity:1!important;
    transform:translateY(11px)!important;
  }
  html body header.site-header .site-nav{
    position:absolute!important;
    left:calc(max(32px,(100vw - 1227px)/2) + 503px - max(32px,(100vw - 1320px)/2))!important;
    width:auto!important;
    margin:0!important;
    margin-left:0!important;
    padding:0!important;
    display:flex!important;
    align-items:center!important;
    justify-content:flex-end!important;
    transform:none!important;
  }
}

'''
          s = require_sub(
              s,
              r'/\* Einheitliche Kopfzeile wie auf Unternehmen \*/.*?(?=/\* Einheitliche schlichte Fusszeile wie die Kopfzeile \*/)',
              canonical_header,
              'global canonical header block',
              re.S,
          )

          s = require_sub(
              s,
              r'/\* Kopfzeilenbalken vollständig deckend \*/\nhtml body header\.site-header\{.*?\n\}\n\n',
              '',
              'global duplicate opaque header',
              re.S,
          )

          s = require_sub(
              s,
              r'/\* Startseite: Logo-Kasten direkt unter der Farbverlaufslinie im Hero \*/\n@media\(min-width:801px\)\{.*?\n\}\n\n',
              '',
              'global home-only logo position',
              re.S,
          )

          s = require_replace(s, '  html body .header-inner,\n', '', 'global header-inner width duplicate')

          s = require_sub(
              s,
              r'/\* Startseite Hero-Linie: Farbverlauf wie Kontaktbutton \*/\nhtml body header\.site-header\.home-page-header::after\{.*?\n\}\n\n',
              '',
              'global home-only header line',
              re.S,
          )

          s = require_sub(
              s,
              r'/\* Einheitliche Kopf- und Fusszeile auf allen Seiten \*/\nhtml body header\.site-header\{.*?html body header\.site-header \.header-inner\{.*?\n\}\n(?=html body \.page-main,)',
              '/* Einheitliche Seitenabstände und Fusszeile */\n',
              'global duplicate header dimensions',
              re.S,
          )

          s = require_sub(
              s,
              r'/\* Einheitliches Textlogo mit Schlüssel in sämtlichen Kopfzeilen \*/\n@media\(min-width:801px\)\{.*?\n\}\n\n(?=/\* Kleine Übertitel:)',
              '',
              'global duplicate logo block',
              re.S,
          )

          path.write_text(s, encoding='utf-8')

          # unified-design-base: no header appearance/geometry; keep footer-only parts.
          path = Path('assets/unified-design-base-20260907.css')
          s = path.read_text(encoding='utf-8')
          s = require_replace(s, '.site-header,\n.site-footer{', '.site-footer{', 'base shared header/footer background')
          s = require_sub(
              s,
              r'/\* Navigationslinie mit 13 Pixel Abstand zum Text \*/\nhtml body \.site-nav a::after\{\n  bottom:18px!important;\n\}\n\n',
              '',
              'base nav underline position',
          )

          old_geometry = '''/* Endgültige Header-/Footer-Geometrie ohne nachträgliche JS-Messung */
@media(min-width:801px){
  html body .site-header .site-nav{
    position:absolute!important;
    left:calc(max(32px,(100vw - 1227px)/2) + 503px - max(32px,(100vw - 1320px)/2))!important;
    margin:0!important;
    transform:none!important;
  }
  html body .site-footer .footer-simple{
    box-sizing:border-box!important;
    justify-content:flex-start!important;
    padding-left:calc(max(32px,(100vw - 1227px)/2) + 503px - max(32px,(100vw - 1320px)/2))!important;
  }
}
'''
          new_geometry = '''/* Endgültige Footer-Geometrie ohne nachträgliche JS-Messung */
@media(min-width:801px){
  html body .site-footer .footer-simple{
    box-sizing:border-box!important;
    justify-content:flex-start!important;
    padding-left:calc(max(32px,(100vw - 1227px)/2) + 503px - max(32px,(100vw - 1320px)/2))!important;
  }
}
'''
          s = require_replace(s, old_geometry, new_geometry, 'base final header/footer geometry')
          path.write_text(s, encoding='utf-8')

          # unified-design: remove the last header override and old page-specific background overrides.
          path = Path('assets/unified-design.css')
          s = path.read_text(encoding='utf-8')
          s = require_replace(
              s,
              'html body header.site-header .header-inner .home-text-logo .home-logo-icon{width:165.517241px!important;}\n',
              '',
              'unified logo icon override',
          )
          s = require_sub(
              s,
              r'html body\.page-home\.site-light-page:has\(main\.home\)\{\n  background:#fff url\("\.\./Hintergrundbild 2\.png"\) center top / cover no-repeat fixed!important;\n\}\n',
              '',
              'unified home background image',
          )
          s = require_replace(
              s,
              '  html body.page-home.site-light-page:has(main.home){background-attachment:scroll!important;background-size:auto 100svh!important;background-repeat:repeat-y!important;}\n',
              '',
              'unified home mobile background override',
          )
          s = require_sub(
              s,
              r'html body\.page-knowledge\.site-light-page:has\(#knowledge-articles\)\{\n  background-image:linear-gradient\(to right,#fff 0%,#fff 36%,rgba\(255,255,255,\.95\) 42%,rgba\(255,255,255,\.5\) 49%,rgba\(255,255,255,0\) 58%\),url\("\.\./Hintergrundbild 2\.png"\)!important;\n  background-repeat:no-repeat,repeat-y!important;\n  background-size:100% 100%,cover!important;\n  background-position:center top,center top!important;\n  background-attachment:scroll,fixed!important;\n\}\n@media\(max-width:800px\)\{\n  html body\.page-knowledge\.site-light-page:has\(#knowledge-articles\)\{\n    background-attachment:scroll,scroll!important;\n  \}\n\}\n',
              '',
              'unified knowledge background override',
          )
          path.write_text(s, encoding='utf-8')

          # contact.css: remove its page-specific header background.
          path = Path('assets/contact.css')
          s = path.read_text(encoding='utf-8')
          s = require_replace(
              s,
              '.site-header{\n  background: #0a0a09e0 !important;\n}\n\n',
              '',
              'contact header background',
          )
          path.write_text(s, encoding='utf-8')
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "masoon-site-cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add assets/global.css assets/unified-design-base-20260907.css assets/unified-design.css assets/contact.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Kopfzeile global vereinheitlichen"
          git push
