name: extract-company-portrait

on:
  push:
    paths:
      - '.github/workflows/extract-company-portrait.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract portrait asset and update HTML
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          html_path = Path('unternehmen/index.html')
          asset_path = Path('Foto-unternehmen.webp')
          html = html_path.read_text(encoding='utf-8')

          marker = 'class="home-company__image-primary"'
          marker_pos = html.find(marker)
          if marker_pos < 0:
              raise SystemExit('Portrait image marker is missing')

          src_prefix = 'src="data:image/webp;base64,'
          src_pos = html.find(src_prefix, marker_pos)
          if src_pos < 0:
              raise SystemExit('Inline portrait source is missing')

          data_start = src_pos + len(src_prefix)
          data_end = html.find('"', data_start)
          if data_end < 0:
              raise SystemExit('Inline portrait source is malformed')

          encoded = html[data_start:data_end]
          binary = base64.b64decode(encoded, validate=True)
          asset_path.write_bytes(binary)
          print('portrait_bytes', len(binary))

          old_src = html[src_pos:data_end + 1]
          new_src = 'src="../Foto-unternehmen.webp"'
          html = html[:src_pos] + new_src + html[data_end + 1:]

          old_preload = '<link rel="preload" as="image" href="../Hintergrundbild 2.png" fetchpriority="high" />'
          new_preload = '<link rel="preload" as="image" href="../Foto-unternehmen.webp" type="image/webp" fetchpriority="high" />'
          if html.count(old_preload) != 1:
              raise SystemExit('Unexpected company preload occurrence count')
          html = html.replace(old_preload, new_preload)

          if html.count('src="../Foto-unternehmen.webp"') != 1:
              raise SystemExit('Unexpected external portrait occurrence count')
          if 'class="home-company__image-primary"' not in html:
              raise SystemExit('Portrait class was lost')

          html_path.write_text(html, encoding='utf-8')
          PY

      - name: Commit company portrait cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add unternehmen/index.html Foto-unternehmen.webp
          git rm .github/workflows/extract-company-portrait.yml
          git commit -m "Unternehmen portrait: external preloadable WebP asset"
          git push
