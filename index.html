<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MASOON TREUHAND</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#111;font-family:Arial,sans-serif}
    #site{display:block;width:100%;height:100%;border:0;background:#fff}
    #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#111;color:#fff;z-index:10;letter-spacing:.08em;font-size:14px}
    #error{display:none;position:fixed;inset:0;padding:40px;background:#f4f1ec;color:#222;z-index:20;box-sizing:border-box;font-size:16px;line-height:1.6}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
  <div id="loading">WEBSITE WIRD GELADEN …</div>
  <div id="error"></div>
  <iframe id="site" title="MASOON TREUHAND"></iframe>
<script>
(() => {
  const ZIP_NAME = 'MASOON_TREUHAND_Mehrseitige_Website_1zu1.zip';
  const frame = document.getElementById('site');
  const loading = document.getElementById('loading');
  const errorBox = document.getElementById('error');
  let zip;
  const urls = new Map();
  const htmlFiles = new Set();

  const mime = path => {
    const ext = path.split('.').pop().toLowerCase();
    return ({css:'text/css',js:'application/javascript',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',svg:'image/svg+xml',woff2:'font/woff2',woff:'font/woff',ico:'image/x-icon',txt:'text/plain',html:'text/html'})[ext] || 'application/octet-stream';
  };

  const cleanPath = p => {
    p = decodeURIComponent((p || '').split('#')[0].split('?')[0]);
    const out = [];
    for (const part of p.replace(/^\/+/, '').split('/')) {
      if (!part || part === '.') continue;
      if (part === '..') out.pop(); else out.push(part);
    }
    return out.join('/');
  };

  const resolvePath = (baseFile, relative) => {
    if (!relative || /^(?:[a-z]+:|#|\/\/)/i.test(relative)) return null;
    const baseDir = baseFile.includes('/') ? baseFile.slice(0, baseFile.lastIndexOf('/') + 1) : '';
    return cleanPath(relative.startsWith('/') ? relative : baseDir + relative);
  };

  const rewriteCss = (css, cssPath) => css.replace(/url\(\s*(['"]?)([^)'"\s]+)\1\s*\)/g, (all, q, raw) => {
    if (/^(?:data:|#|https?:|\/\/)/i.test(raw)) return all;
    const path = resolvePath(cssPath, raw);
    return path && urls.has(path) ? `url("${urls.get(path)}")` : all;
  });

  async function prepareZip() {
    const response = await fetch(ZIP_NAME + '?v=' + Date.now(), {cache:'no-store'});
    if (!response.ok) throw new Error('ZIP-Datei konnte nicht geladen werden (' + response.status + ').');
    zip = await JSZip.loadAsync(await response.arrayBuffer());
    const names = Object.keys(zip.files).filter(n => !zip.files[n].dir);
    names.forEach(n => { if (/\.html?$/i.test(n)) htmlFiles.add(cleanPath(n)); });

    for (const name of names) {
      const path = cleanPath(name);
      if (/\.(?:html?|css)$/i.test(path)) continue;
      const blob = await zip.file(name).async('blob');
      urls.set(path, URL.createObjectURL(new Blob([blob], {type:mime(path)})));
    }

    for (const name of names.filter(n => /\.css$/i.test(n))) {
      const path = cleanPath(name);
      const css = rewriteCss(await zip.file(name).async('text'), path);
      urls.set(path, URL.createObjectURL(new Blob([css], {type:'text/css'})));
    }
  }

  function routeFromHash() {
    const raw = location.hash.replace(/^#/, '');
    if (!raw) return 'index.html';
    const decoded = cleanPath(decodeURIComponent(raw));
    if (htmlFiles.has(decoded)) return decoded;
    if (htmlFiles.has(decoded + '/index.html')) return decoded + '/index.html';
    return 'index.html';
  }

  function setRoute(path) {
    path = cleanPath(path || 'index.html');
    if (!htmlFiles.has(path) && htmlFiles.has(path + '/index.html')) path += '/index.html';
    if (!htmlFiles.has(path)) path = 'index.html';
    const next = '#' + encodeURIComponent(path);
    if (location.hash === next) render(path); else location.hash = next;
  }

  async function render(pagePath) {
    try {
      loading.style.display = 'flex';
      const file = zip.file(pagePath);
      if (!file) throw new Error('Seite nicht gefunden: ' + pagePath);
      const source = await file.async('text');
      const doc = new DOMParser().parseFromString(source, 'text/html');

      doc.querySelectorAll('link[rel="preload"]').forEach(el => el.remove());
      doc.querySelectorAll('style').forEach(el => { el.textContent = rewriteCss(el.textContent, pagePath); });

      doc.querySelectorAll('[src]').forEach(el => {
        const path = resolvePath(pagePath, el.getAttribute('src'));
        if (path && urls.has(path)) el.setAttribute('src', urls.get(path));
      });

      doc.querySelectorAll('[srcset]').forEach(el => {
        el.setAttribute('srcset', el.getAttribute('srcset').split(',').map(item => {
          const bits = item.trim().split(/\s+/);
          const path = resolvePath(pagePath, bits[0]);
          if (path && urls.has(path)) bits[0] = urls.get(path);
          return bits.join(' ');
        }).join(', '));
      });

      doc.querySelectorAll('link[href]').forEach(el => {
        const path = resolvePath(pagePath, el.getAttribute('href'));
        if (path && urls.has(path)) el.setAttribute('href', urls.get(path));
      });

      doc.querySelectorAll('a[href]').forEach(a => {
        const href = a.getAttribute('href');
        if (!href || /^(?:mailto:|tel:|https?:|\/\/|#)/i.test(href)) return;
        const path = resolvePath(pagePath, href);
        if (path && (htmlFiles.has(path) || htmlFiles.has(path + '/index.html'))) {
          a.dataset.zipRoute = htmlFiles.has(path) ? path : path + '/index.html';
          a.setAttribute('href', '#');
        }
      });

      const bridge = doc.createElement('script');
      bridge.textContent = "document.addEventListener('click',function(e){var a=e.target.closest('a[data-zip-route]');if(a){e.preventDefault();parent.postMessage({type:'masoon-route',path:a.dataset.zipRoute},'*');}});";
      doc.body.appendChild(bridge);

      frame.srcdoc = '<!doctype html>\n' + doc.documentElement.outerHTML;
      frame.onload = () => { loading.style.display = 'none'; try { frame.contentWindow.scrollTo(0,0); } catch(e) {} };
      document.title = doc.title || 'MASOON TREUHAND';
    } catch (err) { showError(err); }
  }

  function showError(err) {
    loading.style.display = 'none';
    errorBox.style.display = 'block';
    errorBox.innerHTML = '<h2>Die Website konnte nicht geladen werden.</h2><p>' + String(err.message || err) + '</p><p>Bitte mit <strong>Ctrl + F5</strong> neu laden.</p>';
  }

  window.addEventListener('message', e => { if (e.data && e.data.type === 'masoon-route') setRoute(e.data.path); });
  window.addEventListener('hashchange', () => { if (zip) render(routeFromHash()); });
  prepareZip().then(() => render(routeFromHash())).catch(showError);
})();
</script>
</body>
</html>
