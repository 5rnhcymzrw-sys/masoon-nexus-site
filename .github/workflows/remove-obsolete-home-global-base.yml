name: Remove obsolete home global base
on:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-obsolete-home-global-base.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete home base rules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/global.css')
          s=p.read_text(encoding='utf-8')
          old='.home-hero{background-image:linear-gradient(90deg,#060605f7 0%,#060605e3 24%,#06060594 49%,#06060514 75%,#06060505 100%),linear-gradient(#05050500,#0505054d)!important;background-position:50% 50%,50% 50%!important;background-size:cover!important;background-repeat:no-repeat!important;}.home-hero__content{display:block!important;}.home-values__item{min-height:285px!important;padding:34px 36px!important;text-align:left!important;display:flex!important;flex-direction:column!important;justify-content:center!important;align-items:flex-start!important;}.home-values__item .service-number{display:none!important;}.home-values__item h3{margin:0 0 14px!important;}.home-values__item h3::after,\nhtml body.page-home.site-light-page main.home section.home-paths.home-paths .home-paths__grid>a>strong::after{content:""!important;display:block!important;width:100%!important;height:var(--mt-gradient-line-width)!important;margin-top:22px!important;background:var(--mt-gradient-line)!important;border:0!important;}'
          new='html body.page-home.site-light-page main.home section.home-paths.home-paths .home-paths__grid>a>strong::after{content:""!important;display:block!important;width:100%!important;height:var(--mt-gradient-line-width)!important;margin-top:22px!important;background:var(--mt-gradient-line)!important;border:0!important;}'
          assert old in s
          s=s.replace(old,new,1)
          s=s.replace('.home-values__item h3,\n.home-paths__grid strong,\n.services-section .service-card h2{', '.home-paths__grid strong,\n.services-section .service-card h2{',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/global.css
          git commit -m "Alte Startseiten-Grundregeln aus global.css entfernen"
          git rm .github/workflows/remove-obsolete-home-global-base.yml
          git commit -m "Temporären Startseiten-Altlasten-Workflow entfernen"
          git push
