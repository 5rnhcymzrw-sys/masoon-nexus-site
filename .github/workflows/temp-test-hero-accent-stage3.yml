name: temp test hero accent stage3
on:
  push:
    paths:
      - '.github/workflows/temp-test-hero-accent-stage3.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adjust existing test page Hero and Bild Akzent only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('farbtest-alle-kaesten-linien-10092026.html')
          s=p.read_text(encoding='utf-8')

          old="Object.values(pageSections).flat().forEach(s=>{if(!states[s.id])states[s.id]={color:'2',lines:'on',soft:'on'}});"
          new="Object.values(pageSections).flat().forEach(s=>{if(!states[s.id])states[s.id]={color:'2',lines:'on',soft:'on'}});states.hero={color:'3',lines:'off',soft:'on'};states['company-accent']={color:'3',lines:'off',soft:'on'};"
          if s.count(old)!=1: raise SystemExit(f'states init match count {s.count(old)}')
          s=s.replace(old,new,1)

          old="function syncHeroBackplate(d){const hero=d.querySelector('.home-hero__copy'),b=hero?.querySelector(':scope > .masoon-hero-white-backplate');if(!hero||!b)return;const p=d.defaultView.getComputedStyle(hero,'::before');const left=parseFloat(p.left)||0,top=parseFloat(p.top)||0,width=parseFloat(p.width)||hero.getBoundingClientRect().width,height=parseFloat(p.height)||hero.getBoundingClientRect().height;setImp(b,'left',`${left-28}px`);setImp(b,'top',`${top+height*.42}px`);setImp(b,'width',`${width*.72}px`);setImp(b,'height',`${height*.58}px`);setImp(b,'right','auto');setImp(b,'bottom','auto')}"
          new="function syncHeroBackplate(d){const hero=d.querySelector('.home-hero__copy'),b=hero?.querySelector(':scope > .masoon-hero-white-backplate');if(!hero||!b)return;const p=d.defaultView.getComputedStyle(hero,'::before');const left=parseFloat(p.left)||0,top=parseFloat(p.top)||0,width=parseFloat(p.width)||hero.getBoundingClientRect().width,height=parseFloat(p.height)||hero.getBoundingClientRect().height;setImp(b,'left',`${left-38}px`);setImp(b,'top',`${top+height*.48}px`);setImp(b,'width',`${width*.78}px`);setImp(b,'height',`${height*.66}px`);setImp(b,'right','auto');setImp(b,'bottom','auto')}"
          if s.count(old)!=1: raise SystemExit(f'syncHeroBackplate match count {s.count(old)}')
          s=s.replace(old,new,1)

          old="function heroCss(s){const bg=s.color==='off'?'transparent':gradient(s.color);return`html body.page-home.site-light-page main.home section.home-hero .home-hero__copy{position:relative!important;isolation:isolate!important}html body.page-home.site-light-page main.home section.home-hero .home-hero__copy>.masoon-hero-white-backplate{display:block!important;position:absolute!important;box-sizing:border-box!important;background:${bg}!important;background-size:100% 100%!important;background-position:0 0!important;background-repeat:no-repeat!important;border:0!important;box-shadow:none!important;-webkit-backdrop-filter:${s.soft==='on'?'blur(32px)':'none'}!important;backdrop-filter:${s.soft==='on'?'blur(32px)':'none'}!important;pointer-events:none!important;z-index:1!important}html body.page-home.site-light-page main.home section.home-hero .home-hero__copy::before{background:#fff!important;background-image:none!important;border:1px solid transparent!important;border-image:${s.lines==='on'?borderFull:'none'}!important;border-color:transparent!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;z-index:2!important}html body.page-home.site-light-page main.home section.home-hero .home-hero__copy>:not(.masoon-hero-white-backplate){position:relative;z-index:3}` }"
          if s.count(old)==0:
              old="function heroCss(s){const bg=s.color==='off'?'transparent':gradient(s.color);return`html body.page-home.site-light-page main.home section.home-hero .home-hero__copy{position:relative!important;isolation:isolate!important}html body.page-home.site-light-page main.home section.home-hero .home-hero__copy>.masoon-hero-white-backplate{display:block!important;position:absolute!important;box-sizing:border-box!important;background:${bg}!important;background-size:100% 100%!important;background-position:0 0!important;background-repeat:no-repeat!important;border:0!important;box-shadow:none!important;-webkit-backdrop-filter:${s.soft==='on'?'blur(32px)':'none'}!important;backdrop-filter:${s.soft==='on'?'blur(32px)':'none'}!important;pointer-events:none!important;z-index:1!important}html body.page-home.site-light-page main.home section.home-hero .home-hero__copy::before{background:#fff!important;background-image:none!important;border:1px solid transparent!important;border-image:${s.lines==='on'?borderFull:'none'}!important;border-color:transparent!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;z-index:2!important}html body.page-home.site-light-page main.home section.home-hero .home-hero__copy>:not(.masoon-hero-white-backplate){position:relative;z-index:3}`}"
          new="function heroCss(s){const bg=s.color==='off'?'transparent':companyAccentGradient(s.color);return`html body.page-home.site-light-page main.home section.home-hero .home-hero__copy{position:relative!important;isolation:isolate!important}html body.page-home.site-light-page main.home section.home-hero .home-hero__copy>.masoon-hero-white-backplate{display:block!important;position:absolute!important;box-sizing:border-box!important;background:${bg}!important;background-size:100% 100%!important;background-position:0 0!important;background-repeat:no-repeat!important;border:0!important;box-shadow:none!important;-webkit-backdrop-filter:${s.soft==='on'?'blur(32px)':'none'}!important;backdrop-filter:${s.soft==='on'?'blur(32px)':'none'}!important;pointer-events:none!important;z-index:1!important}html body.page-home.site-light-page main.home section.home-hero .home-hero__copy::before{background:#fff!important;background-image:none!important;border:${s.lines==='on'?'1px solid transparent':'0'}!important;border-image:${s.lines==='on'?borderFull:'none'}!important;border-color:transparent!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;z-index:2!important}html body.page-home.site-light-page main.home section.home-hero .home-hero__copy>:not(.masoon-hero-white-backplate){position:relative;z-index:3}`}"
          if s.count(old)!=1: raise SystemExit(f'heroCss match count {s.count(old)}')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add farbtest-alle-kaesten-linien-10092026.html
          git diff --cached --check
          git commit -m 'Test visible Hero accent with Unternehmen stage 3 gradient'
          git push
