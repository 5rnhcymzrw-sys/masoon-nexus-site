name: Globalize section labels v3
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/globalize-section-labels-v3.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch verification
        run: python3 scripts/patch-globalize-section-labels.py
      - name: Apply global section label rule
        run: python3 scripts/globalize-section-labels.py
      - name: Verify
        run: python3 scripts/verify-global-section-labels.py
      - name: Commit and push site changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/global.css assets/contact.css assets/dienstleistungen.css assets/unified-design.css assets/index-CZfMKxM_.css index.html unternehmen dienstleistungen fachwissen kontakt disclaimer impressum datenschutz
          git commit -m "Bereichstitel global vereinheitlichen"
          git push
      - name: Remove temporary files
        run: |
          git rm -f scripts/globalize-section-labels.py scripts/patch-globalize-section-labels.py scripts/verify-global-section-labels.py .github/workflows/globalize-section-labels.yml .github/workflows/globalize-section-labels-v2.yml .github/workflows/globalize-section-labels-v3.yml
          git commit -m "Temporäre Bereichstitel-Bereinigung entfernen"
          git push
