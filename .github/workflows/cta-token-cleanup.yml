name: CTA token cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cta-token-cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply token cleanup
        run: python3 -c "from pathlib import Path; p=Path('assets/global.css'); s=p.read_text(); s=s.replace('--button-text-transform:uppercase;--content-width:1227px;','--button-text-transform:uppercase;--action-color:#777777;--action-hover-color:#171715;--action-arrow-size:20px;--action-arrow-weight:300;--action-arrow-gap:10px;--content-width:1227px;',1); s=s.replace('font-family:var(--font-inter),Arial,sans-serif!important;\n  font-size:11px!important;\n  font-style:normal!important;\n  font-weight:500!important;\n  line-height:1.4!important;\n  letter-spacing:1.1px!important;\n  text-transform:uppercase!important;','font-family:var(--button-font)!important;\n  font-size:var(--button-size)!important;\n  font-style:normal!important;\n  font-weight:var(--button-weight)!important;\n  line-height:var(--button-line-height)!important;\n  letter-spacing:var(--button-letter-spacing)!important;\n  text-transform:var(--button-text-transform)!important;',1); p.write_text(s)"
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/global.css
          git commit -m 'CTA-Typografie über globale Tokens steuern'
          git rm .github/workflows/cta-token-cleanup.yml
          git commit -m 'Temporären CTA-Workflow entfernen'
          git push