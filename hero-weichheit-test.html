<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MASOON TREUHAND – Hero Foto Test</title><style>html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#111}body{display:grid;grid-template-rows:58px 1fr;overflow:hidden}.tester{display:flex;align-items:center;gap:7px;padding:0 14px;background:#f3f3f3;border-bottom:1px solid #ccc;overflow-x:auto;z-index:10}.tester strong{font-size:13px;white-space:nowrap;margin-right:5px}.tester button{border:1px solid #c9c9c9;background:#fff;padding:9px 13px;font-size:12px;cursor:pointer;white-space:nowrap}.tester button.active{background:#111;color:#fff;border-color:#111}iframe{width:100%;height:100%;border:0;background:#fff}</style></head><body>
<div class="tester"><strong>Foto rechts testen</strong><button data-v="clean">Nur Text</button><button data-v="hard">1 · Harte Kante</button><button data-v="soft">2 · Weich</button><button data-v="verysoft">3 · Sehr weich</button><button data-v="softbar" class="active">4 · Weich + brauner Balken</button><button data-v="verysoftbar">5 · Sehr weich + Balken</button></div><iframe id="site" src="./index.html"></iframe>
<script>
const f=document.getElementById('site'),bs=[...document.querySelectorAll('button[data-v]')];let current='softbar';
const css=`@media(min-width:801px){
html[class*="hero-photo-"] body .home-hero{background:#fff!important;background-image:none!important;box-shadow:none!important;border:0!important;position:relative!important;overflow:hidden!important;isolation:isolate!important}
html[class*="hero-photo-"] body .home-hero *:not(.hero-photo-overlay):not(.hero-brown-bar){background-color:transparent!important;background-image:none!important;box-shadow:none!important;border-color:transparent!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
html[class*="hero-photo-"] body .home-hero img,html[class*="hero-photo-"] body .home-hero picture,html[class*="hero-photo-"] body .home-hero video,html[class*="hero-photo-"] body .home-hero svg{visibility:hidden!important;opacity:0!important}
html[class*="hero-photo-"] body .home-hero::before,html[class*="hero-photo-"] body .home-hero::after,html[class*="hero-photo-"] body .home-hero *::before,html[class*="hero-photo-"] body .home-hero *::after{content:none!important;display:none!important}
html[class*="hero-photo-"] body .home-hero h1,html[class*="hero-photo-"] body .home-hero p{visibility:visible!important;opacity:1!important;background:none!important;position:relative!important;z-index:4!important}
html[class*="hero-photo-"] body .hero-photo-overlay{display:block!important;position:absolute!important;top:0!important;right:0!important;height:100%!important;z-index:2!important;background-image:url('https://raw.githubusercontent.com/5rnhcymzrw-sys/masoon-nexus-site/main/Foto-hero.png')!important;background-size:cover!important;background-position:center 35%!important;background-repeat:no-repeat!important;pointer-events:none!important}
html[class*="hero-photo-"] body .hero-brown-bar{display:none!important;position:absolute!important;right:42%!important;bottom:5%!important;width:13%!important;height:58%!important;background:#c9c1b5!important;z-index:1!important;pointer-events:none!important}
html.hero-photo-clean body .hero-photo-overlay{display:none!important}
html.hero-photo-hard body .hero-photo-overlay{width:46%!important;-webkit-mask-image:none!important;mask-image:none!important}
html.hero-photo-soft body .hero-photo-overlay,html.hero-photo-softbar body .hero-photo-overlay{width:52%!important;-webkit-mask-image:linear-gradient(to right,transparent 0%,rgba(0,0,0,.12) 10%,rgba(0,0,0,.58) 24%,#000 40%,#000 100%)!important;mask-image:linear-gradient(to right,transparent 0%,rgba(0,0,0,.12) 10%,rgba(0,0,0,.58) 24%,#000 40%,#000 100%)!important}
html.hero-photo-verysoft body .hero-photo-overlay,html.hero-photo-verysoftbar body .hero-photo-overlay{width:58%!important;-webkit-mask-image:linear-gradient(to right,transparent 0%,transparent 8%,rgba(0,0,0,.08) 18%,rgba(0,0,0,.32) 34%,rgba(0,0,0,.72) 50%,#000 68%,#000 100%)!important;mask-image:linear-gradient(to right,transparent 0%,transparent 8%,rgba(0,0,0,.08) 18%,rgba(0,0,0,.32) 34%,rgba(0,0,0,.72) 50%,#000 68%,#000 100%)!important}
html.hero-photo-softbar body .hero-brown-bar,html.hero-photo-verysoftbar body .hero-brown-bar{display:block!important}
}`;
function apply(v){const d=f.contentDocument;if(!d)return;[...d.documentElement.classList].filter(c=>c.startsWith('hero-photo-')).forEach(c=>d.documentElement.classList.remove(c));let st=d.getElementById('hero-photo-test');if(!st){st=d.createElement('style');st.id='hero-photo-test';st.textContent=css;d.head.appendChild(st)}const hero=d.querySelector('.home-hero');if(hero&&!d.querySelector('.hero-brown-bar')){const b=d.createElement('div');b.className='hero-brown-bar';hero.appendChild(b)}if(hero&&!d.querySelector('.hero-photo-overlay')){const o=d.createElement('div');o.className='hero-photo-overlay';hero.appendChild(o)}d.documentElement.classList.add('hero-photo-'+v);bs.forEach(b=>b.classList.toggle('active',b.dataset.v===v));current=v}
f.addEventListener('load',()=>apply(current));bs.forEach(b=>b.addEventListener('click',()=>apply(b.dataset.v)));
</script></body></html>
