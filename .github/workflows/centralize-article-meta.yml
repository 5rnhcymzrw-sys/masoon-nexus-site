name: Centralize article meta titles
on:
  push:
    branches: [main]
    paths: ['.github/workflows/centralize-article-meta.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Centralize article meta titles
        run: python .github/scripts/centralize_article_meta.py
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.css fachwissen/index.html
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m "Fachbeitrag Metatitel global vereinheitlichen"
          git push origin main
# safe retry
