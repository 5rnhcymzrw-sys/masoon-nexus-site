<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MASOON TREUHAND – DL Farbvergleich</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:Arial,sans-serif}.toolbar{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:99999;display:flex;gap:8px;padding:8px;background:rgba(255,255,255,.95);border:1px solid rgba(23,23,21,.14);box-shadow:0 8px 24px rgba(23,23,21,.10)}.toolbar button{appearance:none;border:1px solid #b9b5af;background:#fff;padding:9px 14px;font-size:12px;cursor:pointer;color:#171715}.toolbar button.active{background:#171715;color:#fff;border-color:#171715}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><div class="toolbar"><button data-mode="a" class="active">Variante 1</button><button data-mode="b">Variante 2</button><button data-mode="c">Variante 3 – Verlauf</button><button data-mode="d">Variante 4 – Screenshots</button><button data-mode="e">Variante 5 – Mix</button><button data-mode="f">Variante 6 – warm</button></div><iframe id="site" src="../index.html"></iframe><script>

function apply(mode){const d=frame.contentDocument||frame.contentWindow.document;if(!d)return;d.getElementById('dl-farbvergleich-style')?.remove();const s=d.createElement('style');s.id='dl-farbvergleich-style';const base='html body.site-light-page:has(main.home) main.home>section.home-values .home-values__items>.home-values__item.home-values__item.home-values__item.home-values__item';const noBorder=`${base}{border:0!important;border-image:none!important;box-shadow:none!important}${base}::before,${base}::after{border:0!important;border-image:none!important;box-shadow:none!important;content:none!important;display:none!important}`;if(mode==='c'){s.textContent=`${noBorder}${base}{background:linear-gradient(110deg,#f3e8d4 0%,#e8e5df 100%)!important;background-image:linear-gradient(110deg,#f3e8d4 0%,#e8e5df 100%)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}${base}:nth-child(3n+2){background:linear-gradient(110deg,#e8e5df 0%,#c7cbd3 100%)!important;background-image:linear-gradient(110deg,#e8e5df 0%,#c7cbd3 100%)!important}${base}:nth-child(3n){background:linear-gradient(110deg,#c7cbd3 0%,#8d96a8 100%)!important;background-image:linear-gradient(110deg,#c7cbd3 0%,#8d96a8 100%)!important}`;}else if(mode==='e'){s.textContent=`${noBorder}${base}{background:transparent!important;background-image:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}${base}:nth-child(3n+2){background:linear-gradient(110deg,#e8e5df 0%,#c7cbd3 100%)!important;background-image:linear-gradient(110deg,#e8e5df 0%,#c7cbd3 100%)!important}${base}:nth-child(3n){background:#F6F4F1!important;background-image:none!important}`;}else if(mode==='f'){s.textContent=`${noBorder}${base}{background:transparent!important;background-image:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}${base}:nth-child(3n+2){background:#ECE9E3!important;background-image:none!important}${base}:nth-child(3n){background:#F6F4F1!important;background-image:none!important}`;}else{const p=palettes[mode];s.textContent=`${noBorder}${base}{background:${p[0]}!important;background-image:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}${base}:nth-child(3n+2){background:${p[1]}!important;background-image:none!important}${base}:nth-child(3n){background:${p[2]}!important;background-image:none!important}`;}d.head.appendChild(s);buttons.forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));}
frame.addEventListener('load',()=>{apply('a');setTimeout(()=>{const d=frame.contentDocument||frame.contentWindow.document;d.querySelector('.home-values')?.scrollIntoView({block:'start'});},180)});buttons.forEach(b=>b.addEventListener('click',()=>apply(b.dataset.mode)));
</script></body></html>
