name: Remove obsolete service editorial block
on:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-obsolete-service-editorial.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete block
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/global.css')
          s=p.read_text(encoding='utf-8')
          start=s.index('/* Dienstleistungen: Editoriales Kartenraster nach Referenz */')
          end=s.index('/* Dienstleistungen: Nummer und Titel */', start)
          s=s[:start]+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/global.css
          git commit -m "Alten Dienstleistungs-Editorialblock entfernen"
          git rm .github/workflows/remove-obsolete-service-editorial.yml
          git commit -m "Temporären Editorial-Cleanup-Workflow entfernen"
          git push
