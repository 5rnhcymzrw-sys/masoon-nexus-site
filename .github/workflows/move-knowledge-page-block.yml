name: Move knowledge page block
on:
  push:
    branches: [main]
    paths: ['.github/workflows/move-knowledge-page-block.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move Fachwissen page block
        run: |
          python3 - <<'PY'
          from pathlib import Path
          g=Path('assets/global.css')
          u=Path('assets/unified-design.css')
          gs=g.read_text(encoding='utf-8')
          us=u.read_text(encoding='utf-8')
          start='/* fachwissen/index.html */'
          end='/* Desktop: Fachwissen Kacheln auf der Startseite gleich hoch wie Werte */'
          assert start in gs and end in gs
          a=gs.index(start)
          b=gs.index(end,a)
          block=gs[a:b].strip()
          block=block.replace('.article-card.article-card','.article-card')
          gs=gs[:a]+gs[b:]
          marker='/* Fachwissen Hauptseite: seitenspezifische Endregeln */'
          assert marker not in us
          us=us.rstrip()+'\n\n'+marker+'\n'+block+'\n'
          g.write_text(gs,encoding='utf-8')
          u.write_text(us,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/global.css assets/unified-design.css
          git commit -m "Fachwissen-Hauptseitenregeln nach unified-design verschieben"
          git rm .github/workflows/move-knowledge-page-block.yml
          git commit -m "Temporären Fachwissen-Verschiebe-Workflow entfernen"
          git push
