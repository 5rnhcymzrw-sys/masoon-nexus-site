<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MASOON – echte Seiten Typografie Test V3</title>
<style>
html,body{margin:0;background:#f4f4f2;font-family:Arial,sans-serif;color:#171715}
.testbar{position:sticky;top:0;z-index:99999;background:#fff;border-bottom:1px solid #d8d8d4;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.testbar strong{font-size:12px;margin-right:8px}.testbar button{appearance:none;border:1px solid #cfcfca;background:#fff;padding:7px 10px;font-size:11px;cursor:pointer}.testbar button:hover,.testbar button.active{background:#171715;color:#fff;border-color:#171715}.note{font-size:11px;color:#666;margin-left:auto}#siteFrame{display:block;width:100%;height:calc(100vh - 50px);border:0;background:#fff}@media(max-width:800px){.note{width:100%;margin-left:0}#siteFrame{height:calc(100vh - 90px)}}
</style>
</head>
<body>
<div class="testbar">
<strong>NEUER TEST · Titel 43 px · Hero 50 px</strong>
<button data-src="index.html?v=typov3" class="active">Startseite</button>
<button data-src="unternehmen/index.html?v=typov3">Unternehmen</button>
<button data-src="dienstleistungen/index.html?v=typov3">Dienstleistungen</button>
<button data-src="fachwissen/index.html?v=typov3">Fachwissen</button>
<button data-src="kontakt/index.html?v=typov3">Kontakt</button>
<button data-src="impressum/index.html?v=typov3">Impressum</button>
<button data-src="datenschutz/index.html?v=typov3">Datenschutz</button>
<button data-src="disclaimer/index.html?v=typov3">Disclaimer</button>
<span class="note">Echte Seiten · keine Fotos · Hero ohne Farbverlauf · Kacheltitel kräftiger</span>
</div>
<iframe id="siteFrame" src="index.html?v=typov3" title="Seitentest"></iframe>
<script>
const frame=document.getElementById('siteFrame');
const buttons=[...document.querySelectorAll('[data-src]')];
const bigSelectors=[
 '.global-title','.section-heading h1','.section-heading h2','.legal-page h1','.knowledge-note h2',
 '.home-paths__heading h2','.home-contact-band h2','.contact-split__info h1','.services-closing h2',
 '.home-company h2','.company-collaboration-box h2'
];
const serviceTitles=['Administration','Buchhaltung','Personaladministration','Jahresabschluss','Steuererklärung','Unternehmensberatung'];
const companyTitles=['Diskretion','Präzision','Verlässlichkeit'];
function normalise(t){return (t||'').replace(/\s+/g,' ').trim()}
function setBig(el,size){
 el.style.setProperty('font-family','"MT PT Serif Bold", Georgia, serif','important');
 el.style.setProperty('font-weight','700','important');
 el.style.setProperty('font-style','normal','important');
 el.style.setProperty('font-size',size+'px','important');
 el.style.setProperty('line-height','1.04','important');
 el.style.setProperty('letter-spacing','0','important');
 el.style.setProperty('-webkit-text-stroke','.25px currentColor','important');
 el.style.setProperty('font-synthesis','none','important');
}
function setCard(el){
 el.style.setProperty('font-weight','700','important');
 el.style.setProperty('-webkit-text-stroke','.12px currentColor','important');
}
function apply(){
 try{
  const d=frame.contentDocument;if(!d||!d.head)return;
  let font=d.getElementById('mt-test-font');
  if(!font){font=d.createElement('style');font.id='mt-test-font';font.textContent='@font-face{font-family:"MT PT Serif Bold";font-style:normal;font-weight:700;font-display:swap;src:url("https://fonts.gstatic.com/s/ptserif/v19/EJRSQgYoZZY2vCFuvAnt65qV.ttf") format("truetype")}';d.head.appendChild(font)}
  let css=d.getElementById('mt-test-css');
  if(!css){css=d.createElement('style');css.id='mt-test-css';css.textContent=`
    html body [class*="hero"]::before,html body [class*="hero"]::after{background-image:none!important}
    html body img:not([data-preserve-logo]),html body picture,html body video{display:none!important}
  `;d.head.appendChild(css)}

  bigSelectors.forEach(sel=>d.querySelectorAll(sel).forEach(el=>setBig(el,43)));

  // Hero-Titel unabhängig von der konkreten Hero-Klasse exakt auf 50 px.
  d.querySelectorAll('h1,h2').forEach(el=>{
    const txt=normalise(el.textContent);
    if(txt.includes('Treuhand mit Struktur und Anspruch')) setBig(el,50);
  });
  d.querySelectorAll('.home-hero h1,[class*="hero"] h1').forEach(el=>setBig(el,50));

  // Farbverläufe nur im Hero entfernen, solide Flächen bleiben bestehen.
  const heroHead=[...d.querySelectorAll('h1,h2')].find(el=>normalise(el.textContent).includes('Treuhand mit Struktur und Anspruch'));
  let hero=heroHead?heroHead.closest('[class*="hero"],section'):d.querySelector('.home-hero,[class*="hero"]');
  if(hero){
    let node=hero;
    node.style.setProperty('background-image','none','important');
    node.querySelectorAll('*').forEach(el=>{
      try{const bg=d.defaultView.getComputedStyle(el).backgroundImage;if(bg&&bg.includes('gradient'))el.style.setProperty('background-image','none','important')}catch(e){}
    });
  }

  // Die gewünschten Kacheltitel direkt nach ihrem echten Text kräftiger setzen.
  d.querySelectorAll('h2,h3,strong').forEach(el=>{
    const txt=normalise(el.textContent);
    if(serviceTitles.includes(txt)||companyTitles.includes(txt)) setCard(el);
  });

  // Zusätzliche Absicherung für die sechs Dienstleistungs-Kacheln.
  d.querySelectorAll('.services-section .service-card h2,.home-values__item h3').forEach(setCard);
 }catch(e){console.error(e)}
}
function runRepeated(){apply();setTimeout(apply,200);setTimeout(apply,600);setTimeout(apply,1400);setTimeout(apply,2600)}
frame.addEventListener('load',()=>{
 runRepeated();
 try{const d=frame.contentDocument;const obs=new MutationObserver(()=>apply());obs.observe(d.documentElement,{childList:true,subtree:true,attributes:true});setTimeout(()=>obs.disconnect(),5000)}catch(e){}
});
buttons.forEach(b=>b.addEventListener('click',()=>{buttons.forEach(x=>x.classList.remove('active'));b.classList.add('active');frame.src=b.dataset.src;}));
</script>
</body>
</html>
