<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Startseite Kastenfarben Test</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:Arial,sans-serif}.bar{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;gap:5px;padding:6px;background:#fff;border:1px solid #ccc}.bar button{padding:8px 11px;background:#fff;border:1px solid #bbb;cursor:pointer}.bar button.on{background:#111;color:#fff}iframe{width:100%;height:100%;border:0}</style></head><body><div class="bar"><button class="on" data-m="1">1 – sehr weich</button><button data-m="2">2 – warm</button><button data-m="3">3 – Greige</button><button data-m="4">4 – Verlauf</button><button data-m="5">5 – Weiss + Akzent</button></div><iframe id="f" src="../index.html"></iframe><script>const f=document.querySelector('#f'),bs=[...document.querySelectorAll('button')];function go(m){const d=f.contentDocument,o=d.querySelector('#kastentest');if(o)o.remove();const s=d.createElement('style');s.id='kastentest';let c='';if(m==='1')c=`.home-values__item{background:linear-gradient(115deg,rgba(243,232,212,.22),rgba(232,229,223,.30),rgba(199,203,211,.18))!important}.home-paths__grid>a{background:linear-gradient(115deg,rgba(243,232,212,.13),rgba(232,229,223,.18),rgba(199,203,211,.12))!important}.home-contact-band{background:linear-gradient(115deg,rgba(243,232,212,.18),rgba(232,229,223,.20),rgba(199,203,211,.14))!important}`;if(m==='2')c=`.home-values__item:nth-child(odd){background:#e2ded8!important}.home-values__item:nth-child(even){background:#f1eee9!important}.home-paths__grid>a{background:#f5f2ed!important}.home-contact-band{background:linear-gradient(110deg,#f3e8d4,#f4f1ec)!important}`;if(m==='3')c=`.home-values__item{background:#e7e4df!important}.home-values__item:nth-child(3n+2){background:#efede9!important}.home-values__item:nth-child(3n){background:#f5f4f1!important}.home-paths__grid>a{background:#efede9!important}.home-contact-band{background:#e7e4df!important}`;if(m==='4')c=`.home-values__item{background:linear-gradient(115deg,rgba(243,232,212,.42),rgba(232,229,223,.48),rgba(199,203,211,.30))!important}.home-paths__grid>a{background:linear-gradient(115deg,rgba(243,232,212,.25),rgba(199,203,211,.25))!important}.home-contact-band{background:linear-gradient(110deg,rgba(243,232,212,.38),rgba(232,229,223,.35),rgba(199,203,211,.30),rgba(141,150,168,.18))!important}`;if(m==='5')c=`.home-values__item,.home-paths__grid>a{background:#fff!important}.home-values__item{border-top:2px solid #e8e5df!important}.home-values__item:nth-child(3n+2){border-top-color:#c7cbd3!important}.home-values__item:nth-child(3n){border-top-color:#8d96a8!important}.home-contact-band{background:#fff!important}`;s.textContent=c;d.head.appendChild(s);bs.forEach(b=>b.classList.toggle('on',b.dataset.m===m));}f.onload=()=>go('1');bs.forEach(b=>b.onclick=()=>go(b.dataset.m));</script></body></html>
