name: Button text colours

on:
  push:
    paths:
      - '.github/workflows/button-text-colours.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update only existing button text colours
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          NORMAL = '#777777!important'
          DARK = '#4f4e4b!important'
          CACHE = 'button-text-colours-20260912-1'

          targets = (
              '.home-action-button',
              '.details-action',
              '.article-action',
              '.services-contact-button',
              '.home-paths__action',
              '.article-back',
              '.contact-split__form button',
              '.contact-form button',
          )
          interactive_markers = (':hover', ':focus-visible', ':focus', ':active')
          rule_re = re.compile(r'([^{}]+)\{([^{}]*)\}', re.S)
          color_re = re.compile(r'(?<![-\w])color\s*:\s*[^;}]+' , re.I)

          changed_files = set()
          stats = {'normal': 0, 'interactive': 0}

          def relevant(selector):
              s = ' '.join(selector.split())
              return any(t in s for t in targets) or ('button[type="submit"]' in s and ('contact' in s or 'form' in s))

          def interactive(selector):
              s = selector.lower()
              return any(m in s for m in interactive_markers)

          for path in sorted(Path('assets').glob('*.css')):
              before = path.read_text()
              text = before
              out = []
              last = 0
              touched = False

              for m in rule_re.finditer(text):
                  selector, body = m.group(1), m.group(2)
                  if not relevant(selector):
                      continue
                  if not color_re.search(body):
                      continue

                  desired = DARK if interactive(selector) else NORMAL
                  new_body, count = color_re.subn('color:' + desired, body)
                  if not count or new_body == body:
                      continue

                  out.append(text[last:m.start()])
                  out.append(selector + '{' + new_body + '}')
                  last = m.end()
                  touched = True
                  stats['interactive' if interactive(selector) else 'normal'] += count

              if touched:
                  out.append(text[last:])
                  after = ''.join(out)

                  # Guardrail: apart from colour declarations, the CSS must remain byte-identical.
                  strip = lambda s: color_re.sub('color:__COLOR__', s)
                  if strip(before) != strip(after):
                      raise SystemExit(f'Unexpected non-colour CSS change in {path}')

                  path.write_text(after)
                  changed_files.add(path)

          if not changed_files:
              raise SystemExit('No existing button/action colour declarations found')

          # If the base stylesheet changed, update its existing import token in unified-design.css.
          base = Path('assets/unified-design-base-20260907.css')
          unified = Path('assets/unified-design.css')
          if base in changed_files:
              u = unified.read_text()
              nu = re.sub(
                  r"(@import url\('\./unified-design-base-20260907\.css\?v=)[^']+",
                  r'\1' + CACHE,
                  u,
                  count=1,
              )
              if nu == u:
                  raise SystemExit('Could not update existing base stylesheet import cache token')
              unified.write_text(nu)
              changed_files.add(unified)

          # Cache-bust only stylesheets actually changed, preserving all markup and layout.
          html_changed = 0
          changed_names = {p.name for p in changed_files}
          for page in [p for p in sorted(Path('.').rglob('*.html')) if '.git' not in p.parts]:
              h = page.read_text(errors='ignore')
              nh = h
              for name in changed_names:
                  nh = re.sub(
                      r'((?:\.\./)*assets/' + re.escape(name) + r'\?v=)[^"\']+',
                      r'\1' + CACHE,
                      nh,
                  )
              if nh != h:
                  page.write_text(nh)
                  html_changed += 1

          print('Changed CSS:', [str(p) for p in sorted(changed_files)])
          print('Colour declarations changed:', stats)
          print('HTML cache tokens changed:', html_changed)
          PY
      - name: Commit colour-only changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets '*.html' */*.html */*/*.html || true
          git diff --cached --quiet && { echo 'No website changes'; exit 1; }
          git commit -m "Buttontexte: Grau und dunklerer Hover"
          git push
