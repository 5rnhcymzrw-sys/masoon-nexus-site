<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MASOON TREUHAND | Hero Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500&family=PT+Serif:wght@700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:"Inter",Arial,sans-serif;background:#fff;color:#171715}
    a{color:inherit;text-decoration:none}

    .site-header{position:relative;height:108px;background:#000;color:#fff;z-index:10}
    .site-header::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:linear-gradient(110deg,#f3e8d4 0%,#e8e5df 38%,#c7cbd3 66%,#8d96a8 100%)}
    .header-inner{width:min(calc(100% - 64px),1227px);height:100%;margin:0 auto;position:relative;display:flex;align-items:center}
    .site-brand{position:relative;width:200px;height:108px;display:flex;align-items:center}
    .site-brand__icon{position:absolute;top:50%;left:50%;width:40%;height:auto;opacity:.18;transform:translate(-50%,-50%);pointer-events:none}
    .site-brand__text{position:relative;z-index:1;width:100%;height:auto}
    .site-nav{position:absolute;left:41%;display:flex;align-items:center;gap:34px}
    .site-nav a{position:relative;padding:35px 0 32px;font-size:11px;font-weight:500;line-height:1.4;letter-spacing:1.1px;text-transform:uppercase;color:#fff}
    .site-nav a::after{content:"";position:absolute;left:0;bottom:18px;width:0;height:2px;background:linear-gradient(110deg,#f3e8d4 0%,#e8e5df 38%,#c7cbd3 66%,#8d96a8 100%);transition:width .4s ease}
    .site-nav a:hover::after,.site-nav a:first-child::after{width:40px}

    .hero{height:calc(100vh - 108px);min-height:calc(100vh - 108px);display:grid;grid-template-columns:minmax(0,1fr) minmax(420px,50%);background:#fff}
    .hero__copy{display:flex;align-items:center;padding:72px 7vw}
    .hero__inner{max-width:620px}
    h1{margin:0;font-family:"PT Serif",Georgia,serif;font-size:clamp(52px,5vw,66px);line-height:.96;font-weight:700;letter-spacing:0;color:#171715}
    p{max-width:420px;margin:28px 0 0;font-size:14px;font-weight:300;line-height:1.65;color:#484a4f}
    .hero__image{height:100%;overflow:hidden;background:#fff}
    .hero__image img{width:100%;height:115%;object-fit:cover;object-position:50% 50%;transform:translateY(-7.5%);display:block}

    @media(max-width:800px){
      .site-header{height:92px}.header-inner{width:calc(100% - 48px)}.site-brand{height:92px;width:190px}.site-nav{display:none}
      .hero{height:auto;min-height:auto;grid-template-columns:1fr}.hero__copy{padding:64px 24px}.hero__image{height:58vh}.hero__image img{height:115%}
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="site-brand" href="../index.html" aria-label="MASOON TREUHAND Startseite">
        <img class="site-brand__icon" src="https://raw.githubusercontent.com/5rnhcymzrw-sys/masoon-treuhand-v2/main/assets/images/logo/icon-white.png" alt="" aria-hidden="true">
        <img class="site-brand__text" src="https://raw.githubusercontent.com/5rnhcymzrw-sys/masoon-treuhand-v2/main/assets/images/logo/textlogo-white.png" alt="MASOON TREUHAND">
      </a>
      <nav class="site-nav" aria-label="Hauptnavigation">
        <a href="../index.html">Startseite</a>
        <a href="../unternehmen/">Unternehmen</a>
        <a href="../dienstleistungen/">Dienstleistungen</a>
        <a href="../fachwissen/">Fachwissen</a>
        <a href="../kontakt/">Kontakt</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="hero__copy">
      <div class="hero__inner">
        <h1>Treuhand mit Struktur und Anspruch.</h1>
        <p>Auf der Basis von Diskretion, Präzision und Vertrauen begleiten wir Sie mit fachlicher Klarheit und hohem Anspruch durch alle Phasen Ihres Geschäftslebens.</p>
      </div>
    </div>
    <div class="hero__image">
      <img src="https://raw.githubusercontent.com/5rnhcymzrw-sys/masoon-treuhand-v2/main/assets/images/photos/hero.png" alt="MASOON TREUHAND">
    </div>
  </section>
</body>
</html>
